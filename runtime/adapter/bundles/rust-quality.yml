schemaVersion: "1"
kind: ci-adapter-bundle
id: rust-cargo-quality
contract: quality-scripts
languageProfiles: [rust]
provider: provider-neutral
executionBoundary: read-only
sourceCheckout: fixed-source
copyable: true
owner: ci-github
assets: []
projectSettings:
  requiredFiles: []
  requiredScripts: []
  requiredEnvironmentPaths: [CI_CARGO_MANIFEST_PATH, CI_CARGO_LOCK_PATH]
toolchain:
  versionEnv: CI_TOOLCHAIN_VERSION
  verify:
    command: rustc
    args: [--version]
preparation:
  - id: dependency-restore
    command: cargo
    args: [fetch, --locked, --manifest-path, "${CI_CARGO_MANIFEST_PATH}"]
commands:
  - id: format
    command: cargo
    args: [fmt, --manifest-path, "${CI_CARGO_MANIFEST_PATH}", --all, --, --check]
  - id: lint
    command: cargo
    args: [clippy, --manifest-path, "${CI_CARGO_MANIFEST_PATH}", --workspace, --all-targets, --all-features, --, -D, warnings]
  - id: test
    command: cargo
    args: [test, --manifest-path, "${CI_CARGO_MANIFEST_PATH}", --workspace, --all-features]
  - id: security
    command: cargo
    args: [audit, --file, "${CI_CARGO_LOCK_PATH}"]
  - id: structure
    command: cargo
    args: [metadata, --manifest-path, "${CI_CARGO_MANIFEST_PATH}", --no-deps, --format-version, "1"]
