name: ci-release-assembly
description: Assemble verified Release assets without executing source or writing to a provider.
inputs:
  repository:
    required: true
    description: Expected owner/repository identity.
  authority-path:
    required: true
    description: Trusted authority JSON containing the publication identity projection.
  snapshot-path:
    required: true
    description: Authority-bound ci.config-snapshot.v1 JSON.
  platform-manifest-path:
    required: false
    default: ''
    description: Authority-bound platform manifest bytes, at most 64 KiB. Empty only for an asset release.
  platform-matrix:
    required: false
    default: ''
    description: Validated ci-platform-matrix output from the authority job. Empty only for an asset release.
  build-root:
    required: false
    default: ''
    description: Directory containing exactly one release-build-ID directory per platform. Empty only for an asset release.
  supplemental-root:
    required: false
    default: ''
    description: Owner-verified supplemental handoff, required only when selected in the snapshot.
  skills-source-root:
    required: false
    default: ''
    description: Separate checkout of authority.source_sha, required only for the selected release skills declaration. No source scripts are executed.
  output-directory:
    required: true
    description: New directory for the handoff; existing paths are never overwritten.
outputs:
  status:
    description: success, produced only after complete validation and assembly.
  release-handoff:
    description: Verified release handoff directory.
  asset-digest:
    description: SHA-256 of the sorted publication asset inventory.
runs:
  using: node24
  main: dist/index.js
