name: ci-release-request-handoff
description: Write an immutable annotated-tag release request handoff.
inputs:
  output-directory:
    required: true
    description: Directory where the handoff files are written.
  tag-source-sha:
    required: true
    description: Source commit SHA resolved from the annotated tag.
  tag-object-sha:
    required: true
    description: Annotated tag object SHA.
  github-ref:
    required: true
    description: GitHub tag ref recorded in the request.
  github-ref-name:
    required: true
    description: GitHub tag name recorded in the request.
  request-run-id:
    required: true
    description: Request workflow run identifier.
  request-actor:
    required: true
    description: Request workflow actor.
outputs:
  request-path:
    description: Path to release-request.json.
  request-digest:
    description: SHA-256 digest file path for release-request.json.
runs:
  using: node24
  main: dist/index.js
