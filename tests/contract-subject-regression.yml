schemaVersion: '1'
kind: sdd-core-shared-contract-regression-reference
id: sdd-core.shared-contract-regression
title: shared contract regression実行契約
summary: runtime の owner discovery と shared contract を検証する a3-sdd regression input
placementRole: public_reference
authority:
  role: authoritative-definition
  owns:
  - a3-sdd shared contract regression input shape
usage:
  whenToRead:
  - a3-sddがshared contract regression planを解釈するとき
  consumers:
  - runtime
  - test
  supportingMarkdown:
    allowed: false
    reasons: []
dsl:
  version: 1
  name: shared-contract-regression
  command: a3-sdd sdd shared-contract-regression run
  owner_registries:
  - owner_skill: sdd-specs
    registry_path: skills/sdd/sdd-specs/assets/definitions/definition-registry.sdd.yml
  - owner_skill: sdd-specs-cli
    registry_path: skills/sdd/sdd-specs-cli/assets/definitions/definition-registry.sdd.yml
  - owner_skill: sdd-designs
    registry_path: skills/sdd/sdd-designs/assets/definitions/definition-registry.sdd.yml
  - owner_skill: sdd-requirements
    registry_path: skills/sdd/sdd-requirements/assets/definitions/definition-registry.sdd.yml
  contract_bindings:
  - definition_id: schema-locator
    contract_id: owner-skill-schema-locator
  - definition_id: current-artifact-locator
    contract_id: current-artifact-locator
  - definition_id: example-manifest
    contract_id: example-manifest
  - definition_id: project-layout
    contract_id: owner-skill-project-layout
  - definition_id: definition-registry
    contract_id: owner-definition-registry
  - definition_id: validation-runtime-contract
    contract_id: owner-validation-runtime-contract
  - definition_id: transform-surface
    contract_id: owner-transform-surface
  conformance_suites:
  - suite_id: runtime-semantic-plan-conformance
    suite_format: model-plan
    authority_contract_id: runtime-semantic-model
    canonical_path: skills/sdd/sdd-core/assets/examples/core/runtime-semantic-plan.conformance.sdd.yml
    repo_target_path: skills/sdd/sdd-core/assets/examples/core/runtime-semantic-plan.conformance.sdd.yml
    schema_path: skills/sdd/sdd-core/assets/schemas/core/runtime-semantic-plan-conformance.schema.json
    plan_shape_contract_id: runtime-semantic-model
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  execution_roots:
    owner_asset_resolution:
      root_role: owner-runtime-asset-source-root
      authority_contract_id: runtime-root-authority-contract
      authority_contract_path: skills/sdd/sdd-core/references/core/runtime-root-authority-contract.reference.yml
      required_for:
      - owner-definition-registry
      - owner schema
      - shared contract reference
    current_artifact_resolution:
      root_role: current-artifact-source-root
      authority_contract_id: current-artifact-source-authority-contract
      authority_contract_path: skills/sdd/sdd-core/references/core/current-artifact-source-authority-contract.reference.yml
      required_for:
      - current-artifact-locator artifact_path
      - current-artifact-locator artifact_glob
    constraints:
    - shared regression は owner asset resolution root と current artifact resolution root を同一 root と仮定しない。
    - installed owner runtime asset root が current artifact を持たない場合は root-authority-mismatch と owner-source-gap を分ける。
    - contract targetはtarget_root_roleとsource_authority_contract_idの組で解決する。
    - deployed mirror一致はdeploy後のmirror diffをproject deploy integrityで検証する。
  shared_targets:
  - contract_id: native-surface-family
    canonical_path: skills/sdd/sdd-core/references/core/native-surface-family.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/native-surface-family.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: runtime-root-authority-contract
    canonical_path: skills/sdd/sdd-core/references/core/runtime-root-authority-contract.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/runtime-root-authority-contract.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: sdd-owner-skill-discovery
    canonical_path: skills/sdd/sdd-core/references/core/sdd-owner-skill-discovery.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/sdd-owner-skill-discovery.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: current-artifact-source-authority-contract
    canonical_path: skills/sdd/sdd-core/references/core/current-artifact-source-authority-contract.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/current-artifact-source-authority-contract.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: owner-runtime-bundle-contract
    canonical_path: skills/sdd/sdd-core/references/core/owner-runtime-bundle-contract.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/owner-runtime-bundle-contract.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: surface-join-contract
    canonical_path: skills/sdd/sdd-core/references/core/surface-join-contract.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/surface-join-contract.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: diagnostics-normalization-contract
    canonical_path: skills/sdd/sdd-core/references/core/diagnostics-normalization-contract.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/diagnostics-normalization-contract.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: definition-file-locations
    canonical_path: skills/sdd/sdd-core/references/core/definition-file-locations.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/definition-file-locations.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: project-operation-slot-binding
    canonical_path: skills/sdd/sdd-core/references/core/project-operation-slot-binding.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/project-operation-slot-binding.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: canonical-project-path
    canonical_path: skills/sdd/sdd-core/references/core/canonical-project-path.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/canonical-project-path.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: operation-resource-containment
    canonical_path: skills/sdd/sdd-core/references/core/operation-resource-containment.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/operation-resource-containment.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
  - contract_id: current-artifact-family-completeness
    canonical_path: skills/sdd/sdd-core/references/core/current-artifact-family-completeness.reference.yml
    repo_target_path: skills/sdd/sdd-core/references/core/current-artifact-family-completeness.reference.yml
    target_root_role: owner-runtime-asset-source-root
    source_authority_contract_id: runtime-root-authority-contract
