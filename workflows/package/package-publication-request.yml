name: package-publication-request

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source SHA represented by this request ref
        required: true
        type: string
      version:
        description: Concrete package version requested for publication
        required: true
        type: string
      target_identity:
        description: Package target identity requested for publication
        required: true
        type: string
      language_profile:
        description: Language profile used by the package build adapter
        required: true
        type: string
      toolchain:
        description: Fixed toolchain used by the package build adapter
        required: true
        type: string

permissions: {}

jobs:
  request:
    runs-on: <versioned-runner>
    permissions: {}
    steps:
      - name: Validate and write request handoff
        uses: a3-suite/a3-ci-github/actions/ci-package-publication-request@59c59b6802dc0424c184d99c82f652d072c60e05
        with:
          operation: create
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          target-identity: ${{ inputs.target_identity }}
          language-profile: ${{ inputs.language_profile }}
          toolchain: ${{ inputs.toolchain }}
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: package-publication-request
          path: package-publication-request
          if-no-files-found: error
          retention-days: 1

      - name: Write workflow summary
        if: always()
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@59c59b6802dc0424c184d99c82f652d072c60e05
        with:
          summary-json: >-
            {"jobs":[{"unit":"request","execution":"workflow_dispatch package publication handoff","rawResult":"${{ job.status }}","applicable":true,"reason":"request job result: ${{ job.status }}"}]}
