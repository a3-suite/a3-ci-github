name: package-publication

on:
  workflow_call:
    inputs:
      package_handoff_run_id:
        description: Run ID that produced the verified package handoff
        required: true
        type: string
      source_sha:
        description: Immutable source SHA bound to the package handoff
        required: true
        type: string
      version:
        description: Concrete package version bound to the handoff
        required: true
        type: string
      target_identity:
        description: Package target identity bound to the handoff
        required: true
        type: string
      package_artifact_id:
        description: Artifact ID returned by the package handoff upload
        required: true
        type: string
    secrets:
      PACKAGE_REGISTRY_TOKEN:
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ inputs.target_identity }}
  cancel-in-progress: false
  queue: max

env:
  CI_GH_VERSION: <gh-version>
  CI_JQ_VERSION: <jq-version>

jobs:
  publish:
    runs-on: <versioned-runner>
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_VERSION: ${{ inputs.version }}
      CI_TARGET_IDENTITY: ${{ inputs.target_identity }}
      CI_PACKAGE_HANDOFF_RUN_ID: ${{ inputs.package_handoff_run_id }}
      CI_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify workflow identity
        id: workflow-identity
        shell: bash
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CALLER_WORKFLOW_PATH: .github/workflows/package-publication-caller.yml
          EXPECTED_CALLED_WORKFLOW_PATH: .github/workflows/package-publication.yml
        run: |
          set -euo pipefail
          expected_caller="${GITHUB_REPOSITORY}/${EXPECTED_CALLER_WORKFLOW_PATH}@refs/heads/${DEFAULT_BRANCH}"
          expected_called="${GITHUB_REPOSITORY}/${EXPECTED_CALLED_WORKFLOW_PATH}@refs/heads/${DEFAULT_BRANCH}"
          test "$CALLER_WORKFLOW_REF" = "$expected_caller"
          test "$CALLED_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$CALLED_WORKFLOW_FILE_PATH" = "$EXPECTED_CALLED_WORKFLOW_PATH"
          test "$CALLED_WORKFLOW_REF" = "$expected_called"
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && "$CALLED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$CALLER_WORKFLOW_SHA" = "$CALLED_WORKFLOW_SHA"
          echo "sha=$CALLED_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
      # This checkout uses the verified workflow snapshot, not the package source.
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ steps.workflow-identity.outputs.sha }}
      - name: Verify trusted control checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.workflow-identity.outputs.sha }}"
      - name: Provision fixed jq
        uses: a3-suite/a3-actions/actions/ci-jq-provisioner@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Provision fixed gh
        uses: a3-suite/a3-actions/actions/ci-gh-provisioner@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          gh-version: ${{ env.CI_GH_VERSION }}
      - name: Verify fixed GitHub tools
        uses: a3-suite/a3-actions/actions/ci-github-toolchain-verifier@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          mode: gh-jq
          gh-version: ${{ env.CI_GH_VERSION }}
          jq-version: ${{ env.CI_JQ_VERSION }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          path: package-handoff
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_handoff_run_id }}
      - name: Validate package handoff integrity
        uses: a3-suite/a3-actions/actions/ci-handoff-integrity@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          handoff-root: package-handoff
          descriptor: handoff.json
          source-sha: ${{ env.CI_SOURCE_SHA }}
          version: ${{ env.CI_VERSION }}
          target-identity: ${{ env.CI_TARGET_IDENTITY }}
      - name: Publish verified package handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PACKAGE_REGISTRY_TOKEN"
          .ci/trusted/ci-package-publish.sh package-handoff

  summary:
    needs: publish
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-actions/actions/ci-quality-summary@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          summary-json: >-
            {"jobs":[{"unit":"publish","execution":"registry remote readback","result":"${{ needs.publish.result == 'success' && 'success' || needs.publish.result == 'failure' && 'failed' || (needs.publish.result == 'cancelled' || needs.publish.result == 'skipped') && '未実施' || '判定不能' }}","evidence":"${{ env.WORKFLOW_RUN_URL }}","collection":"${{ (needs.publish.result == 'success' || needs.publish.result == 'failure') && '完了' || needs.publish.result == 'cancelled' && '一部取得' || '取得不可' }}","reason":"publish job result: ${{ needs.publish.result }}"}]}
