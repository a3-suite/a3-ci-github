name: release-request-tag

on:
  push:
    tags:
      - <release-tag-pattern>

permissions: {}

jobs:
  request:
    runs-on: <versioned-runner>
    permissions:
      actions: write
      contents: read
    env:
      CI_GITHUB_TOKEN: ${{ github.token }}
      CI_GH_VERSION: <gh-version>
      CI_JQ_VERSION: <jq-version>
      CI_SHA256SUM_VERSION: <sha256sum-version>
    steps:
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Provision fixed gh
        uses: a3-suite/a3-ci-github/actions/ci-gh-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          gh-version: ${{ env.CI_GH_VERSION }}
      - name: Verify fixed GitHub tools
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: gh-jq-sha256
          gh-version: ${{ env.CI_GH_VERSION }}
          jq-version: ${{ env.CI_JQ_VERSION }}
          sha256sum-version: ${{ env.CI_SHA256SUM_VERSION }}
      - name: Resolve annotated tag identity
        id: tag
        uses: a3-suite/a3-ci-github/actions/ci-annotated-tag-resolver@312c534de67720de060689d78ada17da9c84c4e2
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          github-token: ${{ env.CI_GITHUB_TOKEN }}
      - name: Write tag request handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-request-handoff@312c534de67720de060689d78ada17da9c84c4e2
        with:
          output-directory: release-request
          tag-source-sha: ${{ steps.tag.outputs.source-sha }}
          tag-object-sha: ${{ steps.tag.outputs.tag-object-sha }}
          github-ref: ${{ github.ref }}
          github-ref-name: ${{ github.ref_name }}
          request-run-id: ${{ github.run_id }}
          request-actor: ${{ github.actor }}
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-request
          path: release-request
          if-no-files-found: error

  summary:
    needs: request
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REQUEST_RESULT: ${{ needs.request.result }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@312c534de67720de060689d78ada17da9c84c4e2
        with:
          summary-json: >-
            {"jobs":[{"unit":"request","execution":"tag event handoff","rawResult":"${{ needs.request.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"request job result: ${{ needs.request.result }}"}]}
