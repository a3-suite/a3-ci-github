name: release-request-tag

on:
  push:
    tags:
      - <release-tag-pattern>

permissions: {}

jobs:
  request:
    runs-on: <versioned-runner>
    permissions:
      actions: write
      contents: read
    env:
      CI_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve annotated tag identity
        id: tag
        uses: a3-suite/a3-ci-github/actions/ci-annotated-tag-resolver@bd695706802b7d86ed3db94a0e39b41b593358d5
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          github-token: ${{ env.CI_GITHUB_TOKEN }}
      - name: Write tag request handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-request-handoff@bd695706802b7d86ed3db94a0e39b41b593358d5
        with:
          output-directory: release-request
          tag-source-sha: ${{ steps.tag.outputs.source-sha }}
          tag-object-sha: ${{ steps.tag.outputs.tag-object-sha }}
          github-ref: ${{ github.ref }}
          github-ref-name: ${{ github.ref_name }}
          request-run-id: ${{ github.run_id }}
          request-actor: ${{ github.actor }}
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-request
          path: release-request
          if-no-files-found: error

  summary:
    needs: request
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@bd695706802b7d86ed3db94a0e39b41b593358d5
        with:
          summary-json: >-
            {"jobs":[{"unit":"request","execution":"tag event handoff","rawResult":"${{ needs.request.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"request job result: ${{ needs.request.result }}"}]}
