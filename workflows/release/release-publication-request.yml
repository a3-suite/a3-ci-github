name: release-publication-request

on:
  workflow_dispatch:
    inputs:
      request_run_id:
        description: Successful release-request workflow run ID
        required: true
        type: string
      release_identity:
        description: Release tag approved for publication
        required: true
        type: string
      release_notes:
        description: Approved release body
        required: true
        type: string
      approval_id:
        description: Unique publication authorization identifier assigned by the dispatcher
        required: true
        type: string
      approval_body_sha256:
        description: SHA-256 digest of the git.release-flow approved body
        required: true
        type: string
      approval_expires_at:
        description: Approval expiry in RFC 3339 format
        required: true
        type: string

permissions: {}

jobs:
  request:
    runs-on: <versioned-runner>
    permissions:
      contents: read
    steps:
      - name: Validate and write publication request
        uses: a3-suite/a3-actions/actions/ci-release-publication-control@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          operation: create-request
          release-request-run-id: ${{ inputs.request_run_id }}
          request-workflow-run-id: ${{ github.run_id }}
          request-head-sha: ${{ github.sha }}
          release-identity: ${{ inputs.release_identity }}
          release-notes: ${{ inputs.release_notes }}
          approval-id: ${{ inputs.approval_id }}
          approval-expires-at: ${{ inputs.approval_expires_at }}
          approval-body-sha256: ${{ inputs.approval_body_sha256 }}
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-publication-request
          path: release-publication-request
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-notes-handoff
          path: release-notes-handoff
          if-no-files-found: error
          retention-days: 1

  summary:
    needs: request
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-actions/actions/ci-quality-summary@3b705bcbb0286a9da0f3bdb73f39d58043ca5605
        with:
          summary-json: >-
            {"jobs":[{"unit":"request","execution":"publication request handoff","result":"${{ needs.request.result == 'success' && 'success' || needs.request.result == 'failure' && 'failed' || (needs.request.result == 'cancelled' || needs.request.result == 'skipped') && '未実施' || '判定不能' }}","evidence":"${{ env.WORKFLOW_RUN_URL }}","collection":"${{ (needs.request.result == 'success' || needs.request.result == 'failure') && '完了' || needs.request.result == 'cancelled' && '一部取得' || '取得不可' }}","reason":"request job result: ${{ needs.request.result }}"}]}
