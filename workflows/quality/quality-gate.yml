name: quality-gate

on:
  pull_request:
  push:
    branches:
      - <protected-branch>

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  quality:
    uses: a3-suite/a3-ci-github/.github/workflows/ci-quality.yml@<quality-workflow-sha>
    permissions:
      contents: read
    with:
      runner: <versioned-runner>
      language-profile: <language-profile>
      toolchain-version: <toolchain-version>
      uv-version: <uv-version>
      cargo-audit-version: <cargo-audit-version>
      cargo-manifest-path: <cargo-manifest-path>
      cargo-lock-path: <cargo-lock-path>
      jq-version: <optional-jq-version>
      standard-bundle-id: <standard-bundle-id>
      adapter-descriptor: <adapter-descriptor>
      docs-only-patterns: docs/**,README.md,**/*.md
  summary:
    needs: quality
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@1d6958ce3953da4ecba81940ce6ab90e4a0a5435
        with:
          summary-json: '{"jobs":[{"unit":"quality","execution":"fixed reusable quality workflow","rawResult":"${{ needs.quality.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"reusable quality workflow result: ${{ needs.quality.result }}"}]}'
