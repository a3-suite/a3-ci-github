name: quality-gate-platforms

on:
  pull_request:
  push:
    branches:
      - <protected-branch>

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_LANGUAGE_PROFILE: <language-profile>
  CI_TOOLCHAIN_VERSION: <toolchain-version>
  CI_UV_VERSION: <uv-version>
  CI_CARGO_AUDIT_VERSION: <cargo-audit-version>
  CI_CARGO_MANIFEST_PATH: <cargo-manifest-path>
  CI_CARGO_LOCK_PATH: <cargo-lock-path>
  CI_PROVIDER: github
  CI_ADAPTER_DESCRIPTOR: .ci/adapters/<adapter-descriptor>
  CI_DOCS_ONLY_PATTERNS: 'docs/**,README.md,**/*.md'
  CI_PLATFORM_MANIFEST: .ci/platform-manifest.yml
  CI_QUALITY_PLATFORM_SELECTION: .ci/quality-platforms.yml

jobs:
  resolve-platforms:
    name: quality-gate-platforms / resolve
    runs-on: <versioned-runner>
    outputs:
      run-ci: ${{ steps.change-scope.outputs['run-ci'] }}
      trusted_root: ${{ steps.trusted-assets.outputs.root }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      expected: ${{ steps.resolve.outputs.expected }}
    steps:
      - name: Check resolved configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_LANGUAGE_PROFILE" =~ ^[a-z][a-z0-9-]*$ ]] || {
            echo "invalid CI_LANGUAGE_PROFILE: $CI_LANGUAGE_PROFILE" >&2
            exit 1
          }
          [[ "$CI_UV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid CI_UV_VERSION: $CI_UV_VERSION" >&2
            exit 1
          }
          [[ -n "${CI_TOOLCHAIN_VERSION:-}" && "${CI_TOOLCHAIN_VERSION:-}" != *'<'* && "${CI_TOOLCHAIN_VERSION:-}" != *'>'* ]]
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Resolve change scope
        id: change-scope
        uses: a3-suite/a3-ci-github/actions/ci-change-scope@312c534de67720de060689d78ada17da9c84c4e2
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.sha }}
          event-name: ${{ github.event_name }}
          pr-base-sha: ${{ github.event.pull_request.base.sha || '' }}
          before-sha: ${{ github.event.before || '' }}
          docs-only-patterns: ${{ env.CI_DOCS_ONLY_PATTERNS }}
      - name: Checkout trusted CI assets
        uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            .ci/ci-assets.lock.json
            .ci/platform-manifest.yml
            .ci/quality-platforms.yml
            package.json
            package-lock.json
      - name: Resolve trusted assets root
        id: trusted-assets
        shell: bash
        env:
          CI_SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          present=0
          for asset in ".ci-base/$CI_ADAPTER_DESCRIPTOR" ".ci-base/$CI_PLATFORM_MANIFEST" ".ci-base/$CI_QUALITY_PLATFORM_SELECTION"; do
            if [[ -f "$asset" ]]; then present=$((present + 1)); fi
          done
          if [[ -f ".ci-base/.ci/ci-assets.lock.json" ]]; then
            if [[ "$present" -ne 3 ]]; then
              echo "trusted CI assets are partially present in the base branch" >&2
              exit 1
            fi
            root=".ci-base"
          else
            if [[ "$present" -ne 0 || -e ".ci-base/.ci/adapters" ]]; then
              echo "trusted CI assets exist in the base branch without a distribution integrity lock" >&2
              exit 1
            fi
            if [[ "$CI_SAME_REPO" != "true" ]]; then
              echo "trusted CI assets bootstrap is limited to same-repository pull requests" >&2
              exit 1
            fi
            root="."
          fi
          if [[ "$root" == ".ci-base" ]]; then source="base"; else source="bootstrap"; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "trusted CI assets root: $root (source: $source)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Set up uv
        uses: astral-sh/setup-uv@<commit-sha>
        with:
          version: ${{ env.CI_UV_VERSION }}
      - name: Resolve platform matrix
        id: resolve
        shell: bash
        env:
          TRUSTED_ROOT: ${{ steps.trusted-assets.outputs.root }}
        run: |
          set -euo pipefail
          uv run --no-project --with 'pyyaml==6.0.3' python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          import yaml

          root = Path(os.environ['TRUSTED_ROOT'])

          class CoreLoader(yaml.SafeLoader):
              def construct_mapping(self, node, deep=False):
                  keys = set()
                  for key_node, _ in node.value:
                      key = self.construct_object(key_node, deep=deep)
                      if key in keys:
                          raise SystemExit(f"duplicate mapping key: {key}")
                      keys.add(key)
                  return super().construct_mapping(node, deep)

          # YAML 1.2 core schema resolvers only, matching the preflight parser.
          CoreLoader.yaml_implicit_resolvers = {}
          CoreLoader.add_implicit_resolver(
              'tag:yaml.org,2002:null',
              re.compile(r'^(?:~|null|Null|NULL|)$'),
              ['~', 'n', 'N', ''],
          )
          CoreLoader.add_implicit_resolver(
              'tag:yaml.org,2002:bool',
              re.compile(r'^(?:true|True|TRUE|false|False|FALSE)$'),
              list('tTfF'),
          )
          CoreLoader.add_implicit_resolver(
              'tag:yaml.org,2002:int',
              re.compile(r'^(?:[-+]?[0-9]+|0o[0-7]+|0x[0-9a-fA-F]+)$'),
              list('-+0123456789'),
          )
          CoreLoader.add_implicit_resolver(
              'tag:yaml.org,2002:float',
              re.compile(r'^(?:[-+]?(?:\.[0-9]+|[0-9]+(?:\.[0-9]*)?)(?:[eE][-+]?[0-9]+)?|[-+]?\.(?:inf|Inf|INF)|\.(?:nan|NaN|NAN))$'),
              list('-+0123456789.'),
          )

          def load(relative: str, max_bytes: int = 0, max_aliases: int = 0) -> dict:
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"missing platform configuration: {path}")
              raw = path.read_bytes()
              if max_bytes > 0 and len(raw) > max_bytes:
                  raise SystemExit("platform manifest exceeds 64 KiB")
              text = raw.decode("utf-8")
              if max_aliases > 0:
                  aliases = {}
                  for event in yaml.parse(text):
                      if isinstance(event, yaml.events.AliasEvent):
                          aliases[event.anchor] = aliases.get(event.anchor, 0) + 1
                  if any(count >= max_aliases for count in aliases.values()):
                      raise SystemExit("platform configuration exceeds alias count limit")
              return yaml.load(text, Loader=CoreLoader)

          def describe(value) -> str:
              return value if isinstance(value, str) else type(value).__name__

          platform_id_pattern = re.compile(r'^[a-z0-9][a-z0-9-]*$')
          target_pattern = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._+-]*$')
          allowed_runners = {'ubuntu-24.04', 'macos-14', 'windows-2022'}
          manifest = load(os.environ['CI_PLATFORM_MANIFEST'], 64 * 1024, 20)
          selection = load(os.environ['CI_QUALITY_PLATFORM_SELECTION'], max_aliases=100)
          if (not isinstance(selection, dict) or set(selection) != {'platforms'}
                  or not isinstance(selection['platforms'], list) or not selection['platforms']):
              raise SystemExit("platform selection must contain only a non-empty platforms list")
          for index, entry in enumerate(selection['platforms']):
              if not isinstance(entry, dict) or set(entry) != {'id'} or not isinstance(entry['id'], str):
                  raise SystemExit(f"platform selection entry must contain only an id at index {index}")
          if not isinstance(manifest, dict) or set(manifest) != {'platforms'}:
              raise SystemExit("platform manifest must contain only a platforms list")
          if not isinstance(manifest['platforms'], list) or not manifest['platforms']:
              raise SystemExit("platform manifest must contain at least one platform")
          platforms = {}
          manifest_targets = set()
          for index, entry in enumerate(manifest['platforms']):
              if not isinstance(entry, dict) or set(entry) != {'id', 'runner', 'target'}:
                  raise SystemExit(f"platform entry must contain id, runner, and target at index {index}")
              if not isinstance(entry['id'], str) or not platform_id_pattern.fullmatch(entry['id']):
                  raise SystemExit(f"platform id is invalid in the manifest: {describe(entry['id'])}")
              if entry['id'] in platforms:
                  raise SystemExit(f"platform id is duplicated in the manifest: {entry['id']}")
              if not isinstance(entry['runner'], str) or entry['runner'] not in allowed_runners:
                  raise SystemExit(f"runner is not allowed by the platform manifest contract: {describe(entry['runner'])}")
              if not isinstance(entry['target'], str) or not target_pattern.fullmatch(entry['target']):
                  raise SystemExit(f"platform target is invalid in the manifest: {describe(entry['target'])}")
              if entry['target'] in manifest_targets:
                  raise SystemExit(f"platform target is duplicated in the manifest: {entry['target']}")
              platforms[entry['id']] = entry
              manifest_targets.add(entry['target'])
          include = []
          selected_ids = set()
          for entry in selection['platforms']:
              platform_id = entry['id']
              if platform_id in selected_ids:
                  raise SystemExit(f"platform is duplicated in the selection: {platform_id}")
              if platform_id not in platforms:
                  raise SystemExit(f"platform is not declared in the manifest: {platform_id}")
              selected_ids.add(platform_id)
              include.append({'platform_id': platform_id, 'runner': platforms[platform_id]['runner']})
          if not include:
              raise SystemExit("platform selection is empty")
          matrix = json.dumps({'include': include}, separators=(',', ':'))
          expected = ','.join(item['platform_id'] for item in include)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"matrix={matrix}\n")
              handle.write(f"expected={expected}\n")
          PY

  platform:
    name: quality-gate-platforms / ${{ matrix.platform_id }}
    needs: resolve-platforms
    if: needs.resolve-platforms.outputs['run-ci'] != 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout trusted CI assets
        if: needs.resolve-platforms.outputs['trusted_root'] == '.ci-base'
        uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            package.json
            package-lock.json
      - name: Set up TypeScript toolchain
        if: env.CI_LANGUAGE_PROFILE == 'typescript'
        uses: actions/setup-node@<commit-sha>
        with:
          node-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          cache: npm
      - name: Set up Python toolchain
        if: env.CI_LANGUAGE_PROFILE == 'python'
        uses: actions/setup-python@<commit-sha>
        with:
          python-version: ${{ env.CI_TOOLCHAIN_VERSION }}
      - name: Set up uv
        if: env.CI_LANGUAGE_PROFILE == 'python'
        uses: astral-sh/setup-uv@<commit-sha>
        with:
          version: ${{ env.CI_UV_VERSION }}
          python-version: ${{ env.CI_TOOLCHAIN_VERSION }}
      - name: Set up Rust toolchain
        if: env.CI_LANGUAGE_PROFILE == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$CI_TOOLCHAIN_VERSION" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$CI_TOOLCHAIN_VERSION" >> "$GITHUB_ENV"
      - name: Set up cargo-audit
        if: env.CI_LANGUAGE_PROFILE == 'rust'
        shell: bash
        run: cargo install cargo-audit --locked --version "$CI_CARGO_AUDIT_VERSION"
      - name: Run project quality adapter
        id: quality-adapter
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@312c534de67720de060689d78ada17da9c84c4e2
        with:
          bundle-path: ${{ needs.resolve-platforms.outputs['trusted_root'] }}/${{ env.CI_ADAPTER_DESCRIPTOR }}
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          require-trusted-project-scripts: 'true'
          trusted-project-root: ${{ needs.resolve-platforms.outputs['trusted_root'] }}
      - name: Report project quality adapter result
        if: always()
        shell: bash
        env:
          CI_QUALITY_RESULT_PATH: ${{ steps.quality-adapter.outputs['result-path'] }}
        run: |
          if [[ -n "${CI_QUALITY_RESULT_PATH:-}" && -f "$CI_QUALITY_RESULT_PATH" ]]; then
            cat -- "$CI_QUALITY_RESULT_PATH"
          fi

  platform-summary:
    name: quality-gate-platforms / summary
    needs: [resolve-platforms, platform]
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESOLVE_RESULT: ${{ needs.resolve-platforms.result }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
      RUN_CI: ${{ needs.resolve-platforms.outputs['run-ci'] }}
      EXPECTED_PLATFORMS: ${{ needs.resolve-platforms.outputs.expected }}
    steps:
      - name: Enforce required platform results
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_PLATFORMS:-}" ]]; then
            echo "expected platform record set is empty" >&2
            exit 1
          fi
          if [[ "${RUN_CI:-}" == "false" ]]; then
            echo "docs-only scope; platforms recorded as 対象外: ${EXPECTED_PLATFORMS}"
            exit 0
          fi
          if [[ "${RESOLVE_RESULT:-}" != "success" || "${PLATFORM_RESULT:-}" != "success" ]]; then
            echo "platform quality results are incomplete: resolve=${RESOLVE_RESULT:-未実施} platform=${PLATFORM_RESULT:-未実施}" >&2
            exit 1
          fi
      - name: Build platform summary
        id: platform-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUN_CI:-}" == "false" && "${RESOLVE_RESULT:-}" == "success" && -n "${EXPECTED_PLATFORMS:-}" ]]; then
            result="success"; execution="docs-only change; platform adapter not run"; collection="完了"; reason="docs-only scope; expected platforms recorded as 対象外: ${EXPECTED_PLATFORMS:-}"
          elif [[ "${RUN_CI:-}" == "false" ]]; then
            result="failed"; execution="docs-only change; platform record resolution failed"; collection="取得不可"; reason="docs-only scope could not establish the expected platform record set"
          elif [[ "${RESOLVE_RESULT:-}" == "success" && "${PLATFORM_RESULT:-}" == "success" ]]; then
            result="success"; execution="platform adapter executed"; collection="完了"; reason="all selected platforms succeeded: ${EXPECTED_PLATFORMS:-}"
          elif [[ "${PLATFORM_RESULT:-}" == "failure" || "${RESOLVE_RESULT:-}" == "failure" ]]; then
            result="failed"; execution="platform adapter executed"; collection="完了"; reason="platform quality failed: resolve=${RESOLVE_RESULT:-} platform=${PLATFORM_RESULT:-}"
          elif [[ "${PLATFORM_RESULT:-}" == "cancelled" || "${PLATFORM_RESULT:-}" == "skipped" ]]; then
            result="未実施"; execution="platform adapter not completed"; collection="一部取得"; reason="platform job was cancelled or skipped"
          else
            result="判定不能"; execution="platform adapter result is unavailable"; collection="取得不可"; reason="platform result could not be determined"
          fi
          summary=$(RESULT="$result" EXECUTION="$execution" COLLECTION="$collection" REASON="$reason" EVIDENCE="$WORKFLOW_RUN_URL" RUN_CI="${RUN_CI:-}" EXPECTED_PLATFORMS="${EXPECTED_PLATFORMS:-}" python3 - <<'PY'
          import json
          import os

          units = [
              {
                  "unit": "quality-gate-platforms",
                  "execution": os.environ["EXECUTION"],
                  "result": os.environ["RESULT"],
                  "evidence": os.environ["EVIDENCE"],
                  "collection": os.environ["COLLECTION"],
                  "reason": os.environ["REASON"],
              }
          ]
          if os.environ.get("RUN_CI") == "false" and os.environ.get("RESULT") == "success":
              for platform_id in os.environ.get("EXPECTED_PLATFORMS", "").split(","):
                  if not platform_id:
                      continue
                  units.append({
                      "unit": f"platform:{platform_id}",
                      "execution": "docs-only change; platform adapter not run",
                      "result": "対象外",
                      "evidence": os.environ["EVIDENCE"],
                      "collection": "完了",
                      "reason": "docs-only scope",
                  })
          print(json.dumps({"jobs": units}, ensure_ascii=False))
          PY
          )
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      - name: Write workflow summary
        if: always()
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@312c534de67720de060689d78ada17da9c84c4e2
        with:
          summary-json: ${{ steps.platform-summary.outputs.summary }}
