name: quality-gate-platforms

on:
  pull_request:
  push:
    branches:
      - <protected-branch>

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platforms:
    uses: a3-suite/a3-ci-github/.github/workflows/ci-quality-platforms.yml@<quality-platforms-workflow-sha>
    permissions:
      contents: read
    with:
      runner: <versioned-runner>
      language-profile: <language-profile>
      toolchain-version: <toolchain-version>
      uv-version: <uv-version>
      cargo-audit-version: <cargo-audit-version>
      cargo-manifest-path: <cargo-manifest-path>
      cargo-lock-path: <cargo-lock-path>
      standard-bundle-id: <standard-bundle-id>
      adapter-descriptor: <adapter-descriptor>
      docs-only-patterns: docs/**,README.md,**/*.md
      platform-manifest: .ci/platform-manifest.yml
      quality-platform-selection: .ci/quality-platforms.yml

  platform-summary:
    name: quality-gate-platforms / summary
    needs: platforms
    if: always()
    runs-on: <versioned-runner>
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@312c534de67720de060689d78ada17da9c84c4e2
        with:
          summary-json: '{"jobs":[{"unit":"platforms","execution":"fixed reusable platform quality workflow","rawResult":"${{ needs.platforms.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"reusable platform workflow result: ${{ needs.platforms.result }}"}]}'
