version: 1
name: logical-design-decision
decisions:
  - decision_id: keep-action-contracts-as-one-distribution-boundary
    subjects:
      component_ids:
        - action-contracts
    decision: 各 GitHub Action の公開 I/O 契約と bundle 済み配布物を、subject ごとに分けず一つの component が所有する
    rationale: Action 固有の判断は各 Action の src に閉じ、Action 間で判断を共有しない。全 Action が action.yml、node24 entrypoint、bundle 済み dist の同一性を同じ配布ゲートで検証され、同じ exact tag の Release で固定 SHA として公開されるため、component を分ける基準となる配布境界と変更の進め方は全 Action で同じであり、Action ごとの差は実装 module の差に留まるため
    alternatives:
      - summary: subject ごとに Action component を分ける
        reason_not_selected: 変更理由が同じ配布境界を重複させ、route と projection だけが増えるため
    consequences:
      - subject ごとの設計判断は component では区別せず、contract-route の hop と仕様側の契約で追跡する
      - 配布単位や公開経路が他の Action と異なる Action が現れた場合は、その Action を別 component に分ける
  - decision_id: keep-runtime-implementations-as-shared-processing-boundary
    subjects:
      component_ids:
        - runtime-implementations
    decision: Action と hosted delivery が再利用する provider 非依存の共有処理を、capability ごとに分けず一つの component が所有する
    rationale: 共有処理は Action へ bundle されるか repository の検証・公開から呼ばれ、共通の失敗診断、platform 検証、固定参照検査の境界を共有する。capability ごとの不変条件は仕様側の subject と契約が所有し、この component の変更理由は呼出側から独立した処理を一か所で検証可能に保つことにあるため
    alternatives:
      - summary: release、provisioning、quality、installer の capability ごとに component を分ける
        reason_not_selected: 共通の診断・platform・固定参照境界を各 component へ重複させるため
    consequences:
      - capability ごとの設計判断は component では区別せず、contract-route の hop と仕様側の契約で追跡する
      - 独立した runtime 境界と公開面を持つ capability は、selective-distribution と同様に別 component に分ける
