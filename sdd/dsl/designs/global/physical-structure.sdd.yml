version: 1
name: physical-structure
structure_id: a3-ci-github-repository-layout
elements:
  - element_id: repository-version
    element_kind: file
    path: VERSION
    primary_area_kind: specification
    area_kinds: [specification]
    source_control: managed
    placement_purpose: repository release tagと照合するSemVer release versionの正本を所有する
  - element_id: actions-root
    element_kind: directory
    path: actions
    primary_area_kind: action
    area_kinds: [action]
    source_control: managed
    placement_purpose: 独立した GitHub Action の公開契約・実装・配布物・局所テストを所有する
  - element_id: workflows-root
    element_kind: directory
    path: workflows
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: 適用先へ配布する用途別 canonical workflow source を所有する
  - element_id: runtime-root
    element_kind: directory
    path: runtime
    primary_area_kind: implementation
    area_kinds: [implementation, verification]
    source_control: managed
    placement_purpose: workflow の配置・preflight、Action から再利用する定型処理、このリポジトリ自身の delivery workflow から呼び出す検証可能な処理を所有する
  - element_id: quality-reusable-workflow
    element_kind: file
    path: .github/workflows/ci-quality.yml
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: consumer の主品質 caller が固定参照する共通品質 workflow source を所有する
  - element_id: preset-model
    element_kind: file
    path: runtime/preset/preset-model.ts
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: presetの型と副作用のない値操作を所有し、registry・適用先の読み込みに依存しない
  - element_id: preset-registry
    element_kind: file
    path: runtime/preset/preset-registry.ts
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: providerの固定registryとYAMLの読み込み・解釈を所有し、適用先資材の調査に依存しない
  - element_id: preset-project-assets
    element_kind: file
    path: runtime/preset/ci-preset-assets.ts
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: 解釈済みregistryに基づく適用先workflow・管理資材の検出とsource解決を所有する
  - element_id: quality-platforms-reusable-workflow
    element_kind: file
    path: .github/workflows/ci-quality-platforms.yml
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: consumer の platform 品質 caller が固定参照する共通 matrix 品質 workflow source を所有する
  - element_id: package-preparation-reusable-workflow
    element_kind: file
    path: .github/workflows/ci-package-preparation.yml
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: consumer が固定参照する package 準備 workflow を所有し、owner build adapter は consumer に保持する
  - element_id: release-publication-reusable-workflow
    element_kind: file
    path: .github/workflows/ci-release-publication.yml
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: consumer caller が固定参照する Release 公開 workflow を所有し、owner 設定と固有 adapter は consumer に保持する
  - element_id: package-publication-reusable-workflow
    element_kind: file
    path: .github/workflows/ci-package-publication.yml
    primary_area_kind: implementation
    area_kinds: [implementation]
    source_control: managed
    placement_purpose: consumer caller が固定参照する Package 公開 workflow を所有し、owner registry credential と固有 publisher は consumer に保持する
  - element_id: distribution-runtime-root
    element_kind: directory
    path: runtime/distribution
    primary_area_kind: implementation
    area_kinds: [implementation, verification]
    source_control: managed
    placement_purpose: selective distribution manifest生成、固定revision取得、workflow差分計画、承認済み適用およびtransaction復旧を所有する
  - element_id: lint-rules-root
    element_kind: directory
    path: lint-rules
    primary_area_kind: verification
    area_kinds: [verification]
    source_control: managed
    placement_purpose: GitHub Actions 資産に対する provider 固有の静的検証ルールを所有し、実 runtime 回帰は tests から検証する
  - element_id: skills-root
    element_kind: directory
    path: skills/ci-github
    primary_area_kind: documentation
    area_kinds: [documentation]
    source_control: managed
    placement_purpose: AIエージェント向けの起動条件と公開操作導線を所有する
  - element_id: local-agent-skills-root
    element_kind: directory
    path: .agents/skills
    primary_area_kind: documentation
    area_kinds: [documentation]
    source_control: managed
    placement_purpose: repository保守者向けのproject-local Agent Skillと公開スキル配備の操作導線を所有する
  - element_id: sdd-root
    element_kind: directory
    path: sdd
    primary_area_kind: specification
    area_kinds: [specification]
    source_control: managed
    placement_purpose: 要求・仕様・設計を接続する SDD 正本を所有する
  - element_id: tests-root
    element_kind: directory
    path: tests
    primary_area_kind: verification
    area_kinds: [verification]
    source_control: managed
    placement_purpose: リポジトリ横断の統合テスト、公開 CLI E2E、契約対象別実行定義、配布検証資産を所有する
  - element_id: docs-root
    element_kind: directory
    path: docs
    primary_area_kind: documentation
    area_kinds: [documentation]
    source_control: managed
    placement_purpose: リポジトリ横断の利用・保守・運用文書を所有する
  - element_id: github-root
    element_kind: directory
    path: .github
    primary_area_kind: delivery
    area_kinds: [delivery]
    source_control: managed
    placement_purpose: このリポジトリ自身の検証・公開 workflow と固定参照される reusable workflow の配置先を所有する
