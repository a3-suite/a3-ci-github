version: 1
name: use-case
use_case_id: github-package-publication
summary: Package管理者が固定sourceから生成した検証済みpackageを承認されたversionでregistryへ公開する
actors:
  - actor_id: package-maintainer
    kind: human
    role: primary
    summary: packageのsource、version、公開先および公開判断を管理する主体
  - actor_id: package-registry
    kind: external-system
    role: secondary
    summary: 認証済みのpackage publishを受け付け、公開結果のreadbackを提供する外部registry
goal: buildと公開権限を分離し、検証済みpackageだけを承認されたversionと公開先へ一度だけ公開する
preconditions:
  - package policy、version plan、build extension、publication extensionおよびregistry credentialのownerが確定している
  - package publicationを構成するcanonical workflow群が同じ検証済みrevisionに配置されている
trigger: Package管理者が公開対象のsourceとexact versionを承認してpublication requestを実行する
main_success_scenario:
  - summary: publication requestがsource、version、target identity、language profile、toolchain、公開先およびrun provenanceを固定する
  - summary: default branchのcallerがrequestとworkflow identityを検証し、固定入力からpreparation workflowを呼び出す
  - summary: preparation workflowが固定sourceとversion planを検証し、package digestを含むimmutableなhandoffを生成する
  - summary: publication workflowがworkflow identityとhandoffを検証してからcredentialを注入し、指定registryへ公開する
  - summary: registryからversionとpackage identityをreadbackし、requestおよびhandoffと照合する
success_outcomes:
  - source、version、package digest、公開先およびregistry上のpackageを一意に対応付けられる
  - write権限を持つ処理は検証済みhandoff以外からpackageやversionを再決定しない
failure_outcomes:
  - request、preparation、identity、handoff、publishまたはreadbackの失敗時は後続処理を停止する
  - 部分公開または状態不明では自動上書きやversion再利用を行わず、観測済み状態を保持する
related_requirements:
  - requirement_ref:
      requirement_id: github-package-publication-workflow
  - requirement_ref:
      requirement_id: ci-common-processing-action-reuse
related_contracts:
  - contract_ref:
      contract_id: contract.ci-package-publication-workflow.publication
  - contract_ref:
      contract_id: contract.ci-package-publication-request.outputs
  - contract_ref:
      contract_id: contract.ci-handoff-integrity.outputs
  - contract_ref:
      contract_id: contract.ci-publish-version.outputs
