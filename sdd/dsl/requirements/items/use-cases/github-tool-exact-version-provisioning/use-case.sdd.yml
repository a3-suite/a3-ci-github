version: 1
name: use-case
use_case_id: github-tool-exact-version-provisioning
summary: CI workflow が provider 処理で使うツールの exact version を runner 既定に依存せず供給し、実行前に検証する
actors:
  - actor_id: ci-workflow
    kind: external-system
    role: primary
    summary: provider 処理の前にツールの版を固定して実行する GitHub workflow
goal: provider が使うツールの exact version を供給し、実行前に検証して runner image 更新の影響を排除する
preconditions:
  - 供給するツールの exact version が workflow 初期パラメータで固定されている
  - Action が固定 commit SHA で参照されている
trigger: provider 処理または release build で exact version のツールが必要になる
main_success_scenario:
  - summary: 指定 version の Release asset を取得し、同じ Release の checksum で検証する
  - summary: 検証済みの実行ファイルだけを job の PATH へ追加する
  - summary: 供給後の実 version を verifier で検証する
  - summary: 供給失敗と version 不一致を区別して診断する
success_outcomes:
  - runner image の既定版に依存せず、指定した exact version のツールで処理が実行される
failure_outcomes:
  - checksum 不一致、未対応 runner、取得失敗、配置失敗は供給を fail closed で停止する
  - 供給後の version 不一致は verifier が検出して停止する
related_requirements:
  - requirement_ref:
      requirement_id: github-toolchain-exact-version-verification
  - requirement_ref:
      requirement_id: jq-release-provisioning
  - requirement_ref:
      requirement_id: gh-release-provisioning
  - requirement_ref:
      requirement_id: ci-common-processing-action-reuse
