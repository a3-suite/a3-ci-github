version: 1
name: use-case
use_case_id: github-actions-action-contract-and-distribution
summary: Action maintainer が公開契約と配布物を一致させ、利用者が同じ ref から Action を実行できる状態を提供する
actors:
  - actor_id: action-maintainer
    kind: human
    role: primary
    summary: Action の契約、実装、テスト、配布物、release ref を管理する主体
  - actor_id: action-consumer
    kind: external-system
    role: secondary
    summary: action.yml の契約を使って Action を呼び出す workflow 側の主体
  - actor_id: script-maintainer
    kind: human
    role: supporting
    summary: provider adapter から独立した定型処理の実装契約とテストを管理する主体
goal: Action の公開契約を保ったまま、利用者側の build や内部依存なしで安全に実行できる配布状態を提供する
preconditions:
  - Action の実行方式と公開契約が選択されている
  - provider 側が workflow mapping、権限、runner、信頼境界を所有している
trigger: Action の新規作成または公開契約・実装・依存の変更
main_success_scenario:
  - summary: action.yml に公開 input、output、runtime、entrypoint を定義する
  - summary: 実装で入力制約、secret 取り扱い、成功 output、失敗終了状態を検証する
  - summary: 共通化する定型処理は単独実行できる script として実装し、Composite Action は入出力写像だけを担当する
  - summary: 実装方式に応じた配布物を再生成し、契約テスト、実装テスト、配布物検証を実行する
  - summary: Action ディレクトリの一覧を README.md へ反映し、コミットゲートで一覧の同期を検証する
  - summary: 実装と配布物を同じ immutable ref に含め、利用者が source build なしで実行できる状態を公開する
success_outcomes:
  - Action の公開契約、実装、配布物が同じ ref で一致する
  - 利用者は Action の input/output 契約だけを使って実行できる
failure_outcomes:
  - 必須契約、入力検証、secret 取り扱い、配布物、テストのいずれかが不一致なら公開を確定しない
  - workflow の権限、runner、trigger、job 境界は Action が決定せず provider 側へ委譲する
related_requirements:
  - requirement_ref:
      requirement_id: github-actions-action-contract-and-distribution
