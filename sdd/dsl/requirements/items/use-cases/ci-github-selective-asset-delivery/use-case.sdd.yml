version: 1
name: use-case
use_case_id: ci-github-selective-asset-delivery
summary: CI管理者がRelease manifestから必要なCI資材を選択取得し、canonical workflowを安全に適用または復旧する
actors:
  - actor_id: ci-maintainer
    kind: human
    role: primary
    summary: 利用projectの配布asset選択、差分確認、適用後検証および復旧を管理する主体
goal: 不要資材と実装authorityの複製を避け、固定revisionの必要資材だけを再現可能な状態で利用projectへ接続する
preconditions:
  - 承認済みGitHub Release identity、配布manifestおよびfetch CLIの取得元を解決できる
  - 利用project rootと適用するpresetまたはassetが明示されている
trigger: 利用projectがa3-ci-githubの資材を新規取得、追加取得、更新または復旧する
main_success_scenario:
  - Release manifestとfetch CLIの完全性を確認し、発行者信頼境界とchecksum検証を区別する
  - presetまたはassetを選び、registry由来の必須依存閉包と外部owner境界を確認する
  - full commit SHA固定URLから選択fileだけをstagingへ取得し、sizeとSHA-256を検証する
  - 検証済みfileと取得receiptをsource revision単位のproject-local distributionへ公開する
  - manifestの固定参照を確認し、製品設定を反映したcanonical workflowを得る
  - 生成結果と各destinationの適用区分をplanとして確認する
  - 依頼で許可された範囲の差分確認、同一digest照合、排他取得、plan前提再確認後に生成済みworkflowを適用し、transactionと変更前状態を保持する
  - 必要なadapter materializeを既存ownerへ委譲し、asset lock、lint、preflight、consumer契約テストを順に実行する
success_outcomes:
  - 選択した配布assetだけがfull source revision、manifest digest、receipt、planおよびtransactionから追跡できる
  - 通常CI実行は導入・検証用のproject-local distributionを参照せず、配置済みcaller・request workflow、固定SHAのprovider再利用workflowとAction、project-owned設定で成立する
  - 更新失敗時は旧distributionを保持し、今回transactionの変更を復旧できる
failure_outcomes:
  - manifest、source、size、digest、依存閉包またはredirect境界が不正ならconsumer管理資産を変更しない
  - plan後のsource、destination、manifestまたは照合対象のplan digestが変化した場合はcopyを開始または継続しない
  - 管理外差分、並行apply、未取得assetまたは不完全な閉包を成功扱いにしない
related_requirements:
  - ci-github-selective-distribution
  - github-ci-project-lifecycle
related_contracts:
  - contract.ci-selective-distribution.selection
  - contract.ci-selective-distribution.delivery
  - contract.ci-selective-distribution.publication
  - contract.ci-selective-distribution.application
  - contract.ci-preset-materialization.application
  - contract.ci-preset-assurance.asset-lock
  - contract.ci-preset-assurance.verification
  - contract.ci-selective-distribution.plan
  - contract.ci-selective-distribution.rollback
