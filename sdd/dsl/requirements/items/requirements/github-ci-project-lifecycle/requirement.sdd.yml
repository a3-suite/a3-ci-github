version: 1
name: requirement
requirements:
  - requirement_id: github-ci-project-lifecycle
    type: functional
    summary: 利用projectがa3-ci-githubのpresetを選択、適用、更新、検証および監査できる
    rationale: >-
      workflowの実行時振る舞いだけでは、利用projectへの安全な導入、配布元との同一性、設定差分、
      更新後の整合性を保証できず、projectごとに独自の導入手順が増えるため
    subject:
      namespace: ci
      key: project-lifecycle
    priority: must
    fit_criteria:
      - 利用目的に対応するpresetと、そのcanonical workflow、Action binding、adapter、required extensionの閉包をregistryから選択できる
      - 既存資産との差分を確認し、利用projectが所有する設定と配布元から配置する資産を区別して適用できる
      - 配布元revision、canonical asset、配置済みassetの同一性をlockとpreflightで検証できる
      - 更新時は既存資産を暗黙に上書きせず、追加、変更、撤去対象とproject固有差分を確認できる
      - runner OS、toolchain、runtime、依存packageおよびAction・配布資材参照のバージョン制約ごとに、固定しない場合に損なわれる保証、必要な固定粒度、許容できる選択範囲と選択を所有する側を説明できる
      - 完全一致、major・minor単位、互換範囲および利用projectによる指定を比較し、安全性・再現性・契約互換性を満たすために必要な最小限の制約を選べる
      - 公開契約と必要な実行条件を満たす利用projectのバージョン選択・移行を、必要性のないprovider固有の固定値や許可リストで妨げない
      - 検証済みバージョンの一覧と入力として受理する範囲を区別し、範囲を制限する場合は契約または実行上の根拠と更新・廃止への追従方法を確認できる
      - 選択範囲を広げる場合も、既存契約が要求する固定SHA、checksum、lock、toolchain検証および信頼・権限境界を維持し、選択方針と実際に解決・検証した版を区別できる
      - read-only監査では利用projectの管理対象資産、依存またはlockを変更せず、不一致と未確認事項を記録できる
      - remediationは明示的な変更許可がある場合だけ行い、監査結果を成功させるために不足資産を暗黙補完しない
