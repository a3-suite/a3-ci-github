version: 1
name: requirement
requirements:
  - requirement_id: ci-failure-diagnostics
    type: quality
    summary: 各契約対象でエラー発生時に詳細な原因診断が可能な証跡を残し、保守者が障害箇所と次の確認事項を特定できる
    rationale: >-
      失敗終了だけでは原因箇所、入力、環境差異、再実行条件を特定できず、調査のための再実行や
      一時的なデバッグ変更が増えて復旧が遅れるため
    subject:
      namespace: ci
      key: failure-diagnostics
    priority: must
    fit_criteria:
      - 全契約対象の公開境界で、拒否・実行失敗・判定不能を診断対象とし、失敗終了だけでなく原因診断に必要な証跡を残す。正常な未選択・skipをエラーに変えない
      - 各契約は失敗段階を識別できることを保証する。段階の値域と段階ごとの入力identityは実装とテストで保証し、期待値と観測値または取得不可理由、失敗前に確定した結果、証跡の所在は共通の診断契約で保証する
      - 再実行や一時的なデバッグ変更を行わずに、残されたlogと既存の証跡から原因を切り分けられる。原因が不明の場合は不明であることと調査に必要な文脈を明示する
      - 診断契約の定義・静的検査と、実際の失敗境界で証跡を保持する実行検証を区別し、定義の存在やテスト収集だけで実装適合を主張しない
      - 失敗したcomponent、stageまたはoperationと、原因分類、失敗理由、対処に必要な次の確認事項を識別できるメッセージを出力する
      - run、job、matrix、source revision、対象platform、artifactなど、事象を一意に対応付けるために必要な識別情報を既存のCIコンテキストから確認できる
      - 入力検証結果、実行した検証段階、終了状態、失敗前に確定した主要結果を、障害原因の切り分けに必要な範囲で証跡として残す
      - secret、token、credential、保護対象の入力値をメッセージ、summary、outputまたはartifactへ記録しない
      - 同じ情報の重複、大量の無関係な出力、文脈のないstack traceを避け、最初に確認すべき失敗情報を判別できる
      - 証跡生成の失敗が元の失敗理由や終了状態を上書きせず、元の障害を追跡できる
