version: 1
name: requirement
requirements:
  - requirement_id: rust-release-asset-integrity
    type: functional
    summary: Rust release asset を承認済みの source、toolchain、platform 定義に結び付け、改変や上書きを許さず検証できる
    rationale: >-
      release asset の生成根拠と内容が分離すると、異なる source や toolchain から生成された成果物を
      正規の release として扱う危険があるため
    subject:
      namespace: skills
      key: rust-release
    priority: must
    fit_criteria:
      - 要求の language profile が release authority の language profile と一致する
      - checkoutしたソースのコミットSHAが release authority の source SHA と一致する
      - 資材の生成に使う toolchain は release authority の固定版と完全に一致し、可変 channel は受け入れない
      - 承認済みの platform manifest 内で指定された platform ID が一意であり、その target が要求された target と一致する
      - package version が release authority の version と一致する
      - 生成されたバイナリが報告する version が release authority の version と一致する
      - version の不一致または観測不能を成功扱いにせず識別できる
      - archive の内容が checksum と asset manifest の記録に一致する
      - asset manifest に記録された source SHA と platform identity が承認済みの生成条件に一致する
      - 既存の出力先または競合して作成された出力先を上書きしない
      - 入力不一致、build、package、または検証の失敗時は成功状態や未検証 asset を公開しない
