version: 1
name: requirement
requirements:
  - requirement_id: ci-common-processing-action-reuse
    type: functional
    summary: 再利用可能な共通 CI 処理を、project-local な複製ではなく固定 SHA の GitHub Action として提供する
    rationale: >-
      共通処理の実装正本を Action 提供側へ集約し、利用 project ごとの実装複製と runtime 依存の重複を避けながら、
      workflow と owner が持つ信頼、権限、policy の境界を維持するため。
      標準 installer の公開入口の構成（Windows 公開入口と Unix 共有入口、Unix の対象別導入方式の維持）と、
      標準 Rust 品質 bundle が利用者指定の版と設定ファイルだけを正本として依存ポリシー検査を実行する方式は、
      利用者が指定したため要求として固定する
    subject:
      namespace: ci
      key: common-processing-action-reuse
    priority: must
    fit_criteria:
      - Action 化する処理は cross-project reusable、bounded I/O、fail-closed の全条件を満たし、provider write は registry が限定承認した専用 Release publisher のみ許可する
      - 対象処理は固定 SHA の Action から実行でき、利用 project に同じ実装 script または runtime を複製しない
      - workflow は job 境界、permissions、credential 注入を保持し、owner は policy と credential route を保持する
      - Release publication の request、provenance、approval を provider-write-free に検証できる
      - package publication request の作成と検証を provider-write-free に実行できる
      - validated read-only quality descriptor を固定 source checkout に対して実行し、実行状態を取得できる
      - Action へ移した旧実装を project-local fallback として残さない
      - 標準installerを選択した場合、providerはinstaller ownerの命名契約に従うWindows公開入口とUnix共有入口を生成・検証し、製品宣言との自己整合だけで標準適合としない。Unixの対象別導入方式は維持する
      - 公開スキルを選択した場合、製品と同じ固定source・versionに拘束した必要なスキルだけを同じ1回のReleaseで提供し、開発・一時・コンパイル残骸を除外する。installerとの併用でも各owner証跡を保持し、利用者向けの導入・削除案内を同梱構成と一致させる
      - quality descriptor が要求する toolchain version と実際の version の一致を確認でき、不一致を成功扱いにしない
      - 標準 Rust 品質 bundle は、利用者が版と設定ファイルを指定した場合だけ、その設定ファイルを正本とする依存ポリシー検査を実行する。指定しない場合は未実行として結果に記録し、成功として扱わない。設定ファイルを確認できない場合は既定の規則で代替せず停止する
      - platform 別に品質検査を実行する場合、共通検査（format、security、dependency-policy）の共有は、利用 project が宣言し、platform 間で設定と対象が同等であることを確認した、信頼できる宣言だけで有効になる
      - 共通検査の共有が有効な場合は共通検査を重複して実行せず、共通検査の結果を含めて全 platform の成功を集約の成功条件とする
      - 共通検査の共有が有効と判断できない場合は、全 platform で全検査を維持する
      - 品質結果の集約 status は、owner の方針で対象外とした行と、descriptor が任意と宣言した検査の未設定による未実行だけを成否の判定から除く。これら以外の未実行・判定不能を成功として扱わない
      - 全行が対象外の入力は集約せず拒否する
    depends_on:
      - github-actions-action-contract-and-distribution
    external_document_refs:
      - document_id: a3-prompts-ci-script-contracts
        locator: commonContract
      - document_id: a3-prompts-ci-adapter-bundles
        locator: contract.toolchain
