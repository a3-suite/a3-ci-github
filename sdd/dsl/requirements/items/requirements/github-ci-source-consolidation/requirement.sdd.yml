version: 1
name: requirement
requirements:
  - requirement_id: github-ci-source-consolidation
    type: functional
    summary: GitHub Actions向けCIの契約、workflow、Action、runtime、検証を一つの責務境界で保守できる
    rationale:
      why: >-
        CIスキルとcanonical workflow、再利用Actionが別リポジトリに分散した状態では、契約変更の追跡と
        受入検証が複数の変更集合に分かれ、正本と実装の整合を一度に確認できないため
    subject:
      namespace: ci
      key: github-source-consolidation
    priority: must
    fit_criteria:
      - Agent Skill、canonical workflow、Action、runtime、静的検証、SDD、回帰資産のownerと物理配置を一意に解決できる
      - Agent Skillは操作導線だけを所有し、workflow、Action、runtime、lint ruleの実体を内包しない
      - 適用先へ配布するcanonical workflowと、このリポジトリ自身のworkflowを別の公開面として識別できる
      - Actionは短く安定したactions/<action-name>の公開パスを使用できる
      - 移行のauthority、baseline revision、cutover状態を確認できる
    derived_artifacts:
      use_cases:
        - use_case_ref:
            use_case_id: ci-github-managed-source-maintenance
      constraints:
        - constraint_ref:
            constraint_id: github-ci-migration-authority
