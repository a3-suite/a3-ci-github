version: 1
name: requirement
requirements:
  - requirement_id: github-package-publication-workflow
    type: functional
    summary: GitHub Actions上で検証済みpackageを承認されたversionと公開先へ安全に公開できる
    rationale: >-
      package生成、公開要求、credentialを使う公開処理を直接接続すると、未検証packageや異なるversionを
      registryへ公開する危険があるため
    subject:
      namespace: ci
      key: package-publication-workflow
    priority: must
    fit_criteria:
      - package preparationは固定sourceとversionからpackageと検証可能なhandoffを生成する
      - publication requestは公開対象のsource、version、target identity、language profile、toolchainおよびrequest provenanceをimmutableに固定する
      - default branchのcallerから渡されたrequestとworkflow identityを確認できる場合だけ、そのrequestに固定された入力からpackageが準備される
      - 公開されたpackageの内容と版は、公開前に検証したhandoffの内容と版に一致する
      - credentialが使われる公開段階で、packageの再buildや版の再決定は発生しない
      - 公開後はregistryからversionとpackage identityをreadbackし、不一致または状態不明を成功扱いしない
      - request、preparation、identity、handoff、publishまたはreadbackの失敗時は未検証の後続処理を停止する
