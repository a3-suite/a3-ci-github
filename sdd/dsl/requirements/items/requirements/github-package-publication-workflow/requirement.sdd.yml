version: 1
name: requirement
requirements:
  - requirement_id: github-package-publication-workflow
    type: functional
    summary: GitHub Actions上で検証済みpackageを承認されたversionと公開先へ安全に公開できる
    rationale:
      why: >-
        package生成、公開要求、credentialを使う公開処理を直接接続すると、未検証packageや異なるversionを
        registryへ公開する危険があるため
    subject:
      namespace: ci
      key: package-publication-workflow
    priority: must
    fit_criteria:
      - package preparationは固定sourceとversionからpackageと検証可能なhandoffを生成する
      - publication requestは公開対象のpackage、version、sourceおよびprovenanceをimmutableに固定する
      - default branch上のcallerがrequestとworkflow identityを検証してからpublication workflowを呼び出す
      - credentialを使用するpublish処理は検証済みhandoffだけを入力とし、buildやversion決定をやり直さない
      - 公開後はregistryからversionとpackage identityをreadbackし、不一致または状態不明を成功扱いしない
      - preparation、request、handoff、publishまたはreadbackの失敗時は未検証の後続処理を停止する
    derived_artifacts:
      use_cases:
        - use_case_ref:
            use_case_id: github-package-publication
