version: 1
name: constraint
constraint_id: github-ci-migration-authority
summary: cutover完了までコピー元を公開済み資産のauthorityとして維持し、移行先で独立した二重更新を行わない
scope:
  namespace: ci
  key: github-source-consolidation
rule: >-
  a3-ci-github の契約再構築と受入検証が完了するまでは、公開済みActionと固定SHAは a3-actions、
  既存CIスキルとcanonical workflowは a3-prompts をauthorityとする。取り込んだ資産は移行baselineとして扱い、
  同じ契約をコピー元とコピー先で独立に変更しない。新しいrepository path、固定SHA、Release tagへの切替と、
  コピー元からの削除またはarchiveは、代表フローの検証と別途承認の後に行う。
rationale:
  why: 移行中に複数の正本が同時に更新され、公開済み利用者と再構築中の実装が追跡不能に分岐することを防ぐため
violation_impact: 公開Action、workflow、スキル契約の不一致と、固定SHA利用者の再現性喪失を招く
related_requirements:
  - requirement_ref:
      requirement_id: github-ci-source-consolidation
