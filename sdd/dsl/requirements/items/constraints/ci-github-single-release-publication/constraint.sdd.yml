version: 1
name: constraint
constraint_id: ci-github-single-release-publication
summary: CI資材の実装と接続の公開を1つのReleaseにまとめる
scope:
  namespace: ci
  key: selective-distribution
rule: >-
  通常リリースとhotfixの公開単位はそれぞれ1つのexact tagとGitHub Releaseとする。
  同じ版の実装と接続の利用可能化を、Action実装の先行Releaseと接続専用の後続Releaseへ分割してはならない。
  準備コミットの数にかかわらず、exact tag、Release、consumerが採用する版はこの公開単位に対応する。
rationale: 修正の公開とその利用可能化を分離すると、公開済みの修正版を採用しても旧実装が動くため
violation_impact: consumerで修正が有効にならない、または追加Releaseが必要になる
related_requirements:
  - ci-github-selective-distribution
