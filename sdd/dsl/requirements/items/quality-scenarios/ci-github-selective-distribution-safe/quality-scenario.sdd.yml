version: 1
name: quality-scenario
quality_scenario_id: ci-github-selective-distribution-safe
summary: 選択配布が改変、欠落、競合、並行操作または通信失敗時にconsumer管理資産を保護する
quality_attribute: reliability
stimulus: Repository保守者が固定revisionの配布bootstrapを公開する、またはCI管理者が固定Releaseからpresetまたはassetを取得・適用・更新・復旧する
environment: GitHub Releaseとfull SHA Raw source、または同一repository snapshotを利用できる導入・保守環境
response: 配布資材の公開・取得を完全性検証後にだけ成功として受け入れ、承認済みplan以外のconsumer変更を拒否または復旧する
response_measure:
  - 通常リリースとhotfixの各公開で、consumerが同じReleaseだけを採用して修正実装を利用でき、実装の事前公開や接続専用の追加公開を要求しない
  - 公開対象に含まれない実装SHA、実行資材の差異、または旧実装への接続を検出した場合は公開を成功扱いにしない
  - manifestとfileのsource revision、path、sizeまたはSHA-256が一致しない場合はRelease公開またはconsumer管理資産変更を成功扱いにしない
  - GitHub Releaseの3 assetをremote readbackし、準備済みbyteとの不一致または重複時はaliasを更新しない
  - 通信にはtimeoutと有限retryを適用し、検証済みlocal distributionは同一manifest digestの場合だけ再利用する
  - asset単体選択の不足依存、preset閉包の欠落、外部owner identity不足を成功扱いにしない
  - plan後にmanifest、source、destinationまたは所有権を示すasset lockのdigestが変化した場合はapplyを停止する
  - 同一projectのapplyは排他し、consumer変更前にtransactionを永続化してpartial applyまたは中断applyを変更前状態へ戻す
  - 管理外destinationを上書きせず、staleは自動削除しない
  - 旧distributionは新revisionの受入完了まで保持し、参照状態を判断できない場合はpruneしない
