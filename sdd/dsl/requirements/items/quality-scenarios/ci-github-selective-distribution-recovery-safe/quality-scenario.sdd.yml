version: 1
name: quality-scenario
quality_scenario_id: ci-github-selective-distribution-recovery-safe
summary: 選択配布の失敗した適用や明示的な復旧で変更前状態へ戻せる
quality_attribute: reliability
stimulus: 適用が途中で失敗する、またはCI管理者が適用済みtransactionの復旧を要求する
environment: GitHub Releaseとfull SHA Raw source、または同一repository snapshotを利用できる導入・保守環境
response: 今回のtransactionが変更したmanaged fileを変更前状態へ戻し、復旧に必要な旧distributionを保持する
response_measure:
  - partial applyまたは中断applyは変更前状態へ戻せる
  - 旧distributionは新revisionの受入完了まで保持し、参照状態を判断できない場合はpruneしない
related_requirements:
  - ci-github-selective-distribution
related_contracts:
  - contract.ci-selective-distribution.application
  - contract.ci-selective-distribution.rollback
