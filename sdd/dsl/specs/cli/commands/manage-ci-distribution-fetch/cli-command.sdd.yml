version: 1
name: cli-command
command:
  id: manage-ci-distribution-fetch
  path:
    - node
    - runtime/distribution/fetch-a3-ci-github.mjs
    - fetch
  summary: Fetch selected preset or asset files into a verified project-local distribution
  usage_targets:
    - id: fetch-local-manifest
      summary: Fetch a selection of at least one preset or asset using a local manifest
      option_bindings:
        - option_id: repo-root
          presence: optional
        - option_id: manifest
          presence: required
        - option_id: preset
          presence: optional
        - option_id: asset
          presence: optional
        - option_id: source-root
          presence: optional
    - id: fetch-release-manifest
      summary: Fetch a selection of at least one preset or asset using a release manifest URL
      option_bindings:
        - option_id: repo-root
          presence: optional
        - option_id: manifest-url
          presence: required
        - option_id: preset
          presence: optional
        - option_id: asset
          presence: optional
  option_groups:
    - id: selection
      title: Distribution selection
      options:
        - manifest
        - manifest-url
        - preset
        - asset
        - source-root
    - id: application
      title: Planned application or recovery
      options:
        - repo-root
  usage:
    - node runtime/distribution/fetch-a3-ci-github.mjs fetch --manifest <PATH> (--preset <ID> | --asset <ID>)... [--source-root <PATH>] [--repo-root <PATH>]
    - node runtime/distribution/fetch-a3-ci-github.mjs fetch --manifest-url <URL> (--preset <ID> | --asset <ID>)... [--repo-root <PATH>]
