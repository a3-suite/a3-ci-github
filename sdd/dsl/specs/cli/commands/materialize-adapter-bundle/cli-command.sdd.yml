version: 1
name: cli-command
command:
  id: materialize-adapter-bundle
  path:
    - tsx
    - runtime/adapter/materialize-adapter-bundle.ts
  summary: Materialize one registered adapter bundle into a consumer project without overwriting conflicting files
  usage_targets:
    - id: materialize
      summary: Return a standard Action binding without copying adapter files into the consumer project
      option_bindings:
        - option_id: source-root
          presence: optional
        - option_id: inventory
          presence: required
        - option_id: bundle
          presence: required
        - option_id: target-root
          presence: required
        - option_id: output
          presence: optional
    - id: custom-materialize
      summary: Resolve external-skill sources and place one custom adapter bundle
      option_bindings:
        - option_id: source-root
          presence: required
        - option_id: inventory
          presence: required
        - option_id: bundle
          presence: required
        - option_id: target-root
          presence: required
        - option_id: output
          presence: optional
  option_groups:
    - id: inputs
      title: Materialization inputs
      options:
        - source-root
        - inventory
        - bundle
        - target-root
        - output
  usage:
    - tsx runtime/adapter/materialize-adapter-bundle.ts --inventory <PATH> --bundle <STANDARD-ID> --target-root <PATH> [--source-root <PATH>] [--output <PATH>]
    - tsx runtime/adapter/materialize-adapter-bundle.ts --inventory <PATH> --bundle <CUSTOM-ID> --target-root <PATH> --source-root <PATH> [--output <PATH>]
