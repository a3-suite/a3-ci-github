version: 1
name: cli-command
command:
  id: assemble-standard-installer
  path:
    - node
    - runtime/installer/run-installer.mjs
    - --operation
    - assemble
  summary: Assemble transferred standard installer candidates into a verified supplemental handoff
  usage_targets:
    - id: assemble
      summary: Verify transported candidates and emit supplemental handoff
      option_bindings:
        - option_id: source-root
          presence: required
        - option_id: authority-path
          presence: required
        - option_id: snapshot-path
          presence: required
        - option_id: standard-build-root
          presence: required
        - option_id: output-directory
          presence: required
        - option_id: provider-revision
          presence: required
        - option_id: supplemental-build-root
          presence: required
  option_groups:
    - id: assembly
      title: Fixed assembly inputs
      options:
        - source-root
        - authority-path
        - snapshot-path
        - standard-build-root
        - output-directory
        - provider-revision
        - supplemental-build-root
  usage:
    - node runtime/installer/run-installer.mjs --operation assemble --source-root PATH --authority-path PATH --snapshot-path PATH --standard-build-root PATH --supplemental-build-root PATH --output-directory PATH --provider-revision SHA
