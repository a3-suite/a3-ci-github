version: 1
name: cli-command
command:
  id: build-standard-installer-platform
  path:
    - node
    - runtime/installer/run-installer.mjs
    - --operation
    - build-platform
  summary: Prepare and verify an exact standard installer candidate for one platform
  usage_targets:
    - id: build-platform
      summary: Verify the exact native platform candidate before evidence finalization
      option_bindings:
        - option_id: source-root
          presence: required
        - option_id: authority-path
          presence: required
        - option_id: snapshot-path
          presence: required
        - option_id: standard-build-root
          presence: required
        - option_id: output-directory
          presence: required
        - option_id: provider-revision
          presence: required
  option_groups:
    - id: assembly
      title: Fixed assembly inputs
      options:
        - source-root
        - authority-path
        - snapshot-path
        - standard-build-root
        - output-directory
        - provider-revision
  usage:
    - node runtime/installer/run-installer.mjs --operation build-platform --source-root PATH --authority-path PATH --snapshot-path PATH --standard-build-root PATH --output-directory PATH --provider-revision SHA
