version: 1
name: contract-environment
environment_id: a3-ci-github-github-environment
boundaries:
  - id: boundary.action-caller
    summary: Action metadata files that declare the inputs a caller can pass.
    kind: file-tree
  - id: boundary.action-output
    summary: GitHub Actions outputs and step result exposed by an Action.
    kind: operation-response
  - id: boundary.runner-path
    summary: Command search path inherited by later steps in the same job.
    kind: data-store
  - id: boundary.workspace-files
    summary: Files read or written in the checked-out workspace.
    kind: file-tree
  - id: boundary.script-result
    summary: Exit status and generated state exposed by a shared script to its caller.
    kind: operation-response
  - id: boundary.repository-gate-result
    summary: Repository consistency result exposed by a maintenance gate.
    kind: operation-response
  - id: boundary.workflow-definition
    summary: Canonical workflow triggers, permissions, orchestration, and summaries exposed for repository verification.
    kind: file-tree
  - id: boundary.project-ci-assets
    summary: Canonical and project-owned CI assets materialized into a consumer project.
    kind: file-tree
  - id: boundary.cli-result
    summary: Exit status, standard output, standard error, and generated evidence exposed by a public repository CLI entrypoint.
    kind: operation-response
  - id: boundary.diagnostic-result
    summary: Failure status, classified reason, correlation identity, and evidence reference exposed by CI processing.
    kind: operation-response
  - id: boundary.release-provider-requests
    summary: GitHub Release provider requests and responses observed during publication or independent verification.
    kind: external-system
  - id: boundary.observation-clock
    summary: Reobservation delays requested from the runner clock.
    kind: external-system
runtime_contexts:
  - id: runtime-context.failure-diagnostic-required
    summary: A selected contract invocation is rejected, fails, or produces an unresolved classification. Failure evidence is required at its public boundary; expected skipped or unselected work does not create an error, and diagnostic generation cannot change the original classification or outcome.
  - id: runtime-context.annotated-tag-resolution-valid
    summary: Repository and tag inputs are valid, credentials permit access to the configured provider, and its tag records identify an annotated tag and referenced commit with canonical SHAs.
  - id: runtime-context.publish-version-plan-valid
    summary: The readable owner-approved plan conforms to the declared exact or ciGenerated version-plan input contract, with complete matching template components and a safe materialized version.
  - id: runtime-context.release-request-handoff-valid
    summary: Required tag, source and request identities are valid, the tag ref agrees with its ref name, and the destination permits writing the request and digest files.
  - id: runtime-context.supplemental-phase-valid
    summary: The selected v2 owner phase has authority-bound configuration, a matching fixed checkout, safe unchanged inputs, exit zero and a new nonempty output directory. Standard-installer declarations also satisfy installer owner public entry naming constraints. Selected native targets are Linux, macOS or Windows; Windows installer execution runs on Windows PowerShell 5.1 or later, and a shared wrapper targets Linux and macOS only.
  - id: runtime-context.supplemental-phase-invalid
    summary: Phase inputs, snapshot, owner selection, checkout or output destination are invalid, a standard-installer declaration violates installer owner public entry naming constraints, the owner fails or produces no nonempty output, or read-only inputs change. A selected native target or installer shell can also be unsupported.
  - id: runtime-context.release-assembly-valid
    summary: Authority, snapshot, platform selection, exact build asset/checksum inventories and any selected opaque owner evidence bindings agree, and the output destination is unclaimed. Selected public skills satisfy ci-github.release-skills-contract and bind to the same Release source and version.
  - id: runtime-context.release-assembly-invalid
    summary: Assembly input is unavailable, unsafe, inconsistent with authority or platform selection, has extra or mismatching assets/checksums or supplemental bindings, or the output destination already exists. Selected public skills can also violate fixed source, required inventory, safe paths or publication name constraints.
  - id: runtime-context.release-pre-observation-valid
    summary: GitHub credentials establish draft visibility and complete GET-only inventory observes no Release for the bound tag, source and handoff identity.
  - id: runtime-context.release-post-verification-valid
    summary: Owner receipt and readback satisfy the evidence schema and all authority/handoff/digest bindings, and independent GET-only observations match the immutable create-result Release ID, tag/source, published state, body and exact asset/checksum inventory.
  - id: runtime-context.release-observation-invalid
    summary: Credentials or remote visibility are insufficient, a Release already exists before create, remote knowledge is incomplete, or owner evidence or independent post-create observations do not match their schema, identity or digest bindings.
  - id: runtime-context.platform-manifest-valid
    summary: The selected manifest is available and satisfies the ci-platform-matrix Action input contract, with selection-path omitted. Runner policy defaults to the bounded bootstrap catalog; a fixed caller may select trusted versioned Hosted label syntax only for verified base or publication control configuration. Label syntax is not proof of Hosted origin or availability.
  - id: runtime-context.platform-manifest-invalid
    summary: The selected manifest is unavailable or does not satisfy the ci-platform-matrix Action input contract.
  - id: runtime-context.quality-platform-selection-invalid
    summary: A supplied quality selection or its manifest is unavailable or violates the ci-platform-matrix input contract.
  - id: runtime-context.quality-toolchain-inputs-ready
    summary: Caller inputs satisfy quality-toolchain-request-valid. For Node/Python, the external setup provider supplies a well-formed exact version record within the requested selector; Rust uses the requested exact version and requires no independent version record. For a registered cargo-audit or cargo-deny binary only, the downloaded archive bytes match the registered digest, extraction supplies a nonempty executable and its external --version response matches the requested version. Rustup and unregistered cargo-audit or cargo-deny source installation require zero external command status, not independently inspected version metadata. Other selected setup dependencies supply their normal zero-status responses; required files and output, environment and PATH destinations permit the selected reads/writes. These are external response and IO inputs, not the composite Action's own step outcomes, computed resolution or published outputs. Release and legacy callers retain the default exact policy.
  - id: runtime-context.quality-toolchain-inputs-unusable
    summary: Caller inputs violate the supported profile, policy or selected version grammar, or request a cargo-deny version below the supported 0.20.0 minimum; or a Node/Python provider supplies a missing, malformed or out-of-selector version record; or a registered cargo-audit or cargo-deny binary has an unavailable download response, mismatching archive digest, empty/invalid executable bytes or a mismatching external --version response; or a selected external installation command/service returns nonzero or required IO is denied. Rustup and unregistered cargo-audit or cargo-deny source installation do not require independent version records or executable metadata. No composite Action outcome or computed resolution is assumed.
  - id: runtime-context.github-toolchain-matches-request
    summary: The selected mode is supported, every required CLI is available, and each installed version exactly matches the requested version.
  - id: runtime-context.jq-release-asset-valid
    summary: The requested jq release and runner asset are available with a matching checksum.
  - id: runtime-context.jq-release-asset-invalid
    summary: The requested jq release is invalid or unavailable, the runner is unsupported, or the checksum or installation fails.
  - id: runtime-context.gh-release-asset-valid
    summary: The requested GitHub CLI release and Linux runner asset are available with a matching checksum.
  - id: runtime-context.gh-release-asset-invalid
    summary: The requested GitHub CLI release is invalid or unavailable, the runner is unsupported, or the checksum, extraction, or installation fails.
  - id: runtime-context.github-toolchain-does-not-match-request
    summary: The selected mode is unsupported, a required CLI is unavailable, or an installed version differs from the requested version.
  - id: runtime-context.github-toolchain-script-succeeded
    summary: The shared GitHub toolchain verification script completed successfully.
  - id: runtime-context.github-toolchain-script-failed
    summary: The shared GitHub toolchain verification script failed.
  - id: runtime-context.rust-source-matches-authority
    summary: The release authority selects Rust, contains a canonical source SHA, and matches the checked-out HEAD.
  - id: runtime-context.rust-source-does-not-match-authority
    summary: The release authority does not select Rust, has an invalid source SHA, or differs from the checked-out HEAD.
  - id: runtime-context.rust-source-script-succeeded
    summary: The shared Rust source verification script completed successfully.
  - id: runtime-context.rust-source-script-failed
    summary: The shared Rust source verification script failed.
  - id: runtime-context.rust-release-build-inputs-match-authority
    summary: The Rust build request has valid authority, source identity, exact toolchain, unique platform selection, package metadata, a binary that reports the authority version as an independent token, and an unclaimed output destination.
  - id: runtime-context.rust-release-build-commands-succeed
    summary: The Rust build inputs match the release authority and the toolchain setup, build, package, checksum, manifest and artifact verification commands complete successfully.
  - id: runtime-context.rust-release-build-rejected
    summary: A Rust build input is invalid, does not match the release authority, selects an ambiguous platform, uses a mutable toolchain, targets an existing output destination, or the binary does not report the authority version as an independent token.
  - id: runtime-context.rust-release-version-report-rejected
    summary: The built binary does not report the authority version as an independent token, or the version command fails.
  - id: runtime-context.rust-release-build-script-succeeded
    summary: The shared Rust release build script completed build, package, checksum, manifest, and artifact verification successfully.
  - id: runtime-context.rust-release-build-script-failed
    summary: The shared Rust release build script failed input validation, build, package, or artifact verification.
  - id: runtime-context.repository-action-distribution-inputs-available
    summary: Action definitions, build metadata, tracked distribution paths, and Composite Action script references are available to the distribution gate.
  - id: runtime-context.repository-action-distribution-inconsistent
    summary: An untracked distribution file exists or a Composite Action references an untracked script.
  - id: runtime-context.repository-action-catalog-inputs-available
    summary: Action definitions and the maintained README Action catalog are available to the catalog projection gate.
  - id: runtime-context.repository-exact-release-tag-available
    summary: An annotated exact vX.Y.Z release tag resolves to the target source commit, whose VERSION is a valid X.Y.Z release version matching the tag.
  - id: runtime-context.repository-release-version-invalid-or-mismatched
    summary: The target source commit has no VERSION, its VERSION is not a valid X.Y.Z release version, or that version differs from the exact release tag.
  - id: runtime-context.release-publication-request-verified
    summary: The publication request has been verified against the invoking workflow evidence and exposes the bound release request run ID.
  - id: runtime-context.package-publication-request-succeeded
    summary: The package publication request has been created or verified successfully and exposes its bound source identity.
  - id: runtime-context.request-trigger-verification-invoked
    summary: A publication request Action runs verify-trigger for the workflow_run event that triggered its caller.
  - id: runtime-context.quality-adapter-toolchain-version-report-rejected
    summary: A quality adapter toolchain version command does not report the requested version as an independent token, or the command exits non-zero.
  - id: runtime-context.action-input-invalid
    summary: An Action invocation contains invalid, unsafe, or authority-mismatching input.
  - id: runtime-context.action-input-insufficient
    summary: An Action input is insufficient to resolve a trustworthy result.
  - id: runtime-context.selective-distribution-selection-valid
    summary: The requested preset or explicitly complete asset set resolves to registered assets and dependencies.
  - id: runtime-context.selective-distribution-selection-incomplete
    summary: A requested preset or direct asset selection is unknown, cyclic, or missing a declared dependency.
  - id: runtime-context.selective-distribution-source-valid
    summary: The trusted manifest and every selected regular file match the immutable repository revision, size, and SHA-256.
  - id: runtime-context.selective-distribution-source-invalid
    summary: The manifest, redirect, path, source file, size, or SHA-256 does not satisfy the selective distribution contract.
  - id: runtime-context.selective-distribution-publication-valid
    summary: The exact tag, approved source and implementation revisions, integration evidence and fixed workflow and installer connections pass provider checks, and the prepared Release assets can be read back byte-identically.
  - id: runtime-context.selective-distribution-publication-invalid
    summary: The approved source, implementation binding, integration evidence or execution inputs fail provider checks, or a Release asset read back differs from its prepared bytes.
  - id: runtime-context.selective-distribution-application-valid
    summary: The approved plan, selected local distribution, and observed consumer destinations remain unchanged under an exclusive apply lock.
  - id: runtime-context.selective-distribution-application-conflict
    summary: A canonical workflow destination contains content not owned by the prior asset lock or the selected plan contains a conflict.
  - id: runtime-context.selective-distribution-application-incomplete
    summary: A copyable asset was fetched directly without selecting the preset dependency closure required for application.
  - id: runtime-context.selective-distribution-plan-changed
    summary: The manifest, source, destination, approval digest, or plan input changed after planning.
  - id: runtime-context.preset-materialization-rejected
    summary: A selected source is invalid, a destination already contains different content, declared consumer settings are unsatisfied, or a copy fails after the invocation starts.
  - id: runtime-context.preset-assurance-roots-missing
    summary: Preset assurance is invoked without an explicit repository root.
  - id: runtime-context.preset-assurance-read-only-output-requested
    summary: Read-only preset assurance is invoked with remediation output requested.
  - id: runtime-context.release-publisher-valid
    summary: Owner-approved notes, future expiry, authority and validated handoff agree; injected GitHub token has observed draft visibility, complete absence and successful bounded provider responses.
  - id: runtime-context.release-publisher-invalid
    summary: Inputs are missing or mismatched, approval is expired, source moves, inventory is unknown, a Release already exists, or create/upload/finalize/readback fails.
  - id: runtime-context.release-authority-valid
    summary: Explicit owner Release decision, authorized request runs, approved notes, fixed tag/source, owner receiving workflow and trusted snapshot agree with the target repository identity.
  - id: runtime-context.release-authority-invalid
    summary: Decision or provenance is missing, legacy-only, changed or expired; tag/source, owner receiving workflow, snapshot or provider state is inconsistent or unknown.
  - id: runtime-context.standard-installer-evidence-valid
    summary: Standard-installer assemble receives authority-bound transported candidates whose exact file inventories and SHA-256 bytes match their platform records and whose native verification succeeds.
  - id: runtime-context.preset-standard-materialization-valid
    summary: Repository and external-skill sources resolve, all selected destinations are new or content-identical, declared consumer settings are satisfied, and the required source reads and destination writes remain available throughout the invocation. The selection is a registered standard Action bundle and needs no external source-root.
  - id: runtime-context.preset-custom-materialization-valid
    summary: Repository and external-skill sources resolve, all selected destinations are new or content-identical, declared consumer settings are satisfied, and the required source reads and destination writes remain available throughout the invocation. The selection is a copyable custom bundle with an explicit source-root.
  - id: runtime-context.release-publisher-invocation
    summary: The declared publisher boundary is invoked with its normal input and provider interfaces, including incomplete or invalid inputs and any provider response or transport fault.
  - id: runtime-context.quality-selection-shared-checks-supplied
    summary: A valid quality selection explicitly declares boolean sharedStandardChecks.
  - id: runtime-context.quality-selection-shared-checks-omitted
    summary: A valid quality selection omits sharedStandardChecks.
  - id: runtime-context.distribution-rollback-restorable
    summary: An explicit rollback receives a valid recorded transaction, verified before-state backups and unchanged transaction-owned destinations under the exclusive lock; backup reads, restoration writes and required state writes remain available.
  - id: runtime-context.distribution-partial-apply-restorable
    summary: An initially valid unchanged plan has multiple writes; after an earlier write, a later destination or source becomes unavailable or changes. Earlier transaction-owned destinations remain unchanged by others, verified backups remain readable and all recovery writes remain available.
  - id: runtime-context.release-verification-invocation
    summary: Any invocation of observe-before or verify-after, including invalid inputs, insufficient credentials, unknown remote state and mismatching evidence.
  - id: runtime-context.distribution-independent-destination-stable
    summary: During a plan, apply or rollback invocation, one or more canonical consumer destinations differ from the current identity expected by the plan or recorded transaction. Every such destination remains unchanged by other actors from its independent modification through invocation completion.
  - id: runtime-context.selective-distribution-plan-input-valid
    summary: A plan request selects a verified local distribution and complete preset closure, readable consumer destinations, valid settings and interpretable prior ownership. Conflicts may be reported by the resulting plan; no apply approval is required to plan.
  - id: runtime-context.ci-quality-adapter-native-rust-valid
    summary: A valid embedded rust-cargo-quality invocation selects execution-scope native, valid fixed source paths and a matching toolchain.
  - id: runtime-context.ci-quality-adapter-native-scope-rejected
    summary: A native execution request selects a non-Rust bundle or a local descriptor, or the requested execution scope is unknown.
  - id: runtime-context.ci-quality-adapter-dependency-policy-unconfigured
    summary: A rust-cargo-quality invocation with execution scope all leaves both CI_CARGO_DENY_VERSION and CI_CARGO_DENY_CONFIG_PATH empty, and its prerequisites succeed.
  - id: runtime-context.ci-quality-adapter-dependency-policy-configured
    summary: A rust-cargo-quality invocation with execution scope all supplies a nonempty CI_CARGO_DENY_VERSION and a relative CI_CARGO_DENY_CONFIG_PATH naming a regular file inside the source checkout, and its prerequisites succeed.
  - id: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
    summary: A rust-cargo-quality invocation supplies only one of CI_CARGO_DENY_VERSION and CI_CARGO_DENY_CONFIG_PATH, or a CI_CARGO_DENY_CONFIG_PATH that is absolute, missing, not a regular file, or outside the source checkout.
  - id: runtime-context.ci-quality-adapter-dependency-policy-violation
    summary: A configured rust-cargo-quality dependency-policy command exits non-zero, and its cargo-deny JSON output reports error diagnostics and a per-check summary together with message, label and span text.
  - id: runtime-context.ci-quality-adapter-embedded-bundle-supplied
    summary: A registered embedded standard bundle is selected from a fixed Action artifact for execution; consumer descriptors are not selected.
  - id: runtime-context.ci-quality-summary-summary-mixed-applicability
    summary: At least one quality row is applicable and valid; excluded rows may contain non-success statuses.
  - id: runtime-context.ci-quality-summary-summary-default-evidence-valid
    summary: A valid summary has a row with omitted evidence and a valid GitHub server URL, repository and run ID.
  - id: runtime-context.ci-quality-summary-summary-all-excluded
    summary: All supplied quality rows are intentionally excluded.
  - id: runtime-context.ci-quality-summary-summary-run-context-missing
    summary: Evidence is omitted and the GitHub run context needed to construct a URL is absent or invalid.
  - id: runtime-context.ci-quality-toolchain-registered-binary-input-unusable
    summary: A registered cargo-audit or cargo-deny version/target is requested with an unavailable download response, mismatching archive digest, invalid archive, mismatching executable version, or unwritable PATH output destination.
  - id: runtime-context.quality-toolchain-request-valid
    summary: The requested language profile and version policy are supported; the requested toolchain is exact or a bounded Node/Python selector under compatible policy, and selected auxiliary tool versions satisfy their input grammar. No setup outcome or observed resolved version is assumed.
  - id: runtime-context.ci-preset-assurance-canonical-lock-input
    summary: A full immutable source revision and a complete configured canonical preset are supplied for lock generation. Managed workflow bytes, registry-projected pin companions and required settings conform to the provider inputs; source and consumer files remain readable and unchanged through the invocation.
