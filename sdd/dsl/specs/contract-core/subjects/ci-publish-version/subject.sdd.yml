version: 1
name: contract-subject
subject:
  id: subject.ci.publish-version
  summary: Materializing an owner-approved version plan into a publish version.
contracts:
  - id: contract.ci-publish-version.outputs
    summary: Owner-approved version plan inputs to the publish version Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: version-plan-json
        meaning: "Received by the contract target: version plan file path."
      - name: strategy
        meaning: "Received by the contract target: version strategy in the plan."
      - name: template
        meaning: "Received by the contract target: version template in the plan."
      - name: components
        meaning: "Received by the contract target: version components in the plan."
      - name: publish-version
        meaning: "Received by the contract target: exact publish version in the plan."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.publish-version-plan-valid
        summary: The invocation meets the shared runtime context `runtime-context.publish-version-plan-valid`.
      - id: runtime-context.action-input-invalid
        summary: The invocation meets the shared runtime context `runtime-context.action-input-invalid`.
    guarantees:
      - id: publish-version-output-produced
        applies_to:
          - runtime-context.publish-version-plan-valid
        boundary: boundary.action-output
        statement: "`publish-version` equals the invocation input `publish-version`. The materialized publish version. Observable fields at this boundary also include `status` (Whether the version plan was materialized successfully)."
      - id: publish-version-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected publish version step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-publish-version
