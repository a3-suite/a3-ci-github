version: 1
name: contract-observations
subject_ref: subject.ci.publish-version
observations:
  - id: observation.ci-publish-version.outputs
    summary: The Action exposes deterministic publish-version outputs to the caller.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Whether the version plan was materialized successfully.
        - selector: publish-version
          kind: observation_field
          meaning: The materialized publish version.
  - id: observation.ci-publish-version.result
    summary: The Action exposes its failed step outcome when a publish version plan is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected publish version step.
  - id: observation.ci-publish-version.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "plan読取・exact/ciGenerated選択・template展開・version検証・書込を区別し、plan相対path、選択方式、違反field/component、期待する形式と安全な観測値、書込前後の確定状態を残す。"
