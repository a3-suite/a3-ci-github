version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-publish-version.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-publish-version.outputs
    id: valid-version-plan
    partition: runtime-context.publish-version-plan-valid
    input:
      version-plan-json: .ci/version-plan.json
  - contract_id: contract.ci-publish-version.outputs
    id: invalid-plan-rejected
    partition: runtime-context.action-input-invalid
    input:
      strategy: ciGenerated
      template: "{baseVersion}"
      components: {}
