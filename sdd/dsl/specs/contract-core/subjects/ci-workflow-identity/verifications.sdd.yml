version: 1
name: contract-verifications
subject_ref: subject.ci.workflow-identity
verifications:
  - id: verification.ci-workflow-identity.verify
    contract_id: contract.ci-workflow-identity.verify
    cases:
      - id: default-branch-reusable-call
        intent_id: workflow-identity-verified
        input:
          repository: a3-suite/a3-rust-cruiser
          default-branch: main
          caller-workflow-ref: default-branch-snapshot
          called-workflow-ref: default-branch-snapshot
          snapshot-sha: matching-lowercase-hex-40
        checks:
          - id: check-verified-snapshot-sha
            guarantee_ref: verified-snapshot-sha-produced
      - id: mismatched-workflow-identity
        intent_id: workflow-identity-mismatch-rejected
        input:
          called-workflow-sha: divergent-from-caller
        checks:
          - id: check-mismatched-identity-failure
            guarantee_ref: mismatched-identity-stops
      - id: non-default-branch-call
        intent_id: workflow-identity-mismatch-rejected
        input:
          caller-workflow-ref: feature-branch-snapshot
        checks:
          - id: check-non-default-branch-failure
            guarantee_ref: mismatched-identity-stops
