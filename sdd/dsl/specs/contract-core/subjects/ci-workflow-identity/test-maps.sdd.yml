version: 1
name: contract-test-maps
subject_ref: subject.ci.workflow-identity
test_maps:
  - verification_id: verification.ci-workflow-identity.verify
    case_id: default-branch-reusable-call
    tests:
      - path: actions/ci-workflow-identity/tests/identity.test.ts
        symbol: returns the verified snapshot sha for a default-branch reusable call
        check_refs:
          - check-verified-snapshot-sha
      - path: actions/ci-workflow-identity/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint exposes the verified workflow snapshot sha"
        check_refs:
          - check-verified-snapshot-sha
      - path: actions/ci-workflow-identity/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint exposes the verified workflow snapshot sha"
        check_refs:
          - check-verified-snapshot-sha
  - verification_id: verification.ci-workflow-identity.verify
    case_id: mismatched-workflow-identity
    tests:
      - path: actions/ci-workflow-identity/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint rejects a mismatched workflow snapshot"
        check_refs:
          - check-mismatched-identity-failure
      - path: actions/ci-workflow-identity/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint rejects a mismatched workflow snapshot"
        check_refs:
          - check-mismatched-identity-failure
  - verification_id: verification.ci-workflow-identity.verify
    case_id: non-default-branch-call
    tests:
      - path: actions/ci-workflow-identity/tests/identity.test.ts
        symbol: rejects a caller ref that is not the default-branch snapshot
        check_refs:
          - check-non-default-branch-failure
