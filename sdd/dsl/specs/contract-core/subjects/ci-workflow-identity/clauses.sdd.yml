version: 1
name: contract-clauses
subject_ref: subject.ci.workflow-identity
contracts:
  - id: contract.ci-workflow-identity.verify
    summary: A default-branch reusable workflow call exposes its verified snapshot SHA; a mismatched identity stops the step.
    conditions:
      - id: workflow-identity-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.workflow-identity-context-valid
          op: available
      - id: workflow-identity-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.workflow-identity-context-invalid
          op: available
    guarantees:
      - id: verified-snapshot-sha-produced
        when: workflow-identity-valid
        observation_ref: observation.ci-workflow-identity.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: sha
      - id: mismatched-identity-stops
        when: workflow-identity-invalid
        observation_ref: observation.ci-workflow-identity.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
    verification_intents:
      - id: workflow-identity-verified
        goal: A default-branch reusable call exposes the verified workflow snapshot SHA.
        guarantee_refs:
          - verified-snapshot-sha-produced
      - id: workflow-identity-mismatch-rejected
        goal: A caller, repository, path, ref, or SHA mismatch stops the step before publication.
        guarantee_refs:
          - mismatched-identity-stops
