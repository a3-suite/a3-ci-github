version: 1
name: contract-subject
subject:
  id: subject.ci.rust-release-build
  summary: Building, packaging, and verifying Rust CLI release assets.
contracts:
  - id: contract.ci-rust-release-build.processing
    summary: Rust release build script invocation.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: language-profile
        meaning: "Received by the contract target: language profile selected by the caller."
      - name: platform-id
        meaning: "Received by the contract target: platform identifier selected for the build."
      - name: platform-target
        meaning: "Received by the contract target: build target bound to the selected platform."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: commands
        meaning: "Precondition prepared by the case: outcome of the build commands."
      - name: version
        meaning: "Received by the contract target: version value passed to the contract target."
      - name: version-output
        meaning: "Precondition prepared by the case: version reported by the toolchain."
      - name: platform-manifest
        meaning: "Received by the contract target: content of the platform manifest file."
    observations:
      - summary: The shared script exposes whether the authority-bound Rust release asset was built, packaged, and verified.
        boundary: boundary.script-result
        fields:
          - selector: outcome
            meaning: Success only after build, package, checksum, manifest, and artifact verification; failure otherwise.
          - selector: final-output
            meaning: A verified asset is published on success; failure leaves no agent-owned final asset and preserves a destination owned by another process.
          - selector: diagnostic-codes
            meaning: Stable diagnostic codes reported by the failed step.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.rust-release-build-inputs-match-authority
      - environment: runtime-context.rust-release-build-rejected
      - environment: runtime-context.rust-release-build-commands-succeed
      - environment: runtime-context.rust-release-version-report-rejected
    guarantees:
      - id: rust-release-processing-succeeds
        applies_to:
          - runtime-context.rust-release-build-commands-succeed
        claim:
          field: outcome
          in:
            - success
      - id: rust-release-final-output-safe
        applies_to:
          - runtime-context.rust-release-build-inputs-match-authority
        claim:
          field: final-output
          in:
            - verified
            - absent
            - preserved
      - id: rust-release-processing-fails
        applies_to:
          - runtime-context.rust-release-build-rejected
        claim:
          field: outcome
          in:
            - failure
      - id: rust-release-rejected-final-output-safe
        applies_to:
          - runtime-context.rust-release-build-rejected
        claim:
          field: final-output
          in:
            - absent
            - preserved
      - id: rust-release-version-diagnostic-present
        applies_to:
          - runtime-context.rust-release-version-report-rejected
        claim:
          field: diagnostic-codes
          contains: binary-version-mismatch
      - id: diagnostic-failure-stage-processing
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-rust-release-build.outputs
    summary: The Composite Action maps shared script success to completed output and propagates script failure.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: language-profile
        meaning: "Received by the contract target: language profile selected by the caller."
      - name: platform-id
        meaning: "Received by the contract target: platform identifier selected for the build."
      - name: platform-target
        meaning: "Received by the contract target: build target bound to the selected platform."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: completed
            meaning: Whether build, package, checksum, manifest, and artifact verification all succeeded.
          - selector: outcome
            meaning: The success or failure outcome of the release build step.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.rust-release-build-script-succeeded
      - environment: runtime-context.rust-release-build-script-failed
    guarantees:
      - id: completed-output-produced
        applies_to:
          - runtime-context.rust-release-build-script-succeeded
        claim:
          field: completed
          in:
            - "true"
      - id: release-build-failure-propagated
        applies_to:
          - runtime-context.rust-release-build-script-failed
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
