version: 1
name: contract-subject
subject:
  id: subject.ci.rust-release-build
  summary: Building, packaging, and verifying Rust CLI release assets.
contracts:
  - id: contract.ci-rust-release-build.processing
    summary: Rust release build script invocation.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: language-profile
        meaning: "Received by the contract target: language profile selected by the caller."
      - name: platform-id
        meaning: "Received by the contract target: platform identifier selected for the build."
      - name: platform-target
        meaning: "Received by the contract target: build target bound to the selected platform."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: commands
        meaning: "Precondition prepared by the case: results of external tool commands, including Git, Rustup, Cargo and archive tooling."
      - name: toolchain-version
        meaning: "Received by the contract target: exact Rust toolchain version."
      - name: authority-path
        meaning: "Received by the contract target: path to the release authority containing the approved version."
      - name: cargo-manifest-path
        meaning: "Received by the contract target: path to the Cargo manifest."
      - name: release-binary-name
        meaning: "Received by the contract target: Cargo binary target and archive entry name."
      - name: release-asset-prefix
        meaning: "Received by the contract target: release archive name prefix."
      - name: checkout-head
        meaning: "Precondition prepared by the case: HEAD of the source checkout."
      - name: version-output
        meaning: "Precondition prepared by the case: version reported by the built binary."
      - name: platform-manifest
        meaning: "Received by the contract target: content of the platform manifest file."
      - name: output-destination-state
        meaning: "Precondition prepared by the case: state of the output destination before the invocation."
    conditions:
      - id: runtime-context.rust-release-build-rejected
        summary: The build cannot proceed because of missing, invalid or conflicting inputs, a failed prerequisite or build command, failure while constructing, verifying or publishing the staged archive, or a conflicting output destination. A rejected binary version response has its own condition.
      - id: runtime-context.rust-release-build-commands-succeed
        summary: The supplied profile, checkout HEAD, exact toolchain, package version and unique manifest platform match the release authority. External commands supply usable results, including an accepted binary version and a readable archive matching the expected entry and digest. The new output destination can be claimed and written.
      - id: runtime-context.rust-release-version-report-rejected
        summary: The build reaches the binary version check, but the binary does not report the approved version as an independent token or its version command fails.
    guarantees:
      - id: rust-release-processing-succeeds
        applies_to:
          - runtime-context.rust-release-build-commands-succeed
        boundary: boundary.script-result
        statement: '`outcome` is one of `"success"`. Step outcome of the release build invocation; success or failure.'
      - id: rust-release-final-output-verified-on-success
        applies_to:
          - runtime-context.rust-release-build-commands-succeed
        boundary: boundary.workspace-files
        statement: '`final-output` is one of `"verified"`. State of the final output destination after the invocation. verified: the final asset is present and verified, absent: no agent-owned final asset exists, preserved: a destination owned by another process remains unchanged.'
      - id: rust-release-processing-fails
        applies_to:
          - runtime-context.rust-release-build-rejected
          - runtime-context.rust-release-version-report-rejected
        boundary: boundary.script-result
        statement: '`outcome` is one of `"failure"`. Step outcome of the release build invocation; success or failure.'
      - id: rust-release-rejected-final-output-safe
        applies_to:
          - runtime-context.rust-release-build-rejected
          - runtime-context.rust-release-version-report-rejected
        boundary: boundary.workspace-files
        statement: '`final-output` is one of `"absent"`, `"preserved"`. State of the final output destination after the invocation. verified: the final asset is present and verified, absent: no agent-owned final asset exists, preserved: a destination owned by another process remains unchanged.'
      - id: rust-release-version-diagnostic-present
        applies_to:
          - runtime-context.rust-release-version-report-rejected
        boundary: boundary.script-result
        statement: '`diagnostic-codes` contains `"binary-version-mismatch"`. Stable diagnostic codes reported by the failed step.'
      - id: diagnostic-failure-stage-processing
        applies_to:
          - runtime-context.rust-release-build-rejected
          - runtime-context.rust-release-version-report-rejected
        boundary: boundary.diagnostic-result
        statement: "The build diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-release-build.sh
  - id: contract.ci-rust-release-build.outputs
    summary: Language profile, platform, and output directory inputs to the Rust release build Composite Action.
    inputs:
      - name: language-profile
        meaning: "Received by the contract target: language profile selected by the caller."
      - name: platform-id
        meaning: "Received by the contract target: platform identifier selected for the build."
      - name: platform-target
        meaning: "Received by the contract target: build target bound to the selected platform."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: platform-manifest
        meaning: "Received by the contract target: path to the selected platform manifest."
      - name: toolchain-version
        meaning: "Received by the contract target: exact Rust toolchain version."
      - name: authority-path
        meaning: "Received by the contract target: path to the release authority JSON."
      - name: cargo-manifest-path
        meaning: "Received by the contract target: path to the Cargo manifest."
      - name: release-binary-name
        meaning: "Received by the contract target: Cargo binary target and archive entry name."
      - name: release-asset-prefix
        meaning: "Received by the contract target: release archive name prefix."
      - name: github-output
        meaning: "Received by the contract target: runner file that receives the completed output."
    conditions:
      - id: runtime-context.rust-release-build-script-succeeded
        summary: The build script succeeds and the Action output can be written.
      - id: runtime-context.rust-release-build-script-failed
        summary: The build script fails.
      - id: rust-release-build-output-write-denied
        summary: The build script succeeds, but writing the Action output fails.
    guarantees:
      - id: completed-output-produced
        applies_to:
          - runtime-context.rust-release-build-script-succeeded
        boundary: boundary.action-output
        statement: '`completed` is one of `"true"`. Whether the release build script reported its run as completed.'
      - id: release-build-failure-propagated
        applies_to:
          - runtime-context.rust-release-build-script-failed
          - rust-release-build-output-write-denied
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. The release build step fails. If the build script failed, the step does not publish `completed`.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.rust-release-build-script-failed
        boundary: boundary.diagnostic-result
        statement: "The build script records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-rust-release-build
