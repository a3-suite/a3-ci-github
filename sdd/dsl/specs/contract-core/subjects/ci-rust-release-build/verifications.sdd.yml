version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-rust-release-build.processing
    id: detailed-failure-processing
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.ci-rust-release-build.processing
    id: matching-rust-release-processing
    partition: runtime-context.rust-release-build-inputs-match-authority
    input:
      language-profile: rust
      platform-id: linux-x64
      platform-target: x86_64-unknown-linux-gnu
      output-directory: build/linux-x64
  - contract_id: contract.ci-rust-release-build.processing
    id: completed-rust-release-processing
    partition: runtime-context.rust-release-build-commands-succeed
    input:
      language-profile: rust
      platform-id: linux-x64
      platform-target: x86_64-unknown-linux-gnu
      output-directory: build/linux-x64
      commands: succeed
  - contract_id: contract.ci-rust-release-build.processing
    id: rejected-rust-release-processing
    partition: runtime-context.rust-release-build-rejected
    input:
      language-profile: rust
      platform-id: macos-arm64
      platform-target: x86_64-unknown-linux-gnu
      output-directory: build/macos-arm64
  - contract_id: contract.ci-rust-release-build.processing
    id: version-report-rejected
    partition: runtime-context.rust-release-version-report-rejected
    input:
      version: 0.3.0
      version-output: rejected-set
  - contract_id: contract.ci-rust-release-build.processing
    id: source-text-boundary
    partition: runtime-context.rust-release-build-rejected
    input:
      platform-manifest: BOM
  - contract_id: contract.ci-rust-release-build.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.ci-rust-release-build.outputs
    id: matching-authority-bound-build-inputs
    partition: runtime-context.rust-release-build-script-succeeded
    input:
      language-profile: rust
      platform-id: linux-x64
      platform-target: x86_64-unknown-linux-gnu
      output-directory: build/linux-x64
  - contract_id: contract.ci-rust-release-build.outputs
    id: mismatching-authority-bound-build-inputs
    partition: runtime-context.rust-release-build-script-failed
    input:
      language-profile: rust
      platform-id: macos-arm64
      platform-target: x86_64-unknown-linux-gnu
      output-directory: build/macos-arm64
