version: 1
name: contract-test-maps
subject_ref: subject.ci.rust-release-build
test_maps:
  - verification_id: verification.ci-rust-release-build.processing
    case_id: matching-rust-release-processing
    tests:
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: release build binds exact toolchain and a unique manifest platform before building
        check_refs:
          - check-rust-release-processing-outcome
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: Unix package and verification bind archive, checksum, manifest, and source without overwrite
        check_refs:
          - check-rust-release-processing-outcome
          - check-rust-release-final-output-safe
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: Unix package failure leaves no final or temporary output directory
        check_refs:
          - check-rust-release-processing-outcome
          - check-rust-release-final-output-safe
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: Unix package preserves an output directory created immediately before publication
        check_refs:
          - check-rust-release-processing-outcome
          - check-rust-release-final-output-safe
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: Unix package removes its claimed output when publication fails
        check_refs:
          - check-rust-release-processing-outcome
          - check-rust-release-final-output-safe
  - verification_id: verification.ci-rust-release-build.processing
    case_id: rejected-rust-release-processing
    tests:
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: release build binds exact toolchain and a unique manifest platform before building
        check_refs:
          - check-rust-release-processing-failure
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: Unix package and verification bind archive, checksum, manifest, and source without overwrite
        check_refs:
          - check-rust-release-processing-failure
          - check-rust-release-rejected-final-output-safe
  - verification_id: verification.ci-rust-release-build.processing
    case_id: version-report-rejected
    tests:
      - path: runtime/rust-release/tests/rust-release-scripts.test.mjs
        symbol: release build binds exact toolchain and a unique manifest platform before building
        check_refs:
          - check-rust-release-version-diagnostic
  - verification_id: verification.ci-rust-release-build.outputs
    case_id: matching-authority-bound-build-inputs
    tests:
      - path: actions/ci-rust-release-build/tests/action-contract.test.mjs
        symbol: composite release build exposes completed only after script success
        check_refs:
          - check-completed-output
  - verification_id: verification.ci-rust-release-build.outputs
    case_id: mismatching-authority-bound-build-inputs
    tests:
      - path: actions/ci-rust-release-build/tests/action-contract.test.mjs
        symbol: composite release build exposes completed only after script success
        check_refs:
          - check-release-build-failure
