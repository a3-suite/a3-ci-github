version: 1
name: contract-subject
subject:
  id: subject.ci.handoff-integrity
  summary: Validating release handoff identity, manifest, and artifact digests.
contracts:
  - id: contract.ci-handoff-integrity.outputs
    summary: Handoff root, descriptor and source identity inputs to the handoff integrity Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: handoff-root
        meaning: "Received by the contract target: handoff root directory path."
      - name: descriptor
        meaning: "Received by the contract target: handoff descriptor file name."
      - name: source-sha
        meaning: "Received by the contract target: source commit SHA passed by the caller."
      - name: version
        meaning: "Received by the contract target: version value passed to the contract target."
      - name: target-identity
        meaning: "Received by the contract target: target identity bound to the handoff."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: Required inputs are absent or invalid, the handoff fails its identity or integrity checks, or writing an Action output fails.
      - id: handoff-input-present
        summary: The supplied handoff satisfies the requested source, version, and target identities, its descriptor, manifest, and artifacts pass integrity checks, and all Action outputs can be written.
    guarantees:
      - id: handoff-status-succeeded
        applies_to:
          - handoff-input-present
        boundary: boundary.action-output
        statement: '`status` is `"success"`. The `descriptor` and `manifest` outputs identify the validated files relative to the handoff root. `manifest-digest` equals the SHA-256 digest of the validated manifest bytes, and `entries` equals the number of validated manifest entries.'
      - id: handoff-failure-propagated
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected handoff validation step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-handoff-integrity
