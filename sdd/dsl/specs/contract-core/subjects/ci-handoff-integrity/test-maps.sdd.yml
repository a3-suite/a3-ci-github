version: 1
name: contract-test-maps
subject_ref: subject.ci.handoff-integrity
test_maps:
  - verification_id: verification.ci-handoff-integrity.outputs
    case_id: valid-handoff
    tests:
      - path: actions/ci-handoff-integrity/tests/entrypoint.test.ts
        symbol: bundled entrypoint validates a handoff
        check_refs:
          - check-handoff-status
  - verification_id: verification.ci-handoff-integrity.outputs
    case_id: source-identity-mismatch-rejected
    tests:
      - path: actions/ci-handoff-integrity/tests/entrypoint.test.ts
        symbol: bundled entrypoint fails an identity mismatch
        check_refs:
          - check-handoff-failure-status
