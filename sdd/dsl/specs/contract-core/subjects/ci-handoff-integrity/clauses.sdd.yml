version: 1
name: contract-clauses
subject_ref: subject.ci.handoff-integrity
contracts:
  - id: contract.ci-handoff-integrity.outputs
    summary: A matching handoff descriptor and manifest produce a handoff status output.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: handoff-input-present
        input_predicate:
          kind: input
          term: input.handoff-root
          op: present
      - id: handoff-validation-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.action-input-invalid
          op: available
    guarantees:
      - id: handoff-status-produced
        when: handoff-input-present
        observation_ref: observation.ci-handoff-integrity.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: handoff-failure-propagated
        when: handoff-validation-rejected
        observation_ref: observation.ci-handoff-integrity.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-handoff-integrity.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-outputs]
      - id: handoff-output-set
        goal: A valid handoff produces its status output.
        guarantee_refs:
          - handoff-status-produced
      - id: handoff-validation-rejected
        goal: A mismatching or unsafe handoff fails the Action without validated outputs.
        guarantee_refs:
          - handoff-failure-propagated
