version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-handoff-integrity.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-handoff-integrity.outputs
    id: valid-handoff
    partition: handoff-input-present
    input:
      handoff-root: .ci/handoff
      descriptor: handoff.json
      source-sha: "0000000000000000000000000000000000000001"
      version: 1.0.0
      target-identity: linux-x64
  - contract_id: contract.ci-handoff-integrity.outputs
    id: source-identity-mismatch-rejected
    partition: runtime-context.action-input-invalid
    input:
      handoff-root: .ci/handoff
      descriptor: handoff.json
      source-sha: mismatched-source
      version: 1.0.0
      target-identity: linux-x64
