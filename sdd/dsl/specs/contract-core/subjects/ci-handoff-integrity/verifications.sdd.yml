version: 1
name: contract-verifications
subject_ref: subject.ci.handoff-integrity
verifications:
  - id: verification.ci-handoff-integrity.outputs
    contract_id: contract.ci-handoff-integrity.outputs
    cases:
      - id: valid-handoff
        intent_id: handoff-output-set
        input:
          handoff-root: .ci/handoff
          descriptor: handoff.json
          source-sha: 0000000000000000000000000000000000000001
          version: 1.0.0
          target-identity: linux-x64
        checks:
          - id: check-handoff-status
            guarantee_ref: handoff-status-produced
      - id: source-identity-mismatch-rejected
        intent_id: handoff-validation-rejected
        input:
          handoff-root: .ci/handoff
          descriptor: handoff.json
          source-sha: mismatched-source
          version: 1.0.0
          target-identity: linux-x64
        checks:
          - id: check-handoff-failure-status
            guarantee_ref: handoff-failure-propagated
