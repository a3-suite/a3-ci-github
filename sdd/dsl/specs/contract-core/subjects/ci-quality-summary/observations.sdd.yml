version: 1
name: contract-observations
subject_ref: subject.ci.quality-summary
observations:
  - id: observation.ci-quality-summary.outputs
    summary: The Action exposes aggregate status, digest, and evidence path outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Aggregate quality status.
        - selector: digest
          kind: observation_field
          meaning: SHA-256 digest of rendered summary evidence.
        - selector: evidence-path
          kind: observation_field
          meaning: Path written for rendered summary evidence.
  - id: observation.ci-quality-summary.result
    summary: The Action exposes its failed step outcome when summary input is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected quality summary step.
  - id: observation.ci-quality-summary.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "入力result/report読取・classification・render・evidence保存を区別し、欠落または不正な入力identity、failed/unresolved/skippedの元状態、未収集項目、保存済み証跡参照を残す。summary作成失敗で元の失敗を隠さない。"
