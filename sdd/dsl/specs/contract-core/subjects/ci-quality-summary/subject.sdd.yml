version: 1
name: contract-subject
subject:
  id: subject.ci.quality-summary
  summary: Rendering quality results and exposing deterministic summary evidence.
contracts:
  - id: contract.ci-quality-summary.outputs
    summary: Quality result input to the quality summary Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: summary-json
        meaning: "Received by the contract target: summary JSON passed to the Action."
      - name: github-step-summary
        meaning: "Precondition prepared by the case: step summary destination provided by the runner."
      - name: github-run-context
        meaning: "Precondition prepared by the case: run context provided by the runner."
      - name: row-evidence
        meaning: "Received by the contract target: evidence reference of a summary row."
      - name: server-url
        meaning: "Precondition prepared by the case: GitHub server URL provided by the runner."
      - name: repository
        meaning: "Received by the contract target: repository identity passed by the caller."
      - name: run-id
        meaning: "Precondition prepared by the case: run ID provided by the runner."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: summary-input-present
        summary: The invocation supplies a valid job summary document.
      - id: runtime-context.action-input-invalid
        summary: The invocation meets the shared runtime context `runtime-context.action-input-invalid`.
      - id: runtime-context.ci-quality-summary-summary-mixed-applicability
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-summary-summary-mixed-applicability`.
      - id: runtime-context.ci-quality-summary-summary-default-evidence-valid
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-summary-summary-default-evidence-valid`.
      - id: runtime-context.ci-quality-summary-summary-all-excluded
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-summary-summary-all-excluded`.
      - id: runtime-context.ci-quality-summary-summary-run-context-missing
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-summary-summary-run-context-missing`.
    guarantees:
      - id: quality-summary-status-produced
        applies_to:
          - summary-input-present
        boundary: boundary.action-output
        statement: "`status` is present. Aggregate quality status. Observable fields at this boundary also include `digest` (SHA-256 digest of rendered summary evidence), `evidence-path` (Path written for rendered summary evidence)."
      - id: evidence-matches-step-summary
        applies_to:
          - summary-input-present
        boundary: boundary.workspace-files
        statement: '`evidence-step-summary-comparison` is one of `"equal"`. Comparison of the content of the file at the evidence path with the content of the step summary file given by the runner; equal or different.'
      - id: quality-summary-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
          - runtime-context.ci-quality-summary-summary-all-excluded
          - runtime-context.ci-quality-summary-summary-run-context-missing
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected quality summary step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: excluded-rows-not-aggregated
        applies_to:
          - runtime-context.ci-quality-summary-summary-mixed-applicability
        boundary: boundary.action-output
        statement: '`applicable-only-status-comparison` is one of `"equal"`. Comparison of the aggregate status with aggregation of applicable rows alone.'
      - id: no-row-without-evidence-reference
        applies_to:
          - runtime-context.ci-quality-summary-summary-default-evidence-valid
        boundary: boundary.action-output
        statement: '`missing-evidence-row-state` is one of `"absent"`. Occurrence state (present or absent) of a summary row that has no evidence reference after the invocation.'
    input_kind:
      kind: operation
      name: ci-quality-summary
