version: 1
name: contract-clauses
subject_ref: subject.ci.quality-summary
contracts:
  - id: contract.ci-quality-summary.outputs
    summary: A quality result containing normalized rows or raw GitHub job results produces an aggregate status output; caller-declared non-applicable rows become 対象外, are excluded from aggregation, and a result where every row is 対象外 is invalid input. A row without evidence takes the workflow run URL from a valid GitHub run context and is rejected as missing evidence otherwise.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: summary-input-present
        input_predicate:
          kind: input
          term: input.summary-json
          op: present
      - id: quality-summary-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.action-input-invalid
          op: available
      - id: summary-mixed-applicability
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-summary-summary-mixed-applicability
          op: available
      - id: summary-default-evidence-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-summary-summary-default-evidence-valid
          op: available
      - id: summary-all-excluded
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-summary-summary-all-excluded
          op: available
      - id: summary-run-context-missing
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-summary-summary-run-context-missing
          op: available
    guarantees:
      - id: quality-summary-status-produced
        when: summary-input-present
        observation_ref: observation.ci-quality-summary.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: quality-summary-failure-propagated
        when: quality-summary-rejected
        observation_ref: observation.ci-quality-summary.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-quality-summary.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: excluded-rows-not-aggregated
        when: summary-mixed-applicability
        observation_ref: observation.ci-quality-summary.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: applicable-only-status-comparison
            right:
              kind: value_set
              values:
                - equal
      - id: run-url-used-for-missing-evidence
        when: summary-default-evidence-valid
        observation_ref: observation.ci-quality-summary.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: default-evidence-comparison
            right:
              kind: value_set
              values:
                - equal
      - id: summary-all-excluded-rejected
        when: summary-all-excluded
        observation_ref: observation.ci-quality-summary.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: summary-run-context-missing-rejected
        when: summary-run-context-missing
        observation_ref: observation.ci-quality-summary.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [ diagnostic-details-outputs ]
      - id: quality-summary-output-set
        goal: A normalized quality result or raw GitHub job result produces its aggregate status output while the caller owns applicability.
        guarantee_refs:
          - quality-summary-status-produced
      - id: quality-summary-rejected
        goal: Missing or unresolved quality evidence fails summary publication.
        guarantee_refs:
          - quality-summary-failure-propagated
      - id: mixed-applicability
        goal: Verify the summary-mixed-applicability partition.
        guarantee_refs:
          - excluded-rows-not-aggregated
      - id: default-evidence
        goal: Verify the summary-default-evidence-valid partition.
        guarantee_refs:
          - run-url-used-for-missing-evidence
      - id: summary-all-excluded-rejection
        goal: Verify rejection of this input partition.
        guarantee_refs:
          - summary-all-excluded-rejected
      - id: summary-run-context-missing-rejection
        goal: Verify rejection of this input partition.
        guarantee_refs:
          - summary-run-context-missing-rejected
