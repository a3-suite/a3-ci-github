version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: supported-runner-assets
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > selects the supported runner assets
        guarantees:
          - checked-gh-available
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: checked-release-asset
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > installs the checksummed asset and exports its directory
        guarantees:
          - checked-gh-available
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: mismatched-release-asset
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects a checksum mismatch without exposing a binary
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: invalid-version
    tests:
      - path: actions/ci-gh-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects an invalid version as provisioning failure
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-gh-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects an invalid version as provisioning failure
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: unsupported-runner
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects an unsupported runner before download or PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: unavailable-release-asset
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > reports a download failure separately from version verification
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: invalid-checksum-manifest
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects missing or duplicate checksum entries
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: extraction-failure
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects an extraction failure before PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: installation-failure
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects an installation failure before PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: path-update-failure
    tests:
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > removes the installed binary when PATH update fails
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-gh-provisioner.provision
    case_id: detailed-failure-provision
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-gh-provisioner failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-provision
      - path: actions/ci-gh-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects an invalid version as provisioning failure
        guarantees:
          - diagnostic-failure-stage-provision
      - path: actions/ci-gh-provisioner/tests/provision.test.ts
        symbol: GitHub CLI provisioning > rejects a checksum mismatch without exposing a binary
        guarantees:
          - diagnostic-failure-stage-provision
