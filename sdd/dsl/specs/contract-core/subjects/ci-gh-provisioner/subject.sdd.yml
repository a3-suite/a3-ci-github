version: 1
name: contract-subject
subject:
  id: subject.ci.gh-provisioner
  summary: Provisioning an exact GitHub CLI Release asset for later GitHub CI steps.
contracts:
  - id: contract.ci-gh-provisioner.provision
    summary: A checked official GitHub CLI Release asset enters the job PATH; failed provisioning exposes no executable.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: runner-os-arch
        meaning: "Precondition prepared by the case: runner operating system and architecture combination."
      - name: gh-version
        meaning: "Received by the contract target: GitHub CLI version requested by the caller."
      - name: runner-os
        meaning: "Precondition prepared by the case: runner operating system."
      - name: runner-arch
        meaning: "Precondition prepared by the case: runner CPU architecture."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: asset
        meaning: "Precondition prepared by the case: availability of the release asset to download."
      - name: checksum-entry
        meaning: "Precondition prepared by the case: checksum list entry for the selected asset."
      - name: archive-extraction
        meaning: "Precondition prepared by the case: outcome of extracting the archive."
      - name: installation
        meaning: "Precondition prepared by the case: outcome of the installation step."
      - name: path-update
        meaning: "Precondition prepared by the case: outcome of updating the runner command path."
    observations:
      - summary: The provisioned GitHub CLI command is visible to later steps.
        boundary: boundary.runner-path
        fields:
          - selector: gh
            meaning: Checked GitHub CLI executable on the job command search path.
      - summary: Provisioning success or failure is visible to the caller.
        boundary: boundary.action-output
        fields:
          - selector: outcome
            meaning: Success after checksum verification, extraction, and PATH handoff, or failure before handoff.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.gh-release-asset-valid
      - environment: runtime-context.gh-release-asset-invalid
    guarantees:
      - id: checked-gh-available
        applies_to:
          - runtime-context.gh-release-asset-valid
        claim:
          field: gh
          present: true
      - id: failed-provisioning-stops
        applies_to:
          - runtime-context.gh-release-asset-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-provision
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
