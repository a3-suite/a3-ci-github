version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-gh-provisioner.provision
    id: detailed-failure-provision
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-gh-provisioner.provision
    id: supported-runner-assets
    partition: runtime-context.gh-release-asset-valid
    input:
      runner-os-arch: supported-matrix
  - contract_id: contract.ci-gh-provisioner.provision
    id: checked-release-asset
    partition: runtime-context.gh-release-asset-valid
    input:
      gh-version: 2.80.0
      runner-os: Linux
      runner-arch: X64
  - contract_id: contract.ci-gh-provisioner.provision
    id: mismatched-release-asset
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      checksum: mismatch
  - contract_id: contract.ci-gh-provisioner.provision
    id: invalid-version
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: not-exact
  - contract_id: contract.ci-gh-provisioner.provision
    id: unsupported-runner
    partition: runtime-context.gh-release-asset-invalid
    input:
      runner-os: Windows
      runner-arch: X64
  - contract_id: contract.ci-gh-provisioner.provision
    id: unavailable-release-asset
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      asset: unavailable
  - contract_id: contract.ci-gh-provisioner.provision
    id: invalid-checksum-manifest
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      checksum-entry: missing
  - contract_id: contract.ci-gh-provisioner.provision
    id: extraction-failure
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      archive-extraction: failed
  - contract_id: contract.ci-gh-provisioner.provision
    id: installation-failure
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      installation: failed
  - contract_id: contract.ci-gh-provisioner.provision
    id: path-update-failure
    partition: runtime-context.gh-release-asset-invalid
    input:
      gh-version: 2.80.0
      path-update: failed
