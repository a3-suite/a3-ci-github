version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: supported-runner-assets
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action installs the checksummed macOS/ARM64 asset and exports its directory
        guarantees:
          - checked-jq-available
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action installs the checksummed macOS/ARM64 asset and exports its directory
        guarantees:
          - checked-jq-available
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: checked-release-asset
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action installs the checksummed Linux/X64 asset and exports its directory
        guarantees:
          - checked-jq-available
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action installs the checksummed Linux/X64 asset and exports its directory
        guarantees:
          - checked-jq-available
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: mismatched-release-asset
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects a checksum mismatch without exposing a binary
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects a checksum mismatch without exposing a binary
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: invalid-version
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects an invalid version as provisioning failure
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects an invalid version as provisioning failure
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: unsupported-runner
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects an unsupported runner before download or PATH handoff
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects an unsupported runner before download or PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: unavailable-release-asset
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action reports an unavailable release asset before PATH handoff
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action reports an unavailable release asset before PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: invalid-checksum-manifest
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects a checksum manifest without the asset entry
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects a checksum manifest without the asset entry
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: installation-failure
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action rejects an installation failure before PATH handoff
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action rejects an installation failure before PATH handoff
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: path-update-failure
    tests:
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: source entrypoint > Action removes the installed binary when PATH update fails
        guarantees:
          - failed-provisioning-stops
      - path: actions/ci-jq-provisioner/tests/entrypoint.test.ts
        symbol: dist entrypoint > Action removes the installed binary when PATH update fails
        guarantees:
          - failed-provisioning-stops
  - contract_id: contract.ci-jq-provisioner.provision
    case_id: detailed-failure-provision
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-jq-provisioner failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-provision
