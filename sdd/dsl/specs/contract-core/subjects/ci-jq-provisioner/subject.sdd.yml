version: 1
name: contract-subject
subject:
  id: subject.ci.jq-provisioner
  summary: Provisioning an exact jq Release asset for later GitHub CI steps.
contracts:
  - id: contract.ci-jq-provisioner.provision
    summary: A checked official jq Release asset enters the job PATH; failed provisioning exposes no executable.
    observations:
      - summary: The provisioned jq command is visible to later steps.
        boundary: boundary.runner-path
        fields:
          - selector: jq
            meaning: Checked jq executable on the job command search path.
      - summary: Provisioning success or failure is visible to the caller.
        boundary: boundary.action-output
        fields:
          - selector: outcome
            meaning: Success after checksum verification and PATH handoff, or failure before handoff.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.jq-release-asset-valid
      - environment: runtime-context.jq-release-asset-invalid
    guarantees:
      - id: checked-jq-available
        applies_to:
          - runtime-context.jq-release-asset-valid
        claim:
          field: jq
          present: true
      - id: failed-provisioning-stops
        applies_to:
          - runtime-context.jq-release-asset-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-provision
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
