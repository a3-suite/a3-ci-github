version: 1
name: contract-subject
subject:
  id: subject.ci.jq-provisioner
  summary: Provisioning an exact jq Release asset for later GitHub CI steps.
contracts:
  - id: contract.ci-jq-provisioner.provision
    summary: jq version and runner platform inputs to the jq provisioner Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: runner-os-arch
        meaning: "Precondition prepared by the case: runner operating system and architecture combination."
      - name: jq-version
        meaning: "Received by the contract target: jq version requested by the caller."
      - name: runner-os
        meaning: "Precondition prepared by the case: runner operating system."
      - name: runner-arch
        meaning: "Precondition prepared by the case: runner CPU architecture."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: asset
        meaning: "Precondition prepared by the case: availability of the release asset to download."
      - name: checksum-entry
        meaning: "Precondition prepared by the case: checksum list entry for the selected asset."
      - name: installation
        meaning: "Precondition prepared by the case: outcome of the installation step."
      - name: path-update
        meaning: "Precondition prepared by the case: outcome of updating the runner command path."
    conditions:
      - id: runtime-context.jq-release-asset-valid
        summary: The invocation meets the shared runtime context `runtime-context.jq-release-asset-valid`, with all required runner paths present and file operations permitted.
      - id: runtime-context.jq-release-asset-invalid
        summary: The invocation meets the shared runtime context `runtime-context.jq-release-asset-invalid`, or a required runner path is absent or the PATH handoff write fails.
    guarantees:
      - id: checked-jq-available
        applies_to:
          - runtime-context.jq-release-asset-valid
        boundary: boundary.runner-path
        statement: '`exposed-jq-asset-comparison` is one of `"matched"`. Comparison of the jq on the job command search path with the checksum-matched official asset for the requested version and platform; matched or different.'
      - id: failed-provisioning-stops
        applies_to:
          - runtime-context.jq-release-asset-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Step outcome of the provisioning invocation; success or failure.'
      - id: failed-provisioning-no-path-handoff
        applies_to:
          - runtime-context.jq-release-asset-invalid
        boundary: boundary.runner-path
        statement: '`path-handoff-state` is one of `"absent"`. Occurrence state (present or absent) of an entry written by the invocation to the runner path handoff file (GITHUB_PATH).'
      - id: diagnostic-failure-stage-provision
        applies_to:
          - runtime-context.jq-release-asset-invalid
        boundary: boundary.diagnostic-result
        statement: "The diagnostic identifies the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-jq-provisioner
