version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-jq-provisioner.provision
    id: detailed-failure-provision
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-jq-provisioner.provision
    id: supported-runner-assets
    partition: runtime-context.jq-release-asset-valid
    input:
      runner-os-arch: supported-matrix
  - contract_id: contract.ci-jq-provisioner.provision
    id: checked-release-asset
    partition: runtime-context.jq-release-asset-valid
    input:
      jq-version: 1.7.1
      runner-os: Linux
      runner-arch: X64
  - contract_id: contract.ci-jq-provisioner.provision
    id: mismatched-release-asset
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: 1.7.1
      checksum: mismatch
  - contract_id: contract.ci-jq-provisioner.provision
    id: invalid-version
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: not-exact
  - contract_id: contract.ci-jq-provisioner.provision
    id: unsupported-runner
    partition: runtime-context.jq-release-asset-invalid
    input:
      runner-os: Windows
      runner-arch: ARM64
  - contract_id: contract.ci-jq-provisioner.provision
    id: unavailable-release-asset
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: 1.7.1
      asset: unavailable
  - contract_id: contract.ci-jq-provisioner.provision
    id: invalid-checksum-manifest
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: 1.7.1
      checksum-entry: missing
  - contract_id: contract.ci-jq-provisioner.provision
    id: installation-failure
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: 1.7.1
      installation: failed
  - contract_id: contract.ci-jq-provisioner.provision
    id: path-update-failure
    partition: runtime-context.jq-release-asset-invalid
    input:
      jq-version: 1.7.1
      path-update: failed
