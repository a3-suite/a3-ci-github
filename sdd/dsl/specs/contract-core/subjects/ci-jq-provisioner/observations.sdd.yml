version: 1
name: contract-observations
subject_ref: subject.ci.jq-provisioner
observations:
  - id: observation.ci-jq-provisioner.path
    summary: The provisioned jq command is visible to later steps.
    boundary:
      ref: boundary.runner-path
    value:
      root: runner.path
      kind: object
      fields:
        - selector: jq
          kind: observation_field
          meaning: Checked jq executable on the job command search path.
  - id: observation.ci-jq-provisioner.result
    summary: Provisioning success or failure is visible to the caller.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Success after checksum verification and PATH handoff, or failure before handoff.
  - id: observation.ci-jq-provisioner.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "version選択・platform選択・取得・checksum・配置・version確認を区別し、tool名、要求version、OS/arch、asset名、期待/観測digestまたはversion、HTTP相関情報、失敗した配置段階を残す。"
