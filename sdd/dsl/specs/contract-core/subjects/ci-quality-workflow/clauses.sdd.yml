version: 1
name: contract-clauses
subject_ref: subject.ci.quality-workflow
contracts:
  - id: contract.ci-quality-workflow.execution
    summary: The main and optional platform quality callers pass explicit project settings to fixed reusable workflows, which order trusted source resolution before adapter execution and aggregate every applicable result. Each caller retains its summary check and propagates failed, cancelled, skipped, and missing callee results. Installation requires fixed publication of the selected workflows and their dependencies. Missing Hosted acceptance evidence does not block caller generation, application or asset lock creation. Consumer Hosted acceptance follows installation and establishes required-check compatibility before the generated callers are adopted as required checks.
    conditions:
      - id: diagnostic-required-execution
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-quality-workflow-caller-selected
        input_predicate:
          kind: input
          term: input.caller-source
          op: present
      - id: ci-quality-workflow-canonical-source-available
        input_predicate:
          kind: input
          term: input.canonical-source
          op: present
      - id: ci-quality-workflow-failure-route-required
        input_predicate:
          kind: input
          term: input.failure-route
          op: present
      - id: ci-quality-workflow-platform-source-selected
        input_predicate:
          kind: input
          term: input.optional-platform-canonical-source
          op: present
    guarantees:
      - id: ci-quality-workflow-reusable-binding-observed
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: reusable-binding
      - id: ci-quality-workflow-success-observed
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: execution-chain
      - id: ci-quality-workflow-failure-observed
        when: ci-quality-workflow-failure-route-required
        observation_ref: observation.ci-quality-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: failure-summary
      - id: ci-quality-workflow-platform-chain-observed
        when: ci-quality-workflow-platform-source-selected
        observation_ref: observation.ci-quality-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: optional-platform-chain
      - id: diagnostic-details-execution
        when: diagnostic-required-execution
        observation_ref: observation.ci-quality-workflow.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: quality-fixed-reference
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-fixed-reference
            right:
              kind: value_set
              values:
                - equal
      - id: quality-explicit-input-binding
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-explicit-input-binding
            right:
              kind: value_set
              values:
                - equal
      - id: quality-summary-identity
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-summary-identity
            right:
              kind: value_set
              values:
                - summary
      - id: quality-no-consumer-callee-copy
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-no-consumer-callee-copy
            right:
              kind: value_set
              values:
                - absent
      - id: quality-caller-read-permissions
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-caller-read-permissions
            right:
              kind: value_set
              values:
                - read
      - id: quality-caller-summary-always
        when: ci-quality-workflow-caller-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-caller-summary-always
            right:
              kind: value_set
              values:
                - always
      - id: quality-source-before-adapter
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-source-before-adapter
            right:
              kind: value_set
              values:
                - source-before-adapter
      - id: quality-results-before-summary
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-results-before-summary
            right:
              kind: value_set
              values:
                - execution-before-summary
      - id: quality-failure-summary-always
        when: ci-quality-workflow-failure-route-required
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-failure-summary-always
            right:
              kind: value_set
              values:
                - always
      - id: quality-unresolved-results-visible
        when: ci-quality-workflow-failure-route-required
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-unresolved-results-visible
            right:
              kind: value_set
              values:
                - present
      - id: platform-resolution-before-execution
        when: ci-quality-workflow-platform-source-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: platform-resolution-before-execution
            right:
              kind: value_set
              values:
                - resolution-before-execution
      - id: platform-execution-before-summary
        when: ci-quality-workflow-platform-source-selected
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: platform-execution-before-summary
            right:
              kind: value_set
              values:
                - execution-before-summary
      - id: quality-cargo-cache-rust-only
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-cargo-cache-profile-condition
            right:
              kind: value_set
              values:
                - rust-profile-only
      - id: quality-cargo-cache-before-adapter
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-cargo-cache-before-adapter
            right:
              kind: value_set
              values:
                - cache-before-adapter
      - id: quality-cargo-cache-failure-isolated
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-cargo-cache-failure-dependency
            right:
              kind: value_set
              values:
                - absent
      - id: quality-untrusted-cargo-cache-absent
        when: ci-quality-workflow-canonical-source-available
        observation_ref: observation.ci-quality-workflow.execution.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-untrusted-cargo-cache-use
            right:
              kind: value_set
              values:
                - absent
    verification_intents:
      - id: detailed-diagnostics-execution
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [ diagnostic-details-execution ]
      - id: ci-quality-workflow-reusable-binding-intent
        goal: Verify explicit typed inputs, read permissions, a registered fixed reusable target, no consumer callee copy, and an always-run caller summary. Local evidence does not establish Hosted check-name compatibility.
        guarantee_refs: [ ci-quality-workflow-reusable-binding-observed, quality-fixed-reference, quality-explicit-input-binding, quality-summary-identity, quality-no-consumer-callee-copy, quality-caller-read-permissions, quality-caller-summary-always ]
      - id: ci-quality-workflow-success-intent
        goal: Verify trusted source resolution precedes adapter execution, the aggregate decision follows the applicable execution jobs, and the Cargo cache is confined to trusted Rust execution before the adapter without making adapter execution depend on cache path resolution.
        guarantee_refs:
          - ci-quality-workflow-success-observed
          - quality-source-before-adapter
          - quality-results-before-summary
          - quality-cargo-cache-rust-only
          - quality-cargo-cache-before-adapter
          - quality-cargo-cache-failure-isolated
          - quality-untrusted-cargo-cache-absent
      - id: ci-quality-workflow-failure-intent
        goal: Verify the failure-visible summary runs after applicable execution jobs even when they fail or remain unresolved.
        guarantee_refs:
          - ci-quality-workflow-failure-observed
          - quality-failure-summary-always
          - quality-unresolved-results-visible
      - id: ci-quality-workflow-platform-intent
        goal: Verify the optional platform caller passes explicit typed project inputs to its registered fixed source without copying the callee, preserves trusted asset resolution, selected matrix execution, docs-only platform records and aggregate evidence, and rejects invalid settings and unpublished dependencies through preflight. Local evidence does not establish Hosted check-name compatibility.
        guarantee_refs:
          - ci-quality-workflow-platform-chain-observed
          - platform-resolution-before-execution
          - platform-execution-before-summary
