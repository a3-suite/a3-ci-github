version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-quality-workflow.execution
    case_id: ci-quality-workflow-reusable-binding
    tests:
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality caller passes explicit inputs and preserves the summary check without copying quality jobs
        guarantees:
          - ci-quality-workflow-reusable-binding-observed
          - quality-fixed-reference
          - quality-explicit-input-binding
          - quality-summary-identity
          - quality-no-consumer-callee-copy
          - quality-caller-read-permissions
          - quality-caller-summary-always
      - path: runtime/preset/tests/reusable-quality-workflow.test.mjs
        symbol: contract.ci-quality-workflow.execution > quality-reusable-preflight > reusable quality preflight connects fixed source without copying the callee and rejects caller drift
        guarantees:
          - ci-quality-workflow-reusable-binding-observed
          - quality-fixed-reference
          - quality-explicit-input-binding
  - contract_id: contract.ci-quality-workflow.execution
    case_id: ci-quality-workflow-success
    tests:
      - path: tests/workflow-contracts.process.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality diff preparation fetches only the comparison commit and preserves fail-open scope
        guarantees:
          - ci-quality-workflow-success-observed
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality toolchain callers bind four inputs and preserve execution gates
        guarantees:
          - ci-quality-workflow-success-observed
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality workflow declares trusted execution and aggregate summary
        guarantees:
          - ci-quality-workflow-success-observed
          - quality-source-before-adapter
          - quality-results-before-summary
      - path: tests/workflow-contracts.process.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > only trusted Rust quality reuses the Cargo cache while untrusted and Release builds start clean
        guarantees:
          - quality-cargo-cache-rust-only
          - quality-cargo-cache-before-adapter
          - quality-cargo-cache-failure-isolated
          - quality-untrusted-cargo-cache-absent
  - contract_id: contract.ci-quality-workflow.execution
    case_id: ci-quality-workflow-failure
    tests:
      - path: tests/workflow-contracts.process.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > caller summary rejects failed cancelled skipped and missing reusable results through the bundled Action
        guarantees:
          - ci-quality-workflow-failure-observed
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality workflow keeps failed or missing checks visible
        guarantees:
          - ci-quality-workflow-failure-observed
          - quality-failure-summary-always
          - quality-unresolved-results-visible
  - contract_id: contract.ci-quality-workflow.execution
    case_id: ci-quality-workflow-platform
    tests:
      - path: tests/workflow-contracts.process.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > quality diff preparation fetches only the comparison commit and preserves fail-open scope
        guarantees:
          - ci-quality-workflow-platform-chain-observed
      - path: runtime/preset/tests/reusable-quality-workflow.test.mjs
        symbol: contract.ci-quality-workflow.execution > quality-platform-reusable-preflight > platform reusable preflight validates callee inputs quality selection and availability without consumer copies
        guarantees:
          - ci-quality-workflow-platform-chain-observed
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > platform caller passes explicit inputs and retains the summary identity
        guarantees:
          - ci-quality-workflow-platform-chain-observed
      - path: tests/workflow-contracts.process.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > platform summary scripts preserve docs-only failed cancelled and missing outcomes
        guarantees:
          - ci-quality-workflow-platform-chain-observed
      - path: tests/workflow-contracts.test.mjs
        symbol: workflow-contracts > quality-workflow-contract > optional platform quality workflow preserves trusted assets matrix execution and summary
        guarantees:
          - ci-quality-workflow-platform-chain-observed
          - platform-resolution-before-execution
          - platform-execution-before-summary
  - contract_id: contract.ci-quality-workflow.execution
    case_id: detailed-failure-execution
    tests:
      - path: tests/workflow-failure-diagnostics.test.mjs
        symbol: workflow failure diagnostics > quality aggregate retains failed job identity and run evidence
        guarantees:
          - diagnostic-failure-stage-execution
