version: 1
name: contract-subject
subject:
  id: subject.ci.quality-workflow
  summary: Execute canonical quality checks and expose an aggregate decision without hiding missing or failed checks.
contracts:
  - id: contract.ci-quality-workflow.execution
    summary: Canonical quality caller and reusable workflow definitions.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
      - name: caller-source
        meaning: "Received by the contract target: caller workflow definition file read by repository verification."
      - name: job-result
        meaning: "Precondition prepared by the case: result of a job that the workflow aggregates or depends on."
    observations:
      - summary: Canonical workflow triggers, permissions, orchestration, and summaries exposed for repository verification.
        boundary: boundary.workflow-definition
        fields:
          - selector: reusable-binding
            meaning: Declared caller-to-callee binding.
          - selector: failure-summary
            meaning: Declared aggregate failure route.
          - selector: quality-fixed-reference
            meaning: Comparison of caller reusable reference with its registered provider workflow reference declaration.
          - selector: quality-explicit-input-binding
            meaning: Comparison of caller input names and typed bindings with the callee interface.
          - selector: quality-summary-identity
            meaning: Declared caller aggregate job ID.
          - selector: quality-no-consumer-callee-copy
            meaning: Occurrence of local copies of provider execution jobs in the caller.
          - selector: quality-caller-read-permissions
            meaning: Declared caller contents permission.
          - selector: quality-caller-summary-always
            meaning: Declared caller aggregate condition.
          - selector: quality-source-before-adapter
            meaning: Declared order of trusted checkout/asset resolution and adapter execution.
          - selector: quality-fork-pull-request-job
            meaning: Declared job whose run condition selects a pull request whose head repository differs from the base repository.
          - selector: quality-pull-request-trusted-assets-commit
            meaning: Commit that the trusted CI asset checkout reads for a pull request, in the trusted and untrusted pull request jobs and the platform resolve job.
          - selector: quality-results-before-summary
            meaning: Declared dependency order of applicable execution jobs and aggregate decision.
          - selector: quality-failure-summary-always
            meaning: Declared summary condition on applicable job failure.
          - selector: quality-unresolved-results-visible
            meaning: Occurrence of unresolved applicable results in aggregate failure evidence.
          - selector: platform-resolution-before-execution
            meaning: Declared dependency order of trusted platform resolution and selected matrix execution.
          - selector: platform-execution-before-summary
            meaning: Declared dependency order of matrix execution and aggregate platform decision.
          - selector: quality-cargo-cache-profile-condition
            meaning: Declared language profile condition of the trusted Cargo cache path resolution step.
          - selector: quality-cargo-cache-before-adapter
            meaning: Declared order of the trusted Cargo cache step and adapter execution.
          - selector: quality-cargo-cache-failure-dependency
            meaning: Dependency of adapter execution on the outcome of Cargo cache path resolution.
          - selector: quality-untrusted-cargo-cache-use
            meaning: Occurrence of Cargo cache use in untrusted pull request and Release jobs.
          - selector: quality-cargo-cache-save-condition
            meaning: Declared run condition of the trusted Cargo cache save step.
          - selector: quality-cargo-cache-save-after-adapter
            meaning: Declared order of adapter execution and the trusted Cargo cache save step.
          - selector: quality-toolchain-language-profile-binding
            meaning: Comparison of the language-profile binding of each quality toolchain step with the matching job environment declaration; equal or different.
          - selector: quality-toolchain-toolchain-version-binding
            meaning: Comparison of the toolchain-version binding of each quality toolchain step with the matching job environment declaration; equal or different.
          - selector: quality-toolchain-uv-version-binding
            meaning: Comparison of the uv-version binding of each quality toolchain step with the matching job environment declaration; equal or different.
          - selector: quality-toolchain-cargo-audit-version-binding
            meaning: Comparison of the cargo-audit-version binding of each quality toolchain step with the matching job environment declaration; equal or different.
          - selector: quality-toolchain-cargo-deny-version-binding
            meaning: Comparison of the cargo-deny-version binding of each quality toolchain step with the matching job environment declaration; equal or different.
          - selector: quality-toolchain-continue-on-error
            meaning: Declared continue-on-error setting of the quality toolchain step.
          - selector: platform-explicit-input-binding
            meaning: Comparison of platform caller input names with the platform callee interface.
          - selector: platform-summary-identity
            meaning: Declared platform caller aggregate job name.
          - selector: profiles-callee-runs-per-profile
            meaning: Number of quality callee runs for each configured language profile, as declared by the profiles caller matrix.
          - selector: profiles-summary-identity
            meaning: Declared profiles caller aggregate job name.
      - summary: Commits that the quality and platform resolution checkouts hold after comparison preparation.
        boundary: boundary.workspace-files
        fields:
          - selector: quality-comparison-fetch-scope
            meaning: Commits that comparison preparation adds to the shallow head checkout.
      - summary: Exit status of the comparison preparation step and acceptance by the platform and profiles aggregate steps.
        boundary: boundary.script-result
        fields:
          - selector: quality-comparison-unavailable-preparation
            meaning: Outcome of comparison preparation when the comparison commit is empty, all zeros, or not fetchable.
          - selector: platform-unresolved-results-accepted
            meaning: Occurrence of platform aggregate acceptance when platform resolution or a required platform result is failed, cancelled, skipped, or missing.
          - selector: profiles-unsuccessful-result-accepted
            meaning: Occurrence of profiles aggregate acceptance when the quality job result is not success.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: ci-quality-workflow-caller-selected
      - input: ci-quality-workflow-canonical-source-available
      - input: ci-quality-workflow-failure-route-required
      - input: ci-quality-workflow-platform-source-selected
      - input: ci-quality-workflow-profiles-source-selected
    guarantees:
      - id: ci-quality-workflow-reusable-binding-observed
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: reusable-binding
          present: true
      - id: ci-quality-workflow-failure-observed
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: failure-summary
          present: true
      - id: diagnostic-failure-stage-execution
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: quality-fixed-reference
        applies_to:
          - ci-quality-workflow-caller-selected
          - ci-quality-workflow-platform-source-selected
        claim:
          field: quality-fixed-reference
          in:
            - equal
      - id: quality-explicit-input-binding
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-explicit-input-binding
          in:
            - equal
      - id: quality-summary-identity
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-summary-identity
          in:
            - summary
      - id: quality-no-consumer-callee-copy
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-no-consumer-callee-copy
          in:
            - absent
      - id: quality-caller-read-permissions
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-caller-read-permissions
          in:
            - read
      - id: quality-caller-summary-always
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-caller-summary-always
          in:
            - always
      - id: quality-source-before-adapter
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-source-before-adapter
          in:
            - source-before-adapter
      - id: quality-fork-pull-request-untrusted
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-fork-pull-request-job
          in:
            - untrusted-pr
      - id: quality-pull-request-trusted-assets-from-base
        applies_to:
          - ci-quality-workflow-canonical-source-available
          - ci-quality-workflow-platform-source-selected
        claim:
          field: quality-pull-request-trusted-assets-commit
          in:
            - base-commit
      - id: quality-results-before-summary
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-results-before-summary
          in:
            - execution-before-summary
      - id: quality-failure-summary-always
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: quality-failure-summary-always
          in:
            - always
      - id: quality-unresolved-results-visible
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: quality-unresolved-results-visible
          in:
            - present
      - id: platform-resolution-before-execution
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-resolution-before-execution
          in:
            - resolution-before-execution
      - id: platform-execution-before-summary
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-execution-before-summary
          in:
            - execution-before-summary
      - id: quality-cargo-cache-rust-only
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-profile-condition
          in:
            - rust-profile-only
      - id: quality-cargo-cache-before-adapter
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-before-adapter
          in:
            - cache-before-adapter
      - id: quality-cargo-cache-failure-isolated
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-failure-dependency
          in:
            - absent
      - id: quality-untrusted-cargo-cache-absent
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-untrusted-cargo-cache-use
          in:
            - absent
      - id: quality-cargo-cache-save-default-branch-push-only
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-save-condition
          in:
            - default-branch-push-only
      - id: quality-cargo-cache-save-after-adapter
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-save-after-adapter
          in:
            - adapter-before-save
      - id: quality-comparison-commit-only
        applies_to:
          - ci-quality-workflow-canonical-source-available
          - ci-quality-workflow-platform-source-selected
        claim:
          field: quality-comparison-fetch-scope
          in:
            - comparison-commit-only
      - id: quality-comparison-unavailable-fail-open
        applies_to:
          - ci-quality-workflow-canonical-source-available
          - ci-quality-workflow-platform-source-selected
        claim:
          field: quality-comparison-unavailable-preparation
          in:
            - succeeded
      - id: quality-toolchain-language-profile-bound
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-language-profile-binding
          in:
            - equal
      - id: quality-toolchain-toolchain-version-bound
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-toolchain-version-binding
          in:
            - equal
      - id: quality-toolchain-uv-version-bound
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-uv-version-binding
          in:
            - equal
      - id: quality-toolchain-cargo-audit-version-bound
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-cargo-audit-version-binding
          in:
            - equal
      - id: quality-toolchain-cargo-deny-version-bound
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-cargo-deny-version-binding
          in:
            - equal
      - id: quality-toolchain-continue-on-error-absent
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-toolchain-continue-on-error
          in:
            - absent
      - id: platform-explicit-input-binding
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-explicit-input-binding
          in:
            - equal
      - id: platform-summary-identity
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-summary-identity
          in:
            - quality-gate-platforms / summary
      - id: platform-unresolved-results-rejected
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-unresolved-results-accepted
          in:
            - absent
      - id: profiles-callee-once-per-profile
        applies_to:
          - ci-quality-workflow-profiles-source-selected
        claim:
          field: profiles-callee-runs-per-profile
          in:
            - "1"
      - id: profiles-summary-identity
        applies_to:
          - ci-quality-workflow-profiles-source-selected
        claim:
          field: profiles-summary-identity
          in:
            - quality-gate-profiles / summary
      - id: profiles-unsuccessful-result-rejected
        applies_to:
          - ci-quality-workflow-profiles-source-selected
        claim:
          field: profiles-unsuccessful-result-accepted
          in:
            - absent
