version: 1
name: contract-subject
subject:
  id: subject.ci.quality-workflow
  summary: Execute canonical quality checks and expose an aggregate decision without hiding missing or failed checks.
contracts:
  - id: contract.ci-quality-workflow.execution
    summary: Canonical quality caller and reusable workflow definitions.
    observations:
      - summary: Canonical workflow triggers, permissions, orchestration, and summaries exposed for repository verification.
        boundary:
          ref: boundary.workflow-definition
        value:
          root: canonical-workflow
          kind: object
          fields:
            - selector: reusable-binding
              meaning: Declared caller-to-callee binding.
            - selector: execution-chain
              meaning: Declared quality execution dependency graph.
            - selector: failure-summary
              meaning: Declared aggregate failure route.
            - selector: optional-platform-chain
              meaning: Declared platform quality dependency graph.
            - selector: quality-fixed-reference
              meaning: Comparison of caller reusable reference with its registered provider workflow reference declaration.
            - selector: quality-explicit-input-binding
              meaning: Comparison of caller input names and typed bindings with the callee interface.
            - selector: quality-summary-identity
              meaning: Declared caller aggregate job ID.
            - selector: quality-no-consumer-callee-copy
              meaning: Occurrence of local copies of provider execution jobs in the caller.
            - selector: quality-caller-read-permissions
              meaning: Declared caller contents permission.
            - selector: quality-caller-summary-always
              meaning: Declared caller aggregate condition.
            - selector: quality-source-before-adapter
              meaning: Declared order of trusted checkout/asset resolution and adapter execution.
            - selector: quality-results-before-summary
              meaning: Declared dependency order of applicable execution jobs and aggregate decision.
            - selector: quality-failure-summary-always
              meaning: Declared summary condition on applicable job failure.
            - selector: quality-unresolved-results-visible
              meaning: Occurrence of unresolved applicable results in aggregate failure evidence.
            - selector: platform-resolution-before-execution
              meaning: Declared dependency order of trusted platform resolution and selected matrix execution.
            - selector: platform-execution-before-summary
              meaning: Declared dependency order of matrix execution and aggregate platform decision.
            - selector: quality-cargo-cache-profile-condition
              meaning: Declared language profile condition of the trusted Cargo cache path resolution step.
            - selector: quality-cargo-cache-before-adapter
              meaning: Declared order of the trusted Cargo cache step and adapter execution.
            - selector: quality-cargo-cache-failure-dependency
              meaning: Dependency of adapter execution on the outcome of Cargo cache path resolution.
            - selector: quality-untrusted-cargo-cache-use
              meaning: Occurrence of Cargo cache use in untrusted pull request and Release jobs.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: ci-quality-workflow-caller-selected
      - input: ci-quality-workflow-canonical-source-available
      - input: ci-quality-workflow-failure-route-required
      - input: ci-quality-workflow-platform-source-selected
    guarantees:
      - id: ci-quality-workflow-reusable-binding-observed
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: reusable-binding
          present: true
      - id: ci-quality-workflow-success-observed
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: execution-chain
          present: true
      - id: ci-quality-workflow-failure-observed
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: failure-summary
          present: true
      - id: ci-quality-workflow-platform-chain-observed
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: optional-platform-chain
          present: true
      - id: diagnostic-failure-stage-execution
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: quality-fixed-reference
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-fixed-reference
          in:
            - equal
      - id: quality-explicit-input-binding
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-explicit-input-binding
          in:
            - equal
      - id: quality-summary-identity
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-summary-identity
          in:
            - summary
      - id: quality-no-consumer-callee-copy
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-no-consumer-callee-copy
          in:
            - absent
      - id: quality-caller-read-permissions
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-caller-read-permissions
          in:
            - read
      - id: quality-caller-summary-always
        applies_to:
          - ci-quality-workflow-caller-selected
        claim:
          field: quality-caller-summary-always
          in:
            - always
      - id: quality-source-before-adapter
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-source-before-adapter
          in:
            - source-before-adapter
      - id: quality-results-before-summary
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-results-before-summary
          in:
            - execution-before-summary
      - id: quality-failure-summary-always
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: quality-failure-summary-always
          in:
            - always
      - id: quality-unresolved-results-visible
        applies_to:
          - ci-quality-workflow-failure-route-required
        claim:
          field: quality-unresolved-results-visible
          in:
            - present
      - id: platform-resolution-before-execution
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-resolution-before-execution
          in:
            - resolution-before-execution
      - id: platform-execution-before-summary
        applies_to:
          - ci-quality-workflow-platform-source-selected
        claim:
          field: platform-execution-before-summary
          in:
            - execution-before-summary
      - id: quality-cargo-cache-rust-only
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-profile-condition
          in:
            - rust-profile-only
      - id: quality-cargo-cache-before-adapter
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-before-adapter
          in:
            - cache-before-adapter
      - id: quality-cargo-cache-failure-isolated
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-cargo-cache-failure-dependency
          in:
            - absent
      - id: quality-untrusted-cargo-cache-absent
        applies_to:
          - ci-quality-workflow-canonical-source-available
        claim:
          field: quality-untrusted-cargo-cache-use
          in:
            - absent
