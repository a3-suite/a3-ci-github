version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-quality-workflow.execution
    id: detailed-failure-execution
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-quality-workflow.execution
    id: ci-quality-workflow-reusable-binding
    partition: ci-quality-workflow-caller-selected
    input:
      caller-source: main-quality-caller
  - contract_id: contract.ci-quality-workflow.execution
    id: ci-quality-workflow-success
    partition: ci-quality-workflow-canonical-source-available
    input:
      scenario: valid
  - contract_id: contract.ci-quality-workflow.execution
    id: ci-quality-workflow-failure
    partition: ci-quality-workflow-failure-route-required
    input:
      scenario: rejected
  - contract_id: contract.ci-quality-workflow.execution
    id: ci-quality-workflow-platform
    partition: ci-quality-workflow-platform-source-selected
    input:
      scenario: optional-platform-source-selected
