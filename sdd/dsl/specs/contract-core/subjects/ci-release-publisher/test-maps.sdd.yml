version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-rejection-diagnostics
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-identity-rejection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - rejected
          - no-success-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: standard-workflow-capability
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint publishes with a bound standard workflow token when the API reports push false
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint publishes with a bound standard workflow token when the API reports push false
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-acceptance-not-predicted
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint creates once by immutable ID and leaves acceptance to the create response
        guarantees:
          - receipt-file
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint creates once by immutable ID and leaves acceptance to the create response
        guarantees:
          - receipt-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: canonical-repository-identity
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint preserves approved identity across canonical repository casing
        guarantees:
          - receipt-file
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint preserves approved identity across canonical repository casing
        guarantees:
          - receipt-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: pre-create-handoff-change
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint rejects a handoff asset changed during final absence observation before create
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint rejects a handoff asset changed during final absence observation before create
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
  - contract_id: contract.ci-release-publisher.outputs
    case_id: asset-inventory-propagation
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint waits for the uploaded asset inventory without repeating writes
        guarantees:
          - receipt-file
          - readback-file
          - publication-write-retry
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint waits for the uploaded asset inventory without repeating writes
        guarantees:
          - receipt-file
          - readback-file
          - publication-write-retry
  - contract_id: contract.ci-release-publisher.outputs
    case_id: bundle-publish
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: present'
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: absent'
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: empty'
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: present'
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: absent'
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: 'dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: empty'
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: independent-evidence
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint creates once by immutable ID and leaves acceptance to the create response
        guarantees:
          - receipt-file
          - readback-file
          - publication-created-id-binding
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint creates once by immutable ID and leaves acceptance to the create response
        guarantees:
          - receipt-file
          - readback-file
          - publication-created-id-binding
  - contract_id: contract.ci-release-publisher.outputs
    case_id: bundle-rejection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint rejects missing credential and path injection without outputs
        guarantees:
          - rejected
          - no-success-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint rejects missing credential and path injection without outputs
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: invalid-local-bindings
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint rejects an expired approval before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint rejects an expired approval before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
  - contract_id: contract.ci-release-publisher.outputs
    case_id: tampered-handoff-asset
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint rejects a tampered handoff asset before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint rejects a tampered handoff asset before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
  - contract_id: contract.ci-release-publisher.outputs
    case_id: remote-rejection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint rejects a moved tag source before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint rejects a moved tag source before writes
        guarantees:
          - rejected
          - no-success-outputs
          - publication-write-on-rejection
  - contract_id: contract.ci-release-publisher.outputs
    case_id: partial-failure
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint stops after an uncertain upload without retry, recovery or delete
        guarantees:
          - rejected
          - no-success-outputs
          - publication-created-id-binding
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint stops after an uncertain upload without retry, recovery or delete
        guarantees:
          - rejected
          - no-success-outputs
          - publication-created-id-binding
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
  - contract_id: contract.ci-release-publisher.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-release-publisher failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: publication-existing-release-protection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: source entrypoint > publisher entrypoint refuses to write over an existing same-tag published release
        guarantees:
          - publication-existing-release-write
      - path: actions/ci-release-publisher/tests/entrypoint-scenarios.test.ts
        symbol: dist entrypoint > publisher entrypoint refuses to write over an existing same-tag published release
        guarantees:
          - publication-existing-release-write
