  - contract_id: contract.ci-release-publisher.outputs
    case_id: publication-immutable-id
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > publisher creates once and emits evidence accepted by independent verifier
        guarantees:
