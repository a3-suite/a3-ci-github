version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-rejection-diagnostics
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-identity-rejection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - rejected
          - no-success-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: standard-workflow-capability
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > bound standard capability permits false API push through publication and independent readback
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: provider-acceptance-not-predicted
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher leaves provider acceptance to the create response instead of predicting it from the default branch
        guarantees:
          - receipt-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: canonical-repository-identity
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > publisher preserves approved identity across canonical repository casing
        guarantees:
          - receipt-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: pre-create-handoff-change
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > publisher rejects handoff changes during final absence observation before create
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: asset-inventory-propagation
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > publisher waits for uploaded asset inventory without repeating publication writes
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: bundle-publish
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: present"
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: absent"
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: empty"
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: present"
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: absent"
        guarantees:
          - receipt-file
          - readback-file
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "dist entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: empty"
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: independent-evidence
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: contract.ci-release-publisher.outputs > release-publisher-source-flow > publisher creates once and emits evidence accepted by independent verifier
        guarantees:
          - receipt-file
          - readback-file
  - contract_id: contract.ci-release-publisher.outputs
    case_id: bundle-rejection
    tests:
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint rejects missing credential and path injection without outputs
        guarantees:
          - rejected
          - no-success-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: dist entrypoint > runActionEntrypoint > publisher entrypoint rejects missing credential and path injection without outputs
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: invalid-local-bindings
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher rejects invalid approval, handoff and pre-observation before writes
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: tampered-handoff-asset
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher rejects invalid approval, handoff and pre-observation before writes
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: remote-rejection
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher rejects moved source, existing draft and unverifiable draft visibility before create
        guarantees:
          - rejected
          - no-success-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: partial-failure
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: create"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: upload"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: finalize"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: readback"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: provider-expiry"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: provider-notes"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: tag-expiry"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: tag-notes"
        guarantees:
          - rejected
          - no-success-outputs
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher transport bounds write operations and sanitizes uncertain provider results
        guarantees:
          - rejected
  - contract_id: contract.ci-release-publisher.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-release-publisher failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: "source entrypoint > runActionEntrypoint > publisher entrypoint writes once by immutable ID and emits evidence paths: present"
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: actions/ci-release-publisher/tests/entrypoint.test.ts
        symbol: source entrypoint > runActionEntrypoint > publisher entrypoint preserves provider rejection metadata before writes
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-release-publisher.outputs
    case_id: publication-write-failure-boundary
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: create"
        guarantees:
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
          - publication-created-id-binding
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: upload"
        guarantees:
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
          - publication-created-id-binding
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: finalize"
        guarantees:
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
          - publication-created-id-binding
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: "publisher > publisher > publisher does not retry or recover failed create upload finalize and readback: readback"
        guarantees:
          - publication-write-retry
          - publication-recovery-write
          - publication-delete
          - publication-created-id-binding
  - contract_id: contract.ci-release-publisher.outputs
    case_id: publication-existing-release-protection
    tests:
      - path: runtime/release-publication/tests/publisher.test.mjs
        symbol: publisher > publisher > publisher rejects moved source, existing draft and unverifiable draft visibility before create
