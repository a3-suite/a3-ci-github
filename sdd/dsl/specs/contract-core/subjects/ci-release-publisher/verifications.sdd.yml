version: 1
name: contract-verifications
subject_ref: subject.ci.release-publisher
verifications:
  - id: verification.ci-release-publisher.outputs
    contract_id: contract.ci-release-publisher.outputs
    cases:
      - id: provider-rejection-diagnostics
        intent_id: detailed-diagnostics-outputs
        input: {provider: invalid-identity-shape}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-outputs}]
      - id: provider-identity-rejection
        intent_id: fail-closed
        input: {provider: invalid-identity-shape}
        checks: [{id: rejection, guarantee_ref: rejected}, {id: no-outputs, guarantee_ref: no-success-outputs}]
      - id: standard-workflow-capability
        intent_id: publish-evidence
        input: {credential: bound-standard-workflow-github-token, permission-metadata: boolean-false}
        checks: [{id: receipt, guarantee_ref: receipt-file}, {id: readback, guarantee_ref: readback-file}]
      - id: provider-acceptance-not-predicted
        intent_id: publish-evidence
        input: {default-branch: moved, workflow-tree: unavailable}
        checks: [{id: receipt, guarantee_ref: receipt-file}]
      - id: canonical-repository-identity
        intent_id: publish-evidence
        input: {repository-response: canonical-casing}
        checks: [{id: receipt, guarantee_ref: receipt-file}]
      - id: pre-create-handoff-change
        intent_id: fail-closed
        input: {handoff: changed-during-final-absence-observation}
        checks: [{id: rejection, guarantee_ref: rejected}, {id: no-outputs, guarantee_ref: no-success-outputs}]
      - id: asset-inventory-propagation
        intent_id: publish-evidence
        input: {asset-inventory: initially-valid-subset-then-complete, writes: once}
        checks: [{id: receipt, guarantee_ref: receipt-file}, {id: readback, guarantee_ref: readback-file}]
      - id: detailed-failure-outputs
        intent_id: detailed-diagnostics-outputs
        input: {scenario: rejected-public-invocation}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-outputs}]
      - id: bundle-publish
        intent_id: publish-evidence
        input:
          invocation: bundle
          handoff: validated
        checks:
          - id: receipt
            guarantee_ref: receipt-file
          - id: readback
            guarantee_ref: readback-file
      - id: independent-evidence
        intent_id: publish-evidence
        input:
          provider: fake
          handoff: validated
        checks:
          - id: receipt
            guarantee_ref: receipt-file
          - id: readback
            guarantee_ref: readback-file
      - id: bundle-rejection
        intent_id: fail-closed
        input:
          scenario: missing-credential
        checks:
          - id: rejection
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: invalid-local-bindings
        intent_id: fail-closed
        input:
          approval: expired
        checks:
          - id: rejection
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: tampered-handoff-asset
        intent_id: fail-closed
        input:
          handoff: tampered
        checks:
          - id: rejection
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: remote-rejection
        intent_id: fail-closed
        input:
          remote: moved-source
        checks:
          - id: rejection
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: partial-failure
        intent_id: fail-closed
        input:
          provider: uncertain-upload
        checks:
          - id: rejection
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: publication-write-failure-boundary
        intent_id: publication-write-failure-boundary-intent
        input:
          provider: uncertain-upload
        checks:
        - id: publication-created-id-binding
          guarantee_ref: publication-created-id-binding
        - id: publication-write-retry
          guarantee_ref: publication-write-retry
        - id: publication-recovery-write
          guarantee_ref: publication-recovery-write
        - id: publication-delete
          guarantee_ref: publication-delete
      - id: publication-existing-release-protection
        intent_id: publication-existing-release-protection-intent
        input:
          remote: existing-same-tag-published-release
        checks:
        - id: publication-existing-release-write
          guarantee_ref: publication-existing-release-write
      - id: publication-immutable-id
        intent_id: publication-immutable-id-intent
        input:
          handoff: validated
          provider: successful
        checks:
        - id: publication-created-id-binding
          guarantee_ref: publication-created-id-binding
      - id: publication-inventory-reobservation
        intent_id: publication-inventory-reobservation-intent
        input:
          asset-inventory: initially-valid-subset-then-complete
        checks:
        - id: publication-write-retry
          guarantee_ref: publication-write-retry
