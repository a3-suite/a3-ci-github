version: 1
name: contract-observations
subject_ref: subject.ci.release-publisher
observations:
  - id: observation.ci-release-publisher.outputs
    summary: Evidence paths alone do not establish final publication success.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: receipt-path
          kind: observation_field
          meaning: New schema-valid receipt bound to authority, handoff, original
            pre-observation, asset digest and immutable create-result ID.
        - selector: readback-path
          kind: observation_field
          meaning: New schema-valid remote readback of exact published body, assets,
            source and unique Release ID; independently verified by the next
            Action.
  - id: observation.ci-release-publisher.result
    summary: Invalid inputs, unknown remote state or any partial write failure stops
      without successful outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failed step on rejection or uncertain write result.
        - selector: successful-output-state
          kind: observation_field
          meaning: Successful evidence outputs are absent on failure.
  - id: observation.ci-release-publisher.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "入力/approval検証・pre-write reobservation・create・個別asset upload・finalize・remote readback・receipt保存の段階、固定source/tag/asset、method・安全なendpoint・HTTP status/request ID、確定したRelease IDと最後に完了した公開段階、期待/観測digest、provider拒否・write前未実行・write後の結果不明を表す診断情報。"
  - id: observation.ci-release-publisher.effects
    summary: Provider request and response trace observed across the publication boundary.
    boundary:
      ref: boundary.release-provider-requests
    value:
      root: invocation.effects
      kind: object
      fields:
      - selector: publication-write-retry
        kind: observation_field
        meaning: Repeated create, upload of the same asset, or finalize write requests during one invocation,
          including after an uncertain result.
      - selector: publication-recovery-write
        kind: observation_field
        meaning: Additional provider writes after the first failed or uncertain publication operation.
      - selector: publication-delete
        kind: observation_field
        meaning: Provider DELETE requests during publication.
      - selector: publication-existing-release-write
        kind: observation_field
        meaning: Provider writes to a same-tag Release observed before creation.
      - selector: publication-created-id-binding
        kind: observation_field
        meaning: For every upload or finalize request, equality of its Release ID and the immutable ID from a preceding valid create response. With no such request, this comparison is vacuously matched; a request without that ID is unmatched.
