version: 1
name: contract-clauses
subject_ref: subject.ci.release-publisher
contracts:
  - id: contract.ci-release-publisher.outputs
    summary: Only the registry-approved GitHub token binding may create a previously
      absent Release, upload validated assets and finalize by create-result
      immutable ID. Accept only publication-request v2 and bind its owner version and target to authority. Validate approved notes, expiry,
      authority/handoff/pre-observation, reobserve tag identity, draft visibility and
      complete absence and the unchanged handoff immediately before create without predicting
      provider acceptance, and stop on mismatches,
      unknown results or partial failure without retrying writes, overwrite, deletion or
      successful outputs. Emit schema-valid receipt/readback paths after
      readback; independent verifier owns publication success. Draft visibility and bounded GET-only inventory reobservation follow contract.ci-release-publication-verifier.outputs.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-publisher-valid
          op: available
      - id: invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-publisher-invalid
          op: available
      - id: publication-invocation
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-publisher-invocation
          op: available
    guarantees:
      - id: receipt-file
        when: valid
        observation_ref: observation.ci-release-publisher.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: receipt-path
      - id: readback-file
        when: valid
        observation_ref: observation.ci-release-publisher.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: readback-path
      - id: rejected
        when: invalid
        observation_ref: observation.ci-release-publisher.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: no-success-outputs
        when: invalid
        observation_ref: observation.ci-release-publisher.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: successful-output-state
            right:
              kind: value_set
              values:
                - absent
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-release-publisher.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
      - id: publication-write-retry
        when: publication-invocation
        observation_ref: observation.ci-release-publisher.effects
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: publication-write-retry
            right:
              kind: value_set
              values:
              - absent
      - id: publication-recovery-write
        when: publication-invocation
        observation_ref: observation.ci-release-publisher.effects
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: publication-recovery-write
            right:
              kind: value_set
              values:
              - absent
      - id: publication-delete
        when: publication-invocation
        observation_ref: observation.ci-release-publisher.effects
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: publication-delete
            right:
              kind: value_set
              values:
              - absent
      - id: publication-existing-release-write
        when: publication-invocation
        observation_ref: observation.ci-release-publisher.effects
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: publication-existing-release-write
            right:
              kind: value_set
              values:
              - absent
      - id: publication-created-id-binding
        when: publication-invocation
        observation_ref: observation.ci-release-publisher.effects
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: publication-created-id-binding
            right:
              kind: value_set
              values:
              - matched
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [diagnostic-details-outputs]
      - id: publish-evidence
        goal: Publish once by immutable ID and emit evidence accepted by independent
          read-only verification.
        guarantee_refs:
          - receipt-file
          - readback-file
      - id: fail-closed
        goal: Reject invalid local or remote bindings and uncertain/partial provider
          results without success evidence or recovery writes.
        guarantee_refs:
          - rejected
          - no-success-outputs
      - id: publication-write-failure-boundary-intent
        goal: Observe the complete write trace at each uncertain publication boundary.
        guarantee_refs:
        - publication-created-id-binding
        - publication-write-retry
        - publication-recovery-write
        - publication-delete
      - id: publication-existing-release-protection-intent
        goal: Observe provider writes when a same-tag draft or published Release already exists.
        guarantee_refs:
        - publication-existing-release-write
      - id: publication-immutable-id-intent
        goal: Compare upload and finalize targets with the immutable create response ID.
        guarantee_refs:
        - publication-created-id-binding
      - id: publication-inventory-reobservation-intent
        goal: Observe publication write counts while read-only asset inventory initially lags.
        guarantee_refs:
        - publication-write-retry
