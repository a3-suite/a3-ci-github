version: 1
name: contract-subject
subject:
  id: subject.ci.release-publisher
  summary: Execute owner-approved GitHub Release publication through a bounded create/upload/finalize binding while independent read-only verification retains success authority.
contracts:
  - id: contract.ci-release-publisher.outputs
    summary: Release publication write request from a validated handoff.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: provider
        meaning: "Precondition prepared by the case: behaviour of the Release provider."
      - name: credential
        meaning: "Precondition prepared by the case: credential route available to the step."
      - name: permission-metadata
        meaning: "Precondition prepared by the case: permission metadata returned by the provider."
      - name: default-branch
        meaning: "Precondition prepared by the case: state of the default branch at publication."
      - name: workflow-tree
        meaning: "Precondition prepared by the case: availability of the workflow tree."
      - name: repository-response
        meaning: "Precondition prepared by the case: repository identity response returned by the provider."
      - name: handoff
        meaning: "Precondition prepared by the case: state of the release handoff."
      - name: asset-inventory
        meaning: "Precondition prepared by the case: asset inventory returned by the provider."
      - name: invocation
        meaning: "Received by the contract target: form in which the publisher is invoked."
      - name: approval
        meaning: "Precondition prepared by the case: state of the release approval."
      - name: remote
        meaning: "Precondition prepared by the case: state of the remote Release or tag."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: receipt-path
            meaning: Path of the publication receipt written by the publisher.
          - selector: readback-path
            meaning: Path of the remote readback evidence written by the publisher.
          - selector: outcome
            meaning: Failed step on rejection or uncertain write result.
          - selector: successful-output-state
            meaning: Successful evidence outputs are absent on failure.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Provider request and response trace observed across the publication boundary.
        boundary: boundary.release-provider-requests
        fields:
          - selector: publication-write-retry
            meaning: Repeated create, upload of the same asset, or finalize write requests during one invocation, including after an uncertain result.
          - selector: publication-recovery-write
            meaning: Additional provider writes after the first failed or uncertain publication operation.
          - selector: publication-delete
            meaning: Provider DELETE requests during publication.
          - selector: publication-existing-release-write
            meaning: Provider writes to a same-tag Release observed before creation.
          - selector: publication-created-id-binding
            meaning: For every upload or finalize request, equality of its Release ID and the immutable ID from a preceding valid create response. With no such request, this comparison is vacuously matched; a request without that ID is unmatched.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.release-publisher-valid
      - environment: runtime-context.release-publisher-invalid
      - environment: runtime-context.release-publisher-invocation
    guarantees:
      - id: receipt-file
        applies_to:
          - runtime-context.release-publisher-valid
        claim:
          field: receipt-path
          present: true
      - id: readback-file
        applies_to:
          - runtime-context.release-publisher-valid
        claim:
          field: readback-path
          present: true
      - id: rejected
        applies_to:
          - runtime-context.release-publisher-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: no-success-outputs
        applies_to:
          - runtime-context.release-publisher-invalid
        claim:
          field: successful-output-state
          in:
            - absent
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: publication-write-retry
        applies_to:
          - runtime-context.release-publisher-invocation
        claim:
          field: publication-write-retry
          in:
            - absent
      - id: publication-recovery-write
        applies_to:
          - runtime-context.release-publisher-invocation
        claim:
          field: publication-recovery-write
          in:
            - absent
      - id: publication-delete
        applies_to:
          - runtime-context.release-publisher-invocation
        claim:
          field: publication-delete
          in:
            - absent
      - id: publication-existing-release-write
        applies_to:
          - runtime-context.release-publisher-invocation
        claim:
          field: publication-existing-release-write
          in:
            - absent
      - id: publication-created-id-binding
        applies_to:
          - runtime-context.release-publisher-invocation
        claim:
          field: publication-created-id-binding
          in:
            - matched
