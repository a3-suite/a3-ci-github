version: 1
name: contract-subject
subject:
  id: subject.ci.release-publisher
  summary: Execute owner-approved GitHub Release publication through a bounded create/upload/finalize binding while independent read-only verification retains success authority.
contracts:
  - id: contract.ci-release-publisher.outputs
    summary: Release publication write request from a validated handoff.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: provider
        meaning: "Precondition prepared by the case: behaviour of the Release provider."
      - name: credential
        meaning: "Precondition prepared by the case: credential route available to the step."
      - name: permission-metadata
        meaning: "Precondition prepared by the case: permission metadata returned by the provider."
      - name: default-branch
        meaning: "Precondition prepared by the case: state of the default branch at publication."
      - name: workflow-tree
        meaning: "Precondition prepared by the case: availability of the workflow tree."
      - name: repository-response
        meaning: "Precondition prepared by the case: repository identity response returned by the provider."
      - name: handoff
        meaning: "Precondition prepared by the case: state of the release handoff."
      - name: asset-inventory
        meaning: "Precondition prepared by the case: asset inventory returned by the provider."
      - name: invocation
        meaning: "Received by the contract target: form in which the publisher is invoked."
      - name: approval
        meaning: "Precondition prepared by the case: state of the release approval."
      - name: remote
        meaning: "Precondition prepared by the case: state of the remote Release or tag."
    conditions:
      - id: runtime-context.release-publisher-valid
        summary: Approved inputs and initial remote observations agree, every selected publication and readback request returns matching evidence, and the local evidence and Action outputs can be written.
      - id: runtime-context.release-publisher-invalid
        summary: Inputs, approval, handoff or remote observations fail validation before the first provider write. This includes an existing same-tag Release.
      - id: publication-operation-failed
        summary: Publication reaches a provider write, subsequent readback, or local evidence write with a failed or uncertain result before Action output writing starts.
      - id: publication-action-output-write-failed
        summary: Publication evidence has been written, but the Action output write fails.
    guarantees:
      - id: receipt-file
        applies_to:
          - runtime-context.release-publisher-valid
        boundary: boundary.action-output
        statement: "`receipt-path` identifies the publication receipt file written in the requested output directory."
      - id: readback-file
        applies_to:
          - runtime-context.release-publisher-valid
        boundary: boundary.action-output
        statement: "`readback-path` identifies the remote readback evidence file written in the requested output directory."
      - id: rejected
        applies_to:
          - runtime-context.release-publisher-invalid
          - publication-operation-failed
          - publication-action-output-write-failed
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failed step on rejection or uncertain write result.'
      - id: no-success-outputs
        applies_to:
          - runtime-context.release-publisher-invalid
          - publication-operation-failed
        boundary: boundary.action-output
        statement: '`successful-output-state` is one of `"absent"`. Occurrence state (present or absent) of the successful evidence outputs.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.release-publisher-invalid
          - publication-operation-failed
          - publication-action-output-write-failed
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: publication-write-retry
        applies_to:
          - runtime-context.release-publisher-valid
          - publication-operation-failed
        boundary: boundary.release-provider-requests
        statement: '`publication-write-retry` is one of `"absent"`. Repeated create, upload of the same asset, or finalize write requests during one invocation, including after an uncertain result.'
      - id: publication-recovery-write
        applies_to:
          - publication-operation-failed
        boundary: boundary.release-provider-requests
        statement: '`publication-recovery-write` is one of `"absent"`. Additional provider writes after the first failed or uncertain publication operation.'
      - id: publication-delete
        applies_to:
          - runtime-context.release-publisher-valid
          - runtime-context.release-publisher-invalid
          - publication-operation-failed
          - publication-action-output-write-failed
        boundary: boundary.release-provider-requests
        statement: '`publication-delete` is one of `"absent"`. Provider DELETE requests during publication.'
      - id: publication-write-on-rejection
        applies_to:
          - runtime-context.release-publisher-invalid
        boundary: boundary.release-provider-requests
        statement: '`publication-write-after-rejection` is one of `"absent"`. Occurrence state (present or absent) of provider write requests during an invocation rejected before any write.'
      - id: publication-existing-release-write
        applies_to:
          - runtime-context.release-publisher-invalid
        boundary: boundary.release-provider-requests
        statement: '`publication-existing-release-write` is one of `"absent"`. Provider writes to a same-tag Release observed before creation.'
      - id: publication-created-id-binding
        applies_to:
          - runtime-context.release-publisher-valid
          - publication-operation-failed
        boundary: boundary.release-provider-requests
        statement: '`publication-created-id-binding` is one of `"matched"`. For every upload or finalize request, equality of its Release ID and the immutable ID from a preceding valid create response. A request without that ID is unmatched.'
    input_kind:
      kind: operation
      name: ci-release-publisher
