version: 1
name: contract-subject
subject:
  id: subject.ci.config-snapshot
  summary: Resolving CI configuration precedence and writing a deterministic snapshot.
contracts:
  - id: contract.ci-config-snapshot.outputs
    summary: Valid configuration sources produce a snapshot status output.
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary:
          ref: boundary.action-output
        fields:
          - selector: status
            meaning: Whether configuration resolution and snapshot writing succeeded.
          - selector: snapshot-path
            meaning: Path of the written configuration snapshot.
          - selector: digest
            meaning: SHA-256 digest of resolved snapshot values and sources.
          - selector: outcome
            meaning: Failure outcome of the rejected snapshot operation.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: sources-input-present
      - environment: runtime-context.action-input-invalid
    guarantees:
      - id: config-snapshot-status-produced
        applies_to:
          - sources-input-present
        claim:
          field: status
          present: true
      - id: config-snapshot-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
