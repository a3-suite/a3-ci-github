version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-config-snapshot.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-config-snapshot.outputs
    id: valid-config-sources
    partition: sources-input-present
    input:
      sources-json: '{"preset":{"MODE":"release"},"workflow":{"MODE":"candidate"},"runtime":{"MODE":"dry-run"}}'
      snapshot-path: .ci/config-snapshot.json
  - contract_id: contract.ci-config-snapshot.outputs
    id: command-file-collision-rejected
    partition: runtime-context.action-input-invalid
    input:
      snapshot-path: github-output.txt
      github-output: github-output.txt
