version: 1
name: contract-observations
subject_ref: subject.ci.annotated-tag-resolver
observations:
  - id: observation.ci-annotated-tag-resolver.outputs
    summary: The Action exposes the annotated tag object and source commit identities.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: tag-object-sha
          kind: observation_field
          meaning: SHA of the annotated tag object.
        - selector: tag-object-type
          kind: observation_field
          meaning: Git object type.
        - selector: source-sha
          kind: observation_field
          meaning: SHA of the commit referenced by the tag.
  - id: observation.ci-annotated-tag-resolver.result
    summary: The Action exposes its failed step outcome when tag resolution input is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected tag resolution step.
  - id: observation.ci-annotated-tag-resolver.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "tag取得・annotated tag検証・commit解決を区別し、repository、要求tag、参照種別、取得できたtag object SHAとcommit SHA、期待する固定参照と観測値、provider応答の安全な相関情報を残す。"
