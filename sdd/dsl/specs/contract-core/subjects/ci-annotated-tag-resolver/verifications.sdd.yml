version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-annotated-tag-resolver.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-annotated-tag-resolver.outputs
    id: annotated-tag-resolution
    partition: runtime-context.annotated-tag-resolution-valid
    input:
      repository: owner/repo
      tag: v1.2.3
      github-token: test-token
  - contract_id: contract.ci-annotated-tag-resolver.outputs
    id: missing-token-rejected
    partition: runtime-context.action-input-invalid
    input:
      tag: v1.2.3
      github-token: ""
