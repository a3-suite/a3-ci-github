version: 1
name: contract-test-maps
subject_ref: subject.ci.annotated-tag-resolver
test_maps:
  - verification_id: verification.ci-annotated-tag-resolver.outputs
    case_id: annotated-tag-resolution
    tests:
      - path: actions/ci-annotated-tag-resolver/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint resolves an annotated tag to its commit"
        check_refs:
          - check-tag-resolution-output
      - path: actions/ci-annotated-tag-resolver/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint resolves an annotated tag to its commit"
        check_refs:
          - check-tag-resolution-output
  - verification_id: verification.ci-annotated-tag-resolver.outputs
    case_id: missing-token-rejected
    tests:
      - path: actions/ci-annotated-tag-resolver/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint fails when the token is missing"
        check_refs:
          - check-tag-resolution-failure
      - path: actions/ci-annotated-tag-resolver/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint fails when the token is missing"
        check_refs:
          - check-tag-resolution-failure
  - verification_id: verification.ci-annotated-tag-resolver.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: "ci-annotated-tag-resolver failure boundary > source retains actionable input failure without private input values"
        check_refs: [diagnostic-details]
      - path: actions/ci-annotated-tag-resolver/tests/tag.test.ts
        symbol: "resolveAnnotatedTag(string,string,string,string,fetch) > retains safe provider correlation without the response body or token"
        check_refs: [diagnostic-details]
