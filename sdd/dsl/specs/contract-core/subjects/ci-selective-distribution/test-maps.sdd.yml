version: 1
name: contract-test-maps
subject_ref: subject.ci.selective-distribution
test_maps:
  - verification_id: verification.ci-selective-distribution.selection
    case_id: selective-distribution-selection
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.selection > selective-distribution > preset selection closes dependencies while direct asset selection reports missing dependencies"
        check_refs:
          - check-selective-distribution-closure
          - check-selective-distribution-missing-dependency
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.selection > selective-distribution > preset closure includes only its reusable workflow sources and excludes optional materializer"
        check_refs:
          - check-selective-distribution-closure
          - check-selective-distribution-missing-dependency
  - verification_id: verification.ci-selective-distribution.delivery
    case_id: selective-distribution-delivery
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > release generator derives deterministic selective assets and checksums from registries"
        check_refs:
          - check-selective-distribution-receipt
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > each selected callee resolves from fetched sources and missing sources remain rejected"
        check_refs:
          - check-selective-distribution-assets
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > selected distribution runs preflight and lock without materializer and supports its later acquisition"
        check_refs:
          - check-selective-distribution-assets
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > same revision merges separately fetched verified asset groups without replacing prior files"
        check_refs:
          - check-selective-distribution-assets
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch reuses verified files for repeat and extended preset selections"
        check_refs:
          - check-selective-distribution-assets
          - check-selective-distribution-receipt
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch rejects invalid cached state and concurrent fetch locks before transport"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch preserves prior state and releases its lock after an extension fails"
        check_refs:
          - check-selective-distribution-invalid-source
          - check-selective-distribution-assets
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > explicit source root remains validated when a verified distribution already exists"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > fetch removes staging even when closing or removing its owned lock fails"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > release generator binds every published byte to the exact source commit"
        check_refs:
          - check-selective-distribution-receipt
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > release generator rejects invalid version source and output boundaries"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > manifest validation rejects malformed authority identity files and dependency references"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > remote manifest loading confines the Release URL and release tag mapping"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > fetch rejects source bytes that do not match the release manifest"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > fetch rejects a project-local state path redirected through a symlink"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution > local verification rejects distribution bytes changed after fetch"
        check_refs:
          - check-selective-distribution-invalid-source
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > standalone public CLI executes the local fetch plan and approved apply boundary"
        check_refs:
          - check-selective-distribution-receipt
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch rejects invalid redirect and transport responses without publishing consumer assets"
        check_refs:
          - check-selective-distribution-invalid-source
  - verification_id: verification.ci-selective-distribution.publication
    case_id: selective-distribution-publication
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: "contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes"
        check_refs:
          - check-selective-distribution-publication
          - check-selective-distribution-publication-failure
      - path: tests/workflow-contracts.test.mjs
        symbol: "contract.ci-selective-distribution.publication > repository-selective-distribution-release > repository release publishes and reads back the exact selective distribution asset set before aliases"
        check_refs:
          - check-selective-distribution-publication
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > canonical next-patch hotfix can publish before main integration and rejects stale branch or base"
        check_refs:
          - check-selective-distribution-publication
          - check-selective-distribution-publication-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > release tags reject development VERSION even when integrated into main"
        check_refs:
          - check-selective-distribution-publication-failure
  - verification_id: verification.ci-selective-distribution.publication
    case_id: selective-distribution-single-release-binding
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > one Release connects an untagged implementation on release/0.2.11"
        check_refs: [check-selective-distribution-single-release-success, check-selective-distribution-implementation-binding, check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > one Release connects an untagged implementation on hotfix/0.2.11"
        check_refs: [check-selective-distribution-single-release-success, check-selective-distribution-implementation-binding, check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > candidate updates reject missing and unrelated implementation commits and preserve approval inputs"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > candidate application rejects closure changes and symlink destinations without writing references"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution input VERSION"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution input runtime/payload.mjs"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution input actions/ci-quality-adapter/action.yml"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution input actions/ci-quality-adapter/dist/index.js"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution input actions/ci-quality-adapter/scripts/composite.sh"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects changed execution file modes"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects stale workflow and installer bindings and invalid interfaces"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release cannot validate an unexecutable fixed bundle or bypass execution checks"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared main entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared pre entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared post entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared composite entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared composite-bare entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared composite-quoted entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: "contract.ci-selective-distribution.publication > single Release rejects an absent declared composite-unresolved entrypoint"
        check_refs: [check-selective-distribution-single-release-rejection]
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: "contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes"
        check_refs: [check-selective-distribution-single-release-success, check-selective-distribution-single-release-rejection]
      - path: tests/workflow-contracts.test.mjs
        symbol: "contract.ci-selective-distribution.publication > repository-selective-distribution-release > repository release publishes and reads back the exact selective distribution asset set before aliases"
        check_refs: [check-selective-distribution-single-release-success, check-selective-distribution-implementation-binding]
  - verification_id: verification.ci-selective-distribution.publication
    case_id: selective-distribution-release-integration
    tests:
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > published hotfix squash integration permits the next patch and preserves immutable tags and newer aliases"
        check_refs:
          - check-selective-distribution-release-integration
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > ordinary release accepts only the current main tip tree and refuses historical squash trees"
        check_refs:
          - check-selective-distribution-release-integration
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > squash integrated base rejects a same-version main with different content"
        check_refs:
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > squash integrated base rejects a same-version main with different mode"
        check_refs:
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > tree-equivalent main does not authorize an unrelated next hotfix source"
        check_refs:
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > integration evidence acquisition failure stops publication at main"
        check_refs:
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > integration evidence acquisition failure stops publication at tree"
        check_refs:
          - check-selective-distribution-release-integration-failure
      - path: runtime/repository/tests/update-release-aliases.test.mjs
        symbol: "repository-release-alias-update > integration evidence acquisition failure stops publication at ancestry"
        check_refs:
          - check-selective-distribution-release-integration-failure
  - verification_id: verification.ci-selective-distribution.application
    case_id: selective-distribution-application
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > provider-pin-companion > planned provider pin companions are owned and restored with generated callers"
        check_refs: [check-selective-distribution-plan, check-selective-distribution-transaction, check-selective-distribution-conflict, check-selective-distribution-changed-input, check-selective-distribution-rollback]
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > provider-pin-companion > Release and Package generated companions support lock and preflight without fixture pin injection"
        check_refs: [check-selective-distribution-plan, check-selective-distribution-transaction]
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > provider-pin-companion > missing prior distributions are classified without treating old schemas as current"
        check_refs: [check-selective-distribution-conflict]
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > provider-pin-companion > explicit create migration restores retired assets and the prior lock after a post-apply failure"
        check_refs: [check-selective-distribution-plan, check-selective-distribution-transaction, check-selective-distribution-rollback]
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > workflow-template-generation > normal generation and application need no Hosted evidence and preserve ownership checks"
        check_refs:
          - check-selective-distribution-plan
          - check-selective-distribution-transaction
          - check-selective-distribution-conflict
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > workflow-template-generation > workflow generation safely resolves values and preserves only declared caller settings"
        check_refs:
          - check-selective-distribution-plan
          - check-selective-distribution-conflict
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > fetch, plan, apply and rollback preserve explicit consumer state transitions"
        check_refs:
          - check-selective-distribution-plan
          - check-selective-distribution-transaction
          - check-selective-distribution-rollback
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution-application > approved plans reuse identical workflows update owned bytes and reject unmanaged changes"
        check_refs:
          - check-selective-distribution-plan
          - check-selective-distribution-transaction
          - check-selective-distribution-rollback
          - check-selective-distribution-conflict
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution-application > plan rejects malformed prior ownership locks before changing consumer state"
        check_refs:
          - check-selective-distribution-conflict
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > plan rejects unmanaged destination drift and apply rejects changed plan inputs"
        check_refs:
          - check-selective-distribution-conflict
          - check-selective-distribution-changed-input
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > direct workflow asset fetch cannot bypass preset closure during apply planning"
        check_refs:
          - check-selective-distribution-incomplete-application
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > apply rechecks destination ancestry immediately before writing"
        check_refs:
          - check-selective-distribution-changed-input
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > partial apply failure restores files changed earlier in the transaction"
        check_refs:
          - check-selective-distribution-rollback
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > application rejects invalid ownership approval and concurrent mutation locks"
        check_refs:
          - check-selective-distribution-conflict
          - check-selective-distribution-changed-input
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > rollback validates every backup identity before changing consumer files"
        check_refs:
          - check-selective-distribution-rollback
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > rollback refuses to overwrite consumer changes made after apply"
        check_refs:
          - check-selective-distribution-changed-input
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: "contract.ci-selective-distribution.application > selective-distribution > standalone public CLI executes the local fetch plan and approved apply boundary"
        check_refs:
          - check-selective-distribution-plan
          - check-selective-distribution-transaction
