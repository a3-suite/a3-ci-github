version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-selective-distribution.selection
    case_id: detailed-failure-selection
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.selection > selective-distribution > selection rejection retains the rejected request and missing dependency as failure details
        guarantees:
          - diagnostic-failure-stage-selection
  - contract_id: contract.ci-selective-distribution.selection
    case_id: selective-distribution-selection-selective-distribution-selection-valid
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.selection > selective-distribution > preset selection closes dependencies while direct asset selection reports missing dependencies
        guarantees:
          - selective-distribution-closure-exposed
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.selection > selective-distribution > preset closure includes only its reusable workflow sources and excludes optional materializer
        guarantees:
          - selective-distribution-closure-exposed
  - contract_id: contract.ci-selective-distribution.selection
    case_id: selective-distribution-selection-selective-distribution-selection-incomplete
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.selection > selective-distribution > preset selection closes dependencies while direct asset selection reports missing dependencies
        guarantees:
          - selective-distribution-missing-dependency-rejected
          - selective-distribution-incomplete-selection-preserves-tree
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.selection > selective-distribution > preset closure includes only its reusable workflow sources and excludes optional materializer
        guarantees:
          - selective-distribution-missing-dependency-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: detailed-failure-delivery
    tests:
      - path: tests/runtime-failure-diagnostics.test.mjs
        symbol: runtime failure diagnostics > distribution delivery rejection preserves state and diagnostic context
        guarantees:
          - diagnostic-failure-stage-delivery
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: fetch-cleanup-failure-diagnostic
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > fetch retains validation failure and cached files when lock and staging cleanup fail
        guarantees:
          - diagnostic-failure-stage-delivery
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: selective-distribution-delivery-selective-distribution-source-valid
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > each selected callee resolves from fetched sources and missing sources remain rejected
        guarantees:
          - selective-distribution-assets-exposed
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > selected distribution runs preflight and lock without materializer and supports its later acquisition
        guarantees:
          - selective-distribution-assets-exposed
          - selective-distribution-unselected-files-not-delivered
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.application > selective-distribution > standalone public CLI executes the local fetch plan and approved apply boundary
        guarantees:
          - selective-distribution-receipt-exposed
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: detailed-failure-delivery-unbound-option
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.application > selective-distribution > standalone public CLI executes the local fetch plan and approved apply boundary
        guarantees:
          - diagnostic-failure-stage-delivery
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: selective-distribution-delivery-selective-distribution-source-invalid
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > explicit source root remains validated when a verified distribution already exists
        guarantees:
          - selective-distribution-invalid-source-rejected
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > fetch rejects source bytes that do not match the release manifest
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-cached-file-tampered
    tests:
      - &id001
        path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch rejects invalid cached state and concurrent fetch locks before transport
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-fetch-locked
    tests:
      - *id001
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch preserves prior state and releases its lock after an extension fails
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-lock-cleanup-fails
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > fetch removes staging even when closing or removing its owned lock fails
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-manifest-malformed
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > manifest validation rejects malformed authority identity files and dependency references
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-manifest-url-untrusted
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > remote manifest loading confines the Release URL and release tag mapping
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-state-path-symlink
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > fetch rejects a project-local state path redirected through a symlink
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.delivery
    case_id: source-invalid-download-redirect-untrusted
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution-delivery > remote fetch rejects invalid redirect and transport responses without publishing consumer assets
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.verification
    case_id: source-invalid-verified-file-tampered
    tests:
      - path: runtime/distribution/tests/selective-distribution.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > local verification rejects distribution bytes changed after fetch
        guarantees:
          - selective-distribution-invalid-source-rejected
  - contract_id: contract.ci-selective-distribution.verification
    case_id: detailed-failure-verification-unbound-option
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.application > selective-distribution > standalone public CLI executes the local fetch plan and approved apply boundary
        guarantees:
          - diagnostic-failure-stage-verification
  - contract_id: contract.ci-selective-distribution.release-generation
    case_id: release-generation-valid
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > release generator derives deterministic selective assets and checksums from registries
        guarantees:
          - distribution-release-source-revision-exposed
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > release generator binds every published byte to the exact source commit
        guarantees:
          - distribution-release-source-revision-exposed
  - contract_id: contract.ci-selective-distribution.release-generation
    case_id: release-generation-invalid-source-revision
    tests:
      - path: runtime/distribution/tests/selective-distribution.process.test.mjs
        symbol: contract.ci-selective-distribution.delivery > selective-distribution > release generator rejects invalid version source and output boundaries
        guarantees:
          - distribution-release-generation-rejected
  - contract_id: contract.ci-selective-distribution.release-generation
    case_id: detailed-failure-release-generation
    pending:
      - guarantees:
          - diagnostic-failure-stage-release-generation
        reason: release generator の拒否で失敗段階の診断を確かめるテストが無い。既存の拒否のテストは終了状態と標準エラーの理由だけを確かめ、診断 sink の故障のテストは出力が空であることを確かめる。
  - contract_id: contract.ci-selective-distribution.publication
    case_id: detailed-failure-publication
    tests:
      - path: tests/runtime-failure-diagnostics.test.mjs
        symbol: runtime failure diagnostics > distribution-publication rejects invalid invocation with retained shell failure context
        guarantees:
          - diagnostic-failure-stage-publication
  - contract_id: contract.ci-selective-distribution.publication
    case_id: publication-failure-diagnostic-provider-failure
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes
        guarantees:
          - diagnostic-failure-stage-publication
  - contract_id: contract.ci-selective-distribution.publication
    case_id: selective-distribution-publication-selective-distribution-publication-valid
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes
        guarantees:
          - selective-distribution-publication-exposed
  - contract_id: contract.ci-selective-distribution.publication
    case_id: publication-invalid-provider-observation-fails
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes
        guarantees:
          - selective-distribution-publication-failure-exposed
  - contract_id: contract.ci-selective-distribution.release-readback
    case_id: readback-valid
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes
        guarantees:
          - selective-distribution-readback-exposed
  - contract_id: contract.ci-selective-distribution.release-readback
    case_id: readback-invalid-asset-bytes-mismatch
    tests:
      - path: runtime/repository/tests/manage-distribution-release.test.mjs
        symbol: contract.ci-selective-distribution.publication > repository-selective-distribution-release > distribution Release publication is idempotent and readback rejects changed remote bytes
        guarantees:
          - selective-distribution-readback-failure-exposed
  - contract_id: contract.ci-selective-distribution.release-readback
    case_id: detailed-failure-readback
    pending:
      - guarantees:
          - diagnostic-failure-stage-readback
        reason: readback の拒否で失敗段階の診断を確かめるテストが無い。既存のテストは拒否の終了状態と標準エラーの文言だけを確かめる。
  - contract_id: contract.ci-selective-distribution.reference-update
    case_id: reference-update-invalid-implementation-unreachable
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > candidate updates reject missing and unrelated implementation commits and preserve approval inputs
        guarantees:
          - selective-distribution-reference-update-rejected
  - contract_id: contract.ci-selective-distribution.reference-update
    case_id: reference-update-invalid-execution-assets-dirty
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > candidate application rejects closure changes and symlink destinations without writing references
        guarantees:
          - selective-distribution-reference-update-rejected
  - contract_id: contract.ci-selective-distribution.reference-update
    case_id: detailed-failure-reference-update
    pending:
      - guarantees:
          - diagnostic-failure-stage-reference-update
        reason: 参照の更新の拒否で失敗段階の診断を確かめるテストが無い。既存のテストは拒否の理由の文言だけを確かめる。
  - contract_id: contract.ci-selective-distribution.provider-reference-check
    case_id: provider-reference-check-valid-release-tag
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on release/0.2.11
        guarantees:
          - selective-distribution-implementation-binding-verified
          - selective-distribution-implementation-binding-evidence-exposed
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on hotfix/0.2.11
        guarantees:
          - selective-distribution-implementation-binding-verified
          - selective-distribution-implementation-binding-evidence-exposed
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release verifies a squashed main tag by execution closure while the implementation stays reachable
        guarantees:
          - selective-distribution-implementation-binding-verified
          - selective-distribution-implementation-binding-evidence-exposed
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > single Release accepts changed provider maintenance runtime runtime/preset/payload.mjs
        guarantees:
          - selective-distribution-implementation-binding-verified
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > single Release accepts changed provider maintenance runtime runtime/distribution/payload.mjs
        guarantees:
          - selective-distribution-implementation-binding-verified
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > single Release accepts changed provider maintenance runtime runtime/repository/payload.mjs
        guarantees:
          - selective-distribution-implementation-binding-verified
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > single Release accepts changed provider maintenance runtime runtime/vitest/payload.mjs
        guarantees:
          - selective-distribution-implementation-binding-verified
  - contract_id: contract.ci-selective-distribution.provider-reference-check
    case_id: provider-reference-check-valid-candidate
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on release/0.2.11
        guarantees:
          - selective-distribution-implementation-binding-verified
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on hotfix/0.2.11
        guarantees:
          - selective-distribution-implementation-binding-verified
    pending:
      - guarantees:
          - selective-distribution-implementation-binding-evidence-exposed
        reason: 候補の検査（--staged --candidate）の出力の implementationBinding を確かめるテストが無い。one Release connects の2テストは、候補の検査では implementationBindingStatus だけを確かめ、証拠は公開 tag の検査の出力で確かめる。
  - contract_id: contract.ci-selective-distribution.provider-reference-check
    case_id: provider-reference-check-invalid-execution-input-changed
    tests:
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on release/0.2.11
        guarantees:
          - selective-distribution-provider-reference-check-rejected
      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > one Release connects an untagged implementation on hotfix/0.2.11
