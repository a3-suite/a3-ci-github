      - path: runtime/repository/tests/single-release-binding.test.mjs
        symbol: contract.ci-selective-distribution.publication > single Release rejects a changed execution file mode of runtime/payload.mjs
        guarantees:
          - selective-distribution-provider-reference-check-rejected
