version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-selective-distribution.selection
    id: detailed-failure-selection
    partition: runtime-context.failure-diagnostic-required
    input:
      assets:
        - runtime.preset
  - contract_id: contract.ci-selective-distribution.selection
    id: selective-distribution-selection-selective-distribution-selection-valid
    partition: runtime-context.selective-distribution-selection-valid
    input:
      operation: describe
      presets:
        - quality-gate
      assets: []
  - contract_id: contract.ci-selective-distribution.selection
    id: selective-distribution-selection-selective-distribution-selection-incomplete
    partition: runtime-context.selective-distribution-selection-incomplete
    input:
      operation: describe
      presets: []
      assets:
        - workflow.quality-gate
  - contract_id: contract.ci-selective-distribution.delivery
    id: detailed-failure-delivery
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: fetch
      required-arguments: missing
  - contract_id: contract.ci-selective-distribution.delivery
    id: selective-distribution-delivery-selective-distribution-source-valid
    partition: runtime-context.selective-distribution-source-valid
    input:
      operation: fetch
      presets:
        - quality-gate
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - contract_id: contract.ci-selective-distribution.delivery
    id: selective-distribution-delivery-selective-distribution-source-invalid
    partition: runtime-context.selective-distribution-source-invalid
    input:
      operation: fetch
      presets:
        - quality-gate
      file-sha256: mismatch
  - contract_id: contract.ci-selective-distribution.publication
    id: detailed-failure-publication
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-publication-selective-distribution-publication-valid
    partition: runtime-context.selective-distribution-publication-valid
    input:
      operation: publish
      tag: v1.2.3
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      implementation-revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      integration: ancestor-of-main
      dispatch-ref: refs/tags/v1.2.3
    verifies:
      - selective-distribution-publication-exposed
      - selective-distribution-dispatch-ref-bound
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-dispatch-ref-selective-distribution-publication-invalid
    partition: runtime-context.selective-distribution-publication-invalid
    input:
      operation: publish
      tag: v1.2.3
      dispatch-ref: refs/heads/main
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-publication-selective-distribution-publication-invalid
    partition: runtime-context.selective-distribution-publication-invalid
    input:
      operation: publish
      tag: v1.2.3
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      readback: asset-bytes-mismatch
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-release-integration-selective-distribution-publication-valid
    partition: runtime-context.selective-distribution-publication-valid
    input:
      operation: publish
      tag: v1.2.3
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      main-tip-tree: same-as-approved-source-tree
      integration: published-hotfix-squash
    verifies:
      - selective-distribution-alias-source-integrated
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-release-integration-selective-distribution-publication-invalid
    partition: runtime-context.selective-distribution-publication-invalid
    input:
      operation: publish
      tag: v1.2.3
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      main-tip-tree: different-from-approved-source-tree
      integration: historical-squash-only
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-single-release-binding-selective-distribution-publication-valid
    partition: runtime-context.selective-distribution-publication-valid
    input:
      operation: publish
      branch: release/0.2.11
      tag: v0.2.11
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      implementation-revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      implementation-release: absent
      connection-candidate: approved-unchanged
    verifies:
      - selective-distribution-publication-exposed
      - selective-distribution-implementation-binding-verified
      - selective-distribution-implementation-binding-evidence-exposed
  - contract_id: contract.ci-selective-distribution.publication
    id: selective-distribution-single-release-binding-selective-distribution-publication-invalid
    partition: runtime-context.selective-distribution-publication-invalid
    input:
      operation: publish
      branch: release/0.2.11
      tag: v0.2.11
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      implementation-revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      execution-input-change: actions/ci-quality-adapter/dist/index.js-after-approval
  - contract_id: contract.ci-selective-distribution.plan
    id: selective-distribution-application-selective-distribution-application-incomplete
    partition: runtime-context.selective-distribution-application-incomplete
    input:
      operation: plan
      presets: []
      assets:
        - workflow.quality-gate
  - contract_id: contract.ci-selective-distribution.plan
    id: selective-distribution-application-selective-distribution-application-valid-plan
    partition: runtime-context.selective-distribution-plan-input-valid
    input:
      operation: plan
      presets:
        - quality-gate
      assets: []
  - contract_id: contract.ci-selective-distribution.plan
    id: detailed-failure-plan
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: plan
      repo-root: consumer
      required-arguments: missing
  - contract_id: contract.ci-selective-distribution.plan
    id: plan-independent-destination
    partition: runtime-context.distribution-independent-destination-stable
    input:
      operation: plan
      destination: .github/workflows/quality-gate.yml
      ownership: unmanaged
      independent-state: stable-through-invocation-completion
  - contract_id: contract.ci-selective-distribution.application
    id: selective-distribution-application-selective-distribution-application-valid
    partition: runtime-context.selective-distribution-application-valid
    input:
      operation: apply
      plan: unchanged
      approval: matching-plan-digest
  - contract_id: contract.ci-selective-distribution.application
    id: selective-distribution-application-selective-distribution-application-conflict
    partition: runtime-context.selective-distribution-application-conflict
    input:
      operation: apply
      destination: .github/workflows/quality-gate.yml
      ownership: unmanaged-conflict
  - contract_id: contract.ci-selective-distribution.application
    id: selective-distribution-application-selective-distribution-plan-changed
    partition: runtime-context.selective-distribution-plan-changed
    input:
      operation: apply
      plan: previously-approved
      destination-change: consumer-edit-after-planning
  - contract_id: contract.ci-selective-distribution.application
    id: partial-apply-restoration
    partition: runtime-context.distribution-partial-apply-restorable
    input:
      operation: apply
      destination-change: later-destination-after-an-earlier-write
      independent-state: stable-through-invocation-completion
      rollback-io: available
  - contract_id: contract.ci-selective-distribution.application
    id: partial-apply-protected-destination
    partition: runtime-context.distribution-independent-destination-stable
    input:
      operation: apply
      destination-change: later-destination-after-an-earlier-write
      independent-state: stable-through-invocation-completion
  - contract_id: contract.ci-selective-distribution.application
    id: detailed-failure-application
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: apply
      repo-root: consumer
      required-arguments: missing
  - contract_id: contract.ci-selective-distribution.application
    id: apply-recovery-diagnostic-1
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: apply
      transaction-state: completed
      secondary-io: owned-lock-cleanup-fails
  - contract_id: contract.ci-selective-distribution.rollback
    id: explicit-rollback-restoration
    partition: runtime-context.distribution-rollback-restorable
    input:
      operation: rollback
      transaction: valid-unchanged-restorable
  - contract_id: contract.ci-selective-distribution.rollback
    id: rollback-protected-destination
    partition: runtime-context.distribution-independent-destination-stable
    input:
      operation: rollback
      destination-change: consumer-edit-after-apply
      independent-state: stable-through-invocation-completion
  - contract_id: contract.ci-selective-distribution.rollback
    id: detailed-failure-rollback
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: rollback
      repo-root: consumer
      required-arguments: missing
  - contract_id: contract.ci-selective-distribution.rollback
    id: rollback-recovery-diagnostic-1
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: rollback
      transaction-state: restoration-rejected
      secondary-io: owned-lock-cleanup-fails
  - contract_id: contract.ci-selective-distribution.rollback
    id: rollback-recovery-diagnostic-2
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: rollback
      transaction-state: completed
      secondary-io: owned-lock-cleanup-fails
  - contract_id: contract.ci-selective-distribution.rollback
    id: rollback-recovery-diagnostic-3
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: rollback
      transaction-state: restoration-rejected
      secondary-io: recovery-state-recording-fails
