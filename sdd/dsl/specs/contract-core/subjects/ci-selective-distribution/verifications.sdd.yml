version: 1
name: contract-verifications
subject_ref: subject.ci.selective-distribution
verifications:
  - id: verification.ci-selective-distribution.selection
    contract_id: contract.ci-selective-distribution.selection
    cases:
      - id: detailed-failure-selection
        intent_id: detailed-diagnostics-selection
        input: {scenario: rejected-failed-or-unresolved-public-invocation}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-selection}]
      - id: selective-distribution-selection
        intent_id: selective-distribution-selection-intent
        input:
          scenario: preset-and-direct-asset-selection
        checks:
          - id: check-selective-distribution-closure
            guarantee_ref: selective-distribution-closure-exposed
          - id: check-selective-distribution-missing-dependency
            guarantee_ref: selective-distribution-missing-dependency-rejected
  - id: verification.ci-selective-distribution.delivery
    contract_id: contract.ci-selective-distribution.delivery
    cases:
      - id: detailed-failure-delivery
        intent_id: detailed-diagnostics-delivery
        input: {scenario: rejected-failed-or-unresolved-public-invocation}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-delivery}]
      - id: selective-distribution-delivery
        intent_id: selective-distribution-delivery-intent
        input:
          scenario: valid-and-invalid-selected-source
        checks:
          - id: check-selective-distribution-receipt
            guarantee_ref: selective-distribution-receipt-exposed
          - id: check-selective-distribution-assets
            guarantee_ref: selective-distribution-assets-exposed
          - id: check-selective-distribution-invalid-source
            guarantee_ref: selective-distribution-invalid-source-rejected
  - id: verification.ci-selective-distribution.publication
    contract_id: contract.ci-selective-distribution.publication
    cases:
      - id: detailed-failure-publication
        intent_id: detailed-diagnostics-publication
        input: {scenario: rejected-failed-or-unresolved-public-invocation}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-publication}]
      - id: selective-distribution-publication
        intent_id: selective-distribution-publication-intent
        input:
          scenario: exact-release-assets-and-readback
        checks:
          - id: check-selective-distribution-publication
            guarantee_ref: selective-distribution-publication-exposed
          - id: check-selective-distribution-publication-failure
            guarantee_ref: selective-distribution-publication-failure-exposed
      - id: selective-distribution-release-integration
        intent_id: selective-distribution-publication-intent
        input:
          scenario: ancestry-and-current-main-tree-identity-with-rejected-invalid-and-unavailable-evidence
        checks:
          - id: check-selective-distribution-release-integration
            guarantee_ref: selective-distribution-publication-exposed
          - id: check-selective-distribution-release-integration-failure
            guarantee_ref: selective-distribution-publication-failure-exposed
      - id: selective-distribution-single-release-binding
        intent_id: selective-distribution-publication-intent
        input:
          scenario: implementation-commit-and-connection-commit-with-one-final-release
          valid_variants:
            - ordinary-release-with-verified-implementation-ancestor
            - hotfix-with-verified-implementation-ancestor
          rejected_variants:
            - missing-or-unrelated-implementation-commit
            - implementation-and-final-source-version-mismatch
            - missing-declared-action-entrypoint
            - changed-action-metadata-bundle-composite-script-or-runtime-payload
            - stale-workflow-or-installer-binding
            - fixed-reference-contract-failure
          publication_count: 1
          prior_implementation_release_required: false
        checks:
          - id: check-selective-distribution-single-release-success
            guarantee_ref: selective-distribution-publication-exposed
          - id: check-selective-distribution-implementation-binding
            guarantee_ref: selective-distribution-implementation-binding-verified
          - id: check-selective-distribution-single-release-rejection
            guarantee_ref: selective-distribution-publication-failure-exposed
  - id: verification.ci-selective-distribution.application
    contract_id: contract.ci-selective-distribution.application
    cases:
      - id: detailed-failure-application
        intent_id: detailed-diagnostics-application
        input: {scenario: rejected-failed-or-unresolved-public-invocation}
        checks: [{id: diagnostic-details, guarantee_ref: diagnostic-details-application}]
      - id: selective-distribution-application
        intent_id: selective-distribution-application-intent
        input:
          scenario: create-conflict-change-and-rollback
        checks:
          - id: check-selective-distribution-plan
            guarantee_ref: selective-distribution-plan-exposed
          - id: check-selective-distribution-transaction
            guarantee_ref: selective-distribution-transaction-exposed
          - id: check-selective-distribution-conflict
            guarantee_ref: selective-distribution-conflict-rejected
          - id: check-selective-distribution-incomplete-application
            guarantee_ref: selective-distribution-incomplete-application-rejected
          - id: check-selective-distribution-changed-input
            guarantee_ref: selective-distribution-changed-input-rejected
          - id: check-selective-distribution-rollback
            guarantee_ref: selective-distribution-rollback-exposed
