version: 1
name: contract-subject
subject:
  id: subject.ci.selective-distribution
  summary: Select, fetch, verify, plan, apply, and recover immutable CI distribution assets without overwriting unmanaged consumer state, and generate, publish, read back, and connect the distribution Release on the provider side.
contracts:
  - id: contract.ci-selective-distribution.selection
    summary: Preset and asset selection request for distribution selection.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: presets
        meaning: "Received by the contract target: preset identifiers selected by the request."
      - name: assets
        meaning: "Received by the contract target: asset identifiers selected by the request."
    observations:
      - summary: Selected asset closure or stable dependency diagnostic exposed by distribution selection.
        boundary: boundary.cli-result
        fields:
          - selector: selectedAssets
            meaning: Stable asset identities in the validated selection closure.
          - selector: diagnostic
            meaning: Stable rejection reason for an unknown or incomplete selection.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Consumer file tree compared before and after a selection request.
        boundary: boundary.project-ci-assets
        fields:
          - selector: consumer-tree-comparison
            meaning: Comparison of consumer file paths and bytes before and after the invocation, excluding the fetch lock and staging entries owned by the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-selection-valid
      - environment: runtime-context.selective-distribution-selection-incomplete
    guarantees:
      - id: selective-distribution-closure-exposed
        applies_to:
          - runtime-context.selective-distribution-selection-valid
        claim:
          field: selectedAssets
          present: true
      - id: selective-distribution-missing-dependency-rejected
        applies_to:
          - runtime-context.selective-distribution-selection-incomplete
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-selection
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: selective-distribution-incomplete-selection-preserves-tree
        applies_to:
          - runtime-context.selective-distribution-selection-incomplete
        claim:
          field: consumer-tree-comparison
          in:
            - equal
  - id: contract.ci-selective-distribution.delivery
    summary: Distribution fetch request for selected presets and assets.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: presets
        meaning: "Received by the contract target: preset identifiers selected by the request."
      - name: file-sha256
        meaning: "Precondition prepared by the case: digest of a delivered file compared with the manifest."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
      - name: cached-distribution
        meaning: "Precondition prepared by the case: state of the distribution files cached by an earlier fetch."
      - name: fetch-lock
        meaning: "Precondition prepared by the case: state of the fetch lock of the cached distribution."
      - name: secondary-io
        meaning: "Precondition prepared by the case: outcome of secondary file operations such as lock cleanup."
      - name: manifest
        meaning: "Received by the contract target: distribution manifest document."
      - name: manifest-url
        meaning: "Received by the contract target: URL of the distribution manifest."
      - name: state-path
        meaning: "Precondition prepared by the case: kind of the project-local state path."
      - name: download-response
        meaning: "Precondition prepared by the case: response returned by the transport for a requested file."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Revision-bound local distribution receipt or fetch diagnostic.
        boundary: boundary.cli-result
        fields:
          - selector: sourceRevision
            meaning: Full immutable source commit SHA.
          - selector: selectedAssets
            meaning: Asset identities whose selected files passed integrity validation.
          - selector: diagnostic
            meaning: Stable rejection reason for invalid manifest, source, redirect, size, or digest, or for a fetch lock that cannot be held or released.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Files of the local distribution of the requested revision.
        boundary: boundary.workspace-files
        fields:
          - selector: unselected-file-count
            meaning: Number of files in the local distribution of the requested revision, other than its manifest and receipt, that belong to no asset of the closure of the selections fetched for the revision.
      - summary: Consumer file tree without the entries owned by a fetch request, compared before and after it.
        boundary: boundary.project-ci-assets
        fields:
          - selector: consumer-tree-comparison
            meaning: Comparison of consumer file paths and bytes before and after the invocation; equal or changed.
      - summary: Download requests sent by a fetch request.
        boundary: boundary.download-requests
        fields:
          - selector: download-request-origins
            meaning: Comparison of the origin of every download request sent by the invocation with the trusted origin declared by the manifest; trusted or untrusted.
      - summary: Files outside the project root that a project path of a fetch request resolves to.
        boundary: boundary.outside-project-files
        fields:
          - selector: outside-project-files-comparison
            meaning: Comparison of the paths and bytes of the files in the outside directory before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-source-valid
      - environment: runtime-context.selective-distribution-source-invalid
      - environment: runtime-context.selective-distribution-fetch-lock-failed
      - environment: runtime-context.distribution-path-escapes-project-root
    guarantees:
      - id: selective-distribution-receipt-exposed
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: sourceRevision
          present: true
      - id: selective-distribution-assets-exposed
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: selectedAssets
          present: true
      - id: selective-distribution-invalid-source-rejected
        applies_to:
          - runtime-context.selective-distribution-source-invalid
          - runtime-context.selective-distribution-fetch-lock-failed
          - runtime-context.distribution-path-escapes-project-root
        claim:
          field: diagnostic
          present: true
      - id: rejected-fetch-preserves-consumer-tree
        applies_to:
          - runtime-context.selective-distribution-source-invalid
          - runtime-context.selective-distribution-fetch-lock-failed
        claim:
          field: consumer-tree-comparison
          in:
            - equal
      - id: download-requests-to-trusted-origin
        applies_to:
          - runtime-context.selective-distribution-source-valid
          - runtime-context.selective-distribution-source-invalid
        claim:
          field: download-request-origins
          in:
            - trusted
      - id: outside-project-files-preserved
        applies_to:
          - runtime-context.distribution-path-escapes-project-root
        claim:
          field: outside-project-files-comparison
          in:
            - equal
      - id: diagnostic-failure-stage-delivery
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: selective-distribution-unselected-files-not-delivered
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: unselected-file-count
          in:
            - "0"
  - id: contract.ci-selective-distribution.verification
    summary: Local distribution verification request for files fetched earlier.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: cached-distribution
        meaning: "Precondition prepared by the case: state of the distribution files cached by an earlier fetch."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Verification result or rejection diagnostic of the local distribution.
        boundary: boundary.cli-result
        fields:
          - selector: verification-status
            meaning: Verification status that the invocation reports for the local distribution; verified.
          - selector: diagnostic
            meaning: Stable rejection reason for a local distribution file whose size or SHA-256 differs from its manifest.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Consumer file tree compared before and after a verification request.
        boundary: boundary.project-ci-assets
        fields:
          - selector: consumer-tree-comparison
            meaning: Comparison of consumer file paths and bytes before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-source-valid
      - environment: runtime-context.selective-distribution-source-invalid
    guarantees:
      - id: selective-distribution-fetched-distribution-verified
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: verification-status
          in:
            - verified
      - id: selective-distribution-invalid-source-rejected
        applies_to:
          - runtime-context.selective-distribution-source-invalid
        claim:
          field: diagnostic
          present: true
      - id: rejected-verification-preserves-consumer-tree
        applies_to:
          - runtime-context.selective-distribution-source-invalid
        claim:
          field: consumer-tree-comparison
          in:
            - equal
      - id: diagnostic-failure-stage-verification
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.release-generation
    summary: Distribution release generation request for a committed repository source.
    inputs:
      - name: source-revision
        meaning: "Received by the contract target: source revision identifier."
      - name: release-tag
        meaning: "Received by the contract target: release tag name."
      - name: output-destination
        meaning: "Precondition prepared by the case: state of the directory that the generated release is written to."
      - name: source-path
        meaning: "Precondition prepared by the case: kind of a path in the committed repository source."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
    observations:
      - summary: Generated distribution manifest or generation diagnostic.
        boundary: boundary.script-result
        fields:
          - selector: sourceRevision
            meaning: Full immutable source commit SHA recorded in the generated distribution manifest.
          - selector: diagnostic
            meaning: Stable rejection reason for an invalid source revision, release tag, version, source head, source path, or output destination.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Output destination of a release generation request.
        boundary: boundary.workspace-files
        fields:
          - selector: generated-output-comparison
            meaning: Comparison of the paths, bytes and existence of the output destination tree before and after the invocation; equal or changed.
          - selector: manifest-file-digest-comparison
            meaning: Comparison of each file SHA-256 in the generated manifest with the SHA-256 of that file in the source commit; matched or mismatched.
          - selector: manifest-file-size-comparison
            meaning: Comparison of the size recorded for each file in the generated manifest with the size of the file at the same path in the source commit; matched or mismatched.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-release-generation-valid
      - environment: runtime-context.selective-distribution-release-generation-invalid
    guarantees:
      - id: distribution-release-source-revision-exposed
        applies_to:
          - runtime-context.selective-distribution-release-generation-valid
        claim:
          field: sourceRevision
          present: true
      - id: distribution-release-generation-rejected
        applies_to:
          - runtime-context.selective-distribution-release-generation-invalid
        claim:
          field: diagnostic
          present: true
      - id: rejected-generation-preserves-output-destination
        applies_to:
          - runtime-context.selective-distribution-release-generation-invalid
        claim:
          field: generated-output-comparison
          in:
            - equal
      - id: distribution-release-manifest-digests-bound-to-source
        applies_to:
          - runtime-context.selective-distribution-release-generation-valid
        claim:
          field: manifest-file-digest-comparison
          in:
            - matched
      - id: distribution-release-manifest-sizes-bound-to-source
        applies_to:
          - runtime-context.selective-distribution-release-generation-valid
        claim:
          field: manifest-file-size-comparison
          in:
            - matched
      - id: diagnostic-failure-stage-release-generation
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.publication
    summary: Exact-tag distribution Release publish request.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: provider-response
        meaning: "Precondition prepared by the case: response returned by the release provider for an observation, upload, readback, or finalize request."
      - name: approved-notes
        meaning: "Received by the contract target: owner-approved Release notes."
      - name: prepared-assets
        meaning: "Precondition prepared by the case: state of the prepared distribution assets."
      - name: remote-tag-object
        meaning: "Precondition prepared by the case: tag object that the remote reports for the release tag."
      - name: existing-release
        meaning: "Precondition prepared by the case: state of the Release that already exists for the tag."
    observations:
      - summary: Hosted workflow script result for exact-tag GitHub Release publication and byte readback.
        boundary: boundary.script-result
        fields:
          - selector: releaseTag
            meaning: Exact validated SemVer tag that owns the published assets.
          - selector: assetNames
            meaning: Manifest, standalone fetch CLI, checksum, and same-source Agent Skills ZIP and its checksum asset names without bundled implementation files.
          - selector: readbackStatus
            meaning: Readback status that the publisher reports for the remote Release assets.
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected publication.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Release requests sent to the provider by a publish request and the Release state that the provider holds.
        boundary: boundary.release-provider-requests
        fields:
          - selector: release-create-request-count
            meaning: Number of Release creation requests sent to the provider by the invocation.
          - selector: upload-request-count
            meaning: Number of asset upload requests sent to the provider by the invocation.
          - selector: release-body-comparison
            meaning: Comparison of the body of the existing Release held by the provider before and after the invocation; equal or changed.
          - selector: release-publication-state
            meaning: Publication state of the Release of the tag held by the provider after the invocation; draft or published.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-publication-valid
      - environment: runtime-context.selective-distribution-publication-invalid
      - environment: runtime-context.selective-distribution-publication-rejected-before-create
      - environment: runtime-context.selective-distribution-publication-rejected-existing-release-notes-mismatch
      - environment: runtime-context.selective-distribution-publication-failed-before-finalize
      - environment: runtime-context.selective-distribution-publication-already-published
    guarantees:
      - id: selective-distribution-publication-exposed
        applies_to:
          - runtime-context.selective-distribution-publication-valid
          - runtime-context.selective-distribution-publication-already-published
        claim:
          field: readbackStatus
          present: true
      - id: selective-distribution-publication-failure-exposed
        applies_to:
          - runtime-context.selective-distribution-publication-invalid
          - runtime-context.selective-distribution-publication-rejected-before-create
          - runtime-context.selective-distribution-publication-rejected-existing-release-notes-mismatch
          - runtime-context.selective-distribution-publication-failed-before-finalize
        claim:
          field: diagnostic
          present: true
      - id: release-not-created
        applies_to:
          - runtime-context.selective-distribution-publication-rejected-before-create
          - runtime-context.selective-distribution-publication-rejected-existing-release-notes-mismatch
        claim:
          field: release-create-request-count
          in:
            - "0"
      - id: rejected-publication-preserves-release-body
        applies_to:
          - runtime-context.selective-distribution-publication-rejected-existing-release-notes-mismatch
        claim:
          field: release-body-comparison
          in:
            - equal
      - id: failed-publication-not-published
        applies_to:
          - runtime-context.selective-distribution-publication-failed-before-finalize
        claim:
          field: release-publication-state
          in:
            - draft
      - id: selective-distribution-release-published
        applies_to:
          - runtime-context.selective-distribution-publication-valid
          - runtime-context.selective-distribution-publication-already-published
        claim:
          field: release-publication-state
          in:
            - published
      - id: republication-uploads-nothing
        applies_to:
          - runtime-context.selective-distribution-publication-already-published
        claim:
          field: upload-request-count
          in:
            - "0"
      - id: diagnostic-failure-stage-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.release-readback
    summary: Readback request for a published distribution Release.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: readback
        meaning: "Precondition prepared by the case: content returned by the Release readback."
    observations:
      - summary: Hosted workflow script result for the readback of a published distribution Release.
        boundary: boundary.script-result
        fields:
          - selector: readbackStatus
            meaning: Readback status that the readback reports for the remote Release assets.
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected readback.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-readback-valid
      - environment: runtime-context.selective-distribution-readback-invalid
    guarantees:
      - id: selective-distribution-readback-exposed
        applies_to:
          - runtime-context.selective-distribution-readback-valid
        claim:
          field: readbackStatus
          present: true
      - id: selective-distribution-readback-failure-exposed
        applies_to:
          - runtime-context.selective-distribution-readback-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-readback
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.reference-update
    summary: Implementation reference update request for a release tag and implementation commit.
    inputs:
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: implementation-revision
        meaning: "Received by the contract target: implementation revision bound by the registry."
      - name: connection-candidate
        meaning: "Precondition prepared by the case: state of the approved connection candidate."
    observations:
      - summary: Implementation reference update script result.
        boundary: boundary.script-result
        fields:
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected reference update.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Registry file that holds the implementation references.
        boundary: boundary.workspace-files
        fields:
          - selector: registry-comparison
            meaning: Comparison of the bytes of the registry file before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-reference-update-invalid
    guarantees:
      - id: selective-distribution-reference-update-rejected
        applies_to:
          - runtime-context.selective-distribution-reference-update-invalid
        claim:
          field: diagnostic
          present: true
      - id: rejected-reference-update-preserves-registry
        applies_to:
          - runtime-context.selective-distribution-reference-update-invalid
        claim:
          field: registry-comparison
          in:
            - equal
      - id: diagnostic-failure-stage-reference-update
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.provider-reference-check
    summary: Provider reference check request for a connection candidate or a release tag.
    inputs:
      - name: check-target
        meaning: "Received by the contract target: whether the invocation checks a staged connection candidate or a release tag."
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: branch
        meaning: "Precondition prepared by the case: release branch on which the connection is prepared."
      - name: implementation-revision
        meaning: "Received by the contract target: implementation revision bound by the registry."
      - name: implementation-release
        meaning: "Precondition prepared by the case: presence of the implementation Release."
      - name: connection-candidate
        meaning: "Precondition prepared by the case: state of the approved connection candidate."
      - name: execution-input-change
        meaning: "Precondition prepared by the case: execution input changed after approval."
      - name: release-tag-state
        meaning: "Precondition prepared by the case: state of a local tag named after the release tag."
    observations:
      - summary: Provider reference check result.
        boundary: boundary.script-result
        fields:
          - selector: implementationBindingStatus
            meaning: Binding status of the first-party implementation to the final tagged source reported by the publication check; verified, unverified or rejected.
          - selector: implementationBindingEvidence
            meaning: Evidence record of the implementation binding check.
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected provider reference check.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-provider-reference-check-valid
      - environment: runtime-context.selective-distribution-provider-reference-check-invalid
    guarantees:
      - id: selective-distribution-implementation-binding-verified
        applies_to:
          - runtime-context.selective-distribution-provider-reference-check-valid
        claim:
          field: implementationBindingStatus
          in:
            - verified
      - id: selective-distribution-implementation-binding-evidence-exposed
        applies_to:
          - runtime-context.selective-distribution-provider-reference-check-valid
        claim:
          field: implementationBindingEvidence
          present: true
      - id: selective-distribution-provider-reference-check-rejected
        applies_to:
          - runtime-context.selective-distribution-provider-reference-check-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-provider-reference-check
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.release-dispatch
    summary: Release workflow dispatch for a requested release tag.
    inputs:
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: dispatch-ref
        meaning: "Received by the contract target: ref that dispatched the publication."
    observations:
      - summary: Result of the dispatch guard of the release workflow.
        boundary: boundary.script-result
        fields:
          - selector: accepted-dispatch-ref-comparison
            meaning: Comparison of the workflow ref of the release dispatch accepted for publication with refs/tags/ followed by the requested release tag.
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected dispatch.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-release-dispatch-valid
      - environment: runtime-context.selective-distribution-release-dispatch-invalid
    guarantees:
      - id: selective-distribution-dispatch-ref-bound
        applies_to:
          - runtime-context.selective-distribution-release-dispatch-valid
        claim:
          field: accepted-dispatch-ref-comparison
          in:
            - equal
      - id: selective-distribution-dispatch-rejected
        applies_to:
          - runtime-context.selective-distribution-release-dispatch-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-release-dispatch
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.plan
    summary: Distribution application planning request.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: presets
        meaning: "Received by the contract target: preset identifiers selected by the request."
      - name: assets
        meaning: "Received by the contract target: asset identifiers selected by the request."
      - name: repo-root
        meaning: "Received by the contract target: consumer repository root passed to the CLI."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
      - name: settings
        meaning: "Received by the contract target: workflow template settings passed with --set."
      - name: destination
        meaning: "Precondition prepared by the case: state of the consumer destination path."
      - name: ownership
        meaning: "Precondition prepared by the case: ownership recorded for the consumer destination."
      - name: independent-state
        meaning: "Precondition prepared by the case: consumer state that stays unchanged during the invocation."
      - name: prior-distribution
        meaning: "Precondition prepared by the case: state of the distribution applied earlier."
      - name: caller-settings
        meaning: "Received by the contract target: caller settings of the generated workflow."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Plan result or rejection diagnostic returned by the distribution CLI.
        boundary: boundary.cli-result
        fields:
          - selector: planDigest
            meaning: Digest of the approved distribution plan.
          - selector: actions
            meaning: Create, reuse, update, or conflict classification for canonical workflow destinations.
          - selector: stale
            meaning: Previously managed paths that the current selection excludes.
          - selector: absent-destination-actions
            meaning: Actions that the plan reports for canonical workflow destinations absent before planning, one per destination.
          - selector: owned-current-destination-actions
            meaning: Actions that the plan reports for destinations whose bytes equal the generated bytes under recorded ownership, one per destination.
          - selector: owned-outdated-destination-actions
            meaning: Actions that the plan reports for destinations whose bytes equal the recorded bytes and differ from the generated bytes, one per destination.
          - selector: conflicting-destination-actions
            meaning: Actions that the plan reports for existing destinations without recorded ownership or matching neither generated nor recorded bytes.
          - selector: diagnostic
            meaning: Diagnostic exposed for rejected planning input.
      - summary: Canonical and project-owned CI assets materialized into a consumer project.
        boundary: boundary.project-ci-assets
        fields:
          - selector: independent-destination-binding
            meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
          - selector: consumer-tree-comparison
            meaning: Comparison of consumer file paths and bytes before and after the invocation; equal or changed.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-application-incomplete
      - environment: runtime-context.selective-distribution-plan-input-valid
      - environment: runtime-context.selective-distribution-plan-input-invalid
      - environment: runtime-context.distribution-independent-destination-stable
    guarantees:
      - id: selective-distribution-plan-exposed
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: planDigest
          present: true
      - id: selective-distribution-plan-request-rejected
        applies_to:
          - runtime-context.selective-distribution-application-incomplete
          - runtime-context.selective-distribution-plan-input-invalid
        claim:
          field: diagnostic
          present: true
      - id: rejected-plan-preserves-consumer-tree
        applies_to:
          - runtime-context.selective-distribution-application-incomplete
          - runtime-context.selective-distribution-plan-input-invalid
        claim:
          field: consumer-tree-comparison
          in:
            - equal
      - id: plan-creates-absent-destinations
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: absent-destination-actions
          all:
            in:
              - create
      - id: plan-reuses-owned-current-destinations
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: owned-current-destination-actions
          all:
            in:
              - reuse
      - id: plan-updates-owned-outdated-destinations
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: owned-outdated-destination-actions
          all:
            in:
              - update
      - id: plan-reports-conflicting-destinations
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: conflicting-destination-actions
          all:
            in:
              - conflict
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
  - id: contract.ci-selective-distribution.application
    summary: Approved distribution plan application request.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: plan
        meaning: "Precondition prepared by the case: state of the approved plan file."
      - name: approval
        meaning: "Received by the contract target: approval digest passed for the plan."
      - name: destination
        meaning: "Precondition prepared by the case: state of the consumer destination path."
      - name: ownership
        meaning: "Precondition prepared by the case: ownership recorded for the consumer destination."
      - name: destination-change
        meaning: "Precondition prepared by the case: change made to a consumer destination outside the invocation."
      - name: independent-state
        meaning: "Precondition prepared by the case: consumer state that stays unchanged during the invocation."
      - name: rollback-io
        meaning: "Precondition prepared by the case: availability of rollback file operations."
      - name: repo-root
        meaning: "Received by the contract target: consumer repository root passed to the CLI."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
      - name: transaction-state
        meaning: "Precondition prepared by the case: state of the recorded application transaction."
      - name: secondary-io
        meaning: "Precondition prepared by the case: outcome of secondary file operations such as lock cleanup."
      - name: mutation-lock
        meaning: "Precondition prepared by the case: state of the lock that serializes mutations of the consumer."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Approved application transaction, rollback result, or stable rejection diagnostic.
        boundary: boundary.cli-result
        fields:
          - selector: transactionId
            meaning: Identity of the exclusive application transaction and its before state.
          - selector: diagnostic
            meaning: Stable rejection reason of the refused application.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Atomic boundary comparisons used by this contract.
        boundary: boundary.project-ci-assets
        fields:
          - selector: partial-apply-files-binding
            meaning: Equality of paths written earlier by the interrupted apply with their recorded before-state bytes and existence; the later independently changed destination is excluded.
          - selector: applied-destination-binding
            meaning: Equality of the final bytes of each destination of the approved plan with the generated content of its plan action after the apply; reuse actions compare the existing bytes.
          - selector: unplanned-consumer-files-comparison
            meaning: Comparison of bytes and existence of consumer files that are neither a destination of the approved plan nor under the distribution state directory, before and after the apply; equal or changed.
          - selector: independent-destination-binding
            meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
          - selector: consumer-tree-comparison
            meaning: Comparison of consumer file paths and bytes before and after the invocation; equal or changed.
      - summary: Files outside the project root that a project path of an apply request resolves to.
        boundary: boundary.outside-project-files
        fields:
          - selector: outside-project-files-comparison
            meaning: Comparison of the paths and bytes of the files in the outside directory before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-application-valid
      - environment: runtime-context.selective-distribution-application-conflict
      - environment: runtime-context.selective-distribution-plan-changed
      - environment: runtime-context.distribution-partial-apply-restorable
      - environment: runtime-context.distribution-independent-destination-stable
      - environment: runtime-context.distribution-path-escapes-project-root
    guarantees:
      - id: selective-distribution-transaction-exposed
        applies_to:
          - runtime-context.selective-distribution-application-valid
        claim:
          field: transactionId
          present: true
      - id: selective-distribution-conflict-rejected
        applies_to:
          - runtime-context.selective-distribution-application-conflict
          - runtime-context.selective-distribution-plan-changed
          - runtime-context.distribution-path-escapes-project-root
        claim:
          field: diagnostic
          present: true
      - id: rejected-application-preserves-consumer-tree
        applies_to:
          - runtime-context.selective-distribution-application-conflict
        claim:
          field: consumer-tree-comparison
          in:
            - equal
      - id: outside-project-files-preserved
        applies_to:
          - runtime-context.distribution-path-escapes-project-root
        claim:
          field: outside-project-files-comparison
          in:
            - equal
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: partial-apply-files-restored
        applies_to:
          - runtime-context.distribution-partial-apply-restorable
        claim:
          field: partial-apply-files-binding
          in:
            - matched
      - id: approved-plan-content-applied
        applies_to:
          - runtime-context.selective-distribution-application-valid
        claim:
          field: applied-destination-binding
          in:
            - matched
      - id: unplanned-consumer-files-preserved
        applies_to:
          - runtime-context.selective-distribution-application-valid
        claim:
          field: unplanned-consumer-files-comparison
          in:
            - equal
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
  - id: contract.ci-selective-distribution.rollback
    summary: Rollback request for a recorded consumer application transaction.
    inputs:
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: transaction
        meaning: "Precondition prepared by the case: state of the recorded transaction to restore."
      - name: destination-change
        meaning: "Precondition prepared by the case: change made to a consumer destination outside the invocation."
      - name: independent-state
        meaning: "Precondition prepared by the case: consumer state that stays unchanged during the invocation."
      - name: repo-root
        meaning: "Received by the contract target: consumer repository root passed to the CLI."
      - name: required-arguments
        meaning: "Received by the contract target: presence of the arguments required by the operation."
      - name: transaction-state
        meaning: "Precondition prepared by the case: state of the recorded application transaction."
      - name: secondary-io
        meaning: "Precondition prepared by the case: outcome of secondary file operations such as lock cleanup."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Approved application transaction, rollback result, or stable rejection diagnostic.
        boundary: boundary.cli-result
        fields:
          - selector: rollbackStatus
            meaning: Explicit evidence that transaction changes were restored.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Atomic boundary comparisons used by this contract.
        boundary: boundary.project-ci-assets
        fields:
          - selector: rollback-files-binding
            meaning: Equality of transaction-owned paths with their recorded before-state bytes and existence after explicit rollback; independently changed paths are not part of this comparison.
          - selector: non-transaction-files-comparison
            meaning: Comparison of bytes and existence of consumer files that are not destinations of the recorded transaction and not part of its transaction record, before and after the rollback; equal or changed.
          - selector: independent-destination-binding
            meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
      - summary: Files outside the project root that a project path of a rollback request resolves to.
        boundary: boundary.outside-project-files
        fields:
          - selector: outside-project-files-comparison
            meaning: Comparison of the paths and bytes of the files in the outside directory before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.distribution-rollback-restorable
      - environment: runtime-context.distribution-independent-destination-stable
      - environment: runtime-context.distribution-path-escapes-project-root
    guarantees:
      - id: selective-distribution-rollback-exposed
        applies_to:
          - runtime-context.distribution-rollback-restorable
        claim:
          field: rollbackStatus
          in:
            - restored
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: rollback-files-restored
        applies_to:
          - runtime-context.distribution-rollback-restorable
        claim:
          field: rollback-files-binding
          in:
            - matched
      - id: non-transaction-files-preserved
        applies_to:
          - runtime-context.distribution-rollback-restorable
        claim:
          field: non-transaction-files-comparison
          in:
            - equal
      - id: outside-project-files-preserved
        applies_to:
          - runtime-context.distribution-path-escapes-project-root
        claim:
          field: outside-project-files-comparison
          in:
            - equal
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
