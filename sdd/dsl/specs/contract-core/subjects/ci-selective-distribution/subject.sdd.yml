version: 1
name: contract-subject
subject:
  id: subject.ci.selective-distribution
  summary: Select, fetch, plan, apply, and recover immutable CI distribution assets without overwriting unmanaged consumer state.
contracts:
  - id: contract.ci-selective-distribution.selection
    summary: Preset selection resolves its registered dependency closure while direct asset selection exposes missing dependencies.
    observations:
      - summary: Selected asset closure or stable dependency diagnostic exposed by distribution selection.
        boundary:
          ref: boundary.cli-result
        value:
          root: distribution.selection
          kind: object
          fields:
            - selector: selectedAssets
              meaning: Stable asset identities in the validated selection closure.
            - selector: diagnostic
              meaning: Stable rejection reason for an unknown or incomplete selection.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-selection-valid
      - environment: runtime-context.selective-distribution-selection-incomplete
    guarantees:
      - id: selective-distribution-closure-exposed
        applies_to:
          - runtime-context.selective-distribution-selection-valid
        claim:
          field: selectedAssets
          present: true
      - id: selective-distribution-missing-dependency-rejected
        applies_to:
          - runtime-context.selective-distribution-selection-incomplete
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-selection
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.delivery
    summary: Selected files are published locally only after immutable source identity and file integrity validation.
    observations:
      - summary: Revision-bound local distribution receipt or fetch diagnostic.
        boundary:
          ref: boundary.cli-result
        value:
          root: distribution.fetch
          kind: object
          fields:
            - selector: sourceRevision
              meaning: Full immutable source commit SHA.
            - selector: selectedAssets
              meaning: Asset identities whose selected files passed integrity validation.
            - selector: diagnostic
              meaning: Stable rejection reason for invalid manifest, source, redirect, size, or digest.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-source-valid
      - environment: runtime-context.selective-distribution-source-invalid
    guarantees:
      - id: selective-distribution-receipt-exposed
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: sourceRevision
          present: true
      - id: selective-distribution-assets-exposed
        applies_to:
          - runtime-context.selective-distribution-source-valid
        claim:
          field: selectedAssets
          present: true
      - id: selective-distribution-invalid-source-rejected
        applies_to:
          - runtime-context.selective-distribution-source-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-delivery
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.publication
    summary: Exact-tag distribution Release publication request.
    observations:
      - summary: Hosted workflow script result for exact-tag GitHub Release publication and byte readback.
        boundary:
          ref: boundary.script-result
        value:
          root: distribution.publication
          kind: object
          fields:
            - selector: releaseTag
              meaning: Exact validated SemVer tag that owns the published assets.
            - selector: assetNames
              meaning: Manifest, standalone fetch CLI, checksum, and same-source Agent Skills ZIP and its checksum asset names without bundled implementation files.
            - selector: readbackStatus
              meaning: Evidence that every remote Release asset is byte-identical to the prepared handoff.
            - selector: implementationSourceRevision
              meaning: Full first-party implementation SHA verified against the final tagged source.
            - selector: acceptedDispatchRef
              meaning: Workflow ref of the release dispatch accepted for publication; absent when the dispatch is rejected before publication.
            - selector: implementationBindingStatus
              meaning: Binding status of the first-party implementation to the final tagged source reported by the publication check; verified means the check confirmed implementation reachability from a branch or tag, VERSION, execution closure identity and fixed-reference connections, otherwise unverified.
            - selector: implementationBindingEvidence
              meaning: Evidence record of the implementation binding check.
            - selector: aliasSourceIntegration
              meaning: Main integration state of the release tag source checked before alias update; integrated, canonical-hotfix-tip or not-integrated.
            - selector: diagnostic
              meaning: Stable failure evidence of the rejected publication.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-publication-valid
      - environment: runtime-context.selective-distribution-publication-invalid
    guarantees:
      - id: selective-distribution-publication-exposed
        applies_to:
          - runtime-context.selective-distribution-publication-valid
        claim:
          field: readbackStatus
          present: true
      - id: selective-distribution-publication-failure-exposed
        applies_to:
          - runtime-context.selective-distribution-publication-invalid
        claim:
          field: diagnostic
          present: true
      - id: selective-distribution-implementation-binding-verified
        applies_to:
          - runtime-context.selective-distribution-publication-valid
        claim:
          field: implementationBindingStatus
          in:
            - verified
      - id: selective-distribution-dispatch-ref-bound
        applies_to:
          - runtime-context.selective-distribution-publication-valid
        claim:
          field: acceptedDispatchRef
          in:
            - tag-ref-of-requested-release-tag
      - id: selective-distribution-implementation-binding-evidence-exposed
        applies_to:
          - runtime-context.selective-distribution-publication-valid
        claim:
          field: implementationBindingEvidence
          present: true
      - id: selective-distribution-alias-source-integrated
        applies_to:
          - runtime-context.selective-distribution-publication-valid
        claim:
          field: aliasSourceIntegration
          in:
            - integrated
            - canonical-hotfix-tip
      - id: diagnostic-failure-stage-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-selective-distribution.plan
    summary: Distribution application planning request.
    observations:
      - summary: Canonical and project-owned CI assets materialized into a consumer project.
        boundary:
          ref: boundary.project-ci-assets
        value:
          root: distribution
          kind: object
          fields:
            - selector: planDigest
              meaning: Digest of the approved distribution plan.
            - selector: actions
              meaning: Create, reuse, update, or conflict classification for canonical workflow destinations.
            - selector: stale
              meaning: Previously managed paths excluded from the current selection without automatic deletion.
            - selector: diagnostic
              meaning: Diagnostic exposed for rejected planning input.
            - selector: independent-destination-binding
              meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-application-incomplete
      - environment: runtime-context.selective-distribution-plan-input-valid
      - environment: runtime-context.distribution-independent-destination-stable
    guarantees:
      - id: selective-distribution-plan-exposed
        applies_to:
          - runtime-context.selective-distribution-plan-input-valid
        claim:
          field: planDigest
          present: true
      - id: selective-distribution-incomplete-application-rejected
        applies_to:
          - runtime-context.selective-distribution-application-incomplete
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
  - id: contract.ci-selective-distribution.application
    summary: Approved distribution plan application request.
    observations:
      - summary: Approved application transaction, rollback result, or stable rejection diagnostic.
        boundary:
          ref: boundary.cli-result
        value:
          root: distribution.apply
          kind: object
          fields:
            - selector: transactionId
              meaning: Identity of the exclusive application transaction and its before state.
            - selector: diagnostic
              meaning: Stable rejection reason of the refused application.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
      - summary: Atomic boundary comparisons used by this contract.
        boundary:
          ref: boundary.project-ci-assets
        value:
          root: distribution.restoration
          kind: object
          fields:
            - selector: partial-apply-files-binding
              meaning: Equality of paths written earlier by the interrupted apply with their recorded before-state bytes and existence; the later independently changed destination is excluded.
            - selector: independent-destination-binding
              meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.selective-distribution-application-valid
      - environment: runtime-context.selective-distribution-application-conflict
      - environment: runtime-context.selective-distribution-plan-changed
      - environment: runtime-context.distribution-partial-apply-restorable
      - environment: runtime-context.distribution-independent-destination-stable
    guarantees:
      - id: selective-distribution-transaction-exposed
        applies_to:
          - runtime-context.selective-distribution-application-valid
        claim:
          field: transactionId
          present: true
      - id: selective-distribution-conflict-rejected
        applies_to:
          - runtime-context.selective-distribution-application-conflict
          - runtime-context.selective-distribution-plan-changed
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: partial-apply-files-restored
        applies_to:
          - runtime-context.distribution-partial-apply-restorable
        claim:
          field: partial-apply-files-binding
          in:
            - matched
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
  - id: contract.ci-selective-distribution.rollback
    summary: Restore a recorded transaction under verified restoration preconditions while retaining independent consumer changes.
    observations:
      - summary: Approved application transaction, rollback result, or stable rejection diagnostic.
        boundary:
          ref: boundary.cli-result
        value:
          root: distribution.apply
          kind: object
          fields:
            - selector: rollbackStatus
              meaning: Explicit evidence that transaction changes were restored.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        value:
          root: failure-evidence
          kind: object
          fields:
            - selector: failure-stage
              meaning: 失敗した段階の識別子。
      - summary: Atomic boundary comparisons used by this contract.
        boundary:
          ref: boundary.project-ci-assets
        value:
          root: distribution.restoration
          kind: object
          fields:
            - selector: rollback-files-binding
              meaning: Equality of transaction-owned paths with their recorded before-state bytes and existence after explicit rollback; independently changed paths are not part of this comparison.
            - selector: independent-destination-binding
              meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.distribution-rollback-restorable
      - environment: runtime-context.distribution-independent-destination-stable
    guarantees:
      - id: selective-distribution-rollback-exposed
        applies_to:
          - runtime-context.distribution-rollback-restorable
        claim:
          field: rollbackStatus
          in:
            - restored
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: rollback-files-restored
        applies_to:
          - runtime-context.distribution-rollback-restorable
        claim:
          field: rollback-files-binding
          in:
            - matched
      - id: independent-destination-binding
        applies_to:
          - runtime-context.distribution-independent-destination-stable
        claim:
          field: independent-destination-binding
          in:
            - matched
