version: 1
name: contract-clauses
subject_ref: subject.ci.selective-distribution
contracts:
  - id: contract.ci-selective-distribution.selection
    summary: Preset selection resolves its registered dependency closure while direct asset selection exposes missing dependencies.
    conditions:
      - id: diagnostic-required-selection
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-selection-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-selection-valid
          op: available
      - id: selective-distribution-selection-incomplete
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-selection-incomplete
          op: available
    guarantees:
      - id: selective-distribution-closure-exposed
        when: selective-distribution-selection-valid
        observation_ref: observation.ci-selective-distribution.selection-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: selectedAssets
      - id: selective-distribution-missing-dependency-rejected
        when: selective-distribution-selection-incomplete
        observation_ref: observation.ci-selective-distribution.selection-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-selection
        when: diagnostic-required-selection
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-selection
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-selection]
      - id: selective-distribution-selection-intent
        goal: A preset exposes its complete registered closure and a direct incomplete asset request is rejected.
        guarantee_refs:
          - selective-distribution-closure-exposed
          - selective-distribution-missing-dependency-rejected
  - id: contract.ci-selective-distribution.delivery
    summary: Selected files are published locally only after immutable source identity and file integrity validation.
    conditions:
      - id: diagnostic-required-delivery
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-source-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-valid
          op: available
      - id: selective-distribution-source-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-invalid
          op: available
    guarantees:
      - id: selective-distribution-receipt-exposed
        when: selective-distribution-source-valid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: sourceRevision
      - id: selective-distribution-assets-exposed
        when: selective-distribution-source-valid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: selectedAssets
      - id: selective-distribution-invalid-source-rejected
        when: selective-distribution-source-invalid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-delivery
        when: diagnostic-required-delivery
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-delivery
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-delivery]
      - id: selective-distribution-delivery-intent
        goal: Valid selected files produce a revision-bound receipt and invalid source bytes do not become a usable local distribution. Missing prior manifests produce the classified distribution-local-manifest-missing diagnostic; unsupported manifest schemas are rejected without conversion or fallback.
        guarantee_refs:
          - selective-distribution-receipt-exposed
          - selective-distribution-assets-exposed
          - selective-distribution-invalid-source-rejected
  - id: contract.ci-selective-distribution.publication
    summary: One exact-tag Release makes its implementation and fixed workflow and installer connections available together after provider checks and byte-identical draft asset readback with approved notes.
    conditions:
      - id: diagnostic-required-publication
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-publication-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-valid
          op: available
      - id: selective-distribution-publication-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-invalid
          op: available
    guarantees:
      - id: selective-distribution-publication-exposed
        when: selective-distribution-publication-valid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: readbackStatus
      - id: selective-distribution-publication-failure-exposed
        when: selective-distribution-publication-invalid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-implementation-binding-verified
        when: selective-distribution-publication-valid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: implementationBindingStatus
            right:
              kind: value_set
              values:
                - verified
      - id: diagnostic-details-publication
        when: diagnostic-required-publication
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-publication
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-publication]
      - id: selective-distribution-publication-intent
        goal: >-
          The manifest binds reusable workflow references to the published source SHA and external Action references to verified provider pins. Provider CI verifies template generation, fixed references and caller/callee contracts before publication. Consumer existence and successful Hosted invocation of every reusable workflow are not publication prerequisites. Consumer environment acceptance follows installation and is reported separately.
          Each ordinary release and hotfix uses one immutable exact tag and one GitHub Release to deliver its implementation and connections. A separate implementation Release or connection-only follow-up Release is not a prerequisite. Preparation may use multiple commits; one publication does not require a single commit or equality of the implementation and final source SHA.
          Every first-party Action binding resolves an existing full implementation SHA that is an ancestor of, or equal to, the final tagged source. The implementation SHA and final source declare the same release VERSION. All referenced Actions, their metadata, entrypoints, bundled payloads, Composite scripts and transitively required provider runtime assets are present at that SHA and byte-and-mode identical in the final source. Canonical workflows, provider callees and installer provider revisions use that verified binding; caller generation binds callees to the final source SHA. The registry release tag identifies the enclosing Release, not necessarily the implementation SHA itself.
          Before the final tag exists, candidate validation verifies the implementation against the selected candidate commit or staged tree without requiring a prior Release. Publication revalidates the finalized tag, its source and implementation ancestry, execution closure identity, registry and workflow connections, required I/O and actual fixed-reference behavior. A missing Git object, unrelated implementation, changed execution closure, stale binding or failed contract prevents publication. Arbitrary known SHAs and successful tests of another checkout cannot replace that evidence. Moving branches, tag execution references and future self-SHA placeholders are not substitutes for full SHA bindings.
          These first-party rules do not relax third-party Action pin approval or upstream tag-to-SHA identity checks. Manifest file digests, asset readback, immutable exact tags and publication failure handling remain unchanged.
          A validated exact tag publishes only the three bootstrap assets from a draft with unchanged approved notes after byte-identical readback; prepublication failure leaves the draft unpublished, and any publication or verification failure blocks alias updates.
          Integration into main is evidenced by target ancestry of the fetched main commit snapshot or exact Git tree object identity with that main tip; the target and main commit SHA, both tree IDs, and the accepted evidence method are exposed. Failed reference, tree, or ancestry acquisition stops validation. Tree equality does not substitute for integration approval, releaseability of the integrated main tip, Hosted validation, or Release identity.
          For this repository's fixed-SHA preparation, main integration evaluates the final connected state. Implementation preparation commits need not be independently publishable when integrated together with their validated connection commit; an unconnected implementation commit is never integrated alone. This allowance covers only fixed-SHA preparation, not unrelated unverified changes. The actual integration candidate preserves the referenced implementation commit as an ancestor, matches the validated final source tree and execution closure, and passes the applicable checks. Merge commits or fast-forward integration retain this ancestry; squash or rebase must not remove it or invalidate a fixed binding. Record the preintegration main SHA, incoming commit set and validated candidate, and reevaluate if main advances. Verify ancestry, tree identity and Hosted CI on the resulting main tip; publication readback or tree equality alone does not establish integration completion. Published exact tags and assets remain immutable during history repair.
          Ordinary sources must satisfy this integration proof. A canonical next-patch hotfix tip may precede main integration only when it descends from the annotated base of the current stable main version and that base satisfies the same integration proof; annotated tags, exact source and canonical tip identity, and VERSION alignment remain required.
          Tree equality compares only the fetched main tip; it does not search historical main trees to authorize replay of old releases. Validation-only execution does not mutate aliases; alias updates never regress a newer release or move immutable exact tags.
        guarantee_refs:
          - selective-distribution-publication-exposed
          - selective-distribution-publication-failure-exposed
          - selective-distribution-implementation-binding-verified
  - id: contract.ci-selective-distribution.application
    summary: Configured canonical callers and required registry-projected pin companions are generated under a reviewed unchanged plan within the authorized scope and restored after failure or rollback.
    conditions:
      - id: diagnostic-required-application
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-application-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-valid
          op: available
      - id: selective-distribution-application-conflict
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-conflict
          op: available
      - id: selective-distribution-application-incomplete
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-incomplete
          op: available
      - id: selective-distribution-plan-changed
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-plan-changed
          op: available
    guarantees:
      - id: selective-distribution-plan-exposed
        when: selective-distribution-application-valid
        observation_ref: observation.ci-selective-distribution.plan-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: planDigest
      - id: selective-distribution-transaction-exposed
        when: selective-distribution-application-valid
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: transactionId
      - id: selective-distribution-conflict-rejected
        when: selective-distribution-application-conflict
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-incomplete-application-rejected
        when: selective-distribution-application-incomplete
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-changed-input-rejected
        when: selective-distribution-plan-changed
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-rollback-exposed
        when: selective-distribution-application-valid
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: rollbackStatus
      - id: diagnostic-details-application
        when: diagnostic-required-application
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-application
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-application]
      - id: selective-distribution-application-intent
        goal: >-
          Plans bind product settings, manifest-resolved fixed callee references, source digests and generated bytes. Required pin companions are the complete projection of registry provider Action entries and declared companion fields, share caller ownership classifications and diff review, and participate in the same transaction and rollback. YAML scalar generation rejects missing or unknown settings and leaves no placeholders. Schema 2 updates preserve declared settings from the installed caller and reject structural drift; earlier manifest schemas require explicit create migration with consumer-owned inventory, backup and restoration of the old lock and retired assets. The provider supplies templates and the generation script; consumers supply settings without implementing a renderer or copying provider runtime into Git. Missing Hosted acceptance evidence does not block generation, application or asset lock creation. Generated configuration does not prove successful execution in the consumer environment. Reviewed unchanged plans within the authorized scope apply atomically and expose a rollbackable transaction while conflicts and changed inputs stop. Asset lock generation after apply is outside this transaction. The supplied plan digest binds review to application and is not human approval evidence. Authorized standard setup and updates require no additional user approval of the digest; unapproved scope expansion, custom implementation replacement or destructive changes require prior confirmation of the concrete diff.
        guarantee_refs:
          - selective-distribution-plan-exposed
          - selective-distribution-transaction-exposed
          - selective-distribution-conflict-rejected
          - selective-distribution-incomplete-application-rejected
          - selective-distribution-changed-input-rejected
          - selective-distribution-rollback-exposed
