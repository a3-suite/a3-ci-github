version: 1
name: contract-clauses
subject_ref: subject.ci.selective-distribution
contracts:
  - id: contract.ci-selective-distribution.selection
    summary: Preset selection resolves its registered dependency closure while direct asset selection exposes missing dependencies.
    conditions:
      - id: diagnostic-required-selection
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-selection-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-selection-valid
          op: available
      - id: selective-distribution-selection-incomplete
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-selection-incomplete
          op: available
    guarantees:
      - id: selective-distribution-closure-exposed
        when: selective-distribution-selection-valid
        observation_ref: observation.ci-selective-distribution.selection-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: selectedAssets
      - id: selective-distribution-missing-dependency-rejected
        when: selective-distribution-selection-incomplete
        observation_ref: observation.ci-selective-distribution.selection-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-selection
        when: diagnostic-required-selection
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
    verification_intents:
      - id: detailed-diagnostics-selection
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-selection ]
      - id: selective-distribution-selection-intent-selective-distribution-selection-valid
        goal: Verify the selective-distribution-selection-valid input partition.
        guarantee_refs:
          - selective-distribution-closure-exposed
      - id: selective-distribution-selection-intent-selective-distribution-selection-incomplete
        goal: Verify the selective-distribution-selection-incomplete input partition.
        guarantee_refs:
          - selective-distribution-missing-dependency-rejected
  - id: contract.ci-selective-distribution.delivery
    summary: Selected files are published locally only after immutable source identity and file integrity validation.
    conditions:
      - id: diagnostic-required-delivery
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-source-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-valid
          op: available
      - id: selective-distribution-source-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-invalid
          op: available
    guarantees:
      - id: selective-distribution-receipt-exposed
        when: selective-distribution-source-valid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: sourceRevision
      - id: selective-distribution-assets-exposed
        when: selective-distribution-source-valid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: selectedAssets
      - id: selective-distribution-invalid-source-rejected
        when: selective-distribution-source-invalid
        observation_ref: observation.ci-selective-distribution.fetch-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-delivery
        when: diagnostic-required-delivery
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
    verification_intents:
      - id: detailed-diagnostics-delivery
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-delivery ]
      - id: selective-distribution-delivery-intent-selective-distribution-source-valid
        goal: Verify the selective-distribution-source-valid input partition.
        guarantee_refs:
          - selective-distribution-receipt-exposed
          - selective-distribution-assets-exposed
      - id: selective-distribution-delivery-intent-selective-distribution-source-invalid
        goal: Verify the selective-distribution-source-invalid input partition.
        guarantee_refs:
          - selective-distribution-invalid-source-rejected
  - id: contract.ci-selective-distribution.publication
    summary: One exact-tag Release makes its implementation and fixed workflow and installer connections available together after provider checks and byte-identical draft asset readback with approved notes.
    conditions:
      - id: diagnostic-required-publication
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-publication-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-valid
          op: available
      - id: selective-distribution-publication-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-source-invalid
          op: available
    guarantees:
      - id: selective-distribution-publication-exposed
        when: selective-distribution-publication-valid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: readbackStatus
      - id: selective-distribution-publication-failure-exposed
        when: selective-distribution-publication-invalid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-implementation-binding-verified
        when: selective-distribution-publication-valid
        observation_ref: observation.ci-selective-distribution.publication-result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: implementationBindingStatus
            right:
              kind: value_set
              values:
                - verified
      - id: diagnostic-details-publication
        when: diagnostic-required-publication
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
    verification_intents:
      - id: detailed-diagnostics-publication
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-publication ]
      - id: selective-distribution-publication-intent-selective-distribution-publication-valid
        goal: Verify the selective-distribution-publication-valid input partition.
        guarantee_refs:
          - selective-distribution-publication-exposed
          - selective-distribution-implementation-binding-verified
      - id: selective-distribution-publication-intent-selective-distribution-publication-invalid
        goal: Verify the selective-distribution-publication-invalid input partition.
        guarantee_refs:
          - selective-distribution-publication-failure-exposed
  - id: contract.ci-selective-distribution.plan
    summary: Produce a reviewed workflow application plan from a complete verified distribution selection without applying its changes.
    conditions:
      - id: diagnostic-required-application
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-application-incomplete
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-incomplete
          op: available
      - id: planning-input-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-plan-input-valid
          op: available
      - id: independent-destination-stable
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.distribution-independent-destination-stable
          op: available
    guarantees:
      - id: selective-distribution-plan-exposed
        when: planning-input-valid
        observation_ref: observation.ci-selective-distribution.plan-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: planDigest
      - id: selective-distribution-incomplete-application-rejected
        when: selective-distribution-application-incomplete
        observation_ref: observation.ci-selective-distribution.plan-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-application
        when: diagnostic-required-application
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: details
      - id: independent-destination-binding
        when: independent-destination-stable
        observation_ref: observation.ci-selective-distribution.restoration
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: independent-destination-binding
            right:
              kind: value_set
              values:
                - matched
    verification_intents:
      - id: plan-planning-input-valid
        goal: Verify the planning-input-valid partition for plan.
        guarantee_refs:
          - selective-distribution-plan-exposed
      - id: plan-selective-distribution-application-incomplete
        goal: Verify the selective-distribution-application-incomplete partition for plan.
        guarantee_refs:
          - selective-distribution-incomplete-application-rejected
      - id: plan-diagnostic-required-application
        goal: Verify the diagnostic-required-application partition for plan.
        guarantee_refs:
          - diagnostic-details-application
      - id: plan-independent-destination
        goal: Verify preservation of an independently owned destination during planning.
        guarantee_refs:
          - independent-destination-binding
  - id: contract.ci-selective-distribution.application
    summary: Apply an approved unchanged plan and restore transaction-owned files after a partial failure while retaining independent consumer changes.
    conditions:
      - id: diagnostic-required-application
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: selective-distribution-application-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-valid
          op: available
      - id: selective-distribution-application-conflict
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-application-conflict
          op: available
      - id: selective-distribution-plan-changed
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.selective-distribution-plan-changed
          op: available
      - id: partial-apply-restorable
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.distribution-partial-apply-restorable
          op: available
      - id: independent-destination-stable
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.distribution-independent-destination-stable
          op: available
    guarantees:
      - id: selective-distribution-transaction-exposed
        when: selective-distribution-application-valid
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: transactionId
      - id: selective-distribution-conflict-rejected
        when: selective-distribution-application-conflict
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: selective-distribution-changed-input-rejected
        when: selective-distribution-plan-changed
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-application
        when: diagnostic-required-application
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: partial-apply-files-restored
        when: partial-apply-restorable
        observation_ref: observation.ci-selective-distribution.restoration
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: partial-apply-files-binding
            right:
              kind: value_set
              values:
                - matched
      - id: independent-destination-binding
        when: independent-destination-stable
        observation_ref: observation.ci-selective-distribution.restoration
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: independent-destination-binding
            right:
              kind: value_set
              values:
                - matched
    verification_intents:
      - id: apply-selective-distribution-application-valid
        goal: Verify the selective-distribution-application-valid partition for apply.
        guarantee_refs:
          - selective-distribution-transaction-exposed
      - id: apply-selective-distribution-application-conflict
        goal: Verify the selective-distribution-application-conflict partition for apply.
        guarantee_refs:
          - selective-distribution-conflict-rejected
      - id: apply-selective-distribution-plan-changed
        goal: Verify the selective-distribution-plan-changed partition for apply.
        guarantee_refs:
          - selective-distribution-changed-input-rejected
      - id: apply-diagnostic-required-application
        goal: Verify the diagnostic-required-application partition for apply.
        guarantee_refs:
          - diagnostic-details-application
      - id: apply-partial-apply-restorable
        goal: Verify the partial-apply-restorable partition for apply.
        guarantee_refs:
          - partial-apply-files-restored
      - id: apply-independent-destination-stable
        goal: Verify the independent-destination-stable partition for apply.
        guarantee_refs:
          - independent-destination-binding
  - id: contract.ci-selective-distribution.rollback
    summary: Restore a recorded transaction under verified restoration preconditions while retaining independent consumer changes.
    conditions:
      - id: diagnostic-required-application
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: rollback-restorable
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.distribution-rollback-restorable
          op: available
      - id: independent-destination-stable
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.distribution-independent-destination-stable
          op: available
    guarantees:
      - id: selective-distribution-rollback-exposed
        when: rollback-restorable
        observation_ref: observation.ci-selective-distribution.apply-result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: rollbackStatus
            right:
              kind: value_set
              values:
                - restored
      - id: diagnostic-details-application
        when: diagnostic-required-application
        observation_ref: observation.ci-selective-distribution.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: details
      - id: rollback-files-restored
        when: rollback-restorable
        observation_ref: observation.ci-selective-distribution.restoration
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: rollback-files-binding
            right:
              kind: value_set
              values:
                - matched
      - id: independent-destination-binding
        when: independent-destination-stable
        observation_ref: observation.ci-selective-distribution.restoration
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: independent-destination-binding
            right:
              kind: value_set
              values:
                - matched
    verification_intents:
      - id: rollback-rollback-restorable
        goal: Verify the rollback-restorable partition for rollback.
        guarantee_refs:
          - selective-distribution-rollback-exposed
          - rollback-files-restored
      - id: rollback-diagnostic-required-application
        goal: Verify the diagnostic-required-application partition for rollback.
        guarantee_refs:
          - diagnostic-details-application
      - id: rollback-independent-destination-stable
        goal: Verify the independent-destination-stable partition for rollback.
        guarantee_refs:
          - independent-destination-binding
