version: 1
name: contract-observations
subject_ref: subject.ci.selective-distribution
observations:
  - id: observation.ci-selective-distribution.selection-result
    summary: Selected asset closure or stable dependency diagnostic exposed by distribution selection.
    boundary:
      ref: boundary.cli-result
    value:
      root: distribution.selection
      kind: object
      fields:
        - selector: selectedAssets
          kind: observation_field
          meaning: Stable asset identities in the validated selection closure.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable rejection reason for an unknown or incomplete selection.
  - id: observation.ci-selective-distribution.fetch-result
    summary: Revision-bound local distribution receipt or fetch diagnostic.
    boundary:
      ref: boundary.cli-result
    value:
      root: distribution.fetch
      kind: object
      fields:
        - selector: sourceRevision
          kind: observation_field
          meaning: Full immutable source commit SHA.
        - selector: selectedAssets
          kind: observation_field
          meaning: Asset identities whose selected files passed integrity validation.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable rejection reason for invalid manifest, source, redirect, size, or digest.
  - id: observation.ci-selective-distribution.publication-result
    summary: Hosted workflow script result for exact-tag GitHub Release publication and byte readback.
    boundary:
      ref: boundary.script-result
    value:
      root: distribution.publication
      kind: object
      fields:
        - selector: releaseTag
          kind: observation_field
          meaning: Exact validated SemVer tag that owns the published assets.
        - selector: assetNames
          kind: observation_field
          meaning: Manifest, standalone fetch CLI, and checksum asset names without bundled implementation files.
        - selector: readbackStatus
          kind: observation_field
          meaning: Evidence that every remote Release asset is byte-identical to the prepared handoff.
        - selector: implementationSourceRevision
          kind: observation_field
          meaning: Full first-party implementation SHA verified against the final tagged source.
        - selector: implementationBindingStatus
          kind: observation_field
          meaning: Verified only after implementation ancestry, VERSION, execution closure identity and fixed-reference connections pass; evidence identifies both source SHAs and the checked paths and Git object identities.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable failure evidence for invalid source, duplicate or missing assets, or changed readback bytes.
  - id: observation.ci-selective-distribution.plan-result
    summary: Immutable application plan bound to selected source and current destination state.
    boundary:
      ref: boundary.project-ci-assets
    value:
      root: distribution.plan
      kind: object
      fields:
        - selector: planDigest
          kind: observation_field
          meaning: Digest binding manifest, selection, source, destinations, and observed destination identities.
        - selector: actions
          kind: observation_field
          meaning: Create, reuse, update, or conflict classification for canonical workflow destinations.
        - selector: stale
          kind: observation_field
          meaning: Previously managed paths excluded from the current selection without automatic deletion.
        - selector: diagnostic
          kind: observation_field
          meaning: Diagnostic exposed for rejected planning input.
  - id: observation.ci-selective-distribution.apply-result
    summary: Approved application transaction, rollback result, or stable rejection diagnostic.
    boundary:
      ref: boundary.cli-result
    value:
      root: distribution.apply
      kind: object
      fields:
        - selector: transactionId
          kind: observation_field
          meaning: Identity of the exclusive application transaction and its before state.
        - selector: rollbackStatus
          kind: observation_field
          meaning: Explicit evidence that transaction changes were restored.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable rejection reason for conflict, lock contention, changed input, or invalid plan digest.
  - id: observation.ci-selective-distribution.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "selection/fetch/verify/plan/apply/rollback/publicationのoperationと失敗段階の段階、preset/asset、固定revision、manifest schema、対象相対path、期待/観測size/digest、plan/transaction identity、lock競合と変更前後/復元状態、公開write結果の確定/不明を表す診断情報。"
  - id: observation.ci-selective-distribution.restoration
    summary: Atomic boundary comparisons used by this contract.
    boundary:
      ref: boundary.project-ci-assets
    value:
      root: distribution.restoration
      kind: object
      fields:
        - selector: rollback-files-binding
          kind: observation_field
          meaning: Equality of transaction-owned paths with their recorded before-state bytes and existence after explicit rollback; independently changed paths are not part of this comparison.
        - selector: partial-apply-files-binding
          kind: observation_field
          meaning: Equality of paths written earlier by the interrupted apply with their recorded before-state bytes and existence; the later independently changed destination is excluded.
        - selector: independent-destination-binding
          kind: observation_field
          meaning: Equality of final bytes and existence with the independently modified state immediately before recovery or rejection, for consumer destinations whose modified state differs from the current identity expected by the plan or recorded transaction.
