version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-assembly.outputs
    id: same-release-skills-assembly-valid
    partition: runtime-context.release-assembly-valid
    input:
      operation: assemble
      repository: owner/project
      public-skills:
        - child-tool
        - nested-tool
        - root-tool
        - sdd
      installer: false
    verifies:
      - handoff-output-bound
      - selected-skills-packaged
  - contract_id: contract.ci-release-assembly.outputs
    id: same-release-skills-assembly-invalid
    partition: runtime-context.release-assembly-invalid
    input:
      operation: assemble
      public-skills:
        - ci-github
      required-file: missing-SKILL.md
  - contract_id: contract.ci-release-assembly.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-release-assembly.outputs
    id: bundled-assembly
    partition: runtime-context.release-assembly-valid
    input:
      repository: owner/project
      authority-path: authority.json
      snapshot-path: snapshot.json
      build-root: build
      output-directory: handoff
    verifies:
      - assembly-success
      - handoff-output-bound
      - handoff-source-bound
      - handoff-asset-digest-bound
      - assembly-no-credential-input
  - contract_id: contract.ci-release-assembly.outputs
    id: output-line-injection
    partition: runtime-context.release-assembly-invalid
    input:
      output-directory: |-
        handoff
        status=success
  - contract_id: contract.ci-release-assembly.outputs
    id: identity-rejection
    partition: runtime-context.release-assembly-invalid
    input:
      repository: other/repository
  - contract_id: contract.ci-release-assembly.outputs
    id: supplemental-binding
    partition: runtime-context.release-assembly-valid
    input:
      supplemental-root: supplemental
    verifies:
      - handoff-output-bound
      - handoff-owner-evidence-retained
  - contract_id: contract.ci-release-assembly.outputs
    id: unsafe-build-inputs
    partition: runtime-context.release-assembly-invalid
    input:
      build-root: build output whose asset manifest names another source SHA
  - contract_id: contract.ci-release-assembly.outputs
    id: canonical-checksum-sidecar
    partition: runtime-context.release-assembly-valid
    input:
      build-root: build
      checksum-sidecar: canonical
    verifies:
      - accepted-checksum-verifiable
  - contract_id: contract.ci-release-assembly.outputs
    id: noncanonical-checksum-sidecar
    partition: runtime-context.release-assembly-invalid
    input:
      build-root: build
      checksum-sidecar: single-space-separator
  - contract_id: contract.ci-release-assembly.outputs
    id: platform-checkout-eol
    partition: runtime-context.release-assembly-valid
    input:
      platform-manifest: CRLF
    verifies:
      - handoff-output-bound
  - contract_id: contract.ci-release-assembly.outputs
    id: asset-only-assembly-valid
    partition: runtime-context.release-asset-only-assembly-valid
    input:
      operation: assemble
      release-implementation: asset-release
      public-skills:
        - ci-github
      supplemental-asset: owner-adapter
    verifies:
      - assembly-success
      - handoff-output-bound
  - contract_id: contract.ci-release-assembly.outputs
    id: asset-only-assembly-empty
    partition: runtime-context.release-asset-only-assembly-empty
    input:
      operation: assemble
      release-implementation: asset-release
      public-skills: []
      supplemental-asset: none
