version: 1
name: contract-verifications
subject_ref: subject.ci.release-assembly
verifications:
  - id: verification.ci-release-assembly.outputs
    contract_id: contract.ci-release-assembly.outputs
    cases:
      - id: same-release-skills-assembly-valid
        intent_id: same-release-skills-assembly-valid
        input:
          operation: assemble
          repository: owner/project
          public-skills:
            - ci-github
          installer: false
        checks:
          - id: handoff
            guarantee_ref: bound-handoff
          - id: digest
            guarantee_ref: bound-asset-digest
      - id: same-release-skills-assembly-invalid
        intent_id: same-release-skills-assembly-invalid
        input:
          operation: assemble
          public-skills:
            - ci-github
          required-file: missing-SKILL.md
        checks:
          - id: rejection
            guarantee_ref: assembly-rejected
      - id: detailed-failure-outputs
        intent_id: detailed-diagnostics-outputs
        input: { scenario: rejected-public-invocation }
        checks: [ { id: diagnostic-details, guarantee_ref: diagnostic-details-outputs } ]
      - id: bundled-assembly
        intent_id: bound-assembly
        input:
          repository: owner/project
          authority-path: authority.json
          snapshot-path: snapshot.json
          build-root: build
          output-directory: handoff
        checks:
          - id: success
            guarantee_ref: assembly-success
          - id: handoff
            guarantee_ref: bound-handoff
          - id: digest
            guarantee_ref: bound-asset-digest
      - id: output-line-injection
        intent_id: fail-closed
        input:
          output-directory: "handoff\nstatus=success"
        checks:
          - id: rejection
            guarantee_ref: assembly-rejected
      - id: identity-rejection
        intent_id: fail-closed
        input:
          repository: other/repository
        checks:
          - id: rejection
            guarantee_ref: assembly-rejected
      - id: build-validation
        intent_id: bound-assembly
        input:
          build-root: build
        checks:
          - id: handoff
            guarantee_ref: bound-handoff
          - id: digest
            guarantee_ref: bound-asset-digest
      - id: supplemental-binding
        intent_id: bound-assembly
        input:
          supplemental-root: supplemental
        checks:
          - id: handoff
            guarantee_ref: bound-handoff
      - id: unsafe-build-inputs
        intent_id: fail-closed
        input:
          build-root: invalid-build
        checks:
          - id: rejection
            guarantee_ref: assembly-rejected
      - id: canonical-asset-digest
        intent_id: bound-assembly
        input:
          build-root: build
        checks:
          - id: digest
            guarantee_ref: bound-asset-digest
          - id: asset-digest-serialization
            guarantee_ref: asset-digest-serialization
          - id: asset-digest-asset-order
            guarantee_ref: asset-digest-asset-order
          - id: asset-digest-field-order
            guarantee_ref: asset-digest-field-order
      - id: canonical-checksum-sidecar
        intent_id: bound-assembly
        input:
          build-root: build
          checksum-sidecar: canonical
        checks:
          - id: accepted-checksum-encoding
            guarantee_ref: accepted-checksum-encoding
          - id: accepted-checksum-digest-form
            guarantee_ref: accepted-checksum-digest-form
          - id: accepted-checksum-separator
            guarantee_ref: accepted-checksum-separator
          - id: accepted-checksum-line-ending
            guarantee_ref: accepted-checksum-line-ending
      - id: noncanonical-checksum-sidecar
        intent_id: fail-closed
        input:
          build-root: build
          checksum-sidecar: single-space-separator
        checks:
          - id: rejection
            guarantee_ref: assembly-rejected
      - id: platform-checkout-eol
        intent_id: bound-assembly
        input: { platform-manifest: CRLF }
        checks: [ { id: handoff, guarantee_ref: bound-handoff }, { id: digest, guarantee_ref: bound-asset-digest } ]
