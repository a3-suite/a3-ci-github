version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-assembly.outputs
    id: same-release-skills-assembly-valid
    partition: runtime-context.release-assembly-valid
    input:
      operation: assemble
      repository: owner/project
      public-skills:
        - ci-github
      installer: false
    verifies:
      - bound-handoff
      - bound-asset-digest
  - contract_id: contract.ci-release-assembly.outputs
    id: same-release-skills-assembly-invalid
    partition: runtime-context.release-assembly-invalid
    input:
      operation: assemble
      public-skills:
        - ci-github
      required-file: missing-SKILL.md
  - contract_id: contract.ci-release-assembly.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-release-assembly.outputs
    id: bundled-assembly
    partition: runtime-context.release-assembly-valid
    input:
      repository: owner/project
      authority-path: authority.json
      snapshot-path: snapshot.json
      build-root: build
      output-directory: handoff
    verifies:
      - assembly-success
      - bound-handoff
      - bound-asset-digest
      - assembly-no-credential-input
  - contract_id: contract.ci-release-assembly.outputs
    id: output-line-injection
    partition: runtime-context.release-assembly-invalid
    input:
      output-directory: |-
        handoff
        status=success
  - contract_id: contract.ci-release-assembly.outputs
    id: identity-rejection
    partition: runtime-context.release-assembly-invalid
    input:
      repository: other/repository
  - contract_id: contract.ci-release-assembly.outputs
    id: build-validation
    partition: runtime-context.release-assembly-valid
    input:
      build-root: build
    verifies:
      - bound-handoff
      - bound-asset-digest
      - asset-digest-serialization
      - asset-digest-asset-order
      - asset-digest-field-order
  - contract_id: contract.ci-release-assembly.outputs
    id: supplemental-binding
    partition: runtime-context.release-assembly-valid
    input:
      supplemental-root: supplemental
    verifies:
      - bound-handoff
  - contract_id: contract.ci-release-assembly.outputs
    id: unsafe-build-inputs
    partition: runtime-context.release-assembly-invalid
    input:
      build-root: invalid-build
  - contract_id: contract.ci-release-assembly.outputs
    id: canonical-checksum-sidecar
    partition: runtime-context.release-assembly-valid
    input:
      build-root: build
      checksum-sidecar: canonical
    verifies:
      - accepted-checksum-encoding
      - accepted-checksum-digest-form
      - accepted-checksum-separator
      - accepted-checksum-line-ending
  - contract_id: contract.ci-release-assembly.outputs
    id: noncanonical-checksum-sidecar
    partition: runtime-context.release-assembly-invalid
    input:
      build-root: build
      checksum-sidecar: single-space-separator
  - contract_id: contract.ci-release-assembly.outputs
    id: platform-checkout-eol
    partition: runtime-context.release-assembly-valid
    input:
      platform-manifest: CRLF
    verifies:
      - bound-handoff
      - bound-asset-digest
