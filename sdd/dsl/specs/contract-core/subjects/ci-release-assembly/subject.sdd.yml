version: 1
name: contract-subject
subject:
  id: subject.ci.release-assembly
  summary: Assemble authority-bound Release assets and opaque owner evidence without provider write or source execution.
contracts:
  - id: contract.ci-release-assembly.outputs
    summary: Release assembly request from authority, snapshot and build inventories.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: repository
        meaning: "Received by the contract target: repository identity passed by the caller."
      - name: public-skills
        meaning: "Received by the contract target: public skills selected by the release skills declaration."
      - name: installer
        meaning: "Received by the contract target: standard installer selection."
      - name: required-file
        meaning: "Precondition prepared by the case: state of a file required by a public skill."
      - name: authority-path
        meaning: "Received by the contract target: path to the release authority file."
      - name: snapshot-path
        meaning: "Received by the contract target: path to the configuration snapshot file."
      - name: build-root
        meaning: "Received by the contract target: build root path."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: supplemental-root
        meaning: "Received by the contract target: supplemental asset root path."
      - name: checksum-sidecar
        meaning: "Precondition prepared by the case: format of the checksum sidecar."
      - name: platform-manifest
        meaning: "Received by the contract target: content of the platform manifest file."
      - name: release-implementation
        meaning: "Received by the contract target: release implementation recorded in the snapshot."
      - name: supplemental-asset
        meaning: "Received by the contract target: supplemental asset implementation selected for the release."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: status
            meaning: Success only after complete validation and handoff creation.
          - selector: release-handoff
            meaning: New ci.handoff.v1 directory containing authority-bound assets and opaque owner evidence.
          - selector: asset-digest
            meaning: SHA-256 of the canonical sorted inventory of verified asset names, sizes and digests.
          - selector: outcome
            meaning: Failed step outcome when assembly is rejected.
          - selector: asset-digest-serialization
            meaning: Serialization of the verified asset list whose SHA-256 equals asset-digest.
          - selector: asset-digest-asset-order
            meaning: Order of the assets in the asset-digest serialization.
          - selector: asset-digest-field-order
            meaning: Field order of each asset projection in the asset-digest serialization.
          - selector: accepted-checksum-encoding
            meaning: Text encoding of a checksum sidecar accepted by a successful assembly.
          - selector: accepted-checksum-digest-form
            meaning: Representation of the digest in a checksum sidecar accepted by a successful assembly.
          - selector: accepted-checksum-separator
            meaning: Separator between the digest and the asset filename in a checksum sidecar accepted by a successful assembly.
          - selector: accepted-checksum-line-ending
            meaning: Line ending of a checksum sidecar accepted by a successful assembly, compared as exact bytes.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Inputs declared by the assembly Action for its caller.
        boundary: boundary.action-caller
        fields:
          - selector: credential-input-state
            meaning: Occurrence state (present or absent) of a declared input that accepts a provider credential.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.release-assembly-valid
      - environment: runtime-context.release-asset-only-assembly-valid
      - environment: runtime-context.release-assembly-invalid
      - environment: runtime-context.release-asset-only-assembly-empty
    guarantees:
      - id: assembly-success
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        claim:
          field: status
          in:
            - success
      - id: bound-handoff
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        claim:
          field: release-handoff
          present: true
      - id: bound-asset-digest
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        claim:
          field: asset-digest
          present: true
      - id: assembly-no-credential-input
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: credential-input-state
          in:
            - absent
      - id: assembly-rejected
        applies_to:
          - runtime-context.release-assembly-invalid
          - runtime-context.release-asset-only-assembly-empty
        claim:
          field: outcome
          in:
            - failure
      - id: asset-digest-serialization
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: asset-digest-serialization
          in:
            - compact-utf8-json-without-terminal-newline
      - id: asset-digest-asset-order
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: asset-digest-asset-order
          in:
            - name-order-localecompare-en
      - id: asset-digest-field-order
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: asset-digest-field-order
          in:
            - name-sha256-size
      - id: accepted-checksum-encoding
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: accepted-checksum-encoding
          in:
            - utf8-without-bom
      - id: accepted-checksum-digest-form
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: accepted-checksum-digest-form
          in:
            - lowercase-sha256
      - id: accepted-checksum-separator
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: accepted-checksum-separator
          in:
            - two-spaces
      - id: accepted-checksum-line-ending
        applies_to:
          - runtime-context.release-assembly-valid
        claim:
          field: accepted-checksum-line-ending
          in:
            - single-terminal-lf
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
