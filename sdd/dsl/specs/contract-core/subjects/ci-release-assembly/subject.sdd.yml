version: 1
name: contract-subject
subject:
  id: subject.ci.release-assembly
  summary: Assemble authority-bound Release assets and opaque owner evidence without provider write or source execution.
contracts:
  - id: contract.ci-release-assembly.outputs
    summary: Release assembly request from authority, snapshot and build inventories.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: repository
        meaning: "Received by the contract target: repository identity passed by the caller."
      - name: public-skills
        meaning: "Received by the contract target: public skills selected by the release skills declaration."
      - name: installer
        meaning: "Received by the contract target: standard installer selection."
      - name: required-file
        meaning: "Precondition prepared by the case: state of a file required by a public skill."
      - name: authority-path
        meaning: "Received by the contract target: path to the release authority file."
      - name: snapshot-path
        meaning: "Received by the contract target: path to the configuration snapshot file."
      - name: build-root
        meaning: "Received by the contract target: build root path."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: supplemental-root
        meaning: "Received by the contract target: supplemental asset root path."
      - name: checksum-sidecar
        meaning: "Precondition prepared by the case: format of the checksum sidecar."
      - name: platform-manifest
        meaning: "Received by the contract target: content of the platform manifest file."
      - name: release-implementation
        meaning: "Received by the contract target: release implementation recorded in the snapshot."
      - name: supplemental-asset
        meaning: "Received by the contract target: supplemental asset implementation selected for the release."
    conditions:
      - id: runtime-context.release-assembly-valid
        summary: The authority selects a platform release with matching snapshot, platform manifest and verified asset inputs, and required writes can complete. Exact build asset and checksum inventories and any selected opaque owner evidence bindings agree, and the output destination is unclaimed. Selected public skills satisfy ci-github.release-skills-contract and bind to the same Release source and version.
      - id: runtime-context.release-asset-only-assembly-valid
        summary: The authority selects an asset-only release with a nonempty verified selection, and required writes can complete. Authority records an asset release without language profile, toolchain or platform manifest bindings; no build inventory is supplied; and the selected public skills, the selected supplemental asset evidence, or both bind to the same Release source and version with an unclaimed output destination.
      - id: runtime-context.release-assembly-invalid
        summary: Assembly rejects its inputs or fails before starting the Action output write. An empty asset-only selection has its own condition. Rejection includes unavailable or unsafe assembly input, inconsistency with authority or platform selection, extra or mismatching assets, checksums or supplemental bindings, an existing output destination, or selected public skills that violate fixed source, required inventory, safe paths or publication name constraints.
      - id: runtime-context.release-asset-only-assembly-empty
        summary: The asset-only inputs are valid but select no assets. Authority records an asset release without platform bindings.
      - id: release-assembly-action-output-write-failed
        summary: The handoff has been assembled but the Action output write fails.
    guarantees:
      - id: platform-manifest-line-ending-preserves-identity
        applies_to:
          - runtime-context.release-assembly-valid
        boundary: boundary.workspace-files
        statement: The written assembly identity equals the authority identity when the checked-out platform manifest differs only in line endings.
      - id: assembly-success
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        boundary: boundary.action-output
        statement: '`status` is one of `"success"`. The `asset-digest` output equals the SHA-256 of the canonical sorted inventory of verified asset names, sizes and digests.'
      - id: handoff-output-bound
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        boundary: boundary.action-output
        statement: "`release-handoff` equals the invocation input `output-directory`. Path of the ci.handoff.v1 directory that a successful assembly writes."
      - id: handoff-source-bound
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        boundary: boundary.workspace-files
        statement: '`handoff-source-identity` is one of `"equal"`. Comparison of the source_sha of the identity written in the handoff with the authority source_sha.'
      - id: handoff-asset-digest-bound
        applies_to:
          - runtime-context.release-assembly-valid
          - runtime-context.release-asset-only-assembly-valid
        boundary: boundary.workspace-files
        statement: '`handoff-asset-digest-reload` is one of `"equal"`. Comparison of the asset digest that loading the written handoff yields with the asset-digest output.'
      - id: assembly-no-credential-input
        applies_to:
          - runtime-context.release-assembly-valid
        boundary: boundary.action-caller
        statement: '`credential-input-state` is one of `"absent"`. The Action declares no provider credential input and completes assembly without a provider credential.'
      - id: assembly-rejected
        applies_to:
          - runtime-context.release-assembly-invalid
          - runtime-context.release-asset-only-assembly-empty
          - release-assembly-action-output-write-failed
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failed step outcome when assembly is rejected.'
      - id: accepted-checksum-verifiable
        applies_to:
          - runtime-context.release-assembly-valid
        boundary: boundary.workspace-files
        statement: '`accepted-checksum-verification` is one of `"verified"`. Result of checking each accepted asset against its checksum sidecar with a standard sha256 checksum-file verification; verified or failed.'
      - id: handoff-owner-evidence-retained
        applies_to:
          - runtime-context.release-assembly-valid
        boundary: boundary.workspace-files
        statement: '`owner-evidence-retention-state` is one of `"retained"`. Whether every supplied owner evidence record appears unchanged in the handoff evidence directory; retained or lost.'
      - id: selected-skills-packaged
        applies_to:
          - runtime-context.release-assembly-valid
        boundary: boundary.workspace-files
        statement: '`packaged-skill-selection-comparison` is one of `"matched"`. Comparison of the SKILL.md paths in the skills ZIP owner evidence with the selected skill set; matched or mismatched.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.release-assembly-invalid
          - runtime-context.release-asset-only-assembly-empty
          - release-assembly-action-output-write-failed
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-release-assembly
