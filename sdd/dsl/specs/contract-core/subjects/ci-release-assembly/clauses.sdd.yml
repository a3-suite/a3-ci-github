version: 1
name: contract-clauses
subject_ref: subject.ci.release-assembly
contracts:
  - id: contract.ci-release-assembly.outputs
    summary: Assembly checks authority, snapshot, exact platform and build inventories, source/version identity and asset/checksum bytes before producing a new handoff. Platform manifest identity uses the source-text identity rule of contract.ci-release-authority.outputs. Supplemental records remain opaque and bind the selected owner contract, asset, source, evidence and provenance digests. No source execution or provider write is performed.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: assembly-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-assembly-valid
          op: available
      - id: assembly-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-assembly-invalid
          op: available
    guarantees:
      - id: assembly-success
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.outputs
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values: [ success ]
      - id: bound-handoff
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: release-handoff
      - id: bound-asset-digest
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: asset-digest
      - id: assembly-rejected
        when: assembly-invalid
        observation_ref: observation.ci-release-assembly.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values: [ failure ]
      - id: asset-digest-serialization
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: asset-digest-serialization
            right:
              kind: value_set
              values: [ compact-utf8-json-without-terminal-newline ]
      - id: asset-digest-asset-order
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: asset-digest-asset-order
            right:
              kind: value_set
              values: [ name-order-localecompare-en ]
      - id: asset-digest-field-order
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: asset-digest-field-order
            right:
              kind: value_set
              values: [ name-sha256-size ]
      - id: accepted-checksum-encoding
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-checksum-encoding
            right:
              kind: value_set
              values: [ utf8-without-bom ]
      - id: accepted-checksum-digest-form
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-checksum-digest-form
            right:
              kind: value_set
              values: [ lowercase-sha256 ]
      - id: accepted-checksum-separator
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-checksum-separator
            right:
              kind: value_set
              values: [ two-spaces ]
      - id: accepted-checksum-line-ending
        when: assembly-valid
        observation_ref: observation.ci-release-assembly.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-checksum-line-ending
            right:
              kind: value_set
              values: [ single-terminal-lf ]
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-release-assembly.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [ diagnostic-details-outputs ]
      - id: bound-assembly
        goal: Complete validation produces the authority-bound handoff, asset digest and success output from canonical checksum sidecars without overwriting an existing destination.
        guarantee_refs:
          - assembly-success
          - bound-handoff
          - bound-asset-digest
          - asset-digest-serialization
          - asset-digest-asset-order
          - asset-digest-field-order
          - accepted-checksum-encoding
          - accepted-checksum-digest-form
          - accepted-checksum-separator
          - accepted-checksum-line-ending
      - id: same-release-skills-assembly-valid
        goal: Verify the assembly-valid input partition.
        guarantee_refs:
          - bound-handoff
          - bound-asset-digest
      - id: same-release-skills-assembly-invalid
        goal: Verify the assembly-invalid input partition.
        guarantee_refs:
          - assembly-rejected
      - id: fail-closed
        goal: Reject identity, platform, checksum, unsafe path, extra asset or supplemental binding mismatches without successful outputs.
        guarantee_refs: [ assembly-rejected ]
