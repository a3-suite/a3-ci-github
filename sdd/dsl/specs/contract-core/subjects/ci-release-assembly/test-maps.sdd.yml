version: 1
name: contract-test-maps
subject_ref: subject.ci.release-assembly
test_maps:
  - verification_id: verification.ci-release-assembly.outputs
    case_id: bundled-assembly
    tests:
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "source entrypoint > assembly bundle emits bound outputs only on complete success"
        check_refs: [success, handoff, digest]
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "dist entrypoint > assembly bundle emits bound outputs only on complete success"
        check_refs: [success, handoff, digest]
  - verification_id: verification.ci-release-assembly.outputs
    case_id: output-line-injection
    tests:
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "source entrypoint > assembly bundle rejects output path line injection before assembly"
        check_refs: [rejection]
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "dist entrypoint > assembly bundle rejects output path line injection before assembly"
        check_refs: [rejection]
  - verification_id: verification.ci-release-assembly.outputs
    case_id: identity-rejection
    tests:
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "source entrypoint > assembly bundle rejects invalid input without successful outputs"
        check_refs: [rejection]
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "dist entrypoint > assembly bundle rejects invalid input without successful outputs"
        check_refs: [rejection]
  - verification_id: verification.ci-release-assembly.outputs
    case_id: build-validation
    tests:
      - path: runtime/release-publication/tests/assembly.test.mjs
        symbol: assembly produces a bound handoff and rejects invalid build inputs
        check_refs: [handoff, digest]
  - verification_id: verification.ci-release-assembly.outputs
    case_id: supplemental-binding
    tests:
      - path: runtime/release-publication/tests/assembly.test.mjs
        symbol: supplemental evidence binds opaque owner records and rejects mismatches
        check_refs: [handoff]
  - verification_id: verification.ci-release-assembly.outputs
    case_id: unsafe-build-inputs
    tests:
      - path: runtime/release-publication/tests/assembly.test.mjs
        symbol: "assembly fails closed: source"
        check_refs: [rejection]
