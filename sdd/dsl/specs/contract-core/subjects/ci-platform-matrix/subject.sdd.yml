version: 1
name: contract-subject
subject:
  id: subject.ci.platform-matrix
  summary: Validating a CI platform manifest and producing a deterministic include matrix.
contracts:
  - id: contract.ci-platform-matrix.outputs
    summary: Platform manifest and optional quality selection inputs to the platform matrix Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: manifest-path
        meaning: "Received by the contract target: platform manifest path."
      - name: manifest-document
        meaning: "Received by the contract target: content of the platform manifest file."
      - name: runner-policy
        meaning: "Received by the contract target: runner policy that selects the permitted runner labels."
      - name: selection-path
        meaning: "Received by the contract target: platform selection file path."
      - name: selection-document
        meaning: "Received by the contract target: content of the platform selection file."
      - name: github-output
        meaning: "Precondition prepared by the case: output destination provided by the runner."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.platform-manifest-valid
        summary: The invocation meets the shared runtime context `runtime-context.platform-manifest-valid`.
      - id: runtime-context.platform-manifest-invalid
        summary: The invocation meets the shared runtime context `runtime-context.platform-manifest-invalid`.
      - id: runtime-context.quality-platform-selection-invalid
        summary: The invocation meets the shared runtime context `runtime-context.quality-platform-selection-invalid`.
      - id: runtime-context.quality-selection-shared-checks-supplied
        summary: The invocation meets the shared runtime context `runtime-context.quality-selection-shared-checks-supplied`.
      - id: runtime-context.quality-selection-shared-checks-omitted
        summary: The invocation meets the shared runtime context `runtime-context.quality-selection-shared-checks-omitted`.
    guarantees:
      - id: invalid-platform-manifest-fails
        applies_to:
          - runtime-context.platform-manifest-invalid
          - runtime-context.quality-platform-selection-invalid
        boundary: boundary.action-output
        statement: '`outcome` is `"failure"` when the manifest or the supplied quality selection is rejected.'
      - id: invalid-platform-manifest-has-no-output
        applies_to:
          - runtime-context.platform-manifest-invalid
          - runtime-context.quality-platform-selection-invalid
        boundary: boundary.action-output
        statement: '`matrix-output-state` is one of `"absent"`. Present when a matrix output was emitted and absent otherwise.'
      - id: invalid-selection-has-no-quality-matrix
        applies_to:
          - runtime-context.quality-platform-selection-invalid
        boundary: boundary.action-output
        statement: '`quality-matrix-output-state` is one of `"absent"`. Present when a quality-matrix output was emitted and absent otherwise.'
      - id: invalid-selection-has-no-expected-platforms
        applies_to:
          - runtime-context.quality-platform-selection-invalid
        boundary: boundary.action-output
        statement: '`expected-platforms-output-state` is one of `"absent"`. Present when an expected-platforms output was emitted and absent otherwise.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: manifest-matrix-binding
        applies_to:
          - runtime-context.platform-manifest-valid
          - runtime-context.quality-selection-shared-checks-omitted
          - runtime-context.quality-selection-shared-checks-supplied
        boundary: boundary.action-output
        statement: '`full-matrix-binding` is one of `"matched"`. Equality of the complete matrix include array, including order and all entry values, with the validated manifest. Observable fields at this boundary also include `matrix` (Compact JSON object that holds the platform matrix entries under include), `quality-matrix` (Compact JSON include matrix of the selected platforms), `expected-platforms` (Comma-separated IDs of the selected platforms).'
      - id: quality-id-set
        applies_to:
          - runtime-context.quality-selection-shared-checks-omitted
          - runtime-context.quality-selection-shared-checks-supplied
        boundary: boundary.action-output
        statement: '`quality-id-set` is one of `"matched"`. Equality of the set of quality matrix platform_id values with the supplied selection ID set, order not compared.'
      - id: quality-runner-binding
        applies_to:
          - runtime-context.quality-selection-shared-checks-omitted
          - runtime-context.quality-selection-shared-checks-supplied
        boundary: boundary.action-output
        statement: '`quality-runner-binding` is one of `"matched"`. Equality of each quality entry runner with the validated manifest runner for that entry platform_id.'
      - id: expected-id-set
        applies_to:
          - runtime-context.quality-selection-shared-checks-omitted
          - runtime-context.quality-selection-shared-checks-supplied
        boundary: boundary.action-output
        statement: '`expected-id-set` is one of `"matched"`. Equality of the set of comma-separated expected-platforms IDs with the supplied selection ID set, order not compared.'
      - id: shared-checks-value
        applies_to:
          - runtime-context.quality-selection-shared-checks-supplied
        boundary: boundary.action-output
        statement: '`shared-checks-value` is one of `"matched"`. Equality of each quality entry shared_standard_checks value with the explicitly supplied boolean sharedStandardChecks.'
      - id: shared-checks-absence
        applies_to:
          - runtime-context.quality-selection-shared-checks-omitted
        boundary: boundary.action-output
        statement: '`shared-checks-absence` is one of `"absent"`. Occurrence state of shared_standard_checks keys when sharedStandardChecks was omitted from the selection.'
    input_kind:
      kind: operation
      name: ci-platform-matrix
