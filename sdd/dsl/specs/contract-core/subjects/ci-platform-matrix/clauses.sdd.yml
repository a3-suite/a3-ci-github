version: 1
name: contract-clauses
subject_ref: subject.ci.platform-matrix
contracts:
  - id: contract.ci-platform-matrix.outputs
    summary: A valid manifest preserves the full build matrix; a valid optional quality selection additionally produces ordered quality matrix and expected platform outputs. Optional boolean sharedStandardChecks is projected as shared_standard_checks only when declared; absence preserves the old quality matrix shape. This projection does not authorize the caller to trust PR head or bootstrap declarations.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: platform-manifest-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.platform-manifest-valid
          op: available
      - id: platform-manifest-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.platform-manifest-invalid
          op: available
      - id: quality-platform-selection-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.quality-platform-selection-invalid
          op: available
      - id: shared-checks-supplied
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.quality-selection-shared-checks-supplied
          op: available
      - id: shared-checks-omitted
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.quality-selection-shared-checks-omitted
          op: available
    guarantees:
      - id: platform-matrix-produced
        when: platform-manifest-valid
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: matrix
      - id: invalid-platform-manifest-fails
        when: platform-manifest-invalid
        observation_ref: observation.ci-platform-matrix.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: invalid-platform-manifest-has-no-output
        when: platform-manifest-invalid
        observation_ref: observation.ci-platform-matrix.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: matrix-output-state
            right:
              kind: value_set
              values:
                - absent
      - id: selected-full-matrix-produced
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: matrix
      - id: ordered-quality-matrix-produced
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: quality-matrix
      - id: ordered-expected-platforms-produced
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: expected-platforms
      - id: invalid-selection-fails
        when: quality-platform-selection-invalid
        observation_ref: observation.ci-platform-matrix.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: invalid-selection-has-no-matrix
        when: quality-platform-selection-invalid
        observation_ref: observation.ci-platform-matrix.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: matrix-output-state
            right:
              kind: value_set
              values:
                - absent
      - id: invalid-selection-has-no-quality-outputs
        when: quality-platform-selection-invalid
        observation_ref: observation.ci-platform-matrix.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-output-state
            right:
              kind: value_set
              values:
                - absent
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-platform-matrix.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: manifest-matrix-binding
        when: platform-manifest-valid
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: full-matrix-binding
            right:
              kind: value_set
              values:
                - matched
      - id: selected-matrix-binding
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: full-matrix-binding
            right:
              kind: value_set
              values:
                - matched
      - id: quality-id-order
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-id-order
            right:
              kind: value_set
              values:
                - matched
      - id: quality-runner-binding
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-runner-binding
            right:
              kind: value_set
              values:
                - matched
      - id: expected-id-order
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: expected-id-order
            right:
              kind: value_set
              values:
                - matched
      - id: shared-checks-value
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: shared-checks-value
            right:
              kind: value_set
              values:
                - matched
      - id: shared-checks-absence
        when: shared-checks-omitted
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: shared-checks-absence
            right:
              kind: value_set
              values:
                - absent
      - id: selected-full-matrix-produced-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: matrix
      - id: ordered-quality-matrix-produced-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: quality-matrix
      - id: ordered-expected-platforms-produced-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: expected-platforms
      - id: selected-matrix-binding-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: full-matrix-binding
            right:
              kind: value_set
              values:
                - matched
      - id: quality-id-order-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-id-order
            right:
              kind: value_set
              values:
                - matched
      - id: quality-runner-binding-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: quality-runner-binding
            right:
              kind: value_set
              values:
                - matched
      - id: expected-id-order-with-shared-checks
        when: shared-checks-supplied
        observation_ref: observation.ci-platform-matrix.comparisons
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: expected-id-order
            right:
              kind: value_set
              values:
                - matched
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-outputs ]
      - id: platform-matrix-output-set
        goal: A valid manifest produces its validated include matrix.
        guarantee_refs:
          - platform-matrix-produced
      - id: invalid-platform-manifest-rejected
        goal: An invalid, unsupported, or oversized manifest fails without a matrix output.
        guarantee_refs:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - id: quality-selection-output-set
        goal: A valid selection retains the full manifest matrix and produces platform_id/runner and comma-separated expected IDs in selection order. Declared sharedStandardChecks must be a boolean and is projected to each quality entry; malformed values and unknown fields fail without outputs.
        guarantee_refs:
          - selected-full-matrix-produced
          - ordered-quality-matrix-produced
          - ordered-expected-platforms-produced
      - id: invalid-quality-selection-rejected
        goal: An invalid supplied selection fails without emitting any successful outputs.
        guarantee_refs:
          - invalid-selection-fails
          - invalid-selection-has-no-matrix
          - invalid-selection-has-no-quality-outputs
      - id: matrix-identity-platform-manifest-valid
        goal: Verify the platform-manifest-valid input partition.
        guarantee_refs:
          - manifest-matrix-binding
      - id: matrix-identity-shared-checks-omitted
        goal: Verify the shared-checks-omitted input partition.
        guarantee_refs:
          - selected-matrix-binding
          - quality-id-order
          - quality-runner-binding
          - expected-id-order
          - shared-checks-absence
      - id: matrix-identity-shared-checks-supplied
        goal: Verify the shared-checks-supplied input partition.
        guarantee_refs:
          - shared-checks-value
          - selected-matrix-binding-with-shared-checks
          - quality-id-order-with-shared-checks
          - quality-runner-binding-with-shared-checks
          - expected-id-order-with-shared-checks
      - id: quality-selection-output-set-with-shared-checks
        goal: A valid selection retains the full manifest matrix and produces platform_id/runner and comma-separated expected IDs in selection order. Declared sharedStandardChecks must be a boolean and is projected to each quality entry; malformed values and unknown fields fail without outputs.
        guarantee_refs:
          - selected-full-matrix-produced-with-shared-checks
          - ordered-quality-matrix-produced-with-shared-checks
          - ordered-expected-platforms-produced-with-shared-checks
