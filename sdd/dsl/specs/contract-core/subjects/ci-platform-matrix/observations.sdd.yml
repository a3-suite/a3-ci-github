version: 1
name: contract-observations
subject_ref: subject.ci.platform-matrix
observations:
  - id: observation.ci-platform-matrix.outputs
    summary: The Action exposes a validated platform matrix output.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: matrix
          kind: observation_field
          meaning: Compact JSON object containing the validated platform entries under include.
        - selector: quality-matrix
          kind: observation_field
          meaning: Compact JSON include matrix of platform_id and runner in supplied selection order, present only for a valid supplied selection.
        - selector: expected-platforms
          kind: observation_field
          meaning: Comma-separated selected IDs in selection order, present only for a valid supplied selection.
  - id: observation.ci-platform-matrix.result
    summary: The Action exposes its step outcome to the caller.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Success for a valid bounded manifest and failure otherwise.
        - selector: matrix-output-state
          kind: observation_field
          meaning: Present when a matrix output was emitted and absent otherwise.
        - selector: quality-output-state
          kind: observation_field
          meaning: Present when quality-matrix and expected-platforms were emitted and absent when neither was emitted.
  - id: observation.ci-platform-matrix.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: manifest読取・schema/identity検証・selection解決の段階、manifest/selection相対path、違反field、重複/未知platform ID、選択順序と該当targetを表す診断情報。
  - id: observation.ci-platform-matrix.comparisons
    summary: Atomic boundary comparisons used by this contract.
    boundary:
      ref: boundary.action-output
    value:
      root: action.output-comparisons
      kind: object
      fields:
      - selector: full-matrix-binding
        kind: observation_field
        meaning: Equality of the complete matrix include array, including order and all entry values, with the validated
          manifest.
      - selector: quality-id-order
        kind: observation_field
        meaning: Equality of the quality matrix platform_id sequence with the supplied selection ID sequence.
      - selector: quality-runner-binding
        kind: observation_field
        meaning: Equality of each quality entry runner with the validated manifest runner for that entry platform_id.
      - selector: expected-id-order
        kind: observation_field
        meaning: Equality of the comma-separated expected-platforms value with the supplied selection ID sequence.
      - selector: shared-checks-value
        kind: observation_field
        meaning: Equality of each quality entry shared_standard_checks value with the explicitly supplied boolean
          sharedStandardChecks.
      - selector: shared-checks-absence
        kind: observation_field
        meaning: Occurrence state of shared_standard_checks keys when sharedStandardChecks was omitted from the selection.
