version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-platform-matrix.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-platform-matrix.outputs
    id: valid-platform-manifest
    partition: runtime-context.platform-manifest-valid
    input:
      manifest-path: .ci/release/platforms.yml
    verifies:
      - platform-matrix-produced
  - contract_id: contract.ci-platform-matrix.outputs
    id: invalid-platform-manifest
    partition: runtime-context.platform-manifest-invalid
    input:
      manifest-path: .ci/release/invalid-platforms.yml
  - contract_id: contract.ci-platform-matrix.outputs
    id: valid-quality-selection
    partition: runtime-context.quality-selection-shared-checks-omitted
    input:
      manifest-path: .ci/platform-manifest.yml
      selection-path: .ci/quality-platforms.yml
      selection-document:
        platforms:
          - id: linux-x64
    verifies:
      - platform-matrix-produced
      - ordered-quality-matrix-produced
      - ordered-expected-platforms-produced
  - contract_id: contract.ci-platform-matrix.outputs
    id: invalid-quality-selection
    partition: runtime-context.quality-platform-selection-invalid
    input:
      manifest-path: .ci/platform-manifest.yml
      selection-path: .ci/invalid-quality-platforms.yml
  - contract_id: contract.ci-platform-matrix.outputs
    id: manifest-identity
    partition: runtime-context.platform-manifest-valid
    input:
      manifest-path: .ci/platform-manifest.yml
    verifies:
      - manifest-matrix-binding
  - contract_id: contract.ci-platform-matrix.outputs
    id: selection-identity
    partition: runtime-context.quality-selection-shared-checks-omitted
    input:
      selection-document:
        platforms:
          - id: windows-x64
          - id: linux-x64
    verifies:
      - manifest-matrix-binding
      - quality-id-order
      - quality-runner-binding
      - expected-id-order
      - shared-checks-absence
  - contract_id: contract.ci-platform-matrix.outputs
    id: shared-checks-identity
    partition: runtime-context.quality-selection-shared-checks-supplied
    input:
      selection-document:
        platforms:
          - id: windows-x64
          - id: linux-x64
        sharedStandardChecks: true
    verifies:
      - manifest-matrix-binding
      - quality-id-order
      - quality-runner-binding
      - expected-id-order
      - shared-checks-value
  - contract_id: contract.ci-platform-matrix.outputs
    id: valid-quality-selection-with-shared-checks
    partition: runtime-context.quality-selection-shared-checks-supplied
    input:
      manifest-path: .ci/platform-manifest.yml
      selection-path: .ci/quality-platforms.yml
      selection-document:
        platforms:
          - id: linux-x64
        sharedStandardChecks: true
    verifies:
      - platform-matrix-produced
      - ordered-quality-matrix-produced
      - ordered-expected-platforms-produced
