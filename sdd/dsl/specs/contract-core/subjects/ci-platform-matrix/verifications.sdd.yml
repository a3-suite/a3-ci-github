version: 1
name: contract-verifications
subject_ref: subject.ci.platform-matrix
verifications:
  - id: verification.ci-platform-matrix.outputs
    contract_id: contract.ci-platform-matrix.outputs
    cases:
      - id: valid-platform-manifest
        intent_id: platform-matrix-output-set
        input:
          manifest-path: .ci/release/platforms.yml
        checks:
          - id: check-platform-matrix-output
            guarantee_ref: platform-matrix-produced
      - id: invalid-platform-manifest
        intent_id: invalid-platform-manifest-rejected
        input:
          manifest-path: .ci/release/invalid-platforms.yml
        checks:
          - id: check-invalid-platform-manifest-failure
            guarantee_ref: invalid-platform-manifest-fails
          - id: check-invalid-platform-manifest-no-output
            guarantee_ref: invalid-platform-manifest-has-no-output
      - id: valid-quality-selection
        intent_id: quality-selection-output-set
        input:
          manifest-path: .ci/platform-manifest.yml
          selection-path: .ci/quality-platforms.yml
        checks:
          - id: check-selected-full-matrix
            guarantee_ref: selected-full-matrix-produced
          - id: check-ordered-quality-matrix
            guarantee_ref: ordered-quality-matrix-produced
          - id: check-ordered-expected-platforms
            guarantee_ref: ordered-expected-platforms-produced
      - id: invalid-quality-selection
        intent_id: invalid-quality-selection-rejected
        input:
          manifest-path: .ci/platform-manifest.yml
          selection-path: .ci/invalid-quality-platforms.yml
        checks:
          - id: check-invalid-selection-failure
            guarantee_ref: invalid-selection-fails
          - id: check-invalid-selection-no-matrix
            guarantee_ref: invalid-selection-has-no-matrix
          - id: check-invalid-selection-no-quality-outputs
            guarantee_ref: invalid-selection-has-no-quality-outputs
