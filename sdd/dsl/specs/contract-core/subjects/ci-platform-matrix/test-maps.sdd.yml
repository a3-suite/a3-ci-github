version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: valid-platform-manifest
    tests:
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint emits the validated matrix
        guarantees:
          - platform-matrix-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint emits the validated matrix
        guarantees:
          - platform-matrix-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint accepts consumer versioned runners only with trusted policy
        guarantees:
          - platform-matrix-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint accepts consumer versioned runners only with trusted policy
        guarantees:
          - platform-matrix-produced
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: invalid-platform-manifest
    tests:
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint fails closed for an unsupported runner
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint fails closed for an unsupported runner
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint preserves bootstrap and invalid policy boundaries
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint preserves bootstrap and invalid policy boundaries
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint rejects an oversized manifest before parsing
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint rejects an oversized manifest before parsing
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: valid-quality-selection
    tests:
      - path: runtime/preset/tests/quality-platform-selection.process.test.mjs
        symbol: contract.ci-platform-matrix.outputs > platform-selection-conformance > platform Action and preflight agree on selection and parser rejection boundaries
        guarantees:
          - ordered-quality-matrix-produced
      - path: tests/shared-quality-checks.test.mjs
        symbol: shared standard quality checks > trusted base declaration wins over head and bootstrap keeps full execution
        guarantees:
          - ordered-quality-matrix-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint emits ordered quality outputs without changing the manifest matrix
        guarantees:
          - platform-matrix-produced
          - ordered-quality-matrix-produced
          - ordered-expected-platforms-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint emits ordered quality outputs without changing the manifest matrix
        guarantees:
          - platform-matrix-produced
          - ordered-quality-matrix-produced
          - ordered-expected-platforms-produced
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: invalid-quality-selection
    tests:
      - path: runtime/preset/tests/quality-platform-selection.process.test.mjs
        symbol: contract.ci-platform-matrix.outputs > platform-selection-conformance > platform Action and preflight agree on selection and parser rejection boundaries
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
          - invalid-selection-has-no-quality-outputs
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint rejects malformed shared checks and unknown selection fields without outputs
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
          - invalid-selection-has-no-quality-outputs
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint rejects malformed shared checks and unknown selection fields without outputs
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
          - invalid-selection-has-no-quality-outputs
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint fails without any outputs for invalid selection
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
          - invalid-selection-has-no-quality-outputs
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint fails without any outputs for invalid selection
        guarantees:
          - invalid-platform-manifest-fails
          - invalid-platform-manifest-has-no-output
          - invalid-selection-has-no-quality-outputs
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-platform-matrix failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: owner validation comparisons > source retains owner field comparisons without private values
        guarantees:
          - diagnostic-failure-stage-outputs
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: owner validation comparisons > dist retains owner field comparisons without private values
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: manifest-identity
    tests:
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint emits the validated matrix
        guarantees:
          - manifest-matrix-binding
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint emits the validated matrix
        guarantees:
          - manifest-matrix-binding
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: selection-identity
    tests:
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint emits ordered quality outputs without changing the manifest matrix
        guarantees:
          - manifest-matrix-binding
          - quality-id-order
          - quality-runner-binding
          - expected-id-order
          - shared-checks-absence
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint emits ordered quality outputs without changing the manifest matrix
        guarantees:
          - manifest-matrix-binding
          - quality-id-order
          - quality-runner-binding
          - expected-id-order
          - shared-checks-absence
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: shared-checks-identity
    tests:
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint projects explicit shared checks without changing build identities or selection order
        guarantees:
          - manifest-matrix-binding
          - quality-id-order
          - quality-runner-binding
          - expected-id-order
          - shared-checks-value
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint projects explicit shared checks without changing build identities or selection order
        guarantees:
          - manifest-matrix-binding
          - quality-id-order
          - quality-runner-binding
          - expected-id-order
          - shared-checks-value
  - contract_id: contract.ci-platform-matrix.outputs
    case_id: valid-quality-selection-with-shared-checks
    tests:
      - path: runtime/preset/tests/quality-platform-selection.process.test.mjs
        symbol: contract.ci-platform-matrix.outputs > platform-selection-conformance > platform Action and preflight agree on selection and parser rejection boundaries
        guarantees:
          - ordered-quality-matrix-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint projects explicit shared checks without changing build identities or selection order
        guarantees:
          - platform-matrix-produced
          - ordered-quality-matrix-produced
          - ordered-expected-platforms-produced
      - path: actions/ci-platform-matrix/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint projects explicit shared checks without changing build identities or selection order
        guarantees:
          - platform-matrix-produced
          - ordered-quality-matrix-produced
          - ordered-expected-platforms-produced
      - path: tests/shared-quality-checks.test.mjs
        symbol: shared standard quality checks > trusted base declaration wins over head and bootstrap keeps full execution
        guarantees:
          - ordered-quality-matrix-produced
