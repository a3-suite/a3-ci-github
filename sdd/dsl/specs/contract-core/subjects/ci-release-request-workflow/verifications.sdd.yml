version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-request-workflow.handoff
    id: detailed-failure-handoff
    partition: runtime-context.failure-diagnostic-required
    input:
      job-result: failure
  - contract_id: contract.ci-release-request-workflow.handoff
    id: ci-release-request-workflow-success
    partition: ci-release-request-workflow-canonical-source-available
    input:
      workflow-source: workflows/release/release-request-tag.yml
  - contract_id: contract.ci-release-request-workflow.handoff
    id: ci-release-request-workflow-failure
    partition: ci-release-request-workflow-failure-route-required
    input:
      workflow-source: workflows/release/release-request-tag.yml
