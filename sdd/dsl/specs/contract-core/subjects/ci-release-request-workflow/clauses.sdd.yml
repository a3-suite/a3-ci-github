version: 1
name: contract-clauses
subject_ref: subject.ci.release-request-workflow
contracts:
  - id: contract.ci-release-request-workflow.handoff
    summary: The canonical release request workflow declares annotated-tag resolution and immutable handoff without publication permission.
    conditions:
      - id: diagnostic-required-handoff
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-release-request-workflow-canonical-source-available
        input_predicate:
          kind: input
          term: input.canonical-source
          op: present
      - id: ci-release-request-workflow-failure-route-required
        input_predicate:
          kind: input
          term: input.failure-route
          op: present
    guarantees:
      - id: ci-release-request-workflow-success-observed
        when: ci-release-request-workflow-canonical-source-available
        observation_ref: observation.ci.release-request-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: request-handoff
      - id: ci-release-request-workflow-failure-observed
        when: ci-release-request-workflow-failure-route-required
        observation_ref: observation.ci.release-request-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: failure-summary
      - id: diagnostic-details-handoff
        when: diagnostic-required-handoff
        observation_ref: observation.ci-release-request-workflow.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-handoff
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-handoff]
      - id: ci-release-request-workflow-success-intent
        goal: Verify the canonical source declares the trusted capability boundary.
        guarantee_refs:
          - ci-release-request-workflow-success-observed
      - id: ci-release-request-workflow-failure-intent
        goal: Verify the canonical source declares a failure-visible summary route.
        guarantee_refs:
          - ci-release-request-workflow-failure-observed
