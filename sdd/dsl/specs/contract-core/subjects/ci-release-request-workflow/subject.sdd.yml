version: 1
name: contract-subject
subject:
  id: subject.ci.release-request-workflow
  summary: Bind an annotated tag event to an immutable release request handoff without publication authority.
contracts:
  - id: contract.ci-release-request-workflow.handoff
    summary: Canonical release request workflow definition.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
      - name: job-result
        meaning: "Precondition prepared by the case: result of a job that the workflow aggregates or depends on."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: ci-release-request-workflow-canonical-source-available
        summary: The canonical release request workflow source is inspected.
      - id: ci-release-request-workflow-failure-route-required
        summary: A job handling the release request fails.
    guarantees:
      - id: ci-release-request-workflow-success-observed
        applies_to:
          - ci-release-request-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: "`request-handoff` is present. Declared request handoff route."
      - id: ci-release-request-workflow-failure-observed
        applies_to:
          - ci-release-request-workflow-failure-route-required
        boundary: boundary.workflow-definition
        statement: "`failure-summary` is present. Declared request aggregate route."
      - id: diagnostic-failure-stage-handoff
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: request-no-publication-permission
        applies_to:
          - ci-release-request-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`request-no-publication-permission` is one of `"absent"`. Occurrence of contents-write permission in the request workflow.'
      - id: request-tag-before-handoff
        applies_to:
          - ci-release-request-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`request-tag-before-handoff` is one of `"tag-before-handoff"`. Declared order of annotated-tag resolution and immutable request handoff.'
      - id: request-failure-summary-always
        applies_to:
          - ci-release-request-workflow-failure-route-required
        boundary: boundary.workflow-definition
        statement: '`request-failure-summary-always` is one of `"always"`. Declared request failure summary condition.'
    input_kind:
      kind: operation
      name: ci-release-request-workflow
