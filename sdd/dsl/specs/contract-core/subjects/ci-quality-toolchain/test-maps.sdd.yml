version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-quality-toolchain.preparation
    case_id: selected-quality-toolchain
    tests:
      - path: actions/ci-quality-toolchain/tests/composite-execution.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > resolved output matches the selector and is published only after selected setup
        guarantees:
          - resolved-quality-toolchain-produced
      - path: actions/ci-quality-toolchain/tests/action-contract.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > quality toolchain contract selects only fixed profile dependencies without project execution
        guarantees:
          - selected-quality-toolchain-ready
      - path: actions/ci-quality-toolchain/tests/composite-execution.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > quality toolchain Rust scripts preserve pinned arguments environment and setup failures
        guarantees:
          - selected-quality-toolchain-ready
      - path: actions/ci-quality-toolchain/tests/cargo-audit.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > verified archive is extracted executed and exported without cargo compilation
        guarantees:
          - selected-quality-toolchain-ready
      - path: actions/ci-quality-toolchain/tests/cargo-audit.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > unregistered versions and targets retain source install and its exit status
        guarantees:
          - selected-quality-toolchain-ready
  - contract_id: contract.ci-quality-toolchain.preparation
    case_id: compatible-quality-toolchain
    tests:
      - path: actions/ci-quality-toolchain/tests/composite-execution.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > compatible policy accepts bounded Node and Python selectors while exact policy stays strict
        guarantees:
          - selected-quality-toolchain-ready
      - path: actions/ci-quality-toolchain/tests/composite-execution.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > resolved output matches the selector and is published only after selected setup
        guarantees:
          - resolved-quality-toolchain-produced
  - contract_id: contract.ci-quality-toolchain.preparation
    case_id: invalid-quality-toolchain
    tests:
