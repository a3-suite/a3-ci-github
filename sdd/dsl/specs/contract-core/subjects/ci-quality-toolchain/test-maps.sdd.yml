        symbol: contract.ci-quality-toolchain.preparation > resolved output matches the selector and is published only after selected setup
        guarantees:
          - invalid-or-failed-quality-toolchain-stops
      - path: actions/ci-quality-toolchain/tests/composite-execution.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > quality toolchain validation accepts selected exact versions and rejects invalid inputs before setup
        guarantees:
          - invalid-or-failed-quality-toolchain-stops
      - path: actions/ci-quality-toolchain/tests/cargo-audit.test.mjs
        symbol: contract.ci-quality-toolchain.preparation > invalid cargo-audit version stops before download or source install
        guarantees:
          - invalid-or-failed-quality-toolchain-stops
