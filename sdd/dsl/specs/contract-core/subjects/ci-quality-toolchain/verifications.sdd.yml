version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-quality-toolchain.preparation
    id: detailed-failure-preparation
    partition: runtime-context.failure-diagnostic-required
    input:
      language-profile: rust
      rust-setup-result: failure
  - contract_id: contract.ci-quality-toolchain.preparation
    id: selected-quality-toolchain
    partition: runtime-context.quality-toolchain-inputs-ready
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      cargo-audit-version: 0.21.0
      rustup-exit-code: 0
      cargo-exit-code: 0
      io-destinations: writable
  - contract_id: contract.ci-quality-toolchain.preparation
    id: compatible-quality-toolchain
    partition: runtime-context.quality-toolchain-inputs-ready
    input:
      language-profile: typescript
      toolchain-version: "24"
      version-policy: compatible
      provider-node-version: v24.21.0
      provider-status: 0
      io-destinations: writable
  - contract_id: contract.ci-quality-toolchain.preparation
    id: invalid-quality-toolchain
    partition: runtime-context.quality-toolchain-inputs-unusable
    input:
      language-profile: unsupported
      toolchain-version: latest
  - contract_id: contract.ci-quality-toolchain.preparation
    id: failed-quality-toolchain-setup
    partition: runtime-context.quality-toolchain-inputs-unusable
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      cargo-audit-version: 0.21.0
      rustup-exit-code: 13
      io-destinations: writable
  - contract_id: contract.ci-quality-toolchain.preparation
    id: registered-binary-failure
    partition: runtime-context.ci-quality-toolchain-registered-binary-input-unusable
    input:
      tool: cargo-audit
      version: 0.22.2
      registered-target: x86_64-unknown-linux-gnu
      archive-sha256: mismatch
  - contract_id: contract.ci-quality-toolchain.preparation
    id: valid-toolchain-request
    partition: runtime-context.quality-toolchain-request-valid
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      version-policy: exact
      cargo-audit-version: 0.21.0
  - contract_id: contract.ci-quality-toolchain.preparation
    id: valid-request-mismatching-resolution
    partition: runtime-context.quality-toolchain-request-valid
    input:
      language-profile: typescript
      toolchain-version: "24"
      version-policy: compatible
      provider-node-version: v26.0.0
    verifies:
      - resolved-version-satisfies-selector
  - contract_id: contract.ci-quality-toolchain.preparation
    id: mismatching-provider-version
    partition: runtime-context.quality-toolchain-inputs-unusable
    input:
      language-profile: typescript
      toolchain-version: "24"
      version-policy: compatible
      provider-node-version: v26.0.0
      provider-status: 0
      io-destinations: writable
  - contract_id: contract.ci-quality-toolchain.preparation
    id: missing-provider-version
    partition: runtime-context.quality-toolchain-inputs-unusable
    input:
      language-profile: typescript
      toolchain-version: "24"
      version-policy: compatible
      provider-node-version: ""
      provider-status: 0
      io-destinations: writable
  - contract_id: contract.ci-quality-toolchain.preparation
    id: selected-cargo-deny
    partition: runtime-context.quality-toolchain-inputs-ready
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      cargo-audit-version: 0.22.2
      cargo-deny-version: 0.20.2
      registered-target: x86_64-unknown-linux-musl
      io-destinations: writable
    verifies:
      - selected-quality-toolchain-ready
  - contract_id: contract.ci-quality-toolchain.preparation
    id: invalid-cargo-deny-version
    partition: runtime-context.quality-toolchain-inputs-unusable
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      cargo-audit-version: 0.22.2
      cargo-deny-version: latest
  - contract_id: contract.ci-quality-toolchain.preparation
    id: registered-cargo-deny-failure
    partition: runtime-context.ci-quality-toolchain-registered-binary-input-unusable
    input:
      tool: cargo-deny
      version: 0.20.2
      registered-target: x86_64-unknown-linux-musl
      archive-sha256: mismatch
  - contract_id: contract.ci-quality-toolchain.preparation
    id: unrequested-cargo-deny
    partition: runtime-context.quality-toolchain-request-valid
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      version-policy: exact
      cargo-audit-version: 0.22.2
      cargo-deny-version: ""
    verifies:
      - selected-profile-dependencies-only
  - contract_id: contract.ci-quality-toolchain.preparation
    id: skipped-auxiliary-tools
    partition: runtime-context.quality-toolchain-request-valid
    input:
      language-profile: rust
      toolchain-version: 1.90.0
      version-policy: exact
      cargo-audit-version: 0.22.2
      cargo-deny-version: 0.20.2
      auxiliary-tools: skip
    verifies:
      - selected-profile-dependencies-only
