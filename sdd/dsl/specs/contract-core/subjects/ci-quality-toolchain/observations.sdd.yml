version: 1
name: contract-observations
subject_ref: subject.ci.quality-toolchain
observations:
  - id: observation.ci-quality-toolchain.result
    summary: Selected preparation succeeds or stops on invalid inputs or a failed setup step.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Preparation step outcome.
        - selector: resolved-toolchain-version
          kind: observation_field
          meaning: Published resolved toolchain version.
  - id: observation.ci-quality-toolchain.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "language/profile選択・要求version検証・各setup・version確認の段階、選択language/profile、失敗したtool/setup step、要求/観測version、OS/arch、元の終了状態を表す診断情報。"
        - selector: diagnostic-only-tool-acquisition-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of an unselected tool acquired solely to obtain diagnostics.
  - id: observation.ci-quality-toolchain.preparation.relations
    summary: Individually observed contract values and comparisons.
    boundary:
      ref: boundary.action-output
    value:
      root: action.result
      kind: object
      fields:
        - selector: unselected-setup-state
          kind: observation_field
          meaning: Occurrence of dependency setup for an unselected language profile.
        - selector: resolved-selector-comparison
          kind: observation_field
          meaning: Comparison of an emitted resolved toolchain version with the requested exact or compatible selector; not-published denotes absence of a resolved version output.
        - selector: source-fallback-state
          kind: observation_field
          meaning: Occurrence of source installation after registered binary acquisition fails.
        - selector: failed-path-export-state
          kind: observation_field
          meaning: Occurrence of a PATH export after registered binary acquisition fails.
