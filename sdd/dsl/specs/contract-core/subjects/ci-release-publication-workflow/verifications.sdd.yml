version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-publication-workflow.publication
    id: detailed-failure-publication
    partition: runtime-context.failure-diagnostic-required
    input:
      job-result: failure
  - contract_id: contract.ci-release-publication-workflow.publication
    id: ci-release-publication-workflow-success
    partition: ci-release-publication-workflow-canonical-source-available
    input:
      workflow-source: .github/workflows/ci-release-publication.yml
    verifies:
      - ci-release-publication-workflow-success-observed
      - release-fixed-provider-reference
      - release-explicit-owner-inputs
      - release-request-before-publication
      - release-authority-before-publication
      - release-control-sha-bound
      - release-control-head-verified
      - release-handoff-before-publication
      - release-publication-before-readback
      - release-tokens-explicit
  - contract_id: contract.ci-release-publication-workflow.publication
    id: ci-release-publication-workflow-failure
    partition: ci-release-publication-workflow-failure-route-required
    input:
      job-result: failure
  - contract_id: contract.ci-release-publication-workflow.publication
    id: ci-release-publication-workflow-evidence-transfer
    partition: ci-release-publication-workflow-canonical-source-available
    input:
      workflow-source: .github/workflows/ci-release-publication.yml
    verifies:
      - ci-release-publication-workflow-evidence-transfer-declared
      - supplemental-upload-selected-root
      - supplemental-hidden-files-selected
      - supplemental-download-root
      - supplemental-final-assembly-input
  - contract_id: contract.ci-release-publication-workflow.asset-publication
    id: detailed-failure-asset-publication
    partition: runtime-context.failure-diagnostic-required
    input:
      job-result: failure
  - contract_id: contract.ci-release-publication-workflow.asset-publication
    id: ci-asset-release-publication-workflow-success
    partition: ci-asset-release-publication-workflow-canonical-source-available
    input:
      workflow-source: .github/workflows/ci-asset-release-publication.yml
  - contract_id: contract.ci-release-publication-workflow.asset-publication
    id: ci-asset-release-publication-workflow-failure
    partition: ci-asset-release-publication-workflow-failure-route-required
    input:
      job-result: failure
