version: 1
name: contract-clauses
subject_ref: subject.ci.release-publication-workflow
contracts:
  - id: contract.ci-release-publication-workflow.publication
    summary: The canonical release workflows order unprivileged request creation, trusted request and publication entry validation, handoff production, privileged publication, and publication readback. Standard-installer platform artifact transfer preserves the exact declared evidence filenames and bytes, including hidden source snapshots, until final owner verification; missing, modified, or undeclared evidence blocks publication.
    conditions:
      - id: diagnostic-required-publication
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-release-publication-workflow-canonical-source-available
        input_predicate:
          kind: input
          term: input.canonical-source
          op: present
      - id: ci-release-publication-workflow-failure-route-required
        input_predicate:
          kind: input
          term: input.failure-route
          op: present
    guarantees:
      - id: ci-release-publication-workflow-success-observed
        when: ci-release-publication-workflow-canonical-source-available
        observation_ref: observation.ci.release-publication-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: publication-boundary
      - id: ci-release-publication-workflow-failure-observed
        when: ci-release-publication-workflow-failure-route-required
        observation_ref: observation.ci.release-publication-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: failure-summary
      - id: ci-release-publication-workflow-evidence-transfer-declared
        when: ci-release-publication-workflow-canonical-source-available
        observation_ref: observation.ci.release-publication-workflow.result
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: evidence-transfer}
      - id: diagnostic-details-publication
        when: diagnostic-required-publication
        observation_ref: observation.ci-release-publication-workflow.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-publication
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-publication]
      - id: ci-release-publication-workflow-success-intent
        goal: Verify the provider publication workflow is called through a registered full SHA with typed static owner configuration, default-branch workflow_run caller entry, authority success dependencies, consumer control checkout at github.workflow_sha with immediate HEAD verification, and handoff validation precede credential-bearing publication and readback.
        guarantee_refs:
          - ci-release-publication-workflow-success-observed
      - id: ci-release-publication-workflow-failure-intent
        goal: Verify failed or unresolved prerequisite stages block publication while the aggregate summary remains observable.
        guarantee_refs:
          - ci-release-publication-workflow-failure-observed
      - id: ci-release-publication-workflow-evidence-transfer-intent
        goal: Verify only the selected supplemental build directory opts into hidden-file upload for standard-installer, downloaded supplemental artifacts reach the final assemble phase, and publication depends on its successful handoff. Runtime candidate completeness and rejection belong to contract.ci-release-supplemental-asset.outputs.
        guarantee_refs: [ci-release-publication-workflow-evidence-transfer-declared]
