version: 1
name: contract-subject
subject:
  id: subject.ci.release-publication-workflow
  summary: Publish a release only after request, approval, publication entry, asset, and provenance verification.
contracts:
  - id: contract.ci-release-publication-workflow.publication
    summary: Canonical release publication workflow definitions.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
      - name: job-result
        meaning: "Precondition prepared by the case: result of a job that the workflow aggregates or depends on."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: ci-release-publication-workflow-canonical-source-available
        summary: The repository release publication workflow source is inspected.
      - id: ci-release-publication-workflow-failure-route-required
        summary: A release publication job fails.
    guarantees:
      - id: diagnostic-failure-stage-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: release-fixed-provider-reference
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-fixed-provider-reference` is one of `"equal"`. Comparison of caller publication reference with the registered provider workflow reference declaration.'
      - id: release-request-before-publication
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-request-before-publication` is one of `"request-before-publication"`. Declared dependency order of request validation and privileged publication call.'
      - id: release-authority-before-publication
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-authority-before-publication` is one of `"authority-before-publication"`. Declared dependency order of authority validation and publication.'
      - id: release-control-sha-bound
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-control-sha-bound` is one of `"equal"`. Comparison of the trusted control checkout revision with github.workflow_sha.'
      - id: release-control-head-verified
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-control-head-verified` is one of `"checkout-before-verification"`. Declared order of control checkout and immediate HEAD verification.'
      - id: release-handoff-before-publication
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-handoff-before-publication` is one of `"handoff-before-publication"`. Declared order of handoff validation and credential-bearing publication.'
      - id: release-publication-before-readback
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-publication-before-readback` is one of `"publication-before-readback"`. Declared order of the publish step and independent verify-publication step.'
      - id: release-publication-group-per-repository
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-publication-concurrency-group` is one of `"per-workflow-and-repository"`. Declared concurrency group of the release publication provider workflow; per-workflow-and-repository or other.'
      - id: release-publication-in-progress-kept
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-publication-in-progress-run` is one of `"kept"`. Declared handling of an in-progress run when another run enters the concurrency group; kept or cancelled.'
      - id: release-publication-pending-queued
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-publication-pending-run` is one of `"queued"`. Declared handling of pending runs in the concurrency group; queued or other.'
      - id: supplemental-final-assembly-input
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`supplemental-final-assembly-input` is one of `"equal"`. Comparison of the supplemental build root passed to final assemble with the root the supplemental artifacts are downloaded to; equal or different.'
      - id: release-assembly-source-credentials-removed
        applies_to:
          - ci-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`release-assembly-source-credentials-persisted` is one of `"false"`. Declared persist-credentials setting of the fixed assembly source checkout.'
      - id: release-failed-prerequisite-blocks
        applies_to:
          - ci-release-publication-workflow-failure-route-required
        boundary: boundary.workflow-definition
        statement: '`release-failed-prerequisite-blocks` is one of `"absent"`. Occurrence of publication eligibility with a failed or unknown required prerequisite.'
    input_kind:
      kind: operation
      name: ci-release-publication-workflow
  - id: contract.ci-release-publication-workflow.asset-publication
    summary: Canonical asset release publication workflow definition for projects without a product build.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
      - name: job-result
        meaning: "Precondition prepared by the case: result of a job that the workflow aggregates or depends on."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: ci-asset-release-publication-workflow-canonical-source-available
        summary: The repository asset release publication workflow source is inspected.
      - id: ci-asset-release-publication-workflow-failure-route-required
        summary: An asset release publication job fails.
    guarantees:
      - id: asset-publication-no-build-job
        applies_to:
          - ci-asset-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`asset-publication-build-job-state` is one of `"absent"`. Occurrence state (present or absent) of a product build job in the asset publication workflow.'
      - id: asset-publication-selection-before-authority
        applies_to:
          - ci-asset-release-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`asset-publication-selection-before-authority` is one of `"selection-before-authority"`. Declared dependency order of the asset selection check and authority validation.'
      - id: asset-publication-failed-prerequisite-blocks
        applies_to:
          - ci-asset-release-publication-workflow-failure-route-required
        boundary: boundary.workflow-definition
        statement: '`asset-publication-failed-prerequisite-blocks` is one of `"absent"`. Occurrence of asset publication eligibility with a failed or unknown required prerequisite.'
      - id: diagnostic-failure-stage-asset-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-release-publication-workflow
