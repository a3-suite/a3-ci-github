version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-rust-source-gate.processing
    id: detailed-failure-processing
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.ci-rust-source-gate.processing
    id: matching-rust-source-processing
    partition: runtime-context.rust-source-matches-authority
    input:
      language-profile: rust
      authority-path: authority.json
      authority-source-sha: checked-out-head
  - contract_id: contract.ci-rust-source-gate.processing
    id: mismatching-rust-source-processing
    partition: runtime-context.rust-source-does-not-match-authority
    input:
      language-profile: rust
      authority-path: authority.json
      authority-source-sha: different-commit
  - contract_id: contract.ci-rust-source-gate.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.ci-rust-source-gate.outputs
    id: matching-rust-source-authority
    partition: runtime-context.rust-source-script-succeeded
    input:
      language-profile: rust
      authority-path: authority.json
  - contract_id: contract.ci-rust-source-gate.outputs
    id: mismatching-rust-source-authority
    partition: runtime-context.rust-source-script-failed
    input:
      language-profile: python
      authority-path: authority.json
