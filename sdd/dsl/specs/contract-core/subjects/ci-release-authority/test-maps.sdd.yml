version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-release-authority.outputs
    case_id: canonical-repository-identity
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: source entrypoint > authority entrypoint accepts canonical repository casing while preserving approved identity
        guarantees:
          - authority-file
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint accepts canonical repository casing while preserving approved identity
        guarantees:
          - authority-file
  - contract_id: contract.ci-release-authority.outputs
    case_id: verified-inputs
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: source entrypoint > authority entrypoint binds explicit decision, owner workflow and snapshot through GET-only observations
        guarantees:
          - authority-file
          - authority-get-only-requests
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint binds explicit decision, owner workflow and snapshot through GET-only observations
        guarantees:
          - authority-file
          - authority-get-only-requests
  - contract_id: contract.ci-release-authority.outputs
    case_id: invalid-bindings
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: source entrypoint > authority entrypoint rejects an expired approval without authority output
        guarantees:
          - no-success-outputs
          - rejected
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint rejects an expired approval without authority output
        guarantees:
          - no-success-outputs
          - rejected
  - contract_id: contract.ci-release-authority.outputs
    case_id: bundle-boundary
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint emits verified outputs and suppresses outputs on rejection
        guarantees:
          - authority-file
  - contract_id: contract.ci-release-authority.outputs
    case_id: platform-checkout-eol
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: source entrypoint > authority entrypoint binds the LF platform manifest digest for CRLF and mixed checkouts
        guarantees:
          - authority-file
          - platform-source-text-digest
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint binds the LF platform manifest digest for CRLF and mixed checkouts
        guarantees:
          - authority-file
          - platform-source-text-digest
  - contract_id: contract.ci-release-authority.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-release-authority failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-release-authority.outputs
    case_id: asset-release-selection
    tests:
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: source entrypoint > authority entrypoint records an asset release without language, toolchain or platform bindings
        guarantees:
          - authority-asset-only-no-platform-manifest
          - authority-file
          - authority-get-only-requests
      - path: actions/ci-release-authority/tests/entrypoint.test.ts
        symbol: dist entrypoint > authority entrypoint records an asset release without language, toolchain or platform bindings
        guarantees:
          - authority-asset-only-no-platform-manifest
          - authority-file
          - authority-get-only-requests
