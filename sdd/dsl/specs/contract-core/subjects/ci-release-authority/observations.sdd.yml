version: 1
name: contract-observations
subject_ref: subject.ci.release-authority
observations:
  - id: observation.ci-release-authority.outputs
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: authority-path
          kind: observation_field
          meaning: Path to the generated authority handoff.
        - selector: source_sha
          kind: observation_field
          meaning: Verified annotated tag commit SHA.
        - selector: version
          kind: observation_field
          meaning: Explicit owner version bound to the publication request.
        - selector: target_identity
          kind: observation_field
          meaning: Explicit opaque owner publication target.
        - selector: approval-id
          kind: observation_field
          meaning: Verified notes approval ID.
        - selector: body-sha256
          kind: observation_field
          meaning: Digest of separately approved Release notes body.
  - id: observation.ci-release-authority.result
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Authority validation step outcome.
        - selector: successful-output-state
          kind: observation_field
          meaning: Occurrence state of successful outputs.
  - id: observation.ci-release-authority.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "decision・request provenance・tag/source・workflow binding・snapshot・notes approval・repository identityの検証の段階、対象repository/tag/source/run/approval identity、違反field、期待/観測identity、provider HTTP相関情報を表す診断情報。"
  - id: observation.ci-release-authority.outputs.relations
    summary: Individually observed contract values and comparisons.
    boundary:
      ref: boundary.action-output
    value:
      root: action.result
      kind: object
      fields:
        - selector: platform-manifest-source-text-comparison
          kind: observation_field
          meaning: Comparison of authority platform_manifest_sha256 with SHA-256 of strictly decoded UTF-8 platform manifest text after CRLF-to-LF replacement only; BOM, bare CR, whitespace and terminal newline bytes remain significant.
