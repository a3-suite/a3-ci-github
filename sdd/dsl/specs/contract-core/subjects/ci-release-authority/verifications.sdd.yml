version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-authority.outputs
    id: canonical-repository-identity
    partition: runtime-context.release-authority-valid
    input:
      repository-response: canonical-casing
    verifies:
      - authority-file
  - contract_id: contract.ci-release-authority.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-release-authority.outputs
    id: verified-inputs
    partition: runtime-context.release-authority-valid
    input:
      decision: explicit
      provenance: complete
    verifies:
      - authority-file
      - authority-get-only-requests
  - contract_id: contract.ci-release-authority.outputs
    id: invalid-bindings
    partition: runtime-context.release-authority-invalid
    input:
      binding: expired
  - contract_id: contract.ci-release-authority.outputs
    id: bundle-boundary
    partition: runtime-context.release-authority-valid
    input:
      invocation: bundled-action
    verifies:
      - authority-file
  - contract_id: contract.ci-release-authority.outputs
    id: platform-checkout-eol
    partition: runtime-context.release-authority-valid
    input:
      platform-manifest: CRLF
