version: 1
name: contract-verifications
subject_ref: subject.ci.release-authority
verifications:
  - id: verification.ci-release-authority.outputs
    contract_id: contract.ci-release-authority.outputs
    cases:
      - id: canonical-repository-identity
        intent_id: coherent-authority
        input: { repository-response: canonical-casing }
        checks: [ { id: authority, guarantee_ref: authority-file } ]
      - id: detailed-failure-outputs
        intent_id: detailed-diagnostics-outputs
        input: { scenario: rejected-public-invocation }
        checks: [ { id: diagnostic-details, guarantee_ref: diagnostic-details-outputs } ]
      - id: verified-inputs
        intent_id: coherent-authority
        input:
          decision: explicit
          provenance: complete
        checks:
          - id: authority
            guarantee_ref: authority-file
      - id: invalid-bindings
        intent_id: fail-closed
        input:
          binding: expired
        checks:
          - id: failure
            guarantee_ref: rejected
          - id: no-outputs
            guarantee_ref: no-success-outputs
      - id: bundle-boundary
        intent_id: coherent-authority
        input:
          invocation: bundled-action
        checks:
          - id: authority
            guarantee_ref: authority-file
      - id: platform-checkout-eol
        intent_id: coherent-authority
        input: { platform-manifest: CRLF }
        checks: [ { id: authority, guarantee_ref: authority-file }, { id: platform-source-text-digest, guarantee_ref: platform-source-text-digest } ]
