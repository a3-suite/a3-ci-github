version: 1
name: contract-subject
subject:
  id: subject.ci.release-authority
  summary: Verify existing owner Release decisions through a read-only common authority binding without choosing owner policy or executing source code.
contracts:
  - id: contract.ci-release-authority.outputs
    summary: Release authority request from an owner publication request.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: repository-response
        meaning: "Precondition prepared by the case: repository identity response returned by the provider."
      - name: decision
        meaning: "Precondition prepared by the case: owner decision recorded for the release."
      - name: provenance
        meaning: "Precondition prepared by the case: provenance of the release request."
      - name: binding
        meaning: "Precondition prepared by the case: state of the approval binding."
      - name: invocation
        meaning: "Received by the contract target: form in which the authority is invoked."
      - name: platform-manifest
        meaning: "Received by the contract target: content of the platform manifest file."
      - name: release-implementation
        meaning: "Received by the contract target: release implementation recorded in the snapshot."
    conditions:
      - id: runtime-context.release-authority-valid
        summary: The verified release inputs select a platform-bound implementation with a matching manifest, and authority and Action outputs can be written.
      - id: runtime-context.release-authority-asset-only-valid
        summary: The verified release inputs select the asset-only implementation, and authority and Action outputs can be written.
      - id: runtime-context.release-authority-invalid
        summary: Inputs or provider responses cannot establish an approved authority, or the authority handoff cannot be written. No Action output write has started.
      - id: release-authority-output-write-denied
        summary: The authority handoff has been written but writing the Action outputs fails.
    guarantees:
      - id: authority-file
        applies_to:
          - runtime-context.release-authority-valid
          - runtime-context.release-authority-asset-only-valid
        boundary: boundary.action-output
        statement: "`authority-path` names the generated authority file. `source_sha` equals the verified annotated tag commit. `version` and `target_identity` equal the approved publication request fields. `approval-id` and `body-sha256` equal the verified notes approval ID and digest."
      - id: rejected
        applies_to:
          - runtime-context.release-authority-invalid
          - release-authority-output-write-denied
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Authority validation step outcome.'
      - id: no-success-outputs
        applies_to:
          - runtime-context.release-authority-invalid
        boundary: boundary.action-output
        statement: '`successful-output-state` is one of `"absent"`. Occurrence state of successful outputs.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.release-authority-invalid
          - release-authority-output-write-denied
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: platform-source-text-digest
        applies_to:
          - runtime-context.release-authority-valid
        boundary: boundary.workspace-files
        statement: '`platform-manifest-source-text-comparison` is one of `"equal"`. Comparison of platform_manifest_sha256 with the SHA-256 of the manifest text, treating CRLF, LF and mixed line endings as the same; equal or different.'
      - id: authority-get-only-requests
        applies_to:
          - runtime-context.release-authority-valid
          - runtime-context.release-authority-asset-only-valid
        boundary: boundary.release-provider-requests
        statement: '`non-get-request-state` is one of `"absent"`. Occurrence state (present or absent) of provider requests using a method other than GET during one invocation.'
      - id: authority-asset-only-no-platform-manifest
        applies_to:
          - runtime-context.release-authority-asset-only-valid
        boundary: boundary.workspace-files
        statement: '`authority-platform-manifest-binding-state` is one of `"absent"`. Occurrence state (present or absent) of a non-null platform_manifest or platform_manifest_sha256 value in the authority handoff.'
    input_kind:
      kind: operation
      name: ci-release-authority
