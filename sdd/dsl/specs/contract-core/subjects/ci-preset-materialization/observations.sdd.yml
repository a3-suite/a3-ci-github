version: 1
name: contract-observations
subject_ref: subject.ci.preset-materialization
observations:
  - id: observation.ci-preset-materialization.result
    summary: Materialization report or thrown rejection diagnostic exposed by the materializer boundary.
    boundary:
      ref: boundary.script-result
    value:
      root: materializer.result
      kind: object
      fields:
        - selector: schema
          kind: observation_field
          meaning: Stable materialization report schema identity.
        - selector: bundle
          kind: observation_field
          meaning: Selected adapter bundle identity.
        - selector: files
          kind: observation_field
          meaning: Canonical source, destination, and copy or reuse action for each materialized file.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable thrown diagnostic for an invalid source or conflicting destination.
