version: 1
name: contract-observations
subject_ref: subject.ci.preset-materialization
observations:
  - id: observation.ci-preset-materialization.result
    summary: Materialization report or thrown rejection diagnostic exposed by the materializer boundary.
    boundary:
      ref: boundary.script-result
    value:
      root: materializer.result
      kind: object
      fields:
        - selector: schema
          kind: observation_field
          meaning: Stable materialization report schema identity.
        - selector: bundle
          kind: observation_field
          meaning: Selected adapter bundle identity.
        - selector: files
          kind: observation_field
          meaning: Canonical source, destination, and copy or reuse action for each materialized file.
        - selector: binding
          kind: observation_field
          meaning: Fixed standard Action bundle identity and owner source revision and digest when no project files are copied.
        - selector: diagnostic
          kind: observation_field
          meaning: Stable thrown diagnostic for an invalid source or conflicting destination.
  - id: observation.ci-preset-materialization.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "bundle/source解決・destination検査・copy/reuse・rollbackを区別し、選択bundle、固定source revision、source/destination相対path、競合の期待/観測digest、変更済み範囲と復元状態を残す。"
