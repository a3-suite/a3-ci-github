version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-preset-materialization.application
    case_id: ci-preset-materialization-success
    tests:
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: materialize-adapter-bundle > materialize-adapter-bundle > materializer separates repository-owned assets from external skill resources
        guarantees:
          - ci-preset-materialization-success-observed
      - path: tests/public-cli-lifecycle.test.mjs
        symbol: contract.ci-preset-materialization.application > consumer-adapter-materialization-cli > public materializer CLI copies reuses and protects consumer adapter files
        guarantees:
          - ci-preset-materialization-success-observed
      - path: tests/public-cli-lifecycle.test.mjs
        symbol: contract.ci-preset-materialization.application > consumer-adapter-materialization-cli > public materializer CLI executes a symlinked entrypoint
        guarantees:
          - ci-preset-materialization-success-observed
  - contract_id: contract.ci-preset-materialization.application
    case_id: ci-preset-materialization-failure
    tests:
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: contract.ci-preset-materialization.application > adapter-materialization-rejection > materializer rejects invalid custom bundle inputs before copying consumer assets
        guarantees:
          - ci-preset-materialization-failure-observed
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: contract.ci-preset-materialization.application > adapter-materialization-rejection > materializer validates delegated project scripts without copying shared implementations
        guarantees:
          - ci-preset-materialization-failure-observed
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: materialize-adapter-bundle > materialize-adapter-bundle > materializer separates repository-owned assets from external skill resources
        guarantees:
          - ci-preset-materialization-failure-observed
      - path: tests/public-cli-lifecycle.test.mjs
        symbol: contract.ci-preset-materialization.application > consumer-adapter-materialization-cli > public materializer CLI copies reuses and protects consumer adapter files
        guarantees:
          - ci-preset-materialization-failure-observed
  - contract_id: contract.ci-preset-materialization.application
    case_id: detailed-failure-application
    tests:
      - path: tests/runtime-failure-diagnostics.test.mjs
        symbol: runtime failure diagnostics > materialization preserves its outcome and safe diagnostic context
        guarantees:
          - diagnostic-failure-stage-application
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: contract.ci-preset-materialization.application > adapter-materialization-rejection > materializer rejection retains the failing stage, paths and conflicting digests
        guarantees:
          - diagnostic-failure-stage-application
  - contract_id: contract.ci-preset-materialization.application
    case_id: standard-binding-footprint
    tests:
      - path: runtime/adapter/tests/standard-quality-footprint.test.mjs
        symbol: adapter-bundle-materialization-contract > registered standard quality bundles require no consumer copies and preserve consumer files
        guarantees:
          - standard-selected-bundle-match
          - standard-copy-state
          - standard-report-files
          - standard-binding-action
          - standard-binding-bundle
          - standard-binding-source
          - standard-binding-digest
          - consumer-settings-change
          - consumer-dependency-change
          - ci-preset-materialization-success-observed
  - contract_id: contract.ci-preset-materialization.application
    case_id: custom-copy-report
    tests:
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: contract.ci-preset-materialization.application > adapter-materialization-rejection > materializer reports copied and reused custom assets without changing consumer settings
        guarantees:
          - standard-selected-bundle-match
          - copy-report-sources
          - copy-report-destinations
          - copy-report-actions
          - consumer-settings-change
          - consumer-dependency-change
  - contract_id: contract.ci-preset-materialization.application
    case_id: conflicting-destination-protection
    tests:
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: materialize-adapter-bundle > materialize-adapter-bundle > materializer separates repository-owned assets from external skill resources
        guarantees:
          - conflicting-destination-change
  - contract_id: contract.ci-preset-materialization.application
    case_id: late-copy-failure-retention
    tests:
      - path: runtime/adapter/tests/materialize-adapter-bundle.test.mjs
        symbol: contract.ci-preset-materialization.application > adapter-materialization-rejection > materializer retains completed copies and reports the changed range after a later copy fails
        guarantees:
          - consumer-settings-change
          - consumer-dependency-change
          - completed-copy-loss
          - changed-range-evidence
  - contract_id: contract.ci-preset-materialization.application
    case_id: standard-rejection-footprint
    tests:
      - path: runtime/adapter/tests/standard-quality-footprint.test.mjs
        symbol: adapter-bundle-materialization-contract > registered standard quality bundles require no consumer copies and preserve consumer files
        guarantees:
          - standard-copy-state
          - consumer-settings-change
          - consumer-dependency-change
