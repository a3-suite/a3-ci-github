version: 1
name: contract-subject
subject:
  id: subject.ci.preset-materialization
  summary: Materialize selected repository and external-skill adapter assets without overwriting conflicting project files.
contracts:
  - id: contract.ci-preset-materialization.application
    summary: Adapter bundle materialization request for a consumer project.
    observations:
      - summary: Materialization report or thrown rejection diagnostic exposed by the materializer boundary.
        boundary:
          ref: boundary.script-result
        fields:
          - selector: schema
            meaning: Stable materialization report schema identity.
          - selector: bundle
            meaning: Selected adapter bundle identity.
          - selector: files
            meaning: Canonical source, destination, and copy or reuse action for each materialized file.
          - selector: binding
            meaning: Fixed standard Action bundle identity and owner source revision and digest when no project files are copied.
          - selector: diagnostic
            meaning: Stable thrown diagnostic of the rejected materialization.
          - selector: standard-binding-bundle
            meaning: Equality of the returned standardBundleId and selected registry bundle ID.
          - selector: standard-binding-source
            meaning: Equality of the binding sourcePath and the selected repository-owned descriptor path.
          - selector: standard-binding-digest
            meaning: Equality of the binding SHA-256 and selected fixed standard descriptor content digest.
          - selector: copy-report-sources
            meaning: Equality of reported sources and the selected descriptor plus registered asset source inventory.
          - selector: copy-report-destinations
            meaning: Equality of reported destinations and the selected descriptor destination inventory.
          - selector: copy-report-actions
            meaning: Agreement of every reported copy or reuse action with the destination state before invocation.
          - selector: standard-report-files
            meaning: Cardinality classification of the returned standard bundle files array.
          - selector: standard-binding-action
            meaning: Action identifier in the returned standard bundle binding.
          - selector: selected-bundle-match
            meaning: Equality of the report bundle ID and the selected input bundle ID.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary:
          ref: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
          - selector: changed-range-evidence
            meaning: Agreement, at each failed copy boundary, of diagnostic written destinations and files successfully copied before that boundary. With no failed copy boundary, this comparison is vacuously matched.
      - summary: Consumer file state before and after materialization, including a failed invocation.
        boundary:
          ref: boundary.project-ci-assets
        fields:
          - selector: standard-copy-state
            meaning: Presence of consumer files newly copied by a standard Action bundle invocation.
          - selector: consumer-settings-change
            meaning: Changes to pre-existing consumer settings bytes during materialization.
          - selector: consumer-dependency-change
            meaning: Changes to pre-existing consumer dependency declarations during materialization.
          - selector: conflicting-destination-change
            meaning: Byte changes to an existing destination whose contents conflict with the selected source.
          - selector: completed-copy-loss
            meaning: Removal or byte changes of files successfully copied before a later copy failure.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.preset-standard-materialization-valid
      - environment: runtime-context.preset-custom-materialization-valid
      - environment: runtime-context.preset-materialization-rejected
    guarantees:
      - id: ci-preset-materialization-success-observed
        applies_to:
          - runtime-context.preset-standard-materialization-valid
          - runtime-context.preset-custom-materialization-valid
        claim:
          field: schema
          in:
            - ci.adapter-materializer.v2
      - id: ci-preset-materialization-failure-observed
        applies_to:
          - runtime-context.preset-materialization-rejected
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: standard-copy-state
        claim:
          field: standard-copy-state
          in:
            - absent
      - id: standard-binding-bundle
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        claim:
          field: standard-binding-bundle
          in:
            - matched
      - id: standard-binding-source
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        claim:
          field: standard-binding-source
          in:
            - matched
      - id: standard-binding-digest
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        claim:
          field: standard-binding-digest
          in:
            - matched
      - id: consumer-settings-change
        claim:
          field: consumer-settings-change
          in:
            - absent
      - id: consumer-dependency-change
        claim:
          field: consumer-dependency-change
          in:
            - absent
      - id: copy-report-sources
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        claim:
          field: copy-report-sources
          in:
            - matched
      - id: copy-report-destinations
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        claim:
          field: copy-report-destinations
          in:
            - matched
      - id: copy-report-actions
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        claim:
          field: copy-report-actions
          in:
            - matched
      - id: conflicting-destination-change
        claim:
          field: conflicting-destination-change
          in:
            - absent
      - id: completed-copy-loss
        claim:
          field: completed-copy-loss
          in:
            - absent
      - id: changed-range-evidence
        claim:
          field: changed-range-evidence
          in:
            - matched
      - id: standard-report-files
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        claim:
          field: standard-report-files
          in:
            - empty
      - id: standard-binding-action
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        claim:
          field: standard-binding-action
          in:
            - ci-quality-adapter
      - id: standard-selected-bundle-match
        applies_to:
          - runtime-context.preset-standard-materialization-valid
          - runtime-context.preset-custom-materialization-valid
        claim:
          field: selected-bundle-match
          in:
            - matched
