version: 1
name: contract-subject
subject:
  id: subject.ci.preset-materialization
  summary: Materialize selected repository and external-skill adapter assets without overwriting conflicting project files.
contracts:
  - id: contract.ci-preset-materialization.application
    summary: Adapter bundle materialization request for a consumer project.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: selection
        meaning: "Received by the contract target: adapter bundle selection passed to the materializer."
      - name: source-root
        meaning: "Received by the contract target: source root argument."
      - name: destination
        meaning: "Precondition prepared by the case: state of the consumer destination path."
      - name: copy-failure
        meaning: "Precondition prepared by the case: copy operation that fails."
      - name: project-settings
        meaning: "Precondition prepared by the case: state of the project settings required by the bundle."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.preset-standard-materialization-valid
        summary: The invocation meets the shared runtime context `runtime-context.preset-standard-materialization-valid`.
      - id: runtime-context.preset-custom-materialization-valid
        summary: The invocation meets the shared runtime context `runtime-context.preset-custom-materialization-valid`.
      - id: runtime-context.preset-materialization-rejected
        summary: The invocation meets the shared runtime context `runtime-context.preset-materialization-rejected`.
    guarantees:
      - id: ci-preset-materialization-success-observed
        applies_to:
          - runtime-context.preset-standard-materialization-valid
          - runtime-context.preset-custom-materialization-valid
        boundary: boundary.script-result
        statement: "`schema` is present. Materialization report schema identity; present only when materialization completed. Observable fields at this boundary also include `bundle` (Selected adapter bundle identity), `files` (Canonical source, destination, and copy or reuse action for each materialized file), `binding` (Fixed standard Action bundle identity and owner source revision and digest when no project files are copied)."
      - id: ci-preset-materialization-failure-observed
        applies_to:
          - runtime-context.preset-materialization-rejected
        boundary: boundary.script-result
        statement: "`diagnostic` is present. Stable thrown diagnostic of the rejected materialization."
      - id: diagnostic-failure-stage-application
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: standard-copy-state
        boundary: boundary.project-ci-assets
        statement: '`standard-copy-state` is one of `"absent"`. Presence of consumer files newly copied by a standard Action bundle invocation.'
      - id: standard-binding-bundle
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        boundary: boundary.script-result
        statement: '`standard-binding-bundle` is one of `"matched"`. Equality of the returned standardBundleId and selected registry bundle ID.'
      - id: standard-binding-source
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        boundary: boundary.script-result
        statement: '`standard-binding-source` is one of `"matched"`. Equality of the binding sourcePath and the selected repository-owned descriptor path.'
      - id: standard-binding-digest
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        boundary: boundary.script-result
        statement: '`standard-binding-digest` is one of `"matched"`. Equality of the binding SHA-256 and selected fixed standard descriptor content digest.'
      - id: consumer-settings-change
        boundary: boundary.project-ci-assets
        statement: '`consumer-settings-change` is one of `"absent"`. Changes to pre-existing consumer settings bytes during materialization.'
      - id: consumer-dependency-change
        boundary: boundary.project-ci-assets
        statement: '`consumer-dependency-change` is one of `"absent"`. Changes to pre-existing consumer dependency declarations during materialization.'
      - id: copy-report-sources
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        boundary: boundary.script-result
        statement: '`copy-report-sources` is one of `"matched"`. Equality of reported sources and the selected descriptor plus registered asset source inventory.'
      - id: copy-report-destinations
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        boundary: boundary.script-result
        statement: '`copy-report-destinations` is one of `"matched"`. Equality of reported destinations and the selected descriptor destination inventory.'
      - id: copy-report-actions
        applies_to:
          - runtime-context.preset-custom-materialization-valid
        boundary: boundary.script-result
        statement: '`copy-report-actions` is one of `"matched"`. Agreement of every reported copy or reuse action with the destination state before invocation.'
      - id: conflicting-destination-change
        boundary: boundary.project-ci-assets
        statement: '`conflicting-destination-change` is one of `"absent"`. Byte changes to an existing destination whose contents conflict with the selected source.'
      - id: changed-range-evidence
        boundary: boundary.diagnostic-result
        statement: '`changed-range-evidence` is one of `"matched"`. Agreement, at each failed copy boundary, of diagnostic written destinations and files successfully copied before that boundary. With no failed copy boundary, this comparison is vacuously matched.'
      - id: standard-report-files
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        boundary: boundary.script-result
        statement: '`standard-report-files` is one of `"empty"`. Cardinality classification of the returned standard bundle files array.'
      - id: standard-binding-action
        applies_to:
          - runtime-context.preset-standard-materialization-valid
        boundary: boundary.script-result
        statement: '`standard-binding-action` is one of `"ci-quality-adapter"`. Action identifier in the returned standard bundle binding.'
      - id: standard-selected-bundle-match
        applies_to:
          - runtime-context.preset-standard-materialization-valid
          - runtime-context.preset-custom-materialization-valid
        boundary: boundary.script-result
        statement: '`selected-bundle-match` is one of `"matched"`. Equality of the report bundle ID and the selected input bundle ID.'
    input_kind:
      kind: operation
      name: materialize-adapter-bundle
