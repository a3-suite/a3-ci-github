  - contract_id: contract.ci-failure-diagnostics.existing-state
    id: input-rejection-preserves-existing-files
    partition: ci-failure-diagnostics-rejected-before-write
    input:
      failure: required inputs absent
      existing-file: pre-existing sentinel file that the contract target does not manage
      output-destination: directory that holds no file written by the contract target
    verifies:
      - failure-runner-temp-preserved
      - failure-target-root-preserved
      - failure-target-root-unextended
      - failure-output-destination-unextended
