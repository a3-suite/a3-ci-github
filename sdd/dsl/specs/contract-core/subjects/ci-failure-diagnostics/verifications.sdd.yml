version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: known-validation-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: known-validation
    verifies:
      - failure-subject-recorded
      - failure-operation-recorded
      - failure-stage-recorded
      - failure-reason-recorded
      - failure-cause-classified
      - execution-context-recorded
      - comparison-recorded
      - evidence-location-recorded
      - execution-outcome-retained
      - last-confirmed-stage-recorded
      - next-check-rule-recorded
      - diagnostic-known-cause-omission
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: unknown-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: unknown
    verifies:
      - diagnostic-unsubstantiated-remediation
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: pull-request-head-source
    partition: runtime-context.failure-diagnostic-required
    input:
      checkout: pull-request-head
    verifies:
      - diagnostic-unsubstantiated-context
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: external-request-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: external-request
    verifies:
      - diagnostic-unsubstantiated-context
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: child-process-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: child-process
    verifies:
      - diagnostic-unsafe-diagnostic-disclosure
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: evidence-generation-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: evidence-generation
    verifies:
      - diagnostic-original-diagnostic-loss
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: evidence-transfer-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: evidence-transfer
    verifies:
      - diagnostic-invalid-evidence-reference
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: summary-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: summary-write
    verifies:
      - diagnostic-original-outcome-replacement
  - contract_id: contract.ci-failure-diagnostics.actionable
    id: partial-write-failure
    partition: runtime-context.failure-diagnostic-required
    input:
      failure: partial-write
    verifies:
      - diagnostic-diagnostic-only-retry
  - contract_id: contract.ci-failure-diagnostics.subject-declarations
    id: all-subject-diagnostics-defined
    partition: subject-contract-source-available
    input:
      subject-contracts: sdd/dsl/specs/contract-core/subjects
  - contract_id: contract.ci-failure-diagnostics.workflow-evidence
    id: workflow-evidence-declared
    partition: ci-failure-diagnostics-workflow-source-available
    input:
      workflow-source: .github/workflows
  - contract_id: contract.ci-failure-diagnostics.bootstrap-diagnostic
    id: bootstrap-diagnostic-emitted
    partition: ci-failure-diagnostics-bootstrap-fails
    input:
      prepared-runtime: unavailable
