version: 1
name: contract-subject
subject:
  id: subject.ci.failure-diagnostics
  summary: Expose actionable CI failure context and evidence without replacing the original failure or disclosing protected values.
contracts:
  - id: contract.ci-failure-diagnostics.actionable
    summary: Failure of a selected contract boundary.
    inputs:
      - name: failure
        meaning: "Precondition prepared by the case: rejected input, failed operation or unresolved result at the selected CI boundary."
      - name: execution-context
        meaning: "Precondition prepared by the case: run and job identity available from the execution environment."
      - name: checkout
        meaning: "Precondition prepared by the case: checkout revision when its identity can be established."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The selected CI boundary rejects input, encounters a failure, or cannot resolve its result. Ordinary unselected or skipped work does not enter this partition.
    guarantees:
      - id: failure-subject-recorded
        boundary: boundary.diagnostic-result
        statement: "`failure-subject` is present. 失敗した契約対象の識別子。"
      - id: failure-operation-recorded
        boundary: boundary.diagnostic-result
        statement: "`failure-operation` is present. 失敗した操作の識別子。"
      - id: failure-stage-recorded
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。"
      - id: failure-reason-recorded
        boundary: boundary.diagnostic-result
        statement: "`failure-reason` is present. 失敗理由を表す安定した識別子。"
      - id: failure-cause-classified
        boundary: boundary.diagnostic-result
        statement: '`failure-cause` is one of `"known"`, `"unknown"`, `"unavailable"`. 失敗原因の判別状態（known、unknown、unavailable のいずれか）。'
      - id: execution-context-run-bound
        boundary: boundary.diagnostic-result
        statement: '`execution-context-run-binding` is one of `"matched"`. Comparison of the run identifier in the failure diagnostic context with the identifier of the failing invocation workflow run; matched or different.'
      - id: execution-context-job-bound
        boundary: boundary.diagnostic-result
        statement: '`execution-context-job-binding` is one of `"matched"`. Comparison of the job identifier in the failure diagnostic context with the identifier of the failing invocation workflow job; matched or different.'
      - id: execution-context-source-bound
        boundary: boundary.diagnostic-result
        statement: '`execution-context-source-binding` is matched when the reported source equals the verified checkout revision. The reported source is `"unavailable"` when checkout identity cannot be established.'
      - id: comparison-expected-recorded
        boundary: boundary.diagnostic-result
        statement: "`comparison-expected` is present. Expected value of the violated rule recorded in the diagnostic comparison."
      - id: comparison-observed-recorded
        boundary: boundary.diagnostic-result
        statement: "`comparison-observed` is present. Observed value, or the unavailable reason, recorded in the diagnostic comparison."
      - id: evidence-location-recorded
        boundary: boundary.diagnostic-result
        statement: '`evidence-location-log` identifies the emitting workflow step log in GitHub Actions and stderr in a local invocation.'
      - id: execution-outcome-retained
        boundary: boundary.diagnostic-result
        statement: '`execution-outcome` retains the original failure or unresolved outcome, including `"cannot-start"` and `"cannot-complete"` when those are the bootstrap outcome.'
      - id: last-confirmed-stage-recorded
        boundary: boundary.diagnostic-result
        statement: "`last-confirmed-stage` is present. 失敗前に最後に確定した段階の識別子。"
      - id: next-check-rule-recorded
        boundary: boundary.diagnostic-result
        statement: "`next-check-rule` is present. 次に確認すべき規則の識別子。"
      - id: diagnostic-known-cause-omission
        boundary: boundary.diagnostic-result
        statement: '`known-cause-omission-state` is one of `"absent"`. Occurrence state (present or absent) of a known safe specific cause omitted from the failure classification.'
      - id: diagnostic-unsubstantiated-context
        boundary: boundary.diagnostic-result
        statement: '`unsubstantiated-context-state` is one of `"absent"`. Occurrence state (present or absent) of context values presented without acquisition evidence.'
      - id: diagnostic-protected-input-disclosure
        boundary: boundary.diagnostic-result
        statement: '`protected-input-disclosure-state` is one of `"absent"`. Occurrence state (present or absent) of protected input values exposed in diagnostics.'
      - id: diagnostic-unchecked-output-disclosure
        boundary: boundary.diagnostic-result
        statement: '`unchecked-output-disclosure-state` is one of `"absent"`. Occurrence state (present or absent) of unchecked child process or provider output exposed in diagnostics.'
      - id: diagnostic-signed-url-disclosure
        boundary: boundary.diagnostic-result
        statement: '`signed-url-disclosure-state` is one of `"absent"`. Occurrence state (present or absent) of signed URLs exposed in diagnostics.'
      - id: diagnostic-whole-payload-disclosure
        boundary: boundary.diagnostic-result
        statement: '`whole-payload-disclosure-state` is one of `"absent"`. Occurrence state (present or absent) of whole input, response, argv, or environment payloads exposed in diagnostics.'
      - id: diagnostic-original-diagnostic-loss
        boundary: boundary.diagnostic-result
        statement: '`original-diagnostic-loss-state` is one of `"absent"`. Occurrence state (present or absent) of the primary diagnostic lost from final logs.'
      - id: diagnostic-invalid-evidence-reference
        boundary: boundary.diagnostic-result
        statement: '`invalid-evidence-reference-state` is one of `"absent"`. Occurrence state (present or absent) of a reference to evidence that was not generated or retained.'
      - id: diagnostic-original-outcome-replacement
        boundary: boundary.diagnostic-result
        statement: '`original-outcome-replacement-state` is one of `"absent"`. Occurrence state (present or absent) of the original failure outcome replaced or made successful by diagnostic/summary handling.'
      - id: diagnostic-diagnostic-only-retry
        boundary: boundary.diagnostic-result
        statement: '`diagnostic-only-retry-state` is one of `"absent"`. Occurrence state (present or absent) of a retry initiated solely to obtain diagnostics.'
    input_kind:
      kind: operation
      name: ci-failure-diagnostics
  - id: contract.ci-failure-diagnostics.workflow-evidence
    summary: Managed workflow failure summary definitions.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
    conditions:
      - id: ci-failure-diagnostics-workflow-source-available
        summary: The managed repository workflow sources are available for inspection.
    guarantees:
      - id: ci-failure-diagnostics-workflow-reason-bound
        boundary: boundary.workflow-definition
        statement: '`workflow-reasonless-source-rows` is one of `"absent"`. Occurrence state (present or absent) of a source job row declared in the summary-json input of a managed summary route without a reason that names the result of that source job.'
      - id: ci-failure-diagnostics-workflow-raw-result-bound
        boundary: boundary.workflow-definition
        statement: '`workflow-raw-resultless-source-rows` is one of `"absent"`. Occurrence state (present or absent) of a source job row declared in the summary-json input of a managed summary route without the raw result of that source job.'
      - id: ci-failure-diagnostics-workflow-summary-secret-safe
        boundary: boundary.workflow-definition
        statement: '`workflow-secret-safe-summary` is one of `"absent"`. Secret context references in managed diagnostic summary definitions; absent or present.'
      - id: ci-failure-diagnostics-workflow-diagnostic-order
        boundary: boundary.workflow-definition
        statement: '`workflow-diagnostic-order` places each aggregate diagnostic job after its declared source jobs via `needs`, and each same-job diagnostic step after the work it summarizes.'
      - id: ci-failure-diagnostics-workflow-source-result-retained
        boundary: boundary.workflow-definition
        statement: '`workflow-source-result-replacement` is one of `"absent"`. Aggregate diagnostic outcomes that replace an original source job result; absent or present.'
    input_kind:
      kind: operation
      name: ci-failure-diagnostics
  - id: contract.ci-failure-diagnostics.bootstrap-diagnostic
    summary: Prepared runtime state for the public runtime bootstrap.
    inputs:
      - name: prepared-runtime
        meaning: "Precondition prepared by the case: state of the prepared runtime that the bootstrap starts."
    conditions:
      - id: ci-failure-diagnostics-bootstrap-fails
        summary: The preset assurance bootstrap cannot locate its prepared runtime, its package metadata differs from the canonical runtime, or its dependency tree is invalid.
    guarantees:
      - id: ci-failure-diagnostics-bootstrap-stage-emitted
        boundary: boundary.diagnostic-result
        statement: "`failureEvidence.classification.stage` identifies runtime discovery, lock validation or dependency validation according to the failed bootstrap check."
      - id: ci-failure-diagnostics-bootstrap-reason-emitted
        boundary: boundary.diagnostic-result
        statement: "`reason` and `failureEvidence.classification.reason` identify the same bootstrap failure."
    input_kind:
      kind: operation
      name: ci-failure-diagnostics
  - id: contract.ci-failure-diagnostics.existing-state
    summary: Invocation of a selected contract boundary, read against pre-existing files that the boundary does not own.
    inputs:
      - name: failure
        meaning: "Precondition prepared by the case: failure that the contract target detects before it starts writing state."
      - name: existing-file
        meaning: "Precondition prepared by the case: file that exists before the invocation and that the contract target does not own or manage."
      - name: output-destination
        meaning: "Received by the contract target: path of the destination to which the contract target writes its output files."
    conditions:
      - id: ci-failure-diagnostics-rejected-before-write
        summary: Required inputs or external evidence are missing, unavailable or invalid at a validation boundary before writing to the output destination.
    guarantees:
      - id: failure-runner-temp-preserved
        boundary: boundary.runner-files
        statement: '`runner-temp-existing-file-content` is one of `"equal"`. Comparison of the content of a pre-existing file in the runner temporary directory that the contract target does not own, before and after the rejected invocation; equal or changed.'
      - id: failure-runner-temp-unextended
        boundary: boundary.runner-files
        statement: No new files remain in the runner temporary directory after the rejected invocation, apart from failure result output.
      - id: failure-target-root-preserved
        boundary: boundary.workspace-files
        statement: '`target-root-unmanaged-file-content` is one of `"equal"`. Comparison of the content of a pre-existing file in the target repository root that the contract target does not manage, before and after the rejected invocation; equal or changed.'
      - id: failure-target-root-unextended
        boundary: boundary.workspace-files
        statement: '`target-root-file-names` is one of `"equal"`. Comparison of the file names in the target repository root before and after the rejected invocation; equal or changed.'
      - id: failure-output-destination-unextended
        boundary: boundary.workspace-files
        statement: '`output-destination-file-names` is one of `"equal"`. Comparison of the file names in the output destination before and after the rejected invocation, excluding the failure result output; equal or changed.'
    input_kind:
      kind: operation
      name: ci-failure-diagnostics
