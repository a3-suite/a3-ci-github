version: 1
name: contract-subject
subject:
  id: subject.ci.failure-diagnostics
  summary: Expose actionable CI failure context and evidence without replacing the original failure or disclosing protected values.
contracts:
  - id: contract.ci-failure-diagnostics.actionable
    summary: Failure of a selected contract boundary.
    inputs:
      - name: failure
        meaning: "Precondition prepared by the case: failure that the instrumented CI processing encounters."
      - name: checkout
        meaning: "Precondition prepared by the case: source checked out for the failing run."
    observations:
      - summary: Failure evidence in final logs and existing referenced evidence.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-subject
            meaning: 失敗した契約対象の識別子。
          - selector: failure-operation
            meaning: 失敗した操作の識別子。
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
          - selector: failure-reason
            meaning: 失敗理由を表す安定した識別子。
          - selector: failure-cause
            meaning: 失敗原因の判別状態（known、unknown、unavailable のいずれか）。
          - selector: execution-context-run-binding
            meaning: Comparison of the run identifier in the failure diagnostic context with the identifier of the failing invocation workflow run; matched or different.
          - selector: execution-context-job-binding
            meaning: Comparison of the job identifier in the failure diagnostic context with the identifier of the failing invocation workflow job; matched or different.
          - selector: execution-context-source-binding
            meaning: Comparison of the source revision in the failure diagnostic context with the revision checked out for the failing invocation; matched or different.
          - selector: comparison-expected
            meaning: Expected value of the violated rule recorded in the diagnostic comparison.
          - selector: comparison-observed
            meaning: Observed value, or the unavailable reason, recorded in the diagnostic comparison.
          - selector: evidence-location-log
            meaning: Location of the original diagnostic in the workflow run, job and step log.
          - selector: execution-outcome
            meaning: 元の失敗の結果（failure または unresolved）。
          - selector: last-confirmed-stage
            meaning: 失敗前に最後に確定した段階の識別子。
          - selector: next-check-rule
            meaning: 次に確認すべき規則の識別子。
          - selector: known-cause-omission-state
            meaning: Occurrence state (present or absent) of a known safe specific cause omitted from the failure classification.
          - selector: unsubstantiated-context-state
            meaning: Occurrence state (present or absent) of context values presented without acquisition evidence.
          - selector: protected-input-disclosure-state
            meaning: Occurrence state (present or absent) of protected input values exposed in diagnostics.
          - selector: unchecked-output-disclosure-state
            meaning: Occurrence state (present or absent) of unchecked child process or provider output exposed in diagnostics.
          - selector: signed-url-disclosure-state
            meaning: Occurrence state (present or absent) of signed URLs exposed in diagnostics.
          - selector: whole-payload-disclosure-state
            meaning: Occurrence state (present or absent) of whole input, response, argv, or environment payloads exposed in diagnostics.
          - selector: original-diagnostic-loss-state
            meaning: Occurrence state (present or absent) of the primary diagnostic lost from final logs.
          - selector: invalid-evidence-reference-state
            meaning: Occurrence state (present or absent) of a reference to evidence that was not generated or retained.
          - selector: original-outcome-replacement-state
            meaning: Occurrence state (present or absent) of the original failure outcome replaced or made successful by diagnostic/summary handling.
          - selector: diagnostic-only-retry-state
            meaning: Occurrence state (present or absent) of a retry initiated solely to obtain diagnostics.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
    guarantees:
      - id: failure-subject-recorded
        claim:
          field: failure-subject
          present: true
      - id: failure-operation-recorded
        claim:
          field: failure-operation
          present: true
      - id: failure-stage-recorded
        claim:
          field: failure-stage
          present: true
      - id: failure-reason-recorded
        claim:
          field: failure-reason
          present: true
      - id: failure-cause-classified
        claim:
          field: failure-cause
          in:
            - known
            - unknown
            - unavailable
      - id: execution-context-run-bound
        claim:
          field: execution-context-run-binding
          in:
            - matched
      - id: execution-context-job-bound
        claim:
          field: execution-context-job-binding
          in:
            - matched
      - id: execution-context-source-bound
        claim:
          field: execution-context-source-binding
          in:
            - matched
      - id: comparison-expected-recorded
        claim:
          field: comparison-expected
          present: true
      - id: comparison-observed-recorded
        claim:
          field: comparison-observed
          present: true
      - id: evidence-location-recorded
        claim:
          field: evidence-location-log
          in:
            - workflow-run-job-step-log
      - id: execution-outcome-retained
        claim:
          field: execution-outcome
          in:
            - failure
            - unresolved
      - id: last-confirmed-stage-recorded
        claim:
          field: last-confirmed-stage
          present: true
      - id: next-check-rule-recorded
        claim:
          field: next-check-rule
          present: true
      - id: diagnostic-known-cause-omission
        claim:
          field: known-cause-omission-state
          in:
            - absent
      - id: diagnostic-unsubstantiated-context
        claim:
          field: unsubstantiated-context-state
          in:
            - absent
      - id: diagnostic-protected-input-disclosure
        claim:
          field: protected-input-disclosure-state
          in:
            - absent
      - id: diagnostic-unchecked-output-disclosure
        claim:
          field: unchecked-output-disclosure-state
          in:
            - absent
      - id: diagnostic-signed-url-disclosure
        claim:
          field: signed-url-disclosure-state
          in:
            - absent
      - id: diagnostic-whole-payload-disclosure
        claim:
          field: whole-payload-disclosure-state
          in:
            - absent
      - id: diagnostic-original-diagnostic-loss
        claim:
          field: original-diagnostic-loss-state
          in:
            - absent
      - id: diagnostic-invalid-evidence-reference
        claim:
          field: invalid-evidence-reference-state
          in:
            - absent
      - id: diagnostic-original-outcome-replacement
        claim:
          field: original-outcome-replacement-state
          in:
            - absent
      - id: diagnostic-diagnostic-only-retry
        claim:
          field: diagnostic-only-retry-state
          in:
            - absent
  - id: contract.ci-failure-diagnostics.workflow-evidence
    summary: Managed workflow failure summary definitions.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
    observations:
      - summary: Failure summary routes declared in managed workflow definitions.
        boundary: boundary.workflow-definition
        fields:
          - selector: workflow-reasonless-source-rows
            meaning: Occurrence state (present or absent) of a source job row declared in the summary-json input of a managed summary route without a reason that names the result of that source job.
          - selector: workflow-raw-resultless-source-rows
            meaning: Occurrence state (present or absent) of a source job row declared in the summary-json input of a managed summary route without the raw result of that source job.
          - selector: workflow-secret-safe-summary
            meaning: Secret context references in managed diagnostic summary definitions; absent or present.
          - selector: workflow-diagnostic-order
            meaning: Position of each managed aggregate diagnostic job relative to its source jobs; after-source-jobs or before-source-jobs.
          - selector: workflow-source-result-replacement
            meaning: Aggregate diagnostic outcomes that replace an original source job result; absent or present.
    conditions:
      - input: ci-failure-diagnostics-workflow-source-available
    guarantees:
      - id: ci-failure-diagnostics-workflow-reason-bound
        claim:
          field: workflow-reasonless-source-rows
          in:
            - absent
      - id: ci-failure-diagnostics-workflow-raw-result-bound
        claim:
          field: workflow-raw-resultless-source-rows
          in:
            - absent
      - id: ci-failure-diagnostics-workflow-summary-secret-safe
        claim:
          field: workflow-secret-safe-summary
          in:
            - absent
      - id: ci-failure-diagnostics-workflow-diagnostic-order
        claim:
          field: workflow-diagnostic-order
          in:
            - after-source-jobs
      - id: ci-failure-diagnostics-workflow-source-result-retained
        claim:
          field: workflow-source-result-replacement
          in:
            - absent
  - id: contract.ci-failure-diagnostics.bootstrap-diagnostic
    summary: Prepared runtime state for the public runtime bootstrap.
    inputs:
      - name: prepared-runtime
        meaning: "Precondition prepared by the case: state of the prepared runtime that the bootstrap starts."
    observations:
      - summary: Failure evidence declared by managed workflows or emitted by a public runtime bootstrap.
        boundary: boundary.diagnostic-result
        fields:
          - selector: bootstrap-failure-stage
            meaning: Failure stage identifier in the bootstrap failure envelope.
          - selector: bootstrap-failure-reason
            meaning: Stable failure reason identifier in the bootstrap failure envelope.
    conditions:
      - input: ci-failure-diagnostics-bootstrap-fails
    guarantees:
      - id: ci-failure-diagnostics-bootstrap-stage-emitted
        claim:
          field: bootstrap-failure-stage
          present: true
      - id: ci-failure-diagnostics-bootstrap-reason-emitted
        claim:
          field: bootstrap-failure-reason
          present: true
  - id: contract.ci-failure-diagnostics.existing-state
    summary: Invocation of a selected contract boundary, read against pre-existing files that the boundary does not own.
    inputs:
      - name: failure
        meaning: "Precondition prepared by the case: failure that the contract target detects before it starts writing state."
      - name: existing-file
        meaning: "Precondition prepared by the case: file that exists before the invocation and that the contract target does not own or manage."
      - name: output-destination
        meaning: "Received by the contract target: path of the destination to which the contract target writes its output files."
    observations:
      - summary: Files in the runner temporary directory before and after a rejected invocation.
        boundary: boundary.runner-files
        fields:
          - selector: runner-temp-existing-file-content
            meaning: Comparison of the content of a pre-existing file in the runner temporary directory that the contract target does not own, before and after the rejected invocation; equal or changed.
      - summary: Files in the target repository root and the output destination before and after a rejected invocation.
        boundary: boundary.workspace-files
        fields:
          - selector: target-root-unmanaged-file-content
            meaning: Comparison of the content of a pre-existing file in the target repository root that the contract target does not manage, before and after the rejected invocation; equal or changed.
          - selector: target-root-file-names
            meaning: Comparison of the file names in the target repository root before and after the rejected invocation; equal or changed.
          - selector: output-destination-file-names
            meaning: Comparison of the file names in the output destination before and after the rejected invocation, excluding the failure result output; equal or changed.
    conditions:
      - input: ci-failure-diagnostics-rejected-before-write
    guarantees:
      - id: failure-runner-temp-preserved
        claim:
          field: runner-temp-existing-file-content
          in:
            - equal
      - id: failure-target-root-preserved
        claim:
          field: target-root-unmanaged-file-content
          in:
            - equal
      - id: failure-target-root-unextended
        claim:
          field: target-root-file-names
          in:
            - equal
      - id: failure-output-destination-unextended
        claim:
          field: output-destination-file-names
          in:
            - equal
