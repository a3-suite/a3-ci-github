version: 1
name: contract-test-maps
subject_ref: subject.ci.failure-diagnostics
test_maps:
  - verification_id: verification.ci-failure-diagnostics.subject-declarations
    case_id: all-subject-diagnostics-defined
    tests:
      - path: tests/workflow-contracts.test.mjs
        symbol: "workflow-contracts > failure-diagnostics-contract > every packaged contract defines subject-specific diagnostics under the shared minimum"
        check_refs: [check.ci-failure-diagnostics.subject-contract-coverage]
  - verification_id: verification.ci-failure-diagnostics.workflow-evidence
    case_id: workflow-evidence-declared
    tests:
      - path: tests/workflow-contracts.test.mjs
        symbol: "workflow-contracts > failure-diagnostics-contract > managed workflows expose correlated secret-safe failure evidence without hiding source results"
        check_refs:
          - check.ci-failure-diagnostics.workflow-evidence
          - check.ci-failure-diagnostics.workflow-correlation
          - check.ci-failure-diagnostics.workflow-summary-secret-safe
          - check.ci-failure-diagnostics.workflow-source-state-preserved
  - verification_id: verification.ci-failure-diagnostics.bootstrap-diagnostic
    case_id: bootstrap-diagnostic-emitted
    tests:
      - path: runtime/preset/tests/preset-assurance-contract.test.mjs
        symbol: "contract.ci-failure-diagnostics.actionable > failure-diagnostics-contract > preset assurance rejects unavailable or inconsistent prepared runtime without changing the project"
        check_refs: [check.ci-failure-diagnostics.bootstrap-diagnostic]
      - path: runtime/preset/tests/preset-assurance-contract.test.mjs
        symbol: "contract.ci-failure-diagnostics.actionable > failure-diagnostics-contract > preset bootstrap confines dependency files and accepts internal symlink cycles"
        check_refs: [check.ci-failure-diagnostics.bootstrap-diagnostic]
      - path: runtime/preset/tests/preset-assurance-contract.test.mjs
        symbol: "contract.ci-failure-diagnostics.actionable > failure-diagnostics-contract > preset bootstrap reports unavailable npm and cleans up state after dependency command failures"
        check_refs: [check.ci-failure-diagnostics.bootstrap-diagnostic]
      - path: runtime/preset/tests/preset-assurance-contract.test.mjs
        symbol: "contract.ci-failure-diagnostics.actionable > failure-diagnostics-contract > preset bootstrap reports validator startup and completion failures without consumer changes"
        check_refs: [check.ci-failure-diagnostics.bootstrap-diagnostic]
      - path: runtime/preset/tests/preset-assurance-contract.test.mjs
        symbol: "preset-assurance-contract > failure-diagnostics-contract > preset assurance rejects a request without explicit roots"
        check_refs:
          - check.ci-failure-diagnostics.bootstrap-diagnostic
  - verification_id: verification.ci-failure-diagnostics.detailed-evidence
    case_id: known-validation-failure
    tests:
      - path: actions/ci-release-assembly/tests/entrypoint.test.ts
        symbol: "source entrypoint > missing build inventory retains the failing stage and exact missing entries"
        check_refs: [classification, context, comparison, retention, state, next-check]
  - verification_id: verification.ci-failure-diagnostics.detailed-evidence
    case_id: unknown-failure
    tests:
      - path: actions/ci-quality-summary/tests/entrypoint.test.ts
        symbol: "source entrypoint > retains source failure when unknown fails"
        check_refs: [classification, context, comparison, retention, state, next-check]
  - verification_id: verification.ci-failure-diagnostics.detailed-evidence
    case_id: external-request-failure
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "source entrypoint > runActionEntrypoint > publication entrypoint exposes safe diagnostics for http"
        check_refs: [classification, context, comparison, retention, state, next-check]
  - verification_id: verification.ci-failure-diagnostics.detailed-evidence
    case_id: child-process-failure
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint propagates owner failure without owner diagnostics"
        check_refs: [classification, context, comparison, retention, state, next-check]
  - verification_id: verification.ci-failure-diagnostics.detailed-evidence
    case_id: evidence-generation-failure
