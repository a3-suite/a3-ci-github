version: 1
name: contract-observations
subject_ref: subject.ci.failure-diagnostics
observations:
  - id: observation.ci-failure-diagnostics.result
    summary: Failure evidence declared by managed workflows or emitted by a public runtime bootstrap.
    boundary:
      ref: boundary.diagnostic-result
    value:
      root: diagnostic
      kind: object
      fields:
        - selector: workflow-evidence
          kind: observation_field
          meaning: Declared workflow summary route preserving evidence and reason fields.
        - selector: workflow-classification-correlation
          kind: observation_field
          meaning: Job-level result classification, reason, and workflow-run correlation exposed by every managed summary route.
        - selector: workflow-secret-safe-summary
          kind: observation_field
          meaning: Managed diagnostic summary definitions do not reference secret contexts.
        - selector: workflow-source-state-preserved
          kind: observation_field
          meaning: Aggregate diagnostics run after source jobs and classify their original result states without replacing them.
        - selector: bootstrap-diagnostic
          kind: observation_field
          meaning: Stable machine-readable failure envelope emitted before runtime validation starts.
        - selector: subject-contract-coverage
          kind: observation_field
          meaning: Every packaged subject and contract defines its failure diagnostic details and refers to the shared minimum; source inspection proves definitions only, independently of execution evidence.
  - id: observation.ci-failure-diagnostics.failure-evidence
    summary: Detailed failure evidence reconstructed from final logs and existing referenced evidence, without imposing a new universal serialized output format.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: classification
          kind: observation_field
          meaning: Contract subject or component, operation, failing stage, stable reason and observed cause classification.
        - selector: context
          kind: observation_field
          meaning: Observed run/job/step/matrix, source revision, platform/target, safe input/asset identities and external request correlation, including unavailable or inapplicable states.
        - selector: comparison
          kind: observation_field
          meaning: Applicable rule or violated field and safe expected/observed identities, versions, inventories, sizes and digests with their observation states.
        - selector: evidence-location
          kind: observation_field
          meaning: Locations and availability states of the original diagnostic, detailed reports and partial artifacts in final logs or existing evidence channels.
        - selector: execution-state
          kind: observation_field
          meaning: Original exit or classified outcome, last confirmed stage, write/partial-output/rollback state and diagnostic-retention outcome.
        - selector: next-check
          kind: observation_field
          meaning: Input, permission, tool, remote request or evidence identified by the observed reason and violated contract.
        - selector: known-cause-omission-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a known safe specific cause omitted from the failure classification.
        - selector: unsubstantiated-context-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of context values presented without acquisition evidence.
        - selector: unsafe-diagnostic-disclosure-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of protected inputs, unchecked child/provider output, signed URLs, or whole input/response/argv/environment payloads exposed in diagnostics.
        - selector: original-diagnostic-loss-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of the primary diagnostic lost from final logs.
        - selector: invalid-evidence-reference-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a reference to evidence that was not generated or retained.
        - selector: original-outcome-replacement-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of the original failure outcome replaced or made successful by diagnostic/summary handling.
        - selector: diagnostic-only-retry-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a retry initiated solely to obtain diagnostics.
        - selector: unsubstantiated-remediation-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of remediation or rerun safety asserted without applicable state evidence.
