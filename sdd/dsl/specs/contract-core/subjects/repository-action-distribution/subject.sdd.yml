version: 1
name: contract-subject
subject:
  id: subject.repository.action-distribution
  summary: Maintaining Action distribution inputs and the repository Action catalog consistently.
contracts:
  - id: contract.repository-action-distribution.integrity
    summary: Repository Action distribution gate invocation.
    inputs:
      - name: action-metadata
        meaning: "Received by the contract target: Action metadata file read by the distribution gate."
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: runtime-root
        meaning: "Received by the contract target: shared runtime root directory."
      - name: untracked-distribution-path
        meaning: "Precondition prepared by the case: distribution file or Composite Action referenced script that exists in the working tree but is not tracked by Git."
    observations:
      - summary: Distribution consistency result exposed by the repository distribution gate.
        boundary: boundary.repository-gate-result
        fields:
          - selector: distribution
            meaning: Distribution gate result.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.repository-action-distribution-inputs-available
      - environment: runtime-context.repository-action-distribution-inconsistent
    guarantees:
      - id: distribution-plan-produced
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        claim:
          field: distribution
          present: true
      - id: inconsistent-distribution-rejected
        applies_to:
          - runtime-context.repository-action-distribution-inconsistent
        claim:
          field: distribution
          in:
            - failure
      - id: diagnostic-failure-stage-integrity
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.repository-action-distribution.catalog
    summary: Repository Action catalog projection invocation.
    inputs:
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: catalog-path
        meaning: "Received by the contract target: path to the Action catalog file."
    observations:
      - summary: Catalog projection result exposed by the repository catalog gate.
        boundary: boundary.repository-gate-result
        fields:
          - selector: catalog
            meaning: Maintained Action catalog projection written by the gate.
          - selector: catalog-action-set
            meaning: Comparison of projected catalog Action rows with discovered Action directories; matched or mismatched.
          - selector: catalog-usage-text
            meaning: Comparison of curated usage text before and after projection; equal or changed.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.repository-action-catalog-inputs-available
    guarantees:
      - id: action-catalog-projected
        applies_to:
          - runtime-context.repository-action-catalog-inputs-available
        claim:
          field: catalog
          present: true
      - id: catalog-action-set-matched
        applies_to:
          - runtime-context.repository-action-catalog-inputs-available
        claim:
          field: catalog-action-set
          in:
            - matched
      - id: catalog-usage-text-preserved
        applies_to:
          - runtime-context.repository-action-catalog-inputs-available
        claim:
          field: catalog-usage-text
          in:
            - equal
      - id: diagnostic-failure-stage-catalog
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.repository-action-distribution.source-verification
    summary: Repository Action source verification planning invocation.
    inputs:
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: prepared-by
        meaning: "Precondition prepared by the case: process that prepared the distribution input."
    observations:
      - summary: Source verification plan exposed by the repository source verification gate.
        boundary: boundary.repository-gate-result
        fields:
          - selector: source-verification
            meaning: Source verification plan of typecheck and test steps.
          - selector: source-verification-action-coverage
            meaning: Comparison of discovered bundled Actions with Actions contributing typecheck and test steps; matched or missing.
          - selector: source-verification-runtime-tests
            meaning: Comparison of shared Action runtime cores with cores contributing focused tests; matched or missing.
          - selector: source-verification-rebuild
            meaning: Dependency installation or distribution build steps inside the source verification plan; absent or present.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.repository-action-distribution-inputs-available
    guarantees:
      - id: action-source-verification-plan-produced
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        claim:
          field: source-verification
          present: true
      - id: source-verification-actions-covered
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        claim:
          field: source-verification-action-coverage
          in:
            - matched
      - id: source-verification-runtime-tests-covered
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        claim:
          field: source-verification-runtime-tests
          in:
            - matched
      - id: source-verification-without-rebuild
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        claim:
          field: source-verification-rebuild
          in:
            - absent
      - id: diagnostic-failure-stage-source-verification
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.repository-action-distribution.release-version
    summary: Release tag alias update request against the repository VERSION and the integrated release source.
    inputs:
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: repository-version
        meaning: "Received by the contract target: content of the repository VERSION file."
      - name: source-revision
        meaning: "Received by the contract target: source revision identifier."
      - name: validation-mode
        meaning: "Received by the contract target: whether the invocation only validates the release source or also updates the aliases."
      - name: integration
        meaning: "Precondition prepared by the case: relation between the release source and the main branch history."
      - name: main-tip-tree
        meaning: "Precondition prepared by the case: tree of the main branch tip compared with the approved source tree."
      - name: branch-tip
        meaning: "Precondition prepared by the case: tip of the release branch compared with the release tag."
      - name: remote-alias-push
        meaning: "Precondition prepared by the case: response of the remote to the alias push."
      - name: alias-state
        meaning: "Precondition prepared by the case: alias tags that already exist on the remote before the invocation."
    observations:
      - summary: Release version comparison and release source integration exposed by the release alias updater.
        boundary: boundary.repository-gate-result
        fields:
          - selector: release-version
            meaning: Comparison of the target source VERSION with the version of the exact release tag; equal, or failure when VERSION is missing, invalid, or different.
          - selector: aliasSourceIntegration
            meaning: Main integration state of the release tag source checked before alias update; integrated, canonical-hotfix-tip or not-integrated.
          - selector: diagnostic
            meaning: Stable failure evidence of the rejected alias update.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - summary: Release tags that the remote holds after an alias update invocation.
        boundary: boundary.remote-release-tags
        fields:
          - selector: alias-tag-comparison
            meaning: Comparison of the major and minor alias tags of the release tag on the remote before and after the invocation; equal or changed.
          - selector: alias-source-comparison
            meaning: Comparison of the source commit of each alias tag with the source commit of the newest release tag of the same line; equal or different.
          - selector: release-tag-object-comparison
            meaning: Comparison of the objects of the exact release tags on the remote before and after the invocation; equal or changed.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.repository-exact-release-tag-available
      - environment: runtime-context.repository-release-version-invalid-or-mismatched
      - environment: runtime-context.repository-release-alias-update-valid
      - environment: runtime-context.repository-release-alias-update-applied
      - environment: runtime-context.repository-release-alias-update-invalid
    guarantees:
      - id: release-version-confirmed
        applies_to:
          - runtime-context.repository-exact-release-tag-available
        claim:
          field: release-version
          in:
            - equal
      - id: invalid-or-mismatched-release-version-rejected
        applies_to:
          - runtime-context.repository-release-version-invalid-or-mismatched
        claim:
          field: release-version
          in:
            - failure
      - id: alias-source-integrated
        applies_to:
          - runtime-context.repository-release-alias-update-valid
          - runtime-context.repository-release-alias-update-applied
        claim:
          field: aliasSourceIntegration
          in:
            - integrated
            - canonical-hotfix-tip
      - id: alias-tags-preserved
        applies_to:
          - runtime-context.repository-release-version-invalid-or-mismatched
          - runtime-context.repository-release-alias-update-valid
          - runtime-context.repository-release-alias-update-invalid
        claim:
          field: alias-tag-comparison
          in:
            - equal
      - id: alias-follows-newest-release
        applies_to:
          - runtime-context.repository-release-alias-update-applied
        claim:
          field: alias-source-comparison
          in:
            - equal
      - id: immutable-release-tags-preserved
        applies_to:
          - runtime-context.repository-release-alias-update-applied
          - runtime-context.failure-diagnostic-required
        claim:
          field: release-tag-object-comparison
          in:
            - equal
      - id: alias-update-rejected
        applies_to:
          - runtime-context.repository-release-alias-update-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-release-version
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
