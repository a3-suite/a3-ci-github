version: 1
name: contract-subject
subject:
  id: subject.repository.action-distribution
  summary: Maintaining Action distribution inputs and the repository Action catalog consistently.
contracts:
  - id: contract.repository-action-distribution.integrity
    summary: Repository Action distribution gate invocation.
    inputs:
      - name: action-metadata
        meaning: "Received by the contract target: Action metadata file read by the distribution gate."
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: runtime-root
        meaning: "Received by the contract target: shared runtime root directory."
      - name: untracked-distribution-path
        meaning: "Precondition prepared by the case: distribution file or Composite Action referenced script that exists in the working tree but is not tracked by Git."
    conditions:
      - id: runtime-context.repository-action-distribution-inputs-available
        summary: The available Action metadata and build inputs are valid, required distribution and script paths are tracked, and rebuilding produces the expected tracked distribution bytes.
      - id: runtime-context.repository-action-distribution-inconsistent
        summary: Required metadata, build inputs or tracked paths are missing or invalid, a build fails, or a rebuilt distribution differs from the tracked distribution. An untracked distribution file also causes rejection.
    guarantees:
      - id: consistent-distribution-accepted
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        boundary: boundary.repository-gate-result
        statement: '`distribution` is one of `"success"`. Distribution gate result; success or failure.'
      - id: inconsistent-distribution-rejected
        applies_to:
          - runtime-context.repository-action-distribution-inconsistent
        boundary: boundary.repository-gate-result
        statement: '`distribution` is one of `"failure"`. Distribution gate result; success or failure.'
      - id: diagnostic-failure-stage-integrity
        applies_to:
          - runtime-context.repository-action-distribution-inconsistent
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: repository-action-distribution
  - id: contract.repository-action-distribution.catalog
    summary: Repository Action catalog projection invocation.
    inputs:
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: catalog-path
        meaning: "Received by the contract target: path to the Action catalog file."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: Catalog check mode detects a stale catalog or cannot read or project its inputs.
      - id: runtime-context.repository-action-catalog-inputs-available
        summary: Catalog projection reads the current catalog and discovered Action metadata for regeneration.
    guarantees:
      - id: catalog-action-set-matched
        applies_to:
          - runtime-context.repository-action-catalog-inputs-available
        boundary: boundary.repository-gate-result
        statement: '`catalog-action-set` is one of `"matched"`. Comparison of projected catalog Action rows with discovered Action directories; matched or mismatched.'
      - id: diagnostic-failure-stage-catalog
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: repository-action-distribution
  - id: contract.repository-action-distribution.source-verification
    summary: Repository Action source verification planning invocation.
    inputs:
      - name: actions-root
        meaning: "Received by the contract target: Actions root directory."
      - name: prepared-by
        meaning: "Precondition prepared by the case: process that prepared the distribution input."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: Source verification encounters invalid metadata or a selected typecheck or test command fails.
      - id: runtime-context.repository-action-distribution-inputs-available
        summary: Discovered bundled Action metadata and shared runtime test configuration are valid, and their selected verification commands succeed. Action definitions, build metadata, tracked distribution paths, and Composite Action script references are available to the distribution gate.
    guarantees:
      - id: source-verification-actions-covered
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        boundary: boundary.repository-gate-result
        statement: '`source-verification-action-coverage` is one of `"matched"`. Comparison of discovered bundled Actions with Actions contributing typecheck and test steps; matched or missing.'
      - id: source-verification-runtime-tests-covered
        applies_to:
          - runtime-context.repository-action-distribution-inputs-available
        boundary: boundary.repository-gate-result
        statement: '`source-verification-runtime-tests` is one of `"matched"`. Comparison of shared Action runtime cores with cores contributing focused tests; matched or missing.'
      - id: diagnostic-failure-stage-source-verification
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: repository-action-distribution
  - id: contract.repository-action-distribution.release-version
    summary: Release tag alias update request against the repository VERSION and the integrated release source.
    inputs:
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: repository-version
        meaning: "Received by the contract target: content of the repository VERSION file."
      - name: source-revision
        meaning: "Received by the contract target: source revision identifier."
      - name: validation-mode
        meaning: "Received by the contract target: whether the invocation only validates the release source or also updates the aliases."
      - name: integration
        meaning: "Precondition prepared by the case: relation between the release source and the main branch history."
      - name: main-tip-tree
        meaning: "Precondition prepared by the case: tree of the main branch tip compared with the approved source tree."
      - name: branch-tip
        meaning: "Precondition prepared by the case: tip of the release branch compared with the release tag."
      - name: remote-alias-push
        meaning: "Precondition prepared by the case: response of the remote to the alias push."
      - name: alias-state
        meaning: "Precondition prepared by the case: alias tags that already exist on the remote before the invocation."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The caller selects update mode and release identity, VERSION and source validation succeed, but alias observation, preparation, push or readback fails.
      - id: runtime-context.repository-release-version-invalid-or-mismatched
        summary: The target source commit has no VERSION, its VERSION is not a valid X.Y.Z release version, or that version differs from the exact release tag.
      - id: runtime-context.repository-release-alias-update-valid
        summary: An alias update request with validation-mode validate-only names an annotated release tag whose release VERSION matches the tag and whose source is integrated into main or is the canonical hotfix tip.
      - id: runtime-context.repository-release-alias-update-applied
        summary: An alias update request with validation-mode update names an annotated release tag whose release VERSION matches the tag and whose source is integrated into main or is the canonical hotfix tip, and the remote accepts every alias tag push that the update needs, whether the aliases are absent, older, equal to the release, or newer. Post-push readback confirms each updated alias.
      - id: runtime-context.repository-release-alias-update-invalid
        summary: The invocation stops before alias observation because release identity, repository or origin availability, tag provenance, source integration, or mode validation fails. VERSION rejection has its own condition. Source integration rejection includes a stale hotfix branch or base.
    guarantees:
      - id: release-version-confirmed
        applies_to:
          - runtime-context.repository-release-alias-update-valid
          - runtime-context.repository-release-alias-update-applied
        boundary: boundary.repository-gate-result
        statement: 'The release-version check accepts the exact release tag when its version equals the valid release SemVer in the target commit’s VERSION file.'
      - id: invalid-or-mismatched-release-version-rejected
        applies_to:
          - runtime-context.repository-release-version-invalid-or-mismatched
        boundary: boundary.repository-gate-result
        statement: 'The gate fails at release-version when the target commit has no VERSION, its VERSION is invalid, or it differs from the exact release tag.'
      - id: alias-source-integrated
        applies_to:
          - runtime-context.repository-release-alias-update-valid
          - runtime-context.repository-release-alias-update-applied
        boundary: boundary.repository-gate-result
        statement: '`aliasSourceIntegration` is one of `"integrated"`, `"canonical-hotfix-tip"`. Main integration state of the release tag source checked before alias update; integrated, canonical-hotfix-tip or not-integrated.'
      - id: alias-tags-preserved
        applies_to:
          - runtime-context.repository-release-version-invalid-or-mismatched
          - runtime-context.repository-release-alias-update-valid
          - runtime-context.repository-release-alias-update-invalid
        boundary: boundary.remote-release-tags
        statement: '`alias-tag-comparison` is one of `"equal"`. Comparison of the major and minor alias tags of the release tag on the remote before and after the invocation; equal or changed.'
      - id: alias-follows-newest-release
        applies_to:
          - runtime-context.repository-release-alias-update-applied
        boundary: boundary.remote-release-tags
        statement: '`alias-source-comparison` is one of `"equal"`. An alias absent or older before this update points to the approved release source. An alias already bound to a newer release retains its source.'
      - id: immutable-release-tags-preserved
        applies_to:
          - runtime-context.repository-release-alias-update-applied
          - runtime-context.failure-diagnostic-required
        boundary: boundary.remote-release-tags
        statement: '`release-tag-object-comparison` is one of `"equal"`. Comparison of the objects of the exact release tags on the remote before and after the invocation; equal or changed.'
      - id: diagnostic-failure-stage-release-version
        applies_to:
          - runtime-context.failure-diagnostic-required
          - runtime-context.repository-release-version-invalid-or-mismatched
          - runtime-context.repository-release-alias-update-invalid
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: repository-action-distribution
