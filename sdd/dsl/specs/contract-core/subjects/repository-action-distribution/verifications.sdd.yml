version: 1
name: contract-verifications
cases:
  - contract_id: contract.repository-action-distribution.integrity
    id: detailed-failure-integrity
    partition: runtime-context.failure-diagnostic-required
    input:
      action-metadata: missing-runtime
  - contract_id: contract.repository-action-distribution.integrity
    id: maintained-distribution-inputs
    partition: runtime-context.repository-action-distribution-inputs-available
    input:
      actions-root: actions
      runtime-root: runtime
    verifies:
      - distribution-plan-produced
  - contract_id: contract.repository-action-distribution.integrity
    id: inconsistent-distribution-state
    partition: runtime-context.repository-action-distribution-inconsistent
    input:
      actions-root: actions
      runtime-root: runtime
      untracked-distribution-path: runtime/installer/dist/extra.js
  - contract_id: contract.repository-action-distribution.integrity
    id: untracked-composite-reference
    partition: runtime-context.repository-action-distribution-inconsistent
    input:
      actions-root: actions
      runtime-root: runtime
      untracked-distribution-path: scripts/example/run.sh
  - contract_id: contract.repository-action-distribution.catalog
    id: maintained-action-catalog
    partition: runtime-context.repository-action-catalog-inputs-available
    input:
      actions-root: actions
      catalog-path: README.md
    verifies:
      - action-catalog-projected
      - catalog-action-set-matched
      - catalog-usage-text-preserved
  - contract_id: contract.repository-action-distribution.source-verification
    id: maintained-action-source-verification
    partition: runtime-context.repository-action-distribution-inputs-available
    input:
      actions-root: actions
      prepared-by: distribution-plan
    verifies:
      - action-source-verification-plan-produced
      - source-verification-actions-covered
      - source-verification-runtime-tests-covered
      - source-verification-without-rebuild
  - contract_id: contract.repository-action-distribution.release-version
    id: matching-release-version
    partition: runtime-context.repository-exact-release-tag-available
    input:
      tag: v1.2.3
      repository-version: 1.2.3
  - contract_id: contract.repository-action-distribution.release-version
    id: missing-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: missing
  - contract_id: contract.repository-action-distribution.release-version
    id: noncanonical-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: 01.2.3
  - contract_id: contract.repository-action-distribution.release-version
    id: mismatched-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: 1.2.4
  - contract_id: contract.repository-action-distribution.catalog
    id: detailed-failure-catalog
    partition: runtime-context.failure-diagnostic-required
    input:
      actions-root: actions
      catalog-path: README.md without the Action catalog section
  - contract_id: contract.repository-action-distribution.source-verification
    id: detailed-failure-source-verification
    partition: runtime-context.failure-diagnostic-required
    input:
      actions-root: actions containing an Action without TypeScript tests
      prepared-by: distribution-plan
  - contract_id: contract.repository-action-distribution.release-version
    id: detailed-failure-release-version
    partition: runtime-context.failure-diagnostic-required
    input:
      tag: v1.2.3
      repository-version: 01.2.3
    verifies:
      - diagnostic-failure-stage-release-version
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-invalid-hotfix-tip-advanced
    partition: runtime-context.repository-release-alias-update-invalid
    input:
      validation-mode: validate-only
      branch-tip: advanced after the release tag
  - contract_id: contract.repository-action-distribution.release-version
    id: development-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: 1.2.3-dev.0
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-valid-published-hotfix-squash
    partition: runtime-context.repository-release-alias-update-valid
    input:
      tag: v1.2.4
      validation-mode: validate-only
      integration: next patch of a release whose hotfix was squash-integrated into main
    verifies:
      - alias-source-integrated
      - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-valid-main-tip-tree
    partition: runtime-context.repository-release-alias-update-valid
    input:
      tag: v2.0.0
      validation-mode: validate-only
      main-tip-tree: same-as-approved-source-tree
    verifies:
      - alias-source-integrated
      - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-valid-canonical-hotfix-tip
    partition: runtime-context.repository-release-alias-update-valid
    input:
      tag: v1.2.3
      validation-mode: validate-only
      branch-tip: canonical next-patch hotfix tip not yet integrated into main
    verifies:
      - alias-source-integrated
      - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-invalid-historical-squash
    partition: runtime-context.repository-release-alias-update-invalid
    input:
      main-tip-tree: different-from-approved-source-tree
      integration: historical-squash-only
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-invalid-same-version-different-tree
    partition: runtime-context.repository-release-alias-update-invalid
    input:
      main-tip-tree: same version with a different tree
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-invalid-unrelated-hotfix-source
    partition: runtime-context.repository-release-alias-update-invalid
    input:
      integration: unrelated source with a tree-equivalent main
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-invalid-evidence-unavailable
    partition: runtime-context.repository-release-alias-update-invalid
    input:
      integration: integration evidence cannot be acquired
  - contract_id: contract.repository-action-distribution.release-version
    id: detailed-failure-alias-update
    partition: runtime-context.failure-diagnostic-required
    input:
      tag: v1.2.3
      remote-alias-push: rejected by the remote
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-applied-new-aliases
    partition: runtime-context.repository-release-alias-update-applied
    input:
      tag: v1.2.3
      validation-mode: update
      alias-state: absent
    verifies:
      - alias-follows-newest-release
      - immutable-release-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-applied-published-hotfix-squash
    partition: runtime-context.repository-release-alias-update-applied
    input:
      tag: v1.2.4
      validation-mode: update
      integration: next patch of a release whose hotfix was squash-integrated into main
  - contract_id: contract.repository-action-distribution.release-version
    id: alias-update-applied-never-regresses
    partition: runtime-context.repository-release-alias-update-applied
    input:
      tag: v1.2.3
      validation-mode: update
      alias-state: major alias already at a newer release
    verifies:
      - alias-follows-newest-release
