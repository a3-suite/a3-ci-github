version: 1
name: contract-verifications
cases:
  - contract_id: contract.repository-action-distribution.integrity
    id: detailed-failure-integrity
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.repository-action-distribution.integrity
    id: maintained-distribution-inputs
    partition: runtime-context.repository-action-distribution-inputs-available
    input:
      actions-root: actions
      runtime-root: runtime
    verifies:
      - distribution-plan-produced
  - contract_id: contract.repository-action-distribution.integrity
    id: inconsistent-distribution-state
    partition: runtime-context.repository-action-distribution-inconsistent
    input:
      actions-root: actions
      runtime-root: runtime
  - contract_id: contract.repository-action-distribution.integrity
    id: maintained-action-catalog
    partition: runtime-context.repository-action-catalog-inputs-available
    input:
      actions-root: actions
      catalog-path: README.md
    verifies:
      - action-catalog-projected
      - catalog-action-set-matched
      - catalog-usage-text-preserved
  - contract_id: contract.repository-action-distribution.integrity
    id: maintained-action-contract-coverage
    partition: runtime-context.repository-action-catalog-inputs-available
    input:
      actions-root: actions
      contract-package: sdd/dsl/specs/contract-core/contract-package.sdd.yml
    verifies:
      - action-contract-coverage-confirmed
      - action-contract-subject-covered
      - action-contract-output-covered
  - contract_id: contract.repository-action-distribution.integrity
    id: maintained-action-source-verification
    partition: runtime-context.repository-action-distribution-inputs-available
    input:
      actions-root: actions
      prepared-by: distribution-plan
    verifies:
      - action-source-verification-plan-produced
      - source-verification-actions-covered
      - source-verification-runtime-tests-covered
      - source-verification-without-rebuild
  - contract_id: contract.repository-action-distribution.integrity
    id: matching-release-version
    partition: runtime-context.repository-exact-release-tag-available
    input:
      tag: v1.2.3
      repository-version: 1.2.3
  - contract_id: contract.repository-action-distribution.integrity
    id: missing-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: missing
  - contract_id: contract.repository-action-distribution.integrity
    id: noncanonical-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: 01.2.3
  - contract_id: contract.repository-action-distribution.integrity
    id: mismatched-release-version
    partition: runtime-context.repository-release-version-invalid-or-mismatched
    input:
      tag: v1.2.3
      repository-version: 1.2.4
