version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.repository-action-distribution.integrity
    case_id: maintained-distribution-inputs
    tests:
      - path: tests/action-dist-gate.process.test.mjs
        symbol: contract.repository-action-distribution.integrity > repository-action-distribution-gates > gate CLI accepts a consistent distribution
        guarantees:
          - distribution-plan-produced
  - contract_id: contract.repository-action-distribution.integrity
    case_id: inconsistent-distribution-state
    tests:
      - path: tests/action-dist-gate.process.test.mjs
        symbol: contract.repository-action-distribution.integrity > repository-action-distribution-gates > gate CLI rejects a build that leaves an untracked dist file
        guarantees:
          - inconsistent-distribution-rejected
  - contract_id: contract.repository-action-distribution.integrity
    case_id: untracked-composite-reference
    tests:
      - path: tests/action-dist-gate.process.test.mjs
        symbol: contract.repository-action-distribution.integrity > repository-action-distribution-gates > gate CLI rejects a Composite Action that references an untracked script
        guarantees:
          - inconsistent-distribution-rejected
  - contract_id: contract.repository-action-distribution.catalog
    case_id: maintained-action-catalog
    tests:
      - path: tests/action-index-gate.test.mjs
        symbol: contract.repository-action-distribution.catalog > repository-action-distribution-gates > preserves curated rows and appends newly discovered actions
        guarantees:
          - action-catalog-projected
          - catalog-action-set-matched
          - catalog-usage-text-preserved
      - path: tests/action-index-gate.test.mjs
        symbol: contract.repository-action-distribution.catalog > repository-action-distribution-gates > removes rows for deleted actions
        guarantees:
          - action-catalog-projected
          - catalog-action-set-matched
  - contract_id: contract.repository-action-distribution.source-verification
    case_id: maintained-action-source-verification
    tests:
      - path: tests/action-package-verification.process.test.mjs
        symbol: contract.repository-action-distribution.source-verification > repository-action-source-verification > source verification CLI typechecks and tests every bundled Action and shared runtime test without install or build
        guarantees:
          - action-source-verification-plan-produced
          - source-verification-actions-covered
          - source-verification-runtime-tests-covered
          - source-verification-without-rebuild
  - contract_id: contract.repository-action-distribution.release-version
    case_id: matching-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater creates major and minor aliases idempotently
        guarantees:
          - release-version-confirmed
  - contract_id: contract.repository-action-distribution.release-version
    case_id: missing-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater rejects missing and invalid repository VERSION
        guarantees:
          - invalid-or-mismatched-release-version-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: noncanonical-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater rejects missing and invalid repository VERSION
        guarantees:
          - invalid-or-mismatched-release-version-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: mismatched-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater rejects a tag that differs from repository VERSION
        guarantees:
          - invalid-or-mismatched-release-version-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.integrity
    case_id: detailed-failure-integrity
    tests:
      - path: tests/runtime-failure-diagnostics.test.mjs
        symbol: runtime failure diagnostics > repository distribution retains the failing metadata gate before build
        guarantees:
          - diagnostic-failure-stage-integrity
  - contract_id: contract.repository-action-distribution.catalog
    case_id: detailed-failure-catalog
    pending:
      - guarantees: [diagnostic-failure-stage-catalog]
        reason: case の入力で catalog gate を実行し、失敗の段階が診断に残ることを確かめるテストが無い。
  - contract_id: contract.repository-action-distribution.source-verification
    case_id: detailed-failure-source-verification
    pending:
      - guarantees: [diagnostic-failure-stage-source-verification]
        reason: case の入力で source verification gate を実行し、失敗の段階が診断に残ることを確かめるテストが無い。
  - contract_id: contract.repository-action-distribution.release-version
    case_id: detailed-failure-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater rejects missing and invalid repository VERSION
        guarantees:
          - diagnostic-failure-stage-release-version
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-invalid-hotfix-tip-advanced
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > canonical next-patch hotfix can publish before main integration and rejects stale branch or base
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: development-release-version
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release tags reject development VERSION even when integrated into main
        guarantees:
          - invalid-or-mismatched-release-version-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-valid-published-hotfix-squash
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > published hotfix squash integration permits the next patch and preserves immutable tags and newer aliases
        guarantees:
          - alias-source-integrated
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-valid-main-tip-tree
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > ordinary release accepts only the current main tip tree and refuses historical squash trees
        guarantees:
          - alias-source-integrated
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-valid-canonical-hotfix-tip
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > canonical next-patch hotfix can publish before main integration and rejects stale branch or base
        guarantees:
          - alias-source-integrated
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-invalid-historical-squash
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > ordinary release accepts only the current main tip tree and refuses historical squash trees
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-invalid-same-version-different-tree
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > squash integrated base rejects a same-version main with different content
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > squash integrated base rejects a same-version main with different mode
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-invalid-unrelated-hotfix-source
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > tree-equivalent main does not authorize an unrelated next hotfix source
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-invalid-evidence-unavailable
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > integration evidence acquisition failure stops publication at main
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > integration evidence acquisition failure stops publication at tree
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > integration evidence acquisition failure stops publication at ancestry
        guarantees:
          - alias-update-rejected
          - alias-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: detailed-failure-alias-update
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > alias push failure retains native exit and uncertain remote state without moving exact tags
        guarantees:
          - diagnostic-failure-stage-release-version
          - immutable-release-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-applied-new-aliases
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater creates major and minor aliases idempotently
        guarantees:
          - alias-follows-newest-release
          - immutable-release-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-applied-published-hotfix-squash
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > published hotfix squash integration permits the next patch and preserves immutable tags and newer aliases
        guarantees:
          - alias-source-integrated
          - alias-follows-newest-release
          - immutable-release-tags-preserved
  - contract_id: contract.repository-action-distribution.release-version
    case_id: alias-update-applied-never-regresses
    tests:
      - path: runtime/repository/tests/update-release-aliases.process.test.mjs
        symbol: repository-release-alias-update > release alias updater never regresses an alias to an older release
        guarantees:
          - alias-follows-newest-release
