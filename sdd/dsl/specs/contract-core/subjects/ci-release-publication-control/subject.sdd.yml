version: 1
name: contract-subject
subject:
  id: subject.ci.release-publication-control
  summary: Bind release publication requests, provenance, and approval evidence.
contracts:
  - id: contract.ci-release-publication-control.outputs
    summary: Release publication control operation request.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: workflow-run
        meaning: "Precondition prepared by the case: triggering workflow run."
      - name: approval-id
        meaning: "Precondition prepared by the case: state of the approval identity."
      - name: release-version
        meaning: "Received by the contract target: release version passed to the Action."
      - name: target-identity
        meaning: "Received by the contract target: target identity bound to the handoff."
      - name: schema
        meaning: "Received by the contract target: schema of the publication request file."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.release-publication-request-verified
        summary: The invocation meets the shared runtime context `runtime-context.release-publication-request-verified`.
      - id: runtime-context.request-trigger-verification-invoked
        summary: The invocation meets the shared runtime context `runtime-context.request-trigger-verification-invoked`.
      - id: runtime-context.action-input-invalid
        summary: The invocation meets the shared runtime context `runtime-context.action-input-invalid`.
    guarantees:
      - id: publication-control-status-succeeded
        applies_to:
          - runtime-context.release-publication-request-verified
        boundary: boundary.action-output
        statement: '`status` is one of `"success"`. Publication control operation status.'
      - id: publication-request-run-id-produced
        applies_to:
          - runtime-context.release-publication-request-verified
        boundary: boundary.action-output
        statement: "`request-run-id` is present. Verified release request workflow run ID."
      - id: publication-control-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected publication control step.'
      - id: rejected-publication-control-no-request-handoff
        applies_to:
          - runtime-context.action-input-invalid
        boundary: boundary.workspace-files
        statement: '`request-handoff-directories-created-count` is one of `"0"`. Number of the directories release-publication-request and release-notes-handoff in the root directory that did not exist before the invocation and exist after it, as a decimal integer string.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: request-trigger-run-bound
        applies_to:
          - runtime-context.request-trigger-verification-invoked
        boundary: boundary.action-output
        statement: '`accepted-trigger-run` is one of `"successful-default-branch-dispatch-of-own-request-workflow"`, `"absent"`. Kind of the triggering workflow run that verify-trigger accepts, identified by its repository, workflow name and path, event, conclusion and head branch; absent when verify-trigger rejects the run.'
    input_kind:
      kind: operation
      name: ci-release-publication-control
