version: 1
name: contract-clauses
subject_ref: subject.ci.release-publication-control
contracts:
  - id: contract.ci-release-publication-control.outputs
    summary: Publication control accepts only ci.release-publication-request.v2 with explicit owner version and target; create-request requires those inputs, and verification reads them from the request. Expose completion status and verified request identity.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: publication-operation-present
        input_predicate:
          kind: input
          term: input.operation
          op: present
      - id: publication-request-verified
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-publication-request-verified
          op: available
      - id: request-trigger-verification-invoked
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.request-trigger-verification-invoked
          op: available
      - id: publication-control-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.action-input-invalid
          op: available
    guarantees:
      - id: publication-control-status-produced
        when: publication-operation-present
        observation_ref: observation.ci-release-publication-control.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: publication-request-run-id-produced
        when: publication-request-verified
        observation_ref: observation.ci-release-publication-control.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: request-run-id
      - id: publication-control-failure-propagated
        when: publication-control-rejected
        observation_ref: observation.ci-release-publication-control.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-release-publication-control.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
      - id: request-trigger-run-bound
        when: request-trigger-verification-invoked
        observation_ref: observation.ci-release-publication-control.trigger-verification
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-trigger-run
            right:
              kind: value_set
              values:
                - successful-default-branch-dispatch-of-own-request-workflow
                - absent
    verification_intents:
      - id: request-trigger-verified
        goal: Verify that verify-trigger reports its status and never accepts a triggering run that differs from a successful default-branch dispatch of the caller's own request workflow.
        guarantee_refs:
          - publication-control-status-produced
          - request-trigger-run-bound
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [diagnostic-details-outputs]
      - id: publication-request-binding
        goal: A created publication request can be verified against workflow evidence.
        guarantee_refs:
          - publication-control-status-produced
          - publication-request-run-id-produced
      - id: publication-control-rejected
        goal: Publication control fails on unsupported request schema, missing or invalid owner decision, approval/provenance mismatch, or a trigger that is not a successful default-branch dispatch of the request workflow.
        guarantee_refs:
          - publication-control-failure-propagated
