version: 1
name: contract-observations
subject_ref: subject.ci.release-publication-control
observations:
  - id: observation.ci-release-publication-control.outputs
    summary: The Action exposes the publication control status and verified request identity when available.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Publication control operation status.
        - selector: request-run-id
          kind: observation_field
          meaning: Verified release request workflow run ID.
  - id: observation.ci-release-publication-control.result
    summary: The Action exposes its failed step outcome when publication control input is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected publication control step.
  - id: observation.ci-release-publication-control.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "operation・request run取得・workflow/source/permission/設定照合の段階、repository、要求run/source/workflow identity、違反fieldと期待/観測identity、provider HTTP相関情報、発行済みrequestの確定/不明状態を表す診断情報。"
  - id: observation.ci-release-publication-control.trigger-verification
    summary: The Action exposes whether verify-trigger accepted the triggering workflow run before request artifacts are downloaded.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: accepted-trigger-run
          kind: observation_field
          meaning: Kind of the triggering workflow run that verify-trigger accepts, identified by its repository, workflow name and path, event, conclusion and head branch; absent when verify-trigger rejects the run.
