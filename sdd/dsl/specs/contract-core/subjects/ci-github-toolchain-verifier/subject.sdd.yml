version: 1
name: contract-subject
subject:
  id: subject.ci.github-toolchain-verifier
  summary: Verifying exact GitHub CI tool versions through a shared script.
contracts:
  - id: contract.ci-github-toolchain-verifier.processing
    summary: The shared script accepts only supported modes whose selected CLI versions exactly match the request.
    observations:
      - summary: The shared script exposes whether exact toolchain verification succeeded or failed.
        boundary: boundary.script-result
        fields:
          - selector: outcome
            meaning: Success only when every CLI selected by the mode exists and exactly matches the requested version; failure otherwise.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.github-toolchain-matches-request
      - environment: runtime-context.github-toolchain-does-not-match-request
    guarantees:
      - id: exact-toolchain-processing-succeeds
        applies_to:
          - runtime-context.github-toolchain-matches-request
        claim:
          field: outcome
          in:
            - success
      - id: invalid-toolchain-processing-fails
        applies_to:
          - runtime-context.github-toolchain-does-not-match-request
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-processing
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-github-toolchain-verifier.outputs
    summary: The Composite Action maps shared script success to verified output and propagates script failure.
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: verified
            meaning: Whether every command selected by mode matched its exact expected version.
          - selector: outcome
            meaning: The success or failure outcome of the verification step.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.github-toolchain-script-succeeded
      - environment: runtime-context.github-toolchain-script-failed
    guarantees:
      - id: verified-output-produced
        applies_to:
          - runtime-context.github-toolchain-script-succeeded
        claim:
          field: verified
          in:
            - "true"
      - id: verification-failure-propagated
        applies_to:
          - runtime-context.github-toolchain-script-failed
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
