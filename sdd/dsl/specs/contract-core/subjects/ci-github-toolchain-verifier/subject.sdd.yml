version: 1
name: contract-subject
subject:
  id: subject.ci.github-toolchain-verifier
  summary: Verifying exact GitHub CI tool versions through a shared script.
contracts:
  - id: contract.ci-github-toolchain-verifier.processing
    summary: Verification mode, requested version and runner toolchain inputs to the GitHub toolchain verifier shared script.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: mode
        meaning: "Received by the contract target: verification mode."
      - name: unavailable-command
        meaning: "Precondition prepared by the case: command missing from the runner."
      - name: requested-versions
        meaning: "Received by the contract target: CLI versions requested through the job environment."
      - name: gh-version
        meaning: "Precondition prepared by the case: GitHub CLI version reported by the runner."
      - name: jq-version
        meaning: "Precondition prepared by the case: jq version reported by the runner."
      - name: sha256sum-version
        meaning: "Precondition prepared by the case: sha256sum version reported by the runner."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.github-toolchain-matches-request
        summary: The invocation meets the shared runtime context `runtime-context.github-toolchain-matches-request`.
      - id: runtime-context.github-toolchain-does-not-match-request
        summary: The invocation meets the shared runtime context `runtime-context.github-toolchain-does-not-match-request`.
    guarantees:
      - id: exact-toolchain-processing-succeeds
        applies_to:
          - runtime-context.github-toolchain-matches-request
        boundary: boundary.script-result
        statement: '`outcome` is one of `"success"`. Outcome of the exact toolchain verification, either success or failure.'
      - id: invalid-toolchain-processing-fails
        applies_to:
          - runtime-context.github-toolchain-does-not-match-request
        boundary: boundary.script-result
        statement: '`outcome` is one of `"failure"`. Outcome of the exact toolchain verification, either success or failure.'
      - id: diagnostic-failure-stage-processing
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: verify-github-toolchain.sh
  - id: contract.ci-github-toolchain-verifier.outputs
    summary: Verification mode and toolchain version inputs to the GitHub toolchain verifier Composite Action.
    inputs:
      - name: mode
        meaning: "Received by the contract target: verification mode."
      - name: gh-version
        meaning: "Precondition prepared by the case: GitHub CLI version reported by the runner."
      - name: jq-version
        meaning: "Precondition prepared by the case: jq version reported by the runner."
      - name: sha256sum-version
        meaning: "Precondition prepared by the case: sha256sum version reported by the runner."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.github-toolchain-script-succeeded
        summary: The invocation meets the shared runtime context `runtime-context.github-toolchain-script-succeeded`.
      - id: runtime-context.github-toolchain-script-failed
        summary: The invocation meets the shared runtime context `runtime-context.github-toolchain-script-failed`.
    guarantees:
      - id: verified-output-produced
        applies_to:
          - runtime-context.github-toolchain-script-succeeded
        boundary: boundary.action-output
        statement: '`verified` is one of `"true"`. Whether every command selected by mode matched its exact expected version.'
      - id: verification-failure-propagated
        applies_to:
          - runtime-context.github-toolchain-script-failed
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. The success or failure outcome of the verification step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: verify-github-toolchain.sh
