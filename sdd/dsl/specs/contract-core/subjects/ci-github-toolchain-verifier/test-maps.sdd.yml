version: 1
name: contract-test-maps
subject_ref: subject.ci.github-toolchain-verifier
test_maps:
  - verification_id: verification.ci-github-toolchain-verifier.processing
    case_id: matching-exact-toolchain-processing
    tests:
      - path: runtime/github-toolchain/tests/verify-github-toolchain.test.mjs
        symbol: accepts every supported verification mode
        check_refs:
          - check-exact-toolchain-processing-success
  - verification_id: verification.ci-github-toolchain-verifier.processing
    case_id: mismatching-exact-toolchain-processing
    tests:
      - path: runtime/github-toolchain/tests/verify-github-toolchain.test.mjs
        symbol: rejects an unsupported mode
        check_refs:
          - check-invalid-toolchain-processing-failure
  - verification_id: verification.ci-github-toolchain-verifier.processing
    case_id: unavailable-toolchain-processing
    tests:
      - path: runtime/github-toolchain/tests/verify-github-toolchain.test.mjs
        symbol: rejects an unavailable selected command
        check_refs:
          - check-unavailable-toolchain-processing-failure
  - verification_id: verification.ci-github-toolchain-verifier.processing
    case_id: version-mismatch-toolchain-processing
    tests:
      - path: runtime/github-toolchain/tests/verify-github-toolchain.test.mjs
        symbol: requires an exact version for every selected command
        check_refs:
          - check-version-mismatch-toolchain-processing-failure
  - verification_id: verification.ci-github-toolchain-verifier.outputs
    case_id: matching-selected-tool-versions
    tests:
      - path: actions/ci-github-toolchain-verifier/tests/action-contract.test.mjs
        symbol: composite run exposes verified only after exact toolchain verification
        check_refs:
          - check-verified-output
  - verification_id: verification.ci-github-toolchain-verifier.outputs
    case_id: mismatching-selected-tool-version
    tests:
      - path: actions/ci-github-toolchain-verifier/tests/action-contract.test.mjs
        symbol: composite run exposes verified only after exact toolchain verification
        check_refs:
          - check-verification-failure
