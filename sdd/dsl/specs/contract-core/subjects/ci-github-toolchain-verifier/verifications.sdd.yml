version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-github-toolchain-verifier.processing
    id: detailed-failure-processing
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-github-toolchain-verifier.processing
    id: matching-exact-toolchain-processing
    partition: runtime-context.github-toolchain-matches-request
    input:
      mode: gh-jq-sha256
  - contract_id: contract.ci-github-toolchain-verifier.processing
    id: mismatching-exact-toolchain-processing
    partition: runtime-context.github-toolchain-does-not-match-request
    input:
      mode: unsupported
  - contract_id: contract.ci-github-toolchain-verifier.processing
    id: unavailable-toolchain-processing
    partition: runtime-context.github-toolchain-does-not-match-request
    input:
      mode: gh-jq-sha256
      unavailable-command: jq
  - contract_id: contract.ci-github-toolchain-verifier.processing
    id: version-mismatch-toolchain-processing
    partition: runtime-context.github-toolchain-does-not-match-request
    input:
      mode: jq-sha256
      jq-version: "1.6"
  - contract_id: contract.ci-github-toolchain-verifier.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-github-toolchain-verifier.outputs
    id: matching-selected-tool-versions
    partition: runtime-context.github-toolchain-script-succeeded
    input:
      mode: gh-jq-sha256
      gh-version: 2.80.0
      jq-version: 1.7
      sha256sum-version: 9.5
  - contract_id: contract.ci-github-toolchain-verifier.outputs
    id: mismatching-selected-tool-version
    partition: runtime-context.github-toolchain-script-failed
    input:
      mode: gh-jq-sha256
      gh-version: 2.80.0
      jq-version: 1.6
      sha256sum-version: 9.5
