version: 1
name: contract-observations
subject_ref: subject.ci.release-publication-verifier
observations:
  - id: observation.ci-release-publication-verifier.outputs
    summary: Operation-specific outputs expose independently verified publication evidence, never an owner write status alone.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Success only after the selected read-only verification completes.
        - selector: observation-path
          kind: observation_field
          meaning: New pre-create observation file, produced only by observe-before.
        - selector: observation-digest
          kind: observation_field
          meaning: SHA-256 of exact pre-create observation bytes, produced only by observe-before.
        - selector: release-remote-identity
          kind: observation_field
          meaning: Immutable create-result Release object ID independently verified by verify-after.
        - selector: publish-receipt
          kind: observation_field
          meaning: Compact schema-validated receipt bound to authority, handoff, asset digest and pre-observation.
        - selector: readback-evidence
          kind: observation_field
          meaning: Compact readback independently matched to Release ID, tag/source, non-draft state, body and exact asset/checksum bytes.
  - id: observation.ci-release-publication-verifier.result
    summary: Missing credentials, unknown remote state or mismatching evidence fails without successful outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failed step outcome when remote observation or evidence verification is rejected.
  - id: observation.ci-release-publication-verifier.diagnostics
    summary: Secret-safe failure diagnostics on stderr, separate from successful outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.stderr
      kind: object
      fields:
        - selector: diagnostic
          kind: observation_field
          meaning: Stable failure envelope containing a code and available remote operation, phase, method, safe endpoint, status, request ID and observation reason.
  - id: observation.ci-release-publication-verifier.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "observe-before/verify-afterとrequest・response・repository visibility・inventory・receipt/readback/schema/binding・asset checksumの検証の段階、固定source/tag/Release ID、対象asset/evidence相対path、期待/観測digest/identity、method・安全なendpoint・HTTP status/request ID、観測の完全/不明を表す診断情報。"
        - selector: checksum-observation-conflation-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a known checksum mismatch classified as unknown observation.
  - id: observation.ci-release-publication-verifier.request-trace
    summary: Atomic boundary comparisons used by this contract.
    boundary:
      ref: boundary.release-provider-requests
    value:
      root: invocation.reads
      kind: object
      fields:
      - selector: non-get-request-state
        kind: observation_field
        meaning: Occurrence state of provider requests using a method other than GET during one invocation.
      - selector: release-inventory-attempts
        kind: observation_field
        meaning: Maximum number of attempted Release inventory observations, including failed or incomplete attempts, in one pre-create or post-create observation
          sequence, represented as a decimal integer string; zero when no such observation begins.
      - selector: asset-inventory-attempts
        kind: observation_field
        meaning: Maximum number of asset inventory observations in one readback sequence, represented as a decimal
          integer string; zero when none begins.
  - id: observation.ci-release-publication-verifier.clock-trace
    summary: Requested delays at the runner clock boundary.
    boundary:
      ref: boundary.observation-clock
    value:
      root: invocation.clock
      kind: object
      fields:
      - selector: release-reobservation-delay
        kind: observation_field
        meaning: Canonical comma-separated distinct millisecond durations requested between successive Release inventory
          observation attempts, including failed or incomplete attempts, sorted numerically; not-applicable only when
          the sequence has fewer than two attempts, and missing when any adjacent pair has no intervening requested delay.
      - selector: asset-reobservation-delay
        kind: observation_field
        meaning: Canonical comma-separated distinct millisecond durations requested between successive asset inventory
          observation attempts, including failed or incomplete attempts, sorted numerically; not-applicable only when
          the sequence has fewer than two attempts, and missing when any adjacent pair has no intervening requested delay.
  - id: observation.ci-release-publication-verifier.evidence-comparisons
    summary: Immutable ID comparisons across emitted verification results.
    boundary:
      ref: boundary.action-output
    value:
      root: action.output-comparisons
      kind: object
      fields:
      - selector: receipt-remote-id-binding
        kind: observation_field
        meaning: Equality of emitted publish-receipt.release_id with the immutable Release object ID from the independent
          GET response.
      - selector: receipt-readback-id-binding
        kind: observation_field
        meaning: Equality of emitted readback-evidence.release_id with emitted publish-receipt.release_id.
      - selector: release-output-id-binding
        kind: observation_field
        meaning: Equality of emitted release-remote-identity with emitted publish-receipt.release_id.
