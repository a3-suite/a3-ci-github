version: 1
name: contract-subject
subject:
  id: subject.ci.release-publication-verifier
  summary: Independently observe Release absence and verify owner publication evidence through read-only GitHub requests.
contracts:
  - id: contract.ci-release-publication-verifier.outputs
    summary: Release publication observation and verification request.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: release-inventory
        meaning: "Precondition prepared by the case: Release inventory returned by the provider."
      - name: credential
        meaning: "Precondition prepared by the case: credential route available to the step."
      - name: permission-metadata
        meaning: "Precondition prepared by the case: permission metadata returned by the provider."
      - name: credential-evidence
        meaning: "Precondition prepared by the case: credential evidence context."
      - name: assets
        meaning: "Precondition prepared by the case: asset inventory returned by the provider."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: handoff-root
        meaning: "Received by the contract target: handoff root directory path."
      - name: observation-path
        meaning: "Received by the contract target: path of the pre-publication observation file."
      - name: receipt-path
        meaning: "Received by the contract target: path of the publish receipt file."
      - name: readback-path
        meaning: "Received by the contract target: path of the readback file."
      - name: remote-release
        meaning: "Precondition prepared by the case: state of the remote Release."
      - name: remote-inventory
        meaning: "Precondition prepared by the case: remote Release inventory observed over time."
      - name: failure
        meaning: "Precondition prepared by the case: failure that the case injects into the processing or its provider."
      - name: evidence
        meaning: "Precondition prepared by the case: independent readback evidence available to the verifier."
      - name: remote-response
        meaning: "Precondition prepared by the case: form of the provider responses."
    conditions:
      - id: runtime-context.release-pre-observation-valid
        summary: The operation is observe-before, the supplied authority and handoff are valid, remote evidence establishes absence, and required files can be written.
      - id: runtime-context.release-post-verification-valid
        summary: The operation is verify-after, all receipt, readback and authority bindings match the independent provider responses, and Action outputs can be written.
      - id: runtime-context.release-observation-invalid
        summary: The operation or local inputs are invalid, provider evidence is unavailable or inconsistent with the selected verification, or a required write cannot complete.
    guarantees:
      - id: observation-status
        applies_to:
          - runtime-context.release-pre-observation-valid
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: '`status` is one of `"success"`. After a successful `observe-before`, `observation-path` equals the supplied path and `observation-digest` is the SHA-256 of the exact bytes written there. After a successful `verify-after`, the observation path and digest are absent.'
      - id: release-id-emitted
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: "`release-remote-identity` contains the verified Release object ID."
      - id: bound-receipt
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: "`publish-receipt` contains the validated publication receipt as JSON."
      - id: readback-evidence-emitted
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: "`readback-evidence` contains the validated readback record as JSON."
      - id: verification-rejected
        applies_to:
          - runtime-context.release-observation-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failed step outcome when remote observation or evidence verification is rejected.'
      - id: verification-diagnostic
        applies_to:
          - runtime-context.release-observation-invalid
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records a sanitized reason for rejection."
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.release-observation-invalid
        boundary: boundary.diagnostic-result
        statement: "The primary failure diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: diagnostic-checksum-observation-conflation
        applies_to:
          - runtime-context.release-observation-invalid
        boundary: boundary.diagnostic-result
        statement: '`checksum-observation-conflation-state` is one of `"absent"`. Occurrence state (present or absent) of a known checksum mismatch classified as unknown observation.'
      - id: get-only-requests
        applies_to:
          - runtime-context.release-pre-observation-valid
          - runtime-context.release-post-verification-valid
          - runtime-context.release-observation-invalid
        boundary: boundary.release-provider-requests
        statement: '`non-get-request-state` is one of `"absent"`. Occurrence state of provider requests using a method other than GET during one invocation.'
      - id: receipt-remote-id-binding
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: '`receipt-remote-id-binding` is one of `"matched"`. Equality of emitted publish-receipt.release_id with the immutable Release object ID from the independent GET response.'
      - id: receipt-readback-id-binding
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: '`receipt-readback-id-binding` is one of `"matched"`. Equality of emitted readback-evidence.release_id with emitted publish-receipt.release_id.'
      - id: release-output-id-binding
        applies_to:
          - runtime-context.release-post-verification-valid
        boundary: boundary.action-output
        statement: '`release-output-id-binding` is one of `"matched"`. Equality of emitted release-remote-identity with emitted publish-receipt.release_id.'
    input_kind:
      kind: operation
      name: ci-release-publication-verifier
