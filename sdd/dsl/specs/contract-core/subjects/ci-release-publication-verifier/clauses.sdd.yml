version: 1
name: contract-clauses
subject_ref: subject.ci.release-publication-verifier
contracts:
  - id: contract.ci-release-publication-verifier.outputs
    summary: Observe-before requires authoritative draft visibility and complete Release absence. Visibility is established by repository permissions.push=true, or, only when permission metadata is absent, by the fixed standard publication workflow's contents-write declaration and same-job GITHUB_TOKEN binding. The latter requires matching repository, the standard release-publication-caller.yml at the current branch ref, workflow_run, CI_RELEASE_CREDENTIAL_SOURCE=standard-workflow-github-token, CI_RELEASE_CONTENTS_PERMISSION=write and equality of the selected credential with GITHUB_TOKEN; these are trusted workflow evidence, not arbitrary caller permission claims. Explicit denied or malformed permission metadata is rejected. Verify-after independently binds receipt/readback to authority, handoff, immutable Release ID, tag/source, body and exact asset bytes. Requests are GET-only. Release and valid-subset asset inventory may be reobserved at most three times at one-second intervals; unknown or conflicting inventory is never accepted and writes are not replayed.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: observation-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-pre-observation-valid
          op: available
      - id: verification-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-post-verification-valid
          op: available
      - id: verification-invalid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.release-observation-invalid
          op: available
    guarantees:
      - id: observation-status
        when: observation-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values: [success]
      - id: observation-file
        when: observation-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: observation-path
      - id: observation-digest
        when: observation-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: observation-digest
      - id: verification-status
        when: verification-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values: [success]
      - id: immutable-release-id
        when: verification-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: release-remote-identity
      - id: bound-receipt
        when: verification-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: publish-receipt
      - id: independent-readback
        when: verification-valid
        observation_ref: observation.ci-release-publication-verifier.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: readback-evidence
      - id: verification-rejected
        when: verification-invalid
        observation_ref: observation.ci-release-publication-verifier.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values: [failure]
      - id: verification-diagnostic
        when: verification-invalid
        observation_ref: observation.ci-release-publication-verifier.diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: diagnostic}
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-release-publication-verifier.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [diagnostic-details-outputs]
      - id: observe-absence
        goal: Read-only absence observation emits only pre-create outputs bound to authority and handoff.
        guarantee_refs: [observation-status, observation-file, observation-digest]
      - id: verify-publication
        goal: Independent GET-only immutable-ID verification emits only post-create outputs when all owner and remote evidence agrees.
        guarantee_refs: [verification-status, immutable-release-id, bound-receipt, independent-readback]
      - id: fail-closed
        goal: Reject unavailable credentials, incomplete remote knowledge, existing Release or mismatching receipt/readback without success evidence.
        guarantee_refs: [verification-rejected]
      - id: safe-diagnostics
        goal: Failure reaches final stderr with a safe reason and stage; diagnostic generation does not change the rejection, successful outputs, permissions, checksum classification or existing bounded observation retry policy.
        guarantee_refs: [verification-diagnostic]
