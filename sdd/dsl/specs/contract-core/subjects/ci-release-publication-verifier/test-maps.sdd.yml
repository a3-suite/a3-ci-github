version: 1
name: contract-test-maps
subject_ref: subject.ci.release-publication-verifier
test_maps:
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: bundled-pre-observation
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "source entrypoint > publication entrypoint observes absence then verifies owner evidence independently"
        check_refs: [status, path, digest]
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "dist entrypoint > publication entrypoint observes absence then verifies owner evidence independently"
        check_refs: [status, path, digest]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: bundled-post-verification
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "source entrypoint > publication entrypoint observes absence then verifies owner evidence independently"
        check_refs: [status, release-id, receipt, readback]
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "dist entrypoint > publication entrypoint observes absence then verifies owner evidence independently"
        check_refs: [status, release-id, receipt, readback]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: output-line-injection
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "source entrypoint > publication entrypoint rejects output path line injection before remote observation"
        check_refs: [rejection]
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "dist entrypoint > publication entrypoint rejects output path line injection before remote observation"
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: missing-credentials
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "source entrypoint > publication entrypoint refuses missing credentials without success evidence"
        check_refs: [rejection]
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: "dist entrypoint > publication entrypoint refuses missing credentials without success evidence"
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: independent-readback
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: "contract.ci-release-publication-verifier.outputs > release-publication-evidence > publication evidence matches independent immutable ID readback"
        check_refs: [release-id, readback]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: existing-release
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: "contract.ci-release-publication-verifier.outputs > release-publication-rejection > pre-create refuses existing releases including drafts"
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: incomplete-pagination
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: "contract.ci-release-publication-verifier.outputs > release-publication-transport > read-only transport refuses an inventory that never completes within the page limit"
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: missing-after-reobservation
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: "contract.ci-release-publication-verifier.outputs > release-publication-rejection > publication verification refuses an inventory still absent after bounded reobservation"
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: mismatching-bindings
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: "contract.ci-release-publication-verifier.outputs > release-publication-receipt-binding > receipt and readback missing or mismatching bindings are rejected"
        check_refs: [rejection]
