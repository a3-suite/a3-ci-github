version: 1
name: contract-test-maps
subject_ref: subject.ci.release-publication-verifier
test_maps:
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: bundled-pre-observation
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: publication bundle observes absence then verifies owner evidence independently
        check_refs: [status, path, digest]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: bundled-post-verification
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: publication bundle observes absence then verifies owner evidence independently
        check_refs: [status, release-id, receipt, readback]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: output-line-injection
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: publication bundle rejects output path line injection before remote observation
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: missing-credentials
    tests:
      - path: actions/ci-release-publication-verifier/tests/entrypoint.test.ts
        symbol: publication bundle refuses missing credentials without success evidence
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: independent-readback
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: publication evidence matches independent immutable ID readback
        check_refs: [release-id, readback]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: existing-release
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: pre-create refuses existing releases including drafts
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: incomplete-pagination
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: read-only transport refuses an inventory that never completes within the page limit
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: missing-after-reobservation
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: publication verification refuses an inventory still absent after bounded reobservation
        check_refs: [rejection]
  - verification_id: verification.ci-release-publication-verifier.outputs
    case_id: mismatching-bindings
    tests:
      - path: runtime/release-publication/tests/observation.test.mjs
        symbol: receipt and readback missing or mismatching bindings are rejected
        check_refs: [rejection]
