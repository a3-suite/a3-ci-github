version: 1
name: contract-observations
subject_ref: subject.ci.vitest-summary
observations:
  - id: observation.ci.vitest-summary.outputs
    summary: The Action exposes summary status, collection, destination, and digest.
    boundary: {ref: boundary.action-output}
    value:
      root: action.outputs
      kind: object
      fields:
        - {selector: status, kind: observation_field, meaning: Vitest summary status.}
        - {selector: collection, kind: observation_field, meaning: Collection completeness.}
        - {selector: summary-path, kind: observation_field, meaning: Rendered summary destination.}
        - {selector: digest, kind: observation_field, meaning: Summary digest.}
  - id: observation.ci.vitest-summary.cli-result
    summary: The shared CLI exposes the same classification as the Action to its caller.
    boundary: {ref: boundary.cli-result}
    value:
      root: cli.result
      kind: object
      fields:
        - {selector: status, kind: observation_field, meaning: "Canonical classification, rendered as 成功, 失敗, or 判定不能 in the CLI summary."}
        - {selector: collection, kind: observation_field, meaning: "Canonical collection state, rendered as 完了, 一部取得, or 取得不可."}
  - id: observation.ci-vitest-summary.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "report取得・JSON解析・schema/count検証・classification・renderを区別し、report相対path、違反field、期待/観測count、欠落/不整合/emptyの理由、収集の完了/一部取得/取得不可、元の明示failureを残す。failed/unresolvedは分類結果として維持し、診断でfalse successに変えない。"
