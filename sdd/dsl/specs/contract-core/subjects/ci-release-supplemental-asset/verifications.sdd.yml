      - diagnostic-cleanup-state-inference
      - diagnostic-cleanup-residual-claim
      - diagnostic-cleanup-extra-field
  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: sole-cleanup-failure
    partition: runtime-context.supplemental-phase-invalid
    input:
      operation: assemble
      supplemental-build-root: supplemental-build
      failure: cleanup-after-successful-primary
    verifies:
      - diagnostic-cleanup-only-code-mismatch
      - diagnostic-cleanup-status-mismatch
      - diagnostic-cleanup-state-inference
      - diagnostic-cleanup-residual-claim
      - diagnostic-cleanup-extra-field
  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: input-mutation
    partition: runtime-context.supplemental-phase-invalid
    input:
      operation: assemble
      supplemental-build-root: supplemental-build
      owner-mutates: supplemental-input
    verifies:
