version: 1
name: contract-verifications
subject_ref: subject.ci.release-supplemental-asset
verifications:
  - id: verification.ci-release-supplemental-asset.outputs
    contract_id: contract.ci-release-supplemental-asset.outputs
    cases:
      - id: standard-entry-name-rejection
        intent_id: standard-installer-public-entry-names-supplemental-invalid
        input: { implementation: standard-installer, declaration: nonstandard-windows-or-unix-shared-entry-name, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected }, { id: diagnostic, guarantee_ref: phase-diagnostic } ]
      - id: detailed-failure-outputs
        intent_id: detailed-diagnostics-outputs
        input: { scenario: rejected-public-invocation, operation: build-platform }
        checks: [ { id: diagnostic-details, guarantee_ref: diagnostic-details-outputs } ]
      - id: platform-phase
        intent_id: bound-phase
        input: { operation: build-platform }
        checks:
          - { id: success, guarantee_ref: phase-success }
          - { id: output, guarantee_ref: phase-output }
      - id: unselected-binding
        intent_id: fail-closed
        input: { enabled: false, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: injected-output
        intent_id: fail-closed
        input: { output-directory: "output\nstatus=success", operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: owner-failure
        intent_id: fail-closed
        input: { owner-exit: 23, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: input-mutation
        intent_id: fail-closed
        input: { owner-mutates: standard-build-input, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: unsafe-phase-path
        intent_id: fail-closed
        input: { path: ../escape, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: identity-selection
        intent_id: fail-closed
        input: { binding: mismatched-source-or-snapshot-or-owner-adapter, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: missing-output
        intent_id: fail-closed
        input: { owner-output: missing-or-empty, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-installer
        intent_id: bound-phase
        input:
          implementation: standard-installer
          config: committed-product-declaration
          operation: build-platform
        checks:
          - id: success
            guarantee_ref: phase-success
          - id: output
            guarantee_ref: phase-output
      - id: standard-declaration-mutation
        intent_id: fail-closed
        input:
          implementation: standard-installer
          config: committed-product-declaration
          operation: build-platform
        checks:
          - id: refusal
            guarantee_ref: phase-rejected
      - id: standard-local-cli
        intent_id: bound-phase
        input:
          implementation: standard-installer
          config: committed-product-declaration
          operation: build-platform
        checks:
          - id: success
            guarantee_ref: phase-success
          - id: output
            guarantee_ref: phase-output
      - id: standard-provider-profile-refusal
        intent_id: fail-closed
        input:
          implementation: standard-installer
          profile: unsupported
          operation: build-platform
        checks:
          - id: refusal
            guarantee_ref: phase-rejected
      - id: standard-platform-subset
        intent_id: bound-phase
        input: { implementation: standard-installer, release-targets: selected-and-unselected, operation: build-platform }
        checks: [ { id: success, guarantee_ref: phase-success }, { id: output, guarantee_ref: phase-output } ]
      - id: standard-platform-binding
        intent_id: fail-closed
        input: { implementation: standard-installer, platform-binding: mismatched-id-or-target, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-platform-authority
        intent_id: fail-closed
        input: { implementation: standard-installer, platform-manifest: authority-checksum-mismatch, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-platform-mutation
        intent_id: fail-closed
        input: { implementation: standard-installer, provider-mutates: platform-manifest, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-checksum-bytes
        intent_id: fail-closed
        input: { implementation: standard-installer, checksum: noncanonical-bytes, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-checkout-eol
        intent_id: bound-phase
        input: { implementation: standard-installer, checkout: LF-CRLF-or-mixed, operation: build-platform }
        checks: [ { id: success, guarantee_ref: phase-success }, { id: output, guarantee_ref: phase-output } ]
      - id: standard-source-content
        intent_id: fail-closed
        input: { implementation: standard-installer, source-change: beyond-CRLF-to-LF, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: standard-execution-eol-mutation
        intent_id: fail-closed
        input: { implementation: standard-installer, provider-mutates: newline-only, operation: build-platform }
        checks: [ { id: refusal, guarantee_ref: phase-rejected } ]
      - id: diagnostic-standard-installer-diagnostic
        intent_id: safe-diagnostics
        input: { failure: standard-installer-diagnostic, operation: build-platform }
        checks: [ { id: diagnostic, guarantee_ref: phase-diagnostic } ]
      - id: diagnostic-owner-process-diagnostic
        intent_id: safe-diagnostics
        input: { failure: owner-process-diagnostic, operation: build-platform }
        checks: [ { id: diagnostic, guarantee_ref: phase-diagnostic } ]
      - id: primary-and-cleanup-failure
        intent_id: cleanup-diagnostics
        input:
          scenario: primary-failure-followed-by-cleanup-failure
          operation: build-platform
        checks:
          - id: diagnostic-cleanup-status-mismatch
            guarantee_ref: diagnostic-cleanup-status-mismatch
          - id: diagnostic-cleanup-state-inference
            guarantee_ref: diagnostic-cleanup-state-inference
          - id: diagnostic-cleanup-residual-claim
            guarantee_ref: diagnostic-cleanup-residual-claim
          - id: diagnostic-cleanup-extra-field
            guarantee_ref: diagnostic-cleanup-extra-field
      - id: sole-cleanup-failure
        intent_id: cleanup-diagnostics
        input:
          scenario: cleanup-fails-after-successful-primary-operation
          operation: build-platform
        checks:
          - id: diagnostic-cleanup-only-code-mismatch
            guarantee_ref: diagnostic-cleanup-only-code-mismatch
          - id: diagnostic-cleanup-status-mismatch
            guarantee_ref: diagnostic-cleanup-status-mismatch
          - id: diagnostic-cleanup-state-inference
            guarantee_ref: diagnostic-cleanup-state-inference
          - id: diagnostic-cleanup-residual-claim
            guarantee_ref: diagnostic-cleanup-residual-claim
          - id: diagnostic-cleanup-extra-field
            guarantee_ref: diagnostic-cleanup-extra-field
      - id: untrusted-installer-process-diagnostic
        intent_id: installer-reason-validation
        input:
          scenario: malformed-or-untrusted-installer-process-diagnostic
          operation: build-platform
        checks:
          - id: diagnostic-unvalidated-installer-reason
            guarantee_ref: diagnostic-unvalidated-installer-reason
