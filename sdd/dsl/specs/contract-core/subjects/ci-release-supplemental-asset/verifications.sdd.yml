  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: standard-evidence-modified
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      transferred-evidence: modified
      operation: assemble
      supplemental-build-root: supplemental-build
    verifies:
