    partition: runtime-context.failure-diagnostic-required
    input:
      operation: assemble
      supplemental-build-root: supplemental-build
      owner-exit: 23
  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: assembly-phase
    partition: runtime-context.supplemental-phase-valid
    input:
