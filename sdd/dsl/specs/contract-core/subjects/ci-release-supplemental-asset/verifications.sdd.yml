version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-entry-name-rejection
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      declaration: nonstandard-windows-shared-entry-name
      operation: build-platform
    verifies:
      - phase-rejected
      - phase-diagnostic
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      operation: build-platform
      owner-exit: 23
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: platform-phase
    partition: runtime-context.supplemental-phase-valid
    input:
      operation: build-platform
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: unselected-binding
    partition: runtime-context.supplemental-phase-invalid
    input:
      enabled: false
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: injected-output
    partition: runtime-context.supplemental-phase-invalid
    input:
      output-directory: |-
        output
        status=success
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: owner-failure
    partition: runtime-context.supplemental-phase-invalid
    input:
      owner-exit: 23
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: input-mutation
    partition: runtime-context.supplemental-phase-invalid
    input:
      owner-mutates: standard-build-input
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: unsafe-phase-path
    partition: runtime-context.supplemental-phase-invalid
    input:
      path: ../escape
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: identity-selection
    partition: runtime-context.supplemental-phase-invalid
    input:
      binding: mismatched-source
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: missing-output
    partition: runtime-context.supplemental-phase-invalid
    input:
      owner-output: missing
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-installer
    partition: runtime-context.supplemental-phase-valid
    input:
      implementation: standard-installer
      config: committed-product-declaration
      operation: build-platform
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-declaration-mutation
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      config: committed-product-declaration
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-provider-profile-refusal
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      profile: unsupported
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-platform-subset
    partition: runtime-context.supplemental-phase-valid
    input:
      implementation: standard-installer
      release-targets: selected-and-unselected
      operation: build-platform
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-platform-binding
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      platform-binding: mismatched-id
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-platform-authority
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      platform-manifest: authority-checksum-mismatch
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-platform-mutation
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      provider-mutates: platform-manifest
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-checksum-bytes
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      checksum: noncanonical-bytes
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-checkout-eol
    partition: runtime-context.supplemental-phase-valid
    input:
      implementation: standard-installer
      checkout: CRLF
      operation: build-platform
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-source-content
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      source-change: beyond-CRLF-to-LF
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: standard-execution-eol-mutation
    partition: runtime-context.supplemental-phase-invalid
    input:
      implementation: standard-installer
      provider-mutates: newline-only
      operation: build-platform
    verifies:
      - phase-rejected
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: diagnostic-standard-installer-diagnostic
    partition: runtime-context.supplemental-phase-invalid
    input:
      failure: standard-installer-diagnostic
      operation: build-platform
    verifies:
      - phase-diagnostic
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: diagnostic-owner-process-diagnostic
    partition: runtime-context.supplemental-phase-invalid
    input:
      failure: owner-process-diagnostic
      operation: build-platform
    verifies:
      - phase-diagnostic
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: primary-and-cleanup-failure
    partition: runtime-context.supplemental-phase-invalid
    input:
      operation: build-platform
      failure: primary-then-cleanup
    verifies:
      - diagnostic-cleanup-status-mismatch
      - diagnostic-cleanup-state-inference
      - diagnostic-cleanup-residual-claim
      - diagnostic-cleanup-extra-field
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: sole-cleanup-failure
    partition: runtime-context.supplemental-phase-invalid
    input:
      operation: build-platform
      failure: cleanup-after-successful-primary
    verifies:
      - diagnostic-cleanup-only-code-mismatch
      - diagnostic-cleanup-status-mismatch
      - diagnostic-cleanup-state-inference
      - diagnostic-cleanup-residual-claim
      - diagnostic-cleanup-extra-field
  - contract_id: contract.ci-release-supplemental-asset.outputs
    id: untrusted-installer-process-diagnostic
    partition: runtime-context.supplemental-phase-invalid
    input:
      operation: build-platform
      failure: malformed-installer-process-diagnostic
    verifies:
      - diagnostic-unvalidated-installer-reason
  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: standard-entry-name-publication
    partition: runtime-context.standard-installer-evidence-valid
    input:
      implementation: standard-installer
      declaration: standard-public-entry-name
      operation: assemble
      supplemental-build-root: supplemental-build
    verifies:
      - standard-installer-publication-assets-produced
      - standard-installer-source-snapshots-excluded
  - contract_id: contract.ci-release-supplemental-asset.assembly
    id: standard-entry-name-rejection
