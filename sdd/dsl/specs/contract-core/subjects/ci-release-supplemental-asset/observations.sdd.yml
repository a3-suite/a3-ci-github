version: 1
name: contract-observations
subject_ref: subject.ci.release-supplemental-asset
observations:
  - id: observation.ci-release-supplemental-asset.outputs
    summary: Success identifies the new owner-produced phase output, not installer semantic approval.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: success after the bound owner phase completes and input before/after observations match.
        - selector: output-directory
          kind: observation_field
          meaning: New nonempty output directory generated by the owner phase.
  - id: observation.ci-release-supplemental-asset.result
    summary: Invalid input, owner failure or input mutation fails without successful outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: failure when common validation or the selected owner phase fails.
  - id: observation.ci-release-supplemental-asset.evidence
    summary: Transported standard-installer candidate files and finalized publication assets.
    boundary:
      ref: boundary.workspace-files
    value:
      root: supplemental-phase-files
      kind: object
      fields:
        - selector: candidate-files
          kind: observation_field
          meaning: The candidate directory contains exactly the filenames declared by platform-record.json, including .installer-source.zip, with matching SHA-256 bytes.
        - selector: publication-assets
          kind: observation_field
          meaning: Final supplemental handoff contains the declared installer and manifest assets, with verification-only source snapshots excluded.
  - id: observation.ci-release-supplemental-asset.diagnostics
    summary: Secret-safe failure diagnostics on stderr, separate from successful outputs.
    boundary:
      ref: boundary.action-output
    value:
      root: action.stderr
      kind: object
      fields:
        - selector: diagnostic
          kind: observation_field
          meaning: Stable failure envelope containing a code, available operation/phase/process status or signal, and optional cleanup status and temporary-state.
        - selector: unvalidated-installer-reason-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a standard installer reason accepted outside the bounded strict provider diagnostic, allowlisted reason and matching phase.
        - selector: cleanup-only-code-mismatch-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a sole cleanup failure reported with a reason other than installer-cleanup-failed.
        - selector: cleanup-status-mismatch-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of cleanup failure metadata with status other than failed.
        - selector: cleanup-state-inference-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of cleanup failure metadata with temporary-state other than unknown.
        - selector: cleanup-residual-claim-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of a residual file or path assertion inferred from cleanup failure.
        - selector: cleanup-extra-field-state
          kind: observation_field
          meaning: Occurrence state (present or absent) of cleanup metadata fields outside status and temporary-state.
  - id: observation.ci-release-supplemental-asset.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: { ref: boundary.diagnostic-result }
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "build-platform/assemble、共通入力検証、standard-installer/owner-adapter起動、候補生成、転送後inventory/digest検証、native検証、final handoff生成の段階、platform、asset/evidence相対path、欠落/余剰/改変、期待/観測digest、終了status/signal、既知の安全なinstaller理由と出力状態を表す診断情報。"
