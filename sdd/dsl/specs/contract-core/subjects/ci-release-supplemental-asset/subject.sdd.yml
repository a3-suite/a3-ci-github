version: 1
name: contract-subject
subject:
  id: subject.ci.release-supplemental-asset
  summary: Prepare supplemental assets through authority-bound phases with the selected owner adapter or the provider standard installer, without publishing them.
contracts:
  - id: contract.ci-release-supplemental-asset.outputs
    summary: Supplemental platform phase request.
    inputs:
      - name: implementation
        meaning: "Received by the contract target: supplemental asset implementation recorded in the snapshot."
      - name: declaration
        meaning: "Received by the contract target: standard installer declaration content."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: enabled
        meaning: "Received by the contract target: supplemental asset selection recorded in the snapshot."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: owner-exit
        meaning: "Precondition prepared by the case: exit status of the owner adapter."
      - name: owner-mutates
        meaning: "Precondition prepared by the case: input that the owner adapter changes."
      - name: path
        meaning: "Received by the contract target: path input passed to the Action."
      - name: binding
        meaning: "Precondition prepared by the case: relation between the snapshot binding and the checkout."
      - name: owner-output
        meaning: "Precondition prepared by the case: output produced by the owner adapter."
      - name: config
        meaning: "Received by the contract target: installer configuration source."
      - name: profile
        meaning: "Received by the contract target: installer profile selected by the declaration."
      - name: release-targets
        meaning: "Received by the contract target: release targets selected by the declaration."
      - name: platform-binding
        meaning: "Precondition prepared by the case: relation between the platform identity and the build directory."
      - name: platform-manifest
        meaning: "Precondition prepared by the case: relation between the platform manifest and the authority checksum."
      - name: provider-mutates
        meaning: "Precondition prepared by the case: input that the provider runtime changes."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: checkout
        meaning: "Precondition prepared by the case: line endings of the fixed checkout."
      - name: source-change
        meaning: "Precondition prepared by the case: change made to the fixed source after checkout."
      - name: failure
        meaning: "Precondition prepared by the case: failure that the case injects into the processing or its provider."
    conditions:
      - id: runtime-context.supplemental-phase-valid
        summary: The selected phase receives valid inputs and evidence, its new output directory can be created, and the Action outputs can be written.
      - id: runtime-context.supplemental-phase-invalid
        summary: The phase rejects invalid inputs or fails before writing Action outputs. An existing output directory has its own condition.
      - id: existing-output-rejected
        summary: The phase rejects an output directory path that already exists.
      - id: supplemental-action-output-write-failed
        summary: The phase writes its result but cannot write the Action outputs.
    guarantees:
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
        boundary: boundary.action-output
        statement: '`status` is one of `"success"`. Phase completion status output; success.'
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
        boundary: boundary.action-output
        statement: '`output-directory-binding` is one of `"equal"`. Comparison of the output directory reported on success with the directory the phase created for its result; equal or different. Observable fields at this boundary also include `output-directory` (Output directory path that the phase reports on success).'
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - existing-output-rejected
          - supplemental-action-output-write-failed
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Step outcome of the phase invocation; success or failure.'
      - id: existing-output-unchanged
        applies_to:
          - existing-output-rejected
        boundary: boundary.workspace-files
        statement: '`existing-output-content-comparison` is one of `"unchanged"`. Comparison of a pre-existing output path content before and after a rejected phase invocation; unchanged or changed.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - existing-output-rejected
          - supplemental-action-output-write-failed
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic identifies the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-release-supplemental-asset
  - id: contract.ci-release-supplemental-asset.assembly
    summary: Supplemental asset processing through the Action or the standard installer CLI, including platform candidate preparation and final assembly from transferred candidates.
    inputs:
      - name: implementation
        meaning: "Received by the contract target: supplemental asset implementation recorded in the snapshot."
      - name: declaration
        meaning: "Received by the contract target: standard installer declaration content."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: supplemental-build-root
        meaning: "Received by the contract target: supplemental build root path."
      - name: owner-exit
        meaning: "Precondition prepared by the case: exit status of the owner adapter."
      - name: config
        meaning: "Received by the contract target: installer configuration source."
      - name: release-targets
        meaning: "Received by the contract target: release targets selected by the declaration."
      - name: platform-binding
        meaning: "Precondition prepared by the case: relation between the platform identity and the build directory."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: checkout
        meaning: "Precondition prepared by the case: line endings of the fixed checkout."
      - name: source-change
        meaning: "Precondition prepared by the case: change made to the fixed source after checkout."
      - name: provider-mutates
        meaning: "Precondition prepared by the case: input that the provider runtime changes."
      - name: transferred-evidence
        meaning: "Precondition prepared by the case: state of the owner evidence transferred between jobs."
      - name: failure
        meaning: "Precondition prepared by the case: failure that the case injects into the processing or its provider."
      - name: owner-mutates
        meaning: "Precondition prepared by the case: input that the owner adapter changes."
      - name: release-implementation
        meaning: "Received by the contract target: release implementation recorded in the snapshot."
      - name: build-roots
        meaning: "Precondition prepared by the case: content of the standard and supplemental build roots."
    conditions:
      - id: runtime-context.supplemental-phase-valid
        summary: A platform release uses a valid owner adapter phase or standard installer build-platform phase, and required destinations can be written.
      - id: runtime-context.supplemental-phase-invalid
        summary: A platform release cannot complete the selected phase or emit the required Action outputs. CLI phase-input mismatch has its own condition.
      - id: runtime-context.standard-installer-evidence-valid
        summary: Standard installer assemble receives complete, matching transferred candidate evidence for the selected release platforms and required destinations can be written.
      - id: runtime-context.supplemental-asset-release-valid
        summary: An asset-only release has valid owner adapter inputs, empty build roots, and writable destinations.
      - id: runtime-context.supplemental-asset-release-invalid
        summary: An asset-only release has invalid phase inputs, fails assembly, or cannot write required Action outputs.
      - id: installer-cli-phase-input-mismatch
        summary: The installer CLI receives a supplemental build root in build-platform, or receives no supplemental build root in assemble.
    guarantees:
      - id: installer-cli-phase-input-rejected
        applies_to:
          - installer-cli-phase-input-mismatch
        boundary: boundary.cli-result
        statement: The installer CLI exits with failure and reports phase-input-mismatch at phase-selection before creating the requested output directory.
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.standard-installer-evidence-valid
          - runtime-context.supplemental-asset-release-valid
        boundary: boundary.action-output
        statement: '`status` is one of `"success"`. Phase completion status output; success.'
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.standard-installer-evidence-valid
          - runtime-context.supplemental-asset-release-valid
        boundary: boundary.action-output
        statement: '`output-directory-binding` is one of `"equal"`. Comparison of the output directory reported on success with the directory the phase created for its result; equal or different. Observable fields at this boundary also include `output-directory` (Output directory path that the phase reports on success).'
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - runtime-context.supplemental-asset-release-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Step outcome of the phase invocation; success or failure.'
      - id: standard-installer-evidence-preserved
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        boundary: boundary.workspace-files
        statement: '`candidate-files` is one of `"matched"`. After assembly, the transferred candidate directory still contains exactly the filenames and bytes bound by the SHA-256 values in platform-record.json, including .installer-source.zip.'
      - id: standard-installer-publication-assets-produced
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        boundary: boundary.workspace-files
        statement: '`publication-asset-paths` is one of `"equal"`. Comparison of the set of asset paths in the final supplemental handoff manifest with the declared installer and manifest asset paths.'
      - id: standard-installer-source-snapshots-excluded
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        boundary: boundary.workspace-files
        statement: '`publication-source-snapshots` is one of `"absent"`. Verification-only installer source snapshots in the final supplemental handoff; absent or present.'
      - id: standard-installer-checksum-sidecar
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        boundary: boundary.workspace-files
        statement: '`publication-asset-checksum-sidecars` is one of `"equal"`. Comparison of each asset checksum file with the sha256 and asset path declared in supplemental-manifest.json; equal or different.'
      - id: standard-installer-declaration-directory-unchanged
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        boundary: boundary.workspace-files
        statement: '`declaration-directory-file-name-difference-count` is one of `"0"`. Number of file names in the installer declaration directory (.ci/installer) that the invocation added or removed, compared before and after the invocation, as a decimal integer string.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - runtime-context.supplemental-asset-release-invalid
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic identifies the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-release-supplemental-asset
