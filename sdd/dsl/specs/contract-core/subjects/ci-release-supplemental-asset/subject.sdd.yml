version: 1
name: contract-subject
subject:
  id: subject.ci.release-supplemental-asset
  summary: Prepare supplemental assets through authority-bound phases using either the selected owner adapter or the provider standard installer. Owner-adapter mode preserves owner verification responsibility; standard-installer mode assembles and verifies exact candidates and generates bound evidence. Neither mode publishes assets.
contracts:
  - id: contract.ci-release-supplemental-asset.outputs
    summary: Supplemental platform phase request.
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: status
            meaning: Phase completion status output; success.
          - selector: output-directory
            meaning: New nonempty output directory generated by the owner phase.
          - selector: outcome
            meaning: Step outcome of the phase invocation; success or failure.
          - selector: diagnostic
            meaning: Stable failure envelope of the failed supplemental phase.
          - selector: unvalidated-installer-reason-state
            meaning: Occurrence state (present or absent) of a standard installer reason accepted outside the bounded strict provider diagnostic, allowlisted reason and matching phase.
          - selector: cleanup-only-code-mismatch-state
            meaning: Occurrence state (present or absent) of a sole cleanup failure reported with a reason other than installer-cleanup-failed.
          - selector: cleanup-status-mismatch-state
            meaning: Occurrence state (present or absent) of cleanup failure metadata with status other than failed.
          - selector: cleanup-state-inference-state
            meaning: Occurrence state (present or absent) of cleanup failure metadata with temporary-state other than unknown.
          - selector: cleanup-residual-claim-state
            meaning: Occurrence state (present or absent) of a residual file or path assertion inferred from cleanup failure.
          - selector: cleanup-extra-field-state
            meaning: Occurrence state (present or absent) of cleanup metadata fields outside status and temporary-state.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.supplemental-phase-valid
      - environment: runtime-context.supplemental-phase-invalid
    guarantees:
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
        claim:
          field: status
          in:
            - success
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
        claim:
          field: output-directory
          present: true
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: phase-diagnostic
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: diagnostic-unvalidated-installer-reason
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: unvalidated-installer-reason-state
          in:
            - absent
      - id: diagnostic-cleanup-only-code-mismatch
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-only-code-mismatch-state
          in:
            - absent
      - id: diagnostic-cleanup-status-mismatch
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-status-mismatch-state
          in:
            - absent
      - id: diagnostic-cleanup-state-inference
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-state-inference-state
          in:
            - absent
      - id: diagnostic-cleanup-residual-claim
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-residual-claim-state
          in:
            - absent
      - id: diagnostic-cleanup-extra-field
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-extra-field-state
          in:
            - absent
  - id: contract.ci-release-supplemental-asset.assembly
    summary: Supplemental final assembly request from transferred platform candidates.
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: status
            meaning: Phase completion status output; success.
          - selector: output-directory
            meaning: New nonempty output directory generated by the owner phase.
          - selector: outcome
            meaning: Step outcome of the phase invocation; success or failure.
          - selector: diagnostic
            meaning: Stable failure envelope of the failed supplemental phase.
          - selector: cleanup-only-code-mismatch-state
            meaning: Occurrence state (present or absent) of a sole cleanup failure reported with a reason other than installer-cleanup-failed.
          - selector: cleanup-status-mismatch-state
            meaning: Occurrence state (present or absent) of cleanup failure metadata with status other than failed.
          - selector: cleanup-state-inference-state
            meaning: Occurrence state (present or absent) of cleanup failure metadata with temporary-state other than unknown.
          - selector: cleanup-residual-claim-state
            meaning: Occurrence state (present or absent) of a residual file or path assertion inferred from cleanup failure.
          - selector: cleanup-extra-field-state
            meaning: Occurrence state (present or absent) of cleanup metadata fields outside status and temporary-state.
      - summary: Transported standard-installer candidate files and finalized publication assets.
        boundary: boundary.workspace-files
        fields:
          - selector: candidate-files
            meaning: Comparison of the transferred candidate directory filenames and SHA-256 bytes with the files declared by platform-record.json, including .installer-source.zip; matched or mismatched.
          - selector: publication-assets
            meaning: Declared installer and manifest assets in the final supplemental handoff.
          - selector: publication-source-snapshots
            meaning: Verification-only installer source snapshots in the final supplemental handoff; absent or present.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.supplemental-phase-valid
      - environment: runtime-context.supplemental-phase-invalid
      - environment: runtime-context.standard-installer-evidence-valid
      - environment: runtime-context.supplemental-asset-release-valid
      - environment: runtime-context.supplemental-asset-release-invalid
    guarantees:
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.supplemental-asset-release-valid
        claim:
          field: status
          in:
            - success
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.supplemental-asset-release-valid
        claim:
          field: output-directory
          present: true
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - runtime-context.supplemental-asset-release-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: standard-installer-evidence-preserved
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: candidate-files
          in:
            - matched
      - id: standard-installer-publication-assets-produced
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: publication-assets
          present: true
      - id: standard-installer-source-snapshots-excluded
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: publication-source-snapshots
          in:
            - absent
      - id: phase-diagnostic
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: diagnostic
          present: true
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: diagnostic-cleanup-only-code-mismatch
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-only-code-mismatch-state
          in:
            - absent
      - id: diagnostic-cleanup-status-mismatch
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-status-mismatch-state
          in:
            - absent
      - id: diagnostic-cleanup-state-inference
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-state-inference-state
          in:
            - absent
      - id: diagnostic-cleanup-residual-claim
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-residual-claim-state
          in:
            - absent
      - id: diagnostic-cleanup-extra-field
        applies_to:
          - runtime-context.supplemental-phase-invalid
        claim:
          field: cleanup-extra-field-state
          in:
            - absent
