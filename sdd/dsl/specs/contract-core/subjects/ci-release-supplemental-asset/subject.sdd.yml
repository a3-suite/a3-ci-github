version: 1
name: contract-subject
subject:
  id: subject.ci.release-supplemental-asset
  summary: Prepare supplemental assets through authority-bound phases with the selected owner adapter or the provider standard installer, without publishing them.
contracts:
  - id: contract.ci-release-supplemental-asset.outputs
    summary: Supplemental platform phase request.
    inputs:
      - name: implementation
        meaning: "Received by the contract target: supplemental asset implementation recorded in the snapshot."
      - name: declaration
        meaning: "Received by the contract target: standard installer declaration content."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: enabled
        meaning: "Received by the contract target: supplemental asset selection recorded in the snapshot."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: owner-exit
        meaning: "Precondition prepared by the case: exit status of the owner adapter."
      - name: owner-mutates
        meaning: "Precondition prepared by the case: input that the owner adapter changes."
      - name: path
        meaning: "Received by the contract target: path input passed to the Action."
      - name: binding
        meaning: "Precondition prepared by the case: relation between the snapshot binding and the checkout."
      - name: owner-output
        meaning: "Precondition prepared by the case: output produced by the owner adapter."
      - name: config
        meaning: "Received by the contract target: installer configuration source."
      - name: profile
        meaning: "Received by the contract target: installer profile selected by the declaration."
      - name: release-targets
        meaning: "Received by the contract target: release targets selected by the declaration."
      - name: platform-binding
        meaning: "Precondition prepared by the case: relation between the platform identity and the build directory."
      - name: platform-manifest
        meaning: "Precondition prepared by the case: relation between the platform manifest and the authority checksum."
      - name: provider-mutates
        meaning: "Precondition prepared by the case: input that the provider runtime changes."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: checkout
        meaning: "Precondition prepared by the case: line endings of the fixed checkout."
      - name: source-change
        meaning: "Precondition prepared by the case: change made to the fixed source after checkout."
      - name: failure
        meaning: "Precondition prepared by the case: failure that the case injects into the processing or its provider."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: output-directory
            meaning: Output directory path that the phase reports on success.
          - selector: status
            meaning: Phase completion status output; success.
          - selector: output-directory-binding
            meaning: Comparison of the output directory reported on success with the directory the phase created for its result; equal or different.
          - selector: outcome
            meaning: Step outcome of the phase invocation; success or failure.
      - summary: Existing output path state before and after a rejected phase invocation.
        boundary: boundary.workspace-files
        fields:
          - selector: existing-output-content-comparison
            meaning: Comparison of a pre-existing output path content before and after a rejected phase invocation; unchanged or changed.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.supplemental-phase-valid
      - environment: runtime-context.supplemental-phase-invalid
      - input: existing-output-rejected
        summary: Invocation rejected because its output directory path already exists.
    guarantees:
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
        claim:
          field: status
          in:
            - success
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
        claim:
          field: output-directory-binding
          in:
            - equal
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - existing-output-rejected
        claim:
          field: outcome
          in:
            - failure
      - id: existing-output-unchanged
        applies_to:
          - existing-output-rejected
        claim:
          field: existing-output-content-comparison
          in:
            - unchanged
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.ci-release-supplemental-asset.assembly
    summary: Supplemental final assembly request from transferred platform candidates.
    inputs:
      - name: implementation
        meaning: "Received by the contract target: supplemental asset implementation recorded in the snapshot."
      - name: declaration
        meaning: "Received by the contract target: standard installer declaration content."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: supplemental-build-root
        meaning: "Received by the contract target: supplemental build root path."
      - name: owner-exit
        meaning: "Precondition prepared by the case: exit status of the owner adapter."
      - name: config
        meaning: "Received by the contract target: installer configuration source."
      - name: release-targets
        meaning: "Received by the contract target: release targets selected by the declaration."
      - name: platform-binding
        meaning: "Precondition prepared by the case: relation between the platform identity and the build directory."
      - name: checksum
        meaning: "Precondition prepared by the case: checksum content available to the contract target."
      - name: checkout
        meaning: "Precondition prepared by the case: line endings of the fixed checkout."
      - name: source-change
        meaning: "Precondition prepared by the case: change made to the fixed source after checkout."
      - name: provider-mutates
        meaning: "Precondition prepared by the case: input that the provider runtime changes."
      - name: transferred-evidence
        meaning: "Precondition prepared by the case: state of the owner evidence transferred between jobs."
      - name: failure
        meaning: "Precondition prepared by the case: failure that the case injects into the processing or its provider."
      - name: owner-mutates
        meaning: "Precondition prepared by the case: input that the owner adapter changes."
      - name: release-implementation
        meaning: "Received by the contract target: release implementation recorded in the snapshot."
      - name: build-roots
        meaning: "Precondition prepared by the case: content of the standard and supplemental build roots."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: output-directory
            meaning: Output directory path that the phase reports on success.
          - selector: status
            meaning: Phase completion status output; success.
          - selector: output-directory-binding
            meaning: Comparison of the output directory reported on success with the directory the phase created for its result; equal or different.
          - selector: outcome
            meaning: Step outcome of the phase invocation; success or failure.
      - summary: Transported standard-installer candidate files and finalized publication assets.
        boundary: boundary.workspace-files
        fields:
          - selector: candidate-files
            meaning: Comparison of the transferred candidate directory filenames and SHA-256 bytes with the files declared by platform-record.json, including .installer-source.zip; matched or mismatched.
          - selector: publication-asset-paths
            meaning: Comparison of the set of asset paths in the final supplemental handoff manifest with the declared installer and manifest asset paths.
          - selector: publication-source-snapshots
            meaning: Verification-only installer source snapshots in the final supplemental handoff; absent or present.
          - selector: publication-asset-checksum-sidecars
            meaning: Comparison of each asset checksum file with the sha256 and asset path declared in supplemental-manifest.json; equal or different.
          - selector: declaration-directory-file-name-difference-count
            meaning: Number of file names in the installer declaration directory (.ci/installer) that the invocation added or removed, compared before and after the invocation, as a decimal integer string.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.supplemental-phase-valid
      - environment: runtime-context.supplemental-phase-invalid
      - environment: runtime-context.standard-installer-evidence-valid
      - environment: runtime-context.supplemental-asset-release-valid
      - environment: runtime-context.supplemental-asset-release-invalid
    guarantees:
      - id: phase-success
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.supplemental-asset-release-valid
        claim:
          field: status
          in:
            - success
      - id: phase-output
        applies_to:
          - runtime-context.supplemental-phase-valid
          - runtime-context.supplemental-asset-release-valid
        claim:
          field: output-directory-binding
          in:
            - equal
      - id: phase-rejected
        applies_to:
          - runtime-context.supplemental-phase-invalid
          - runtime-context.supplemental-asset-release-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: standard-installer-evidence-preserved
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: candidate-files
          in:
            - matched
      - id: standard-installer-publication-assets-produced
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: publication-asset-paths
          in:
            - equal
      - id: standard-installer-source-snapshots-excluded
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: publication-source-snapshots
          in:
            - absent
      - id: standard-installer-checksum-sidecar
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: publication-asset-checksum-sidecars
          in:
            - equal
      - id: standard-installer-declaration-directory-unchanged
        applies_to:
          - runtime-context.standard-installer-evidence-valid
        claim:
          field: declaration-directory-file-name-difference-count
          in:
            - "0"
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
