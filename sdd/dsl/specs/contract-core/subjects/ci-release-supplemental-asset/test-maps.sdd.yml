version: 1
name: contract-test-maps
subject_ref: subject.ci.release-supplemental-asset
test_maps:
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: platform-phase
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint emits success for the v2 build-platform phase"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint emits success for the v2 build-platform phase"
        check_refs: [success, output]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: assembly-phase
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint emits success for the v2 assemble phase"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint emits success for the v2 assemble phase"
        check_refs: [success, output]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: unselected-binding
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint rejects invalid binding before owner execution"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint rejects invalid binding before owner execution"
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: injected-output
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint rejects injected output before owner execution"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint rejects injected output before owner execution"
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: owner-failure
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint propagates owner failure without owner diagnostics"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint propagates owner failure without owner diagnostics"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: "supplemental-phase-source > supplemental source preserves owner shebang failure semantics"
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: input-mutation
    tests:
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "source entrypoint > supplemental entrypoint rejects mutated standard inputs and retains partial output"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/entrypoint.test.ts
        symbol: "dist entrypoint > supplemental entrypoint rejects mutated standard inputs and retains partial output"
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: supplemental source rejects mutated authority, snapshot, adapter and supplemental inputs
        check_refs: [refusal]
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: supplemental source accepts empty markers and rejects their mutation
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: unsafe-phase-path
    tests:
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: supplemental source rejects unsafe paths, invalid phases and existing outputs
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: identity-selection
    tests:
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: supplemental source rejects snapshot, source and owner selection mismatches
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: missing-output
    tests:
      - path: actions/ci-release-supplemental-asset/tests/phase.test.ts
        symbol: supplemental source rejects missing and empty owner output
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-installer
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > executes standard mode from the distributed Action and reports verified output
        check_refs:
          - success
          - output
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-declaration-mutation
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects changed product declaration
          before generating output
        check_refs:
          - refusal
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-candidate-mutation
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects modified candidate even if
          supplied file hashes match
        check_refs:
          - refusal
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-local-cli
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > executes packaged local CLI with the
          same fixed boundary
        check_refs:
          - success
          - output
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-provider-profile-refusal
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects unsupported provider profile without successful Action output or generated assets
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-platform-subset
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > keeps unselected release targets outside native selection
        check_refs: [success, output]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-platform-binding
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects release id or target mismatches in both phases
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-platform-authority
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects platform authority drift before execution
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-platform-mutation
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects platform mutation during provider execution
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-checksum-bytes
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: standard installer > assembly > rejects noncanonical checksum bytes in both phases
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-checkout-eol
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > accepts lf checkout declarations through both phases and release assembly"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > accepts crlf checkout declarations through both phases and release assembly"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > accepts mixed checkout declarations through both phases and release assembly"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > distributed Action accepts CRLF checkout through both phases"
        check_refs: [success, output]
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > distributed CLI accepts CRLF checkout through both phases"
        check_refs: [success, output]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-source-content
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > rejects changes beyond checkout line endings in both phases"
        check_refs: [refusal]
  - verification_id: verification.ci-release-supplemental-asset.outputs
    case_id: standard-execution-eol-mutation
    tests:
      - path: actions/ci-release-supplemental-asset/tests/standard-installer.test.ts
        symbol: "standard installer > assembly > rejects newline-only input mutation during provider execution in both phases"
        check_refs: [refusal]
