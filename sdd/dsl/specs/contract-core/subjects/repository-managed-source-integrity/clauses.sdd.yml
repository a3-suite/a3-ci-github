version: 1
name: contract-clauses
subject_ref: subject.repository.managed-source-integrity
contracts:
  - id: contract.repository-managed-source-integrity.integrity
    summary: Repository maintenance checks resolve canonical managed sources and reject stale legacy ownership locations.
    conditions:
      - id: diagnostic-required-integrity
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: repository-managed-source-integrity-source-available
        input_predicate:
          kind: input
          term: input.repository-source
          op: present
      - id: repository-managed-source-integrity-legacy-check-required
        input_predicate:
          kind: input
          term: input.legacy-location-policy
          op: present
    guarantees:
      - id: repository-managed-source-integrity-success-observed
        when: repository-managed-source-integrity-source-available
        observation_ref: observation.repository-managed-source-integrity.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: canonical-assets
      - id: repository-managed-source-integrity-failure-observed
        when: repository-managed-source-integrity-legacy-check-required
        observation_ref: observation.repository-managed-source-integrity.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: stale-locations
      - id: diagnostic-details-integrity
        when: diagnostic-required-integrity
        observation_ref: observation.repository-managed-source-integrity.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-integrity
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [diagnostic-details-integrity]
      - id: repository-managed-source-integrity-success-intent
        goal: Resolve every registered repository-owned canonical asset from its owner root.
        guarantee_refs:
          - repository-managed-source-integrity-success-observed
      - id: repository-managed-source-integrity-failure-intent
        goal: Verify stale legacy locations are absent and cannot act as a second source authority.
        guarantee_refs:
          - repository-managed-source-integrity-failure-observed
  - id: contract.repository-managed-source-integrity.execution-mapping
    summary: Repository contract subjects have explicit active or excluded execution mappings whose test paths remain inside the repository.
    conditions:
      - id: diagnostic-required-execution-mapping
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: repository-contract-execution-definition-available
        input_predicate:
          kind: input
          term: input.contract-execution-definition
          op: present
    guarantees:
      - id: repository-contract-execution-mapped
        when: repository-contract-execution-definition-available
        observation_ref: observation.repository-managed-source-integrity.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: contract-execution
      - id: diagnostic-details-execution-mapping
        when: diagnostic-required-execution-mapping
        observation_ref: observation.repository-managed-source-integrity.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-execution-mapping
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [diagnostic-details-execution-mapping]
      - id: repository-contract-execution-mapped-intent
        goal: Every packaged subject has an explicit active or excluded execution segment whose test paths stay inside the repository.
        guarantee_refs:
          - repository-contract-execution-mapped
