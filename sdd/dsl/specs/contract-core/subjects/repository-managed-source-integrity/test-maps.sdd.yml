version: 1
name: contract-test-maps
subject_ref: subject.repository.managed-source-integrity
test_maps:
  - verification_id: verification.repository-managed-source-integrity.integrity
    case_id: repository-managed-source-integrity-success
    tests:
      - path: tests/repository-managed-source-integrity.test.mjs
        symbol: "repository-managed-source-integrity > managed source inventory resolves every canonical repository asset"
        check_refs:
          - check-repository-managed-source-integrity-success
  - verification_id: verification.repository-managed-source-integrity.integrity
    case_id: repository-managed-source-integrity-failure
    tests:
      - path: tests/repository-managed-source-integrity.test.mjs
        symbol: "repository-managed-source-integrity > managed source inventory rejects stale legacy locations"
        check_refs:
          - check-repository-managed-source-integrity-failure
  - verification_id: verification.repository-managed-source-integrity.execution-mapping
    case_id: repository-contract-execution-mapped
    tests:
      - path: tests/contract-subject-execution.test.mjs
        symbol: "repository-contract-subject-execution > execution definition covers every contract-package subject scope"
        check_refs:
          - check-repository-contract-execution-mapped
  - verification_id: verification.repository-managed-source-integrity.integrity
    case_id: detailed-failure-integrity
    tests:
      - path: tests/workflow-contracts.test.mjs
        symbol: "workflow-contracts > repository-quality-delivery-regression > candidate gate reports uncommitted execution assets as an actionable reason"
        check_refs: [diagnostic-details]
      - path: tests/runtime-failure-diagnostics.test.mjs
        symbol: "runtime failure diagnostics > managed-source rejects invalid invocation with retained shell failure context"
        check_refs: [diagnostic-details]
      - path: tests/public-cli-lifecycle.test.mjs
        symbol: "repository-maintenance-cli > maintenance entrypoints retain safe failure context and primary exits when sinks fail"
        check_refs: [diagnostic-details]
  - verification_id: verification.repository-managed-source-integrity.execution-mapping
    case_id: detailed-failure-execution-mapping
    tests:
      - path: tests/contract-subject-execution.test.mjs
        symbol: "repository-contract-subject-execution > definition check retains the rejected mapping as failure details without private parser text"
        check_refs: [diagnostic-details]
