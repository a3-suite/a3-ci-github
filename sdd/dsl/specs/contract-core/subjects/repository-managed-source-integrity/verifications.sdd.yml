version: 1
name: contract-verifications
cases:
  - contract_id: contract.repository-managed-source-integrity.integrity
    id: detailed-failure-integrity
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - invalid
  - contract_id: contract.repository-managed-source-integrity.integrity
    id: repository-managed-source-integrity-success
    partition: repository-managed-source-integrity-source-available
    input:
      repository-tree: canonical
  - contract_id: contract.repository-managed-source-integrity.integrity
    id: repository-managed-source-integrity-failure
    partition: repository-managed-source-integrity-legacy-check-required
    input:
      repository-tree: stale-legacy-location
  - contract_id: contract.repository-managed-source-integrity.execution-mapping
    id: detailed-failure-execution-mapping
    partition: runtime-context.failure-diagnostic-required
    input:
      execution-definition: escaping-test-path
  - contract_id: contract.repository-managed-source-integrity.execution-mapping
    id: repository-contract-execution-mapped
    partition: repository-contract-execution-definition-available
    input:
      contract-package: sdd/dsl/specs/contract-core/contract-package.sdd.yml
