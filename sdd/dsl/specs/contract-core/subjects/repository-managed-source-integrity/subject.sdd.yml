version: 1
name: contract-subject
subject:
  id: subject.repository.managed-source-integrity
  summary: Maintain canonical workflows, runtime, rules, guidance, SDD, and verification assets as one resolvable repository source.
contracts:
  - id: contract.repository-managed-source-integrity.integrity
    summary: Repository tree and argument inputs to the managed source maintenance gate.
    inputs:
      - name: repository-tree
        meaning: "Precondition prepared by the case: state of the repository tree read by the managed source gate."
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
    observations:
      - summary: Repository-owned canonical asset roots, registered sources and legacy source locations in the repository tree.
        boundary: boundary.workspace-files
        fields:
          - selector: missing-canonical-asset-roots
            meaning: Occurrence state (present or absent) of a repository-owned canonical asset root directory missing from the repository tree.
          - selector: missing-registered-sources
            meaning: Occurrence state (present or absent) of a workflows, runtime, or lint-rules source path declared by the preset asset registry missing from the repository tree.
          - selector: legacy-source-locations
            meaning: Occurrence state (present or absent) of a registered legacy source location in the repository tree.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: repository-managed-source-integrity-source-available
      - input: repository-managed-source-integrity-legacy-check-required
    guarantees:
      - id: canonical-asset-roots-present
        applies_to:
          - repository-managed-source-integrity-source-available
        claim:
          field: missing-canonical-asset-roots
          in:
            - absent
      - id: registered-sources-present
        applies_to:
          - repository-managed-source-integrity-source-available
        claim:
          field: missing-registered-sources
          in:
            - absent
      - id: legacy-source-locations-absent
        applies_to:
          - repository-managed-source-integrity-legacy-check-required
        claim:
          field: legacy-source-locations
          in:
            - absent
      - id: diagnostic-failure-stage-integrity
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
  - id: contract.repository-managed-source-integrity.execution-mapping
    summary: Repository contract execution definition.
    inputs:
      - name: contract-package
        meaning: "Received by the contract target: contract package definition read by the execution mapping."
      - name: execution-definition
        meaning: "Received by the contract target: contract subject execution definition read by the check."
    observations:
      - summary: Contract execution mapping results exposed by the repository contract execution check.
        boundary: boundary.repository-gate-result
        fields:
          - selector: contract-execution-subject-coverage
            meaning: Comparison of packaged contract subjects with subjects mapped by the execution definition; matched or missing.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: repository-contract-execution-definition-available
    guarantees:
      - id: repository-contract-execution-subjects-covered
        applies_to:
          - repository-contract-execution-definition-available
        claim:
          field: contract-execution-subject-coverage
          in:
            - matched
      - id: diagnostic-failure-stage-execution-mapping
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
