version: 1
name: contract-subject
subject:
  id: subject.ci.release-request-handoff
  summary: Write an immutable annotated-tag release request handoff.
contracts:
  - id: contract.ci-release-request-handoff.outputs
    summary: Valid request inputs produce a request handoff and digest path.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: output-directory
        meaning: "Received by the contract target: output directory path passed by the caller."
      - name: tag-source-sha
        meaning: "Received by the contract target: commit SHA that the tag points to."
      - name: tag-object-sha
        meaning: "Received by the contract target: annotated tag object SHA."
      - name: github-ref
        meaning: "Received by the contract target: ref of the triggering event."
      - name: github-ref-name
        meaning: "Received by the contract target: ref name of the triggering event."
      - name: request-run-id
        meaning: "Received by the contract target: workflow run ID of the request."
      - name: request-actor
        meaning: "Received by the contract target: actor of the request."
      - name: tag
        meaning: "Received by the contract target: release tag name."
      - name: ref
        meaning: "Received by the contract target: tag ref passed to the Action."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: request-path
            meaning: Path to the immutable release request JSON.
          - selector: request-digest
            meaning: Path to the request digest file.
          - selector: outcome
            meaning: Failure outcome of the rejected release request handoff step.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - environment: runtime-context.release-request-handoff-valid
      - environment: runtime-context.action-input-invalid
    guarantees:
      - id: request-handoff-output-produced
        applies_to:
          - runtime-context.release-request-handoff-valid
        claim:
          field: request-path
          present: true
      - id: request-handoff-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
        claim:
          field: outcome
          in:
            - failure
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
