version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-release-request-handoff.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-release-request-handoff.outputs
    id: tag-request-handoff
    partition: runtime-context.release-request-handoff-valid
    input:
      output-directory: release-request
      tag-source-sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      tag-object-sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      github-ref: refs/tags/v1.2.3
      github-ref-name: v1.2.3
      request-run-id: "42"
      request-actor: release-operator
  - contract_id: contract.ci-release-request-handoff.outputs
    id: tag-ref-mismatch-rejected
    partition: runtime-context.action-input-invalid
    input:
      tag: v1.2.3
      ref: refs/tags/v1.2.4
