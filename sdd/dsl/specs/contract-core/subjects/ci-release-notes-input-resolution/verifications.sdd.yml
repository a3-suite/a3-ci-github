version: 1
name: contract-verifications
subject_ref: subject.ci.release-notes-input-resolution
verifications:
  - id: verification.ci-release-notes-input-resolution.outputs
    contract_id: contract.ci-release-notes-input-resolution.outputs
    cases:
      - id: tag-notes-resolution
        intent_id: notes-resolution-output-set
        input:
          input-handoff-directory: release-notes-handoff
          output-directory: release-request
        checks:
          - id: check-notes-resolution-output
            guarantee_ref: notes-resolution-output-produced
      - id: existing-normalized-handoff-rejected
        intent_id: notes-resolution-rejected
        input:
          source-path: release-notes.json
          destination-path: existing-release-notes.json
        checks:
          - id: check-notes-resolution-failure
            guarantee_ref: notes-resolution-failure-propagated
