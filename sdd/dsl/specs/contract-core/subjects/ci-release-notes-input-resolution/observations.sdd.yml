version: 1
name: contract-observations
subject_ref: subject.ci.release-notes-input-resolution
observations:
  - id: observation.ci-release-notes-input-resolution.outputs
    summary: The Action exposes normalized release notes paths.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Whether input resolution succeeded.
        - selector: release-notes-path
          kind: observation_field
          meaning: Normalized release notes path.
        - selector: approval-path
          kind: observation_field
          meaning: Normalized release notes approval path.
  - id: observation.ci-release-notes-input-resolution.result
    summary: The Action exposes its failed step outcome when notes input resolution is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected notes input resolution step.
