version: 1
name: contract-test-maps
subject_ref: subject.ci.release-notes-input-resolution
test_maps:
  - verification_id: verification.ci-release-notes-input-resolution.outputs
    case_id: tag-notes-resolution
    tests:
      - path: actions/ci-release-notes-input-resolution/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint resolves an external tag handoff"
        check_refs:
          - check-notes-resolution-output
      - path: actions/ci-release-notes-input-resolution/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint resolves an external tag handoff"
        check_refs:
          - check-notes-resolution-output
  - verification_id: verification.ci-release-notes-input-resolution.outputs
    case_id: existing-normalized-handoff-rejected
    tests:
      - path: actions/ci-release-notes-input-resolution/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint rejects an existing normalized handoff"
        check_refs:
          - check-notes-resolution-failure
      - path: actions/ci-release-notes-input-resolution/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint rejects an existing normalized handoff"
        check_refs:
          - check-notes-resolution-failure
