version: 1
name: contract-clauses
subject_ref: subject.ci.package-publication-workflow
contracts:
  - id: contract.ci-package-publication-workflow.publication
    summary: The canonical package workflows order source and version request validation, fixed-reference provider-owned package preparation using the consumer-owned build adapter without copying its workflow, handoff validation, fixed-reference provider-owned publication using explicit owner settings and the consumer-owned publisher without copying its workflow, and registry readback.
    conditions:
      - id: diagnostic-required-publication
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-package-publication-workflow-canonical-source-available
        input_predicate:
          kind: input
          term: input.canonical-source
          op: present
      - id: ci-package-publication-workflow-failure-route-required
        input_predicate:
          kind: input
          term: input.failure-route
          op: present
    guarantees:
      - id: ci-package-publication-workflow-success-observed
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: publication-boundary
      - id: ci-package-publication-workflow-failure-observed
        when: ci-package-publication-workflow-failure-route-required
        observation_ref: observation.ci-package-publication-workflow.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: failure-summary
      - id: diagnostic-details-publication
        when: diagnostic-required-publication
        observation_ref: observation.ci-package-publication-workflow.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: package-fixed-provider-reference
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-fixed-provider-reference
            right:
              kind: value_set
              values:
                - equal
      - id: package-explicit-owner-inputs
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-explicit-owner-inputs
            right:
              kind: value_set
              values:
                - equal
      - id: package-request-before-preparation
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-request-before-preparation
            right:
              kind: value_set
              values:
                - request-before-preparation
      - id: package-preparation-before-publication
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-preparation-before-publication
            right:
              kind: value_set
              values:
                - preparation-before-publication
      - id: package-control-sha-bound
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-control-sha-bound
            right:
              kind: value_set
              values:
                - equal
      - id: package-control-head-verified
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-control-head-verified
            right:
              kind: value_set
              values:
                - checkout-before-verification
      - id: package-handoff-before-publication
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-handoff-before-publication
            right:
              kind: value_set
              values:
                - handoff-before-publication
      - id: package-credential-scope
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-credential-scope
            right:
              kind: value_set
              values:
                - absent
      - id: package-owner-publisher-invoked
        when: ci-package-publication-workflow-canonical-source-available
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-owner-publisher-invoked
            right:
              kind: value_set
              values:
                - package-handoff
      - id: package-failure-summary-always
        when: ci-package-publication-workflow-failure-route-required
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-failure-summary-always
            right:
              kind: value_set
              values:
                - always
      - id: package-failed-prerequisite-blocks
        when: ci-package-publication-workflow-failure-route-required
        observation_ref: observation.ci-package-publication-workflow.publication.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: package-failed-prerequisite-blocks
            right:
              kind: value_set
              values:
                - absent
    verification_intents:
      - id: detailed-diagnostics-publication
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [ diagnostic-details-publication ]
      - id: ci-package-publication-workflow-success-intent
        goal: Verify preparation and publication fixed-reference availability, typed inputs, explicit registry secret and permissions fail closed; request validation precedes preparation, and the default-branch workflow_run caller entry, consumer control checkout at github.workflow_sha with immediate HEAD verification, and handoff validation precede credential-bearing publication and registry readback.
        guarantee_refs:
          - ci-package-publication-workflow-success-observed
          - package-fixed-provider-reference
          - package-explicit-owner-inputs
          - package-request-before-preparation
          - package-preparation-before-publication
          - package-control-sha-bound
          - package-control-head-verified
          - package-handoff-before-publication
          - package-credential-scope
          - package-owner-publisher-invoked
      - id: ci-package-publication-workflow-failure-intent
        goal: Verify failed or unresolved prerequisite stages block publication while the aggregate summary remains observable.
        guarantee_refs:
          - ci-package-publication-workflow-failure-observed
          - package-failure-summary-always
          - package-failed-prerequisite-blocks
