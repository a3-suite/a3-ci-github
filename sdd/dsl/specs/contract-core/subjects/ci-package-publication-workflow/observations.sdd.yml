    summary: Observable canonical workflow definition for this capability.
    boundary:
      ref: boundary.workflow-definition
    value:
      root: canonical-workflow
      kind: object
      fields:
        - selector: publication-boundary
          kind: observation_field
          meaning: Declared fixed provider publication call with explicit typed owner configuration and the order in which source and version request validation precedes preparation, publication entry and handoff validation precede credential-bearing publication, and publication precedes registry readback.
