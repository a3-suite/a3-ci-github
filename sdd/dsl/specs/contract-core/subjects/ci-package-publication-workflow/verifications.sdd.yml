version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-package-publication-workflow.publication
    id: detailed-failure-publication
    partition: runtime-context.failure-diagnostic-required
    input:
      job-result: failure
  - contract_id: contract.ci-package-publication-workflow.publication
    id: ci-package-publication-workflow-success
    partition: ci-package-publication-workflow-canonical-source-available
    input:
      workflow-source: .github/workflows/ci-package-publication.yml
  - contract_id: contract.ci-package-publication-workflow.publication
    id: ci-package-publication-workflow-failure
    partition: ci-package-publication-workflow-failure-route-required
    input:
      workflow-source: workflows/package/package-publication-caller.yml
