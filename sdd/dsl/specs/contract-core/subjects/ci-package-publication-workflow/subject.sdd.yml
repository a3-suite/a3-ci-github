version: 1
name: contract-subject
subject:
  id: subject.ci.package-publication-workflow
  summary: Publish a verified package through separated preparation, request validation, and privileged publication stages.
contracts:
  - id: contract.ci-package-publication-workflow.publication
    summary: Canonical package publication workflow definitions.
    observations:
      - summary: Canonical workflow triggers, permissions, orchestration, and summaries exposed for repository verification.
        boundary: boundary.workflow-definition
        fields:
          - selector: publication-boundary
            meaning: Declared owner publication call and its dependency graph.
          - selector: failure-summary
            meaning: Declared package aggregate route.
          - selector: package-fixed-provider-reference
            meaning: Comparison of caller preparation/publication references with registered provider workflow reference declarations.
          - selector: package-explicit-owner-inputs
            meaning: Comparison of caller owner bindings with the provider typed required inputs.
          - selector: package-request-before-preparation
            meaning: Declared dependency order of request validation and preparation.
          - selector: package-preparation-before-publication
            meaning: Declared dependency order of preparation and privileged publication.
          - selector: package-control-sha-bound
            meaning: Comparison of trusted control checkout revision with github.workflow_sha.
          - selector: package-control-head-verified
            meaning: Declared order of control checkout and immediate HEAD verification.
          - selector: package-handoff-before-publication
            meaning: Declared order of package handoff validation and credential-bearing owner publisher invocation.
          - selector: package-credential-scope
            meaning: Occurrence of registry token bindings outside the owner publication step within the provider workflow execution.
          - selector: package-owner-publisher-invoked
            meaning: Declared owner publisher argument.
          - selector: package-failure-summary-always
            meaning: Declared publication aggregate condition.
          - selector: package-failed-prerequisite-blocks
            meaning: Occurrence of publication eligibility with failed or unknown required preparation or request validation.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: ci-package-publication-workflow-canonical-source-available
      - input: ci-package-publication-workflow-failure-route-required
    guarantees:
      - id: ci-package-publication-workflow-success-observed
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: publication-boundary
          present: true
      - id: ci-package-publication-workflow-failure-observed
        applies_to:
          - ci-package-publication-workflow-failure-route-required
        claim:
          field: failure-summary
          present: true
      - id: diagnostic-failure-stage-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: package-fixed-provider-reference
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-fixed-provider-reference
          in:
            - equal
      - id: package-explicit-owner-inputs
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-explicit-owner-inputs
          in:
            - equal
      - id: package-request-before-preparation
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-request-before-preparation
          in:
            - request-before-preparation
      - id: package-preparation-before-publication
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-preparation-before-publication
          in:
            - preparation-before-publication
      - id: package-control-sha-bound
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-control-sha-bound
          in:
            - equal
      - id: package-control-head-verified
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-control-head-verified
          in:
            - checkout-before-verification
      - id: package-handoff-before-publication
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-handoff-before-publication
          in:
            - handoff-before-publication
      - id: package-credential-scope
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-credential-scope
          in:
            - absent
      - id: package-owner-publisher-invoked
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        claim:
          field: package-owner-publisher-invoked
          in:
            - package-handoff
      - id: package-failure-summary-always
        applies_to:
          - ci-package-publication-workflow-failure-route-required
        claim:
          field: package-failure-summary-always
          in:
            - always
      - id: package-failed-prerequisite-blocks
        applies_to:
          - ci-package-publication-workflow-failure-route-required
        claim:
          field: package-failed-prerequisite-blocks
          in:
            - absent
