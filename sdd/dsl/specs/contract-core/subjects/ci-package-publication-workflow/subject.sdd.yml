version: 1
name: contract-subject
subject:
  id: subject.ci.package-publication-workflow
  summary: Publish a verified package through separated preparation, request validation, and privileged publication stages.
contracts:
  - id: contract.ci-package-publication-workflow.publication
    summary: Canonical package publication workflow definitions.
    inputs:
      - name: workflow-source
        meaning: "Received by the contract target: workflow definition file read by repository verification."
      - name: job-result
        meaning: "Received by the summary Action: result of a package workflow job."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The summary Action processes a failed or cancelled package workflow job result.
      - id: ci-package-publication-workflow-canonical-source-available
        summary: Repository verification receives the canonical workflow definitions for inspection.
    guarantees:
      - id: ci-package-publication-workflow-failure-observed
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: "The request summary receives the request job status, and the caller summary receives the publication job result."
      - id: diagnostic-failure-stage-publication
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "The summary Action records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: package-fixed-provider-reference
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-fixed-provider-reference` is one of `"equal"`. Comparison of caller preparation/publication references with registered provider workflow reference declarations.'
      - id: package-explicit-owner-inputs
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-explicit-owner-inputs` is one of `"equal"`. Comparison of caller owner bindings with the provider typed required inputs.'
      - id: package-request-before-preparation
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-request-before-preparation` is one of `"request-before-preparation"`. Declared dependency order of request validation and preparation.'
      - id: package-preparation-before-publication
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-preparation-before-publication` is one of `"preparation-before-publication"`. Declared dependency order of preparation and privileged publication.'
      - id: package-preparation-secrets-absent
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-preparation-secret-bindings` is one of `"absent"`. Occurrence of secrets that the caller passes to, or the provider declares for, the package preparation workflow.'
      - id: package-control-sha-bound
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-control-sha-bound` is one of `"equal"`. Comparison of trusted control checkout revision with github.workflow_sha.'
      - id: package-control-head-verified
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-control-head-verified` is one of `"checkout-before-verification"`. Declared order of control checkout and immediate HEAD verification.'
      - id: package-handoff-before-publication
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-handoff-before-publication` is one of `"handoff-before-publication"`. Declared order of package handoff validation and credential-bearing owner publisher invocation.'
      - id: package-credential-scope
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-credential-scope` is one of `"absent"`. Occurrence of registry token bindings outside the owner publication step within the provider workflow execution.'
      - id: package-owner-publisher-invoked
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-owner-publisher-invoked` is one of `"package-handoff"`. Declared owner publisher argument.'
      - id: package-failure-summary-always
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-failure-summary-always` is one of `"always"`. Declared publication aggregate condition.'
      - id: package-failed-prerequisite-blocks
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-failed-prerequisite-blocks` is one of `"absent"`. Occurrence of publication eligibility with failed or unknown required preparation or request validation.'
      - id: package-publication-serialized
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-publication-concurrency` is one of `"serialized"`. Declared concurrency of the package publication provider workflow: the group includes the workflow, repository and target identity, and pending runs are queued without cancelling an in-progress run.'
      - id: package-preparation-least-privilege
        applies_to:
          - ci-package-publication-workflow-canonical-source-available
        boundary: boundary.workflow-definition
        statement: '`package-preparation-permissions` is one of `"least-privilege"`. Declared permissions of the package preparation provider workflow and its build job: no workflow permissions and read-only contents for build; least-privilege or other.'
    input_kind:
      kind: operation
      name: ci-package-publication-workflow
