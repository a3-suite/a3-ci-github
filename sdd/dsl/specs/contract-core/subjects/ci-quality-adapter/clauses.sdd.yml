version: 1
name: contract-clauses
subject_ref: subject.ci.quality-adapter
contracts:
  - id: contract.ci-quality-adapter.outputs
    summary: Exactly one fixed standard bundle ID or trusted read-only descriptor selects quality commands and produces aggregate execution status. Standard bundles preserve repository-owned source path and content digest and require no consumer descriptor; their IDs are rejected in local descriptors. execution-scope defaults to all; native is accepted only for fixed standard Rust and omits its provider-classified format/security commands while preserving toolchain verification, preparation and native checks. Native success covers only the executed command set; the caller must also establish shared-check success.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: quality-adapter-bundle-present
        input_predicate:
          kind: input
          term: input.bundle-path
          op: present
      - id: quality-adapter-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.action-input-invalid
          op: available
      - id: quality-adapter-standard-bundle-present
        input_predicate:
          kind: input
          term: input.standard-bundle-id
          op: present
      - id: quality-adapter-toolchain-version-report-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.quality-adapter-toolchain-version-report-rejected
          op: available
      - id: native-rust-valid
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-adapter-native-rust-valid
          op: available
      - id: native-scope-rejected
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-adapter-native-scope-rejected
          op: available
      - id: embedded-bundle-supplied
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-quality-adapter-embedded-bundle-supplied
          op: available
    guarantees:
      - id: quality-adapter-status-produced
        when: quality-adapter-bundle-present
        observation_ref: observation.ci-quality-adapter.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: quality-adapter-failure-propagated
        when: quality-adapter-rejected
        observation_ref: observation.ci-quality-adapter.result
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: outcome
            right:
              kind: value_set
              values:
                - failure
      - id: quality-adapter-standard-status-produced
        when: quality-adapter-standard-bundle-present
        observation_ref: observation.ci-quality-adapter.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: quality-adapter-toolchain-version-diagnostic-present
        when: quality-adapter-toolchain-version-report-rejected
        observation_ref: observation.ci-quality-adapter.result
        claim:
          kind: diagnostic-present
          op: contains
          target:
            kind: diagnostic_code
            value: quality-adapter-toolchain-version-mismatch
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-quality-adapter.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: native-format-omitted
        when: native-rust-valid
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: format-command-state
            right:
              kind: value_set
              values:
                - absent
      - id: native-security-omitted
        when: native-rust-valid
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: security-command-state
            right:
              kind: value_set
              values:
                - absent
      - id: native-command-order
        when: native-rust-valid
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: native-task-order
            right:
              kind: value_set
              values:
                - toolchain-verify
                - toolchain-verify,dependency-restore
                - toolchain-verify,dependency-restore,lint,test,structure
      - id: standard-descriptor-independent
        when: quality-adapter-standard-bundle-present
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: consumer-descriptor-read-state
            right:
              kind: value_set
              values:
                - absent
      - id: rejected-scope-no-commands
        when: native-scope-rejected
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: rejected-command-state
            right:
              kind: value_set
              values:
                - absent
      - id: standard-source-path-validated
        when: embedded-bundle-supplied
        observation_ref: observation.ci-quality-adapter.embedded-bundle
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-source-binding
            right:
              kind: value_set
              values:
                - allowed-source-path
      - id: standard-content-digest-checked
        when: embedded-bundle-supplied
        observation_ref: observation.ci-quality-adapter.embedded-bundle
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: accepted-content-digest
            right:
              kind: value_set
              values:
                - equal
      - id: native-terminal-prerequisite-status
        when: native-rust-valid
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: native-terminal-prerequisite-status
            right:
              kind: value_set
              values:
                - failed
                - 判定不能
                - continued
      - id: native-no-followup-after-failed-prerequisite
        when: native-rust-valid
        observation_ref: observation.ci-quality-adapter.outputs.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: native-failed-prerequisite-followup-state
            right:
              kind: value_set
              values:
                - absent
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [ diagnostic-details-outputs ]
      - id: quality-adapter-execution
        goal: A read-only descriptor executes in the selected source root and returns status.
        guarantee_refs:
          - quality-adapter-status-produced
      - id: quality-adapter-rejected
        goal: An adapter that violates the read-only contract fails before project commands run.
        guarantee_refs:
          - quality-adapter-failure-propagated
      - id: quality-adapter-standard-execution
        goal: A fixed Action containing a repository-generated standard bundle executes without reading a consumer descriptor; ambiguous, unknown or integrity-invalid selections and unsupported execution scopes are rejected before commands. Default/all preserve the entire bundle, while native Rust retains toolchain/preparation/clippy/test/metadata and returns only executed results.
        guarantee_refs:
          - quality-adapter-standard-status-produced
          - standard-descriptor-independent
      - id: quality-adapter-toolchain-version-report-rejected
        goal: A toolchain version command that does not report the requested version as an independent token fails with the stable version-mismatch diagnostic.
        guarantee_refs:
          - quality-adapter-toolchain-version-diagnostic-present
      - id: native-rust-rules
        goal: Verify the native-rust-valid partition.
        guarantee_refs:
          - native-format-omitted
          - native-security-omitted
          - native-command-order
          - native-terminal-prerequisite-status
          - native-no-followup-after-failed-prerequisite
      - id: unsupported-native-scope
        goal: Verify the native-scope-rejected partition.
        guarantee_refs:
          - rejected-scope-no-commands
      - id: embedded-bundle-integrity
        goal: Verify the embedded-bundle-supplied partition.
        guarantee_refs:
          - standard-source-path-validated
          - standard-content-digest-checked
