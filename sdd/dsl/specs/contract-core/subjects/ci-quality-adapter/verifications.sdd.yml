version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-quality-adapter.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      scenario: rejected-public-invocation
  - contract_id: contract.ci-quality-adapter.outputs
    id: standard-adapter-execution
    partition: quality-adapter-standard-bundle-present
    input:
      standard-bundle-id: typescript-npm-quality
  - contract_id: contract.ci-quality-adapter.outputs
    id: standard-rust-scopes
    partition: quality-adapter-standard-bundle-present
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: all
      toolchain-version: 1.80.0
    verifies:
      - quality-adapter-status-produced
  - contract_id: contract.ci-quality-adapter.outputs
    id: standard-selection-rejected
    partition: runtime-context.action-input-invalid
    input:
      scenario: unknown-standard-selection
  - contract_id: contract.ci-quality-adapter.outputs
    id: standard-python-adapter-execution
    partition: quality-adapter-standard-bundle-present
    input:
      standard-bundle-id: python-uv-quality
    verifies:
      - quality-adapter-status-produced
  - contract_id: contract.ci-quality-adapter.outputs
    id: read-only-adapter-execution
    partition: quality-adapter-bundle-present
    input:
      bundle-path: adapter.yml
  - contract_id: contract.ci-quality-adapter.outputs
    id: writable-adapter-rejected
    partition: runtime-context.action-input-invalid
    input:
      bundle-path: writable-adapter.yml
  - contract_id: contract.ci-quality-adapter.outputs
    id: toolchain-version-report-rejected
    partition: runtime-context.quality-adapter-toolchain-version-report-rejected
    input:
      bundle-path: adapter.yml
      toolchain-version: 9.9.9
  - contract_id: contract.ci-quality-adapter.outputs
    id: native-rust-rules
    partition: runtime-context.ci-quality-adapter-native-rust-valid
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: native
      toolchain-version: 1.80.0
  - contract_id: contract.ci-quality-adapter.outputs
    id: unsupported-native-scope
    partition: runtime-context.ci-quality-adapter-native-scope-rejected
    input:
      standard-bundle-id: typescript-npm-quality
      execution-scope: native
  - contract_id: contract.ci-quality-adapter.outputs
    id: embedded-bundle-integrity
    partition: runtime-context.ci-quality-adapter-embedded-bundle-supplied
    input:
      standard-bundle-id: rust-cargo-quality
  - contract_id: contract.ci-quality-adapter.outputs
    id: native-preparation-failure
    partition: runtime-context.ci-quality-adapter-native-rust-valid
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: native
      toolchain-version: 1.80.0
      failed-command: fetch
      command-exit: 7
  - contract_id: contract.ci-quality-adapter.outputs
    id: unconfigured-dependency-policy
    partition: runtime-context.ci-quality-adapter-dependency-policy-unconfigured
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: all
      toolchain-version: 1.80.0
      cargo-deny-version: ""
      cargo-deny-config-path: ""
  - contract_id: contract.ci-quality-adapter.outputs
    id: configured-dependency-policy
    partition: runtime-context.ci-quality-adapter-dependency-policy-configured
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: all
      toolchain-version: 1.80.0
      cargo-deny-version: 0.20.2
      cargo-deny-config-path: runtime/deny.toml
  - contract_id: contract.ci-quality-adapter.outputs
    id: missing-dependency-policy-config
    partition: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: all
      toolchain-version: 1.80.0
      cargo-deny-version: 0.20.2
      cargo-deny-config-path: runtime/missing-deny.toml
  - contract_id: contract.ci-quality-adapter.outputs
    id: incomplete-dependency-policy-inputs
    partition: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
    input:
      standard-bundle-id: rust-cargo-quality
      execution-scope: all
      toolchain-version: 1.80.0
      cargo-deny-version: 0.20.2
      cargo-deny-config-path: ""
