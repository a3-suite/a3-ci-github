version: 1
name: contract-subject
subject:
  id: subject.ci.quality-adapter
  summary: Execute validated read-only quality adapters against fixed source checkouts.
contracts:
  - id: contract.ci-quality-adapter.outputs
    summary: Quality adapter invocation with a standard bundle or trusted descriptor.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: standard-bundle-id
        meaning: "Received by the contract target: standard bundle identifier passed by the caller."
      - name: execution-scope
        meaning: "Received by the contract target: execution scope passed by the caller."
      - name: toolchain-version
        meaning: "Received by the contract target: toolchain version passed by the caller."
      - name: bundle-path
        meaning: "Received by the contract target: adapter bundle descriptor path."
      - name: failed-command
        meaning: "Precondition prepared by the case: adapter command that fails."
      - name: command-exit
        meaning: "Precondition prepared by the case: exit status of the failing command."
      - name: dependency-policy-output
        meaning: "Precondition prepared by the case: cargo-deny JSON lines that the failing dependency-policy command writes."
      - name: cargo-deny-version
        meaning: "Received by the contract target: cargo-deny version passed by the caller."
      - name: cargo-deny-config-path
        meaning: "Received by the contract target: cargo-deny configuration path passed by the caller."
    conditions:
      - id: quality-adapter-result-write-failed
        summary: The invocation computes a result but cannot save the result JSON.
      - id: quality-adapter-action-output-write-failed
        summary: The result JSON has been saved, but the invocation cannot write every required Action output.
      - id: quality-adapter-bundle-present
        summary: A valid custom bundle is selected by path and can publish its result. Any requested toolchain check either matches the expected version or cannot run. A command that runs and returns a rejected version report has its own condition.
      - id: runtime-context.action-input-invalid
        summary: Bundle selection, descriptor or other required input or preparation validation rejects the invocation before a result is computed. Native scope and dependency-policy input rejection have their own conditions. Other rejected inputs include unsafe or authority-mismatching input.
      - id: quality-adapter-standard-bundle-present
        summary: A valid built-in bundle uses default or all scope and can publish its result. Separate conditions cover a rejected toolchain version report and Rust invocations that reach the dependency-policy check.
      - id: runtime-context.quality-adapter-toolchain-version-report-rejected
        summary: In a default or all scope invocation, a quality adapter toolchain version command does not report the requested version as an independent token, or the command exits non-zero. The invocation can publish its result.
      - id: runtime-context.ci-quality-adapter-native-rust-valid
        summary: A valid embedded Rust invocation selects native scope, every prerequisite and selected check succeeds, and the result and Action outputs can be written. The invocation selects valid fixed source paths.
      - id: quality-adapter-native-rust-version-rejected
        summary: A valid embedded Rust invocation selects native scope, the toolchain command runs but fails or does not report the requested version, and the result and Action outputs can be written.
      - id: quality-adapter-native-rust-execution-failed
        summary: A valid embedded Rust invocation selects native scope and the toolchain command is unavailable, dependency restoration fails or is unavailable, or a selected native check fails or is unavailable. The result and Action outputs can be written.
      - id: runtime-context.ci-quality-adapter-native-scope-rejected
        summary: A native execution request selects a non-Rust bundle or a local descriptor, or the requested execution scope is unknown.
      - id: runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        summary: The Rust default or all scope invocation reaches the policy check with both optional settings empty and can publish its result.
      - id: runtime-context.ci-quality-adapter-dependency-policy-configured
        summary: The Rust default or all scope invocation reaches the configured policy check and can publish its result. A nonzero policy command that returns structured violation evidence has its own condition. The invocation supplies a nonempty CI_CARGO_DENY_VERSION and a relative CI_CARGO_DENY_CONFIG_PATH naming a regular file inside the source checkout.
      - id: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        summary: A rust-cargo-quality invocation supplies only one of CI_CARGO_DENY_VERSION and CI_CARGO_DENY_CONFIG_PATH, or a CI_CARGO_DENY_CONFIG_PATH that is absolute, missing, not a regular file, or outside the source checkout.
      - id: runtime-context.ci-quality-adapter-dependency-policy-violation
        summary: The Rust default or all scope invocation reaches the configured policy check, receives a nonzero result with structured violation evidence, and can publish its result. The invocation supplies a nonempty CI_CARGO_DENY_VERSION and a relative CI_CARGO_DENY_CONFIG_PATH naming a regular file inside the source checkout, and its prerequisites succeed. Its cargo-deny JSON output reports error diagnostics and a per-check summary together with message, label and span text.
    guarantees:
      - id: quality-adapter-matching-toolchain-allows-preparation
        applies_to:
          - quality-adapter-bundle-present
        boundary: boundary.workspace-files
        statement: When the custom bundle selects toolchain verification and preparation, a successful check that reports the requested version as a standalone token, optionally prefixed by v or V, is recorded before the preparation result.
      - id: status-result-consistent
        applies_to:
          - quality-adapter-bundle-present
          - quality-adapter-standard-bundle-present
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
          - runtime-context.ci-quality-adapter-dependency-policy-configured
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        boundary: boundary.action-output
        statement: '`status-result-consistency` is one of `"consistent"`. The `result-path` output identifies the saved JSON result, and the `status` output equals its status. Status is success exactly when every result except a not-run unconfigured optional command succeeded.'
      - id: quality-adapter-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
          - quality-adapter-result-write-failed
          - quality-adapter-action-output-write-failed
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected quality adapter step.'
      - id: quality-adapter-toolchain-version-diagnostic-present
        applies_to:
          - runtime-context.quality-adapter-toolchain-version-report-rejected
          - quality-adapter-native-rust-version-rejected
        boundary: boundary.diagnostic-result
        statement: The failed Action publishes `quality-adapter-toolchain-version-mismatch` as its diagnostic reason without exposing the toolchain command output.
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.action-input-invalid
          - quality-adapter-result-write-failed
          - quality-adapter-action-output-write-failed
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic identifies the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: native-format-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.workspace-files
        statement: '`format-command-state` is one of `"absent"`. Occurrence of format commands in the native execution trace.'
      - id: native-security-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.workspace-files
        statement: '`security-command-state` is one of `"absent"`. Occurrence of security commands in the native execution trace.'
      - id: standard-descriptor-independent
        applies_to:
          - quality-adapter-standard-bundle-present
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
          - runtime-context.ci-quality-adapter-dependency-policy-configured
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        boundary: boundary.workspace-files
        statement: '`consumer-descriptor-read-state` is one of `"absent"`. Occurrence of consumer descriptor reads for an embedded standard invocation.'
      - id: rejected-scope-no-commands
        applies_to:
          - runtime-context.ci-quality-adapter-native-scope-rejected
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        boundary: boundary.workspace-files
        statement: '`rejected-command-state` is one of `"absent"`. Occurrence of project command execution after the invocation is rejected.'
      - id: native-terminal-prerequisite-status
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.workspace-files
        statement: '`native-terminal-prerequisite-status` is one of `"failed"`, `"判定不能"`, `"continued"`. A failed or unavailable toolchain verification or dependency restoration is the final result. When both prerequisites succeed, the result includes the selected native commands.'
      - id: native-no-followup-after-failed-prerequisite
        applies_to:
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.workspace-files
        statement: '`native-failed-prerequisite-followup-state` is one of `"absent"`. No later command executes or appears in the result after toolchain verification or dependency restoration fails or is unavailable.'
      - id: native-dependency-policy-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
          - quality-adapter-native-rust-version-rejected
          - quality-adapter-native-rust-execution-failed
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"absent"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: unconfigured-dependency-policy-not-run
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"not-run"`. The result contains a dependency-policy entry with reason not-configured and a null exit code.'
      - id: not-run-aggregate-unchanged
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        boundary: boundary.workspace-files
        statement: '`not-run-aggregate-effect` is one of `"none"`. The unconfigured dependency-policy result is excluded from the aggregate status calculation.'
      - id: configured-dependency-policy-executed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"success"`, `"failed"`, `"判定不能"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: configured-dependency-policy-explicit-config
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-config-argument` is one of `"equal"`. The dependency-policy command receives the exact path from CI_CARGO_DENY_CONFIG_PATH as its configuration argument.'
      - id: dependency-policy-violation-failed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"failed"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: dependency-policy-violation-diagnostics-filtered
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        boundary: boundary.workspace-files
        statement: The result JSON retains only validated cargo-deny finding metadata and per-check counts. Raw diagnostic messages, labels, spans, and unstructured child output are protected.
    input_kind:
      kind: operation
      name: ci-quality-adapter
