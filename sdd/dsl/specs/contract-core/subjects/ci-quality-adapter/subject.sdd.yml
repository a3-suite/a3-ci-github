version: 1
name: contract-subject
subject:
  id: subject.ci.quality-adapter
  summary: Execute validated read-only quality adapters against fixed source checkouts.
contracts:
  - id: contract.ci-quality-adapter.outputs
    summary: Quality adapter invocation with a standard bundle or trusted descriptor.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: standard-bundle-id
        meaning: "Received by the contract target: standard bundle identifier passed by the caller."
      - name: execution-scope
        meaning: "Received by the contract target: execution scope passed by the caller."
      - name: toolchain-version
        meaning: "Received by the contract target: toolchain version passed by the caller."
      - name: bundle-path
        meaning: "Received by the contract target: adapter bundle descriptor path."
      - name: failed-command
        meaning: "Precondition prepared by the case: adapter command that fails."
      - name: command-exit
        meaning: "Precondition prepared by the case: exit status of the failing command."
      - name: dependency-policy-output
        meaning: "Precondition prepared by the case: cargo-deny JSON lines that the failing dependency-policy command writes."
      - name: cargo-deny-version
        meaning: "Received by the contract target: cargo-deny version passed by the caller."
      - name: cargo-deny-config-path
        meaning: "Received by the contract target: cargo-deny configuration path passed by the caller."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: quality-adapter-bundle-present
        summary: The invocation selects a custom adapter bundle by path.
      - id: runtime-context.action-input-invalid
        summary: The invocation meets the shared runtime context `runtime-context.action-input-invalid`.
      - id: quality-adapter-standard-bundle-present
        summary: The invocation selects a built-in standard adapter bundle by ID.
      - id: runtime-context.quality-adapter-toolchain-version-report-rejected
        summary: The invocation meets the shared runtime context `runtime-context.quality-adapter-toolchain-version-report-rejected`.
      - id: runtime-context.ci-quality-adapter-native-rust-valid
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-native-rust-valid`.
      - id: runtime-context.ci-quality-adapter-native-scope-rejected
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-native-scope-rejected`.
      - id: runtime-context.ci-quality-adapter-embedded-bundle-supplied
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-embedded-bundle-supplied`.
      - id: runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-dependency-policy-unconfigured`.
      - id: runtime-context.ci-quality-adapter-dependency-policy-configured
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-dependency-policy-configured`.
      - id: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-dependency-policy-config-unusable`.
      - id: runtime-context.ci-quality-adapter-dependency-policy-violation
        summary: The invocation meets the shared runtime context `runtime-context.ci-quality-adapter-dependency-policy-violation`.
    guarantees:
      - id: status-result-consistent
        applies_to:
          - quality-adapter-bundle-present
          - quality-adapter-standard-bundle-present
        boundary: boundary.action-output
        statement: '`status-result-consistency` is one of `"consistent"`. After removing not-run results of unconfigured optional commands, status is success exactly when every remaining result succeeded; consistent or not. Observable fields at this boundary also include `status` (Aggregate quality adapter status), `result-path` (Path to the quality adapter result JSON).'
      - id: quality-adapter-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected quality adapter step.'
      - id: quality-adapter-toolchain-version-diagnostic-present
        applies_to:
          - runtime-context.quality-adapter-toolchain-version-report-rejected
        boundary: boundary.action-output
        statement: '`diagnostic-codes` contains `"quality-adapter-toolchain-version-mismatch"`. Stable diagnostic codes reported by the failed step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: native-format-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        boundary: boundary.workspace-files
        statement: '`format-command-state` is one of `"absent"`. Occurrence of format commands in the native execution trace.'
      - id: native-security-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        boundary: boundary.workspace-files
        statement: '`security-command-state` is one of `"absent"`. Occurrence of security commands in the native execution trace.'
      - id: standard-descriptor-independent
        applies_to:
          - quality-adapter-standard-bundle-present
        boundary: boundary.workspace-files
        statement: '`consumer-descriptor-read-state` is one of `"absent"`. Occurrence of consumer descriptor reads for an embedded standard invocation.'
      - id: rejected-scope-no-commands
        applies_to:
          - runtime-context.ci-quality-adapter-native-scope-rejected
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        boundary: boundary.workspace-files
        statement: '`rejected-command-state` is one of `"absent"`. Occurrence of project command execution after the invocation is rejected.'
      - id: standard-source-path-validated
        applies_to:
          - runtime-context.ci-quality-adapter-embedded-bundle-supplied
        boundary: boundary.workspace-files
        statement: '`accepted-source-binding` is one of `"allowed-source-path"`. Classification of the embedded record source path against the runtime/adapter/bundles/<safe-basename>.yml path grammar.'
      - id: standard-content-digest-checked
        applies_to:
          - runtime-context.ci-quality-adapter-embedded-bundle-supplied
        boundary: boundary.workspace-files
        statement: '`accepted-content-digest` is one of `"equal"`. Comparison of the embedded descriptor SHA-256 with the digest recorded in its immutable embedded record.'
      - id: native-terminal-prerequisite-status
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        boundary: boundary.workspace-files
        statement: '`native-terminal-prerequisite-status` is one of `"failed"`, `"判定不能"`, `"continued"`. Status of the final observed result if its ID is toolchain-verify or dependency-restore; continued if the final result is a native command.'
      - id: native-no-followup-after-failed-prerequisite
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        boundary: boundary.workspace-files
        statement: '`native-failed-prerequisite-followup-state` is one of `"absent"`. Occurrence of a result after a toolchain-verify or dependency-restore result with a non-success status.'
      - id: native-dependency-policy-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"absent"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: unconfigured-dependency-policy-not-run
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"not-run"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: not-run-aggregate-unchanged
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        boundary: boundary.workspace-files
        statement: '`not-run-aggregate-effect` is one of `"none"`. Change of the aggregate status caused by results whose status is not-run.'
      - id: configured-dependency-policy-executed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"success"`, `"failed"`, `"判定不能"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
      - id: configured-dependency-policy-explicit-config
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        boundary: boundary.workspace-files
        statement: '`dependency-policy-config-argument` is one of `"equal"`. Comparison of the configuration path passed to the dependency-policy command with CI_CARGO_DENY_CONFIG_PATH.'
      - id: dependency-policy-violation-failed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        boundary: boundary.workspace-files
        statement: '`dependency-policy-result-status` is one of `"failed"`. Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.'
    input_kind:
      kind: operation
      name: ci-quality-adapter
