version: 1
name: contract-subject
subject:
  id: subject.ci.quality-adapter
  summary: Execute validated read-only quality adapters against fixed source checkouts.
contracts:
  - id: contract.ci-quality-adapter.outputs
    summary: Quality adapter invocation with a standard bundle or trusted descriptor.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: standard-bundle-id
        meaning: "Received by the contract target: standard bundle identifier passed by the caller."
      - name: execution-scope
        meaning: "Received by the contract target: execution scope passed by the caller."
      - name: toolchain-version
        meaning: "Received by the contract target: toolchain version passed by the caller."
      - name: bundle-path
        meaning: "Received by the contract target: adapter bundle descriptor path."
      - name: failed-command
        meaning: "Precondition prepared by the case: adapter command that fails."
      - name: command-exit
        meaning: "Precondition prepared by the case: exit status of the failing command."
      - name: cargo-deny-version
        meaning: "Received by the contract target: cargo-deny version passed by the caller."
      - name: cargo-deny-config-path
        meaning: "Received by the contract target: cargo-deny configuration path passed by the caller."
    observations:
      - summary: GitHub Actions outputs and step result exposed by an Action.
        boundary: boundary.action-output
        fields:
          - selector: status
            meaning: Aggregate quality adapter status.
          - selector: result-path
            meaning: Path to the quality adapter result JSON.
          - selector: outcome
            meaning: Failure outcome of the rejected quality adapter step.
          - selector: diagnostic-codes
            meaning: Stable diagnostic codes reported by the failed step.
          - selector: format-command-state
            meaning: Occurrence of format commands in the native execution trace.
          - selector: security-command-state
            meaning: Occurrence of security commands in the native execution trace.
          - selector: native-task-order
            meaning: Ordered IDs in the observed native result trace.
          - selector: consumer-descriptor-read-state
            meaning: Occurrence of consumer descriptor reads for an embedded standard invocation.
          - selector: rejected-command-state
            meaning: Occurrence of project command execution after scope rejection.
          - selector: native-terminal-prerequisite-status
            meaning: Status of the final observed result if its ID is toolchain-verify or dependency-restore; continued if the final result is a native command.
          - selector: native-failed-prerequisite-followup-state
            meaning: Occurrence of a result after a toolchain-verify or dependency-restore result with a non-success status.
          - selector: dependency-policy-result-status
            meaning: Status of the dependency-policy entry in the adapter result; absent when the result has no such entry.
          - selector: dependency-policy-config-argument
            meaning: Comparison of the configuration path passed to the dependency-policy command with CI_CARGO_DENY_CONFIG_PATH.
          - selector: dependency-policy-diagnostics
            meaning: Presence of structured diagnostics on a failed dependency-policy entry, limited to per-check error and warning counts and error findings with a validated diagnostic code and crate name and version.
          - selector: dependency-policy-unchecked-output-state
            meaning: Occurrence state (present or absent) of cargo-deny message, label or span text, or any unvalidated tool output, in the published dependency-policy entry.
          - selector: not-run-aggregate-effect
            meaning: Change of the aggregate status caused by results whose status is not-run.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
      - boundary: boundary.workspace-files
        fields:
          - selector: accepted-source-binding
            meaning: Classification of the embedded record source path against the runtime/adapter/bundles/<safe-basename>.yml path grammar.
          - selector: accepted-content-digest
            meaning: Comparison of the embedded descriptor SHA-256 with the digest recorded in its immutable embedded record.
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: quality-adapter-bundle-present
      - environment: runtime-context.action-input-invalid
      - input: quality-adapter-standard-bundle-present
      - environment: runtime-context.quality-adapter-toolchain-version-report-rejected
      - environment: runtime-context.ci-quality-adapter-native-rust-valid
      - environment: runtime-context.ci-quality-adapter-native-scope-rejected
      - environment: runtime-context.ci-quality-adapter-embedded-bundle-supplied
      - environment: runtime-context.ci-quality-adapter-dependency-policy-unconfigured
      - environment: runtime-context.ci-quality-adapter-dependency-policy-configured
      - environment: runtime-context.ci-quality-adapter-dependency-policy-config-unusable
      - environment: runtime-context.ci-quality-adapter-dependency-policy-violation
    guarantees:
      - id: quality-adapter-status-produced
        applies_to:
          - quality-adapter-bundle-present
          - quality-adapter-standard-bundle-present
        claim:
          field: status
          present: true
      - id: quality-adapter-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
          - runtime-context.ci-quality-adapter-dependency-policy-config-unusable
        claim:
          field: outcome
          in:
            - failure
      - id: quality-adapter-toolchain-version-diagnostic-present
        applies_to:
          - runtime-context.quality-adapter-toolchain-version-report-rejected
        claim:
          field: diagnostic-codes
          contains: quality-adapter-toolchain-version-mismatch
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
      - id: native-format-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: format-command-state
          in:
            - absent
      - id: native-security-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: security-command-state
          in:
            - absent
      - id: native-command-order
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: native-task-order
          in:
            - toolchain-verify
            - toolchain-verify,dependency-restore
            - toolchain-verify,dependency-restore,lint,test,structure
      - id: standard-descriptor-independent
        applies_to:
          - quality-adapter-standard-bundle-present
        claim:
          field: consumer-descriptor-read-state
          in:
            - absent
      - id: rejected-scope-no-commands
        applies_to:
          - runtime-context.ci-quality-adapter-native-scope-rejected
        claim:
          field: rejected-command-state
          in:
            - absent
      - id: standard-source-path-validated
        applies_to:
          - runtime-context.ci-quality-adapter-embedded-bundle-supplied
        claim:
          field: accepted-source-binding
          in:
            - allowed-source-path
      - id: standard-content-digest-checked
        applies_to:
          - runtime-context.ci-quality-adapter-embedded-bundle-supplied
        claim:
          field: accepted-content-digest
          in:
            - equal
      - id: native-terminal-prerequisite-status
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: native-terminal-prerequisite-status
          in:
            - failed
            - 判定不能
            - continued
      - id: native-no-followup-after-failed-prerequisite
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: native-failed-prerequisite-followup-state
          in:
            - absent
      - id: native-dependency-policy-omitted
        applies_to:
          - runtime-context.ci-quality-adapter-native-rust-valid
        claim:
          field: dependency-policy-result-status
          in:
            - absent
      - id: unconfigured-dependency-policy-not-run
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        claim:
          field: dependency-policy-result-status
          in:
            - not-run
      - id: not-run-aggregate-unchanged
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-unconfigured
        claim:
          field: not-run-aggregate-effect
          in:
            - none
      - id: configured-dependency-policy-executed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        claim:
          field: dependency-policy-result-status
          in:
            - success
            - failed
            - 判定不能
      - id: configured-dependency-policy-explicit-config
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-configured
        claim:
          field: dependency-policy-config-argument
          in:
            - equal
      - id: dependency-policy-violation-failed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        claim:
          field: dependency-policy-result-status
          in:
            - failed
      - id: dependency-policy-violation-diagnosed
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        claim:
          field: dependency-policy-diagnostics
          present: true
      - id: dependency-policy-diagnostics-validated
        applies_to:
          - runtime-context.ci-quality-adapter-dependency-policy-violation
        claim:
          field: dependency-policy-unchecked-output-state
          in:
            - absent
