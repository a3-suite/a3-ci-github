version: 1
name: contract-test-maps
test_maps:
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: standard-adapter-execution
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint executes the embedded standard without reading a project descriptor
        guarantees:
          - status-result-consistent
          - standard-descriptor-independent
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint executes the embedded standard without reading a project descriptor
        guarantees:
          - status-result-consistent
          - standard-descriptor-independent
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: standard-rust-scopes
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - status-result-consistent
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - status-result-consistent
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: standard-selection-rejected
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint rejects an unknown standard ID without a descriptor fallback
        guarantees:
          - quality-adapter-failure-propagated
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint rejects an unknown standard ID without a descriptor fallback
        guarantees:
          - quality-adapter-failure-propagated
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: read-only-adapter-execution
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint emits status and result path
        guarantees:
          - status-result-consistent
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint emits status and result path
        guarantees:
          - status-result-consistent
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: writable-adapter-rejected
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint rejects a non-read-only descriptor
        guarantees:
          - quality-adapter-failure-propagated
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint rejects a non-read-only descriptor
        guarantees:
          - quality-adapter-failure-propagated
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: toolchain-version-report-rejected
    pending:
      - guarantees:
          - quality-adapter-toolchain-version-diagnostic-present
        reason: entrypoint は command の stdout と stderr を公開結果とログで protected-child-output に置き換えるため、quality-adapter-toolchain-version-mismatch の診断コードを Action の出力・結果ファイル・失敗診断から観測できない。
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: ci-quality-adapter failure boundary > source retains actionable input failure without private input values
        guarantees:
          - diagnostic-failure-stage-outputs
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: standard-python-adapter-execution
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > entrypoint executes the embedded Python standard and emits its status
        guarantees:
          - status-result-consistent
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > entrypoint executes the embedded Python standard and emits its status
        guarantees:
          - status-result-consistent
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: native-rust-rules
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - native-format-omitted
          - native-security-omitted
          - native-terminal-prerequisite-status
          - native-no-followup-after-failed-prerequisite
          - native-dependency-policy-omitted
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - native-format-omitted
          - native-security-omitted
          - native-terminal-prerequisite-status
          - native-no-followup-after-failed-prerequisite
          - native-dependency-policy-omitted
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: unsupported-native-scope
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - rejected-scope-no-commands
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > standard Rust scope preserves native checks and rejects unsupported scopes before commands
        guarantees:
          - rejected-scope-no-commands
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: embedded-bundle-integrity
    pending:
      - guarantees:
          - standard-source-path-validated
          - standard-content-digest-checked
        reason: 組み込みの standard bundle は Action の外部入力から差し替えられず、entrypoint の結果にも照合した source path と内容 digest が出ないため、受け入れた binding を契約対象で観測できない。
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: native-preparation-failure
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > native Rust scope retains toolchain preparation and native command failure
        guarantees:
          - native-format-omitted
          - native-security-omitted
          - native-terminal-prerequisite-status
          - native-no-followup-after-failed-prerequisite
          - native-dependency-policy-omitted
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > native Rust scope retains toolchain preparation and native command failure
        guarantees:
          - native-format-omitted
          - native-security-omitted
          - native-terminal-prerequisite-status
          - native-no-followup-after-failed-prerequisite
          - native-dependency-policy-omitted
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: unconfigured-dependency-policy
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > unconfigured dependency policy is recorded as not-run without changing the aggregate status
        guarantees:
          - unconfigured-dependency-policy-not-run
          - not-run-aggregate-unchanged
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > unconfigured dependency policy is recorded as not-run without changing the aggregate status
        guarantees:
          - unconfigured-dependency-policy-not-run
          - not-run-aggregate-unchanged
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: configured-dependency-policy
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > configured dependency policy runs cargo-deny with the declared configuration
        guarantees:
          - configured-dependency-policy-executed
          - configured-dependency-policy-explicit-config
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > configured dependency policy runs cargo-deny with the declared configuration
        guarantees:
          - configured-dependency-policy-executed
          - configured-dependency-policy-explicit-config
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: dependency-policy-violation
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > failed dependency policy retains only validated cargo-deny identifiers
        guarantees:
          - dependency-policy-violation-failed
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > failed dependency policy retains only validated cargo-deny identifiers
        guarantees:
          - dependency-policy-violation-failed
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: missing-dependency-policy-config
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > dependency policy rejects an unusable configuration before commands
        guarantees:
          - quality-adapter-failure-propagated
          - rejected-scope-no-commands
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > dependency policy rejects an unusable configuration before commands
        guarantees:
          - quality-adapter-failure-propagated
          - rejected-scope-no-commands
  - contract_id: contract.ci-quality-adapter.outputs
    case_id: incomplete-dependency-policy-inputs
    tests:
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: source entrypoint > dependency policy rejects incomplete inputs before commands
        guarantees:
          - quality-adapter-failure-propagated
          - rejected-scope-no-commands
      - path: actions/ci-quality-adapter/tests/entrypoint.test.ts
        symbol: dist entrypoint > dependency policy rejects incomplete inputs before commands
        guarantees:
          - quality-adapter-failure-propagated
          - rejected-scope-no-commands
