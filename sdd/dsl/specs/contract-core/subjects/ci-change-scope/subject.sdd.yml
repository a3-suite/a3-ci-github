version: 1
name: contract-subject
subject:
  id: subject.ci.change-scope
  summary: Classifying a checked-out change range into CI and documentation scope.
contracts:
  - id: contract.ci-change-scope.outputs
    summary: A resolvable change range produces a change-scope status output.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: base-sha
        meaning: "Received by the contract target: base commit SHA."
      - name: head-sha
        meaning: "Received by the contract target: head commit SHA."
      - name: docs-only-patterns
        meaning: "Received by the contract target: documentation-only path patterns."
    observations:
      - summary: The Action exposes deterministic change-scope outputs to the caller.
        boundary: boundary.action-output
        fields:
          - selector: status
            meaning: Whether the change range was evaluated successfully or unresolved.
          - selector: run-ci
            meaning: Whether CI checks should run.
          - selector: run-docs
            meaning: Whether documentation checks should run.
          - selector: files
            meaning: Newline-separated changed paths.
          - selector: docs-files
            meaning: Newline-separated documentation paths.
          - selector: other-files
            meaning: Newline-separated non-documentation paths.
      - summary: Failure evidence governed by contract.ci-failure-diagnostics.actionable.
        boundary: boundary.diagnostic-result
        fields:
          - selector: failure-stage
            meaning: 失敗した段階の識別子。
    conditions:
      - environment: runtime-context.failure-diagnostic-required
      - input: change-range-input-present
      - environment: runtime-context.action-input-insufficient
    guarantees:
      - id: change-scope-status-produced
        applies_to:
          - change-range-input-present
        claim:
          field: status
          present: true
      - id: change-scope-unresolved-status-produced
        applies_to:
          - runtime-context.action-input-insufficient
        claim:
          field: status
          in:
            - unresolved
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        claim:
          field: failure-stage
          present: true
