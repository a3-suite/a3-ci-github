version: 1
name: contract-subject
subject:
  id: subject.ci.change-scope
  summary: Classifying a checked-out change range into CI and documentation scope.
contracts:
  - id: contract.ci-change-scope.outputs
    summary: Base commit, head commit and documentation pattern inputs to the change scope Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: base-sha
        meaning: "Received by the contract target: base commit SHA."
      - name: head-sha
        meaning: "Received by the contract target: head commit SHA."
      - name: docs-only-patterns
        meaning: "Received by the contract target: documentation-only path patterns."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: change-range-input-present
        summary: The base and head SHAs refer to the same commit or to an ancestor and its descendant in the checkout.
      - id: runtime-context.action-input-insufficient
        summary: The invocation meets the shared runtime context `runtime-context.action-input-insufficient`.
    guarantees:
      - id: change-scope-status-produced
        applies_to:
          - change-range-input-present
        boundary: boundary.action-output
        statement: "`status` is present. Whether the change range was evaluated successfully or unresolved. Observable fields at this boundary also include `run-docs` (Whether documentation checks should run), `files` (Newline-separated changed paths), `docs-files` (Newline-separated documentation paths), `other-files` (Newline-separated non-documentation paths)."
      - id: change-scope-unresolved-runs-ci
        applies_to:
          - runtime-context.action-input-insufficient
        boundary: boundary.action-output
        statement: '`run-ci` is one of `"true"`. Whether CI checks should run.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
    input_kind:
      kind: operation
      name: ci-change-scope
