version: 1
name: contract-observations
subject_ref: subject.ci.change-scope
observations:
  - id: observation.ci-change-scope.outputs
    summary: The Action exposes deterministic change-scope outputs to the caller.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Whether the change range was evaluated successfully or unresolved.
        - selector: run-ci
          kind: observation_field
          meaning: Whether CI checks should run.
        - selector: run-docs
          kind: observation_field
          meaning: Whether documentation checks should run.
        - selector: files
          kind: observation_field
          meaning: Newline-separated changed paths.
        - selector: docs-files
          kind: observation_field
          meaning: Newline-separated documentation paths.
        - selector: other-files
          kind: observation_field
          meaning: Newline-separated non-documentation paths.
  - id: observation.ci-change-scope.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: 比較範囲解決・Git取得・差分分類の段階、event種別、base/headの固定SHA、取得できないref、判定不能の理由を表す診断情報。
