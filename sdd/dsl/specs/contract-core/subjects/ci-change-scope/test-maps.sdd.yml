version: 1
name: contract-test-maps
subject_ref: subject.ci.change-scope
test_maps:
  - verification_id: verification.ci-change-scope.outputs
    case_id: valid-change-range
    tests:
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint reports a valid range"
        check_refs:
          - check-change-scope-status
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint reports a valid range"
        check_refs:
          - check-change-scope-status
  - verification_id: verification.ci-change-scope.outputs
    case_id: invalid-sha-unresolved
    tests:
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint fails open for an invalid SHA"
        check_refs:
          - check-change-scope-unresolved-status
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "dist entrypoint > entrypoint fails open for an invalid SHA"
        check_refs:
          - check-change-scope-unresolved-status
  - verification_id: verification.ci-change-scope.outputs
    case_id: detailed-failure-outputs
    tests:
      - path: tests/action-failure-diagnostics.test.mjs
        symbol: "ci-change-scope failure boundary > source retains actionable input failure without private input values"
        check_refs: [diagnostic-details]
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint fails open for an invalid SHA"
        check_refs: [diagnostic-details]
      - path: actions/ci-change-scope/tests/entrypoint.test.ts
        symbol: "source entrypoint > entrypoint fails open and keeps both SHAs when the base commit is unavailable"
        check_refs: [diagnostic-details]
