version: 1
name: contract-clauses
subject_ref: subject.ci.change-scope
contracts:
  - id: contract.ci-change-scope.outputs
    summary: A resolvable change range produces a change-scope status output.
    conditions:
      - id: diagnostic-required-outputs
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: change-range-input-present
        input_predicate:
          kind: input
          term: input.base-sha
          op: present
      - id: change-scope-unresolved
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.action-input-insufficient
          op: available
    guarantees:
      - id: change-scope-status-produced
        when: change-range-input-present
        observation_ref: observation.ci-change-scope.outputs
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: status
      - id: change-scope-unresolved-status-produced
        when: change-scope-unresolved
        observation_ref: observation.ci-change-scope.outputs
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values:
                - unresolved
      - id: diagnostic-details-outputs
        when: diagnostic-required-outputs
        observation_ref: observation.ci-change-scope.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: {kind: observation_field, value: details}
    verification_intents:
      - id: detailed-diagnostics-outputs
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable.
        guarantee_refs: [diagnostic-details-outputs]
      - id: change-scope-output-set
        goal: A valid change range exposes its status output.
        guarantee_refs:
          - change-scope-status-produced
      - id: change-scope-unresolved-output-set
        goal: An untrustworthy change range is exposed as unresolved so callers can fail open safely.
        guarantee_refs:
          - change-scope-unresolved-status-produced
