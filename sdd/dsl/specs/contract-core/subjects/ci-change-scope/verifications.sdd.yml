version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-change-scope.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-change-scope.outputs
    id: valid-change-range
    partition: change-range-input-present
    input:
      base-sha: "0000000000000000000000000000000000000001"
      head-sha: "0000000000000000000000000000000000000002"
      docs-only-patterns: docs/**,README.md,**/*.md
  - contract_id: contract.ci-change-scope.outputs
    id: invalid-sha-unresolved
    partition: runtime-context.action-input-insufficient
    input:
      base-sha: short
      head-sha: short
