version: 1
name: contract-clauses
subject_ref: subject.ci.preset-assurance
contracts:
  - id: contract.ci-preset-assurance.verification
    summary: Preset assurance validates applied canonical assets without modifying the consumer project and rejects invalid invocation boundaries.
    conditions:
      - id: diagnostic-required-verification
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-preset-assurance-roots-missing
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.preset-assurance-roots-missing
          op: available
      - id: ci-preset-assurance-read-only-output-requested
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.preset-assurance-read-only-output-requested
          op: available
      - id: selected-action-unavailable
        input_predicate:
          kind: input
          term: input.selected-pending-action
          op: present
      - id: supplemental-phase-drift
        input_predicate:
          kind: input
          term: input.supplemental-phase-drift
          op: present
      - id: retired-release-entrypoints-present
        input_predicate:
          kind: input
          term: input.retired-release-entrypoints-file-or-invocation
          op: present
      - id: ci-preset-assurance-applied-preset-valid
        input_predicate:
          kind: input
          term: input.applied-preset
          op: present
      - id: ci-preset-assurance-applied-preset-drifted
        input_predicate:
          kind: input
          term: input.applied-preset-drift
          op: present
    guarantees:
      - id: ci-preset-assurance-explicit-roots-required
        when: ci-preset-assurance-roots-missing
        observation_ref: observation.ci-preset-assurance.bootstrap-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: reason
      - id: ci-preset-assurance-read-only-output-rejected
        when: ci-preset-assurance-read-only-output-requested
        observation_ref: observation.ci-preset-assurance.bootstrap-result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: reason
      - id: unavailable-action-reported
        when: selected-action-unavailable
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: missingSettings
      - id: supplemental-phase-drift-reported
        when: supplemental-phase-drift
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: mismatches
      - id: retired-release-entrypoints-reported
        when: retired-release-entrypoints-present
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: mismatches
      - id: ci-preset-assurance-valid-preset-succeeds
        when: ci-preset-assurance-applied-preset-valid
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values: [ success ]
      - id: ci-preset-assurance-valid-evidence-exposed
        when: ci-preset-assurance-applied-preset-valid
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: evidence
      - id: ci-preset-assurance-semantic-review-state-exposed
        when: ci-preset-assurance-applied-preset-valid
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: semanticReviewRequired
      - id: ci-preset-assurance-drift-fails
        when: ci-preset-assurance-applied-preset-drifted
        observation_ref: observation.ci-preset-assurance.preflight-report
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: status
            right:
              kind: value_set
              values: [ failed ]
      - id: diagnostic-details-verification
        when: diagnostic-required-verification
        observation_ref: observation.ci-preset-assurance.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: valid-consumer-unchanged
        when: ci-preset-assurance-applied-preset-valid
        observation_ref: observation.ci-preset-assurance.verification.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: valid-tree-comparison
            right:
              kind: value_set
              values:
                - equal
      - id: drift-consumer-unchanged
        when: ci-preset-assurance-applied-preset-drifted
        observation_ref: observation.ci-preset-assurance.verification.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: drift-tree-comparison
            right:
              kind: value_set
              values:
                - equal
    verification_intents:
      - id: detailed-diagnostics-verification
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-verification ]
      - id: ci-preset-assurance-explicit-roots-intent
        goal: Missing explicit repository root produces a stable invalid-input diagnostic before validation starts.
        guarantee_refs: [ ci-preset-assurance-explicit-roots-required ]
      - id: ci-preset-assurance-read-only-output-intent
        goal: Read-only audit rejects remediation output with a stable invalid-input diagnostic.
        guarantee_refs: [ ci-preset-assurance-read-only-output-rejected ]
      - id: pending-action-blocked
        goal: Selected pending Actions produce availability failures until exact publication SHA is confirmed; unrelated released presets remain available.
        guarantee_refs: [ unavailable-action-reported ]
      - id: supplemental-phase-checked
        goal: Supplemental phases must use the common Action and exact owner-v2 argument mapping; bypass, wrong inputs and failure suppression produce observable mismatches.
        guarantee_refs: [ supplemental-phase-drift-reported ]
      - id: retired-release-entrypoints-blocked
        goal: Any path registered as a retired Release entrypoint is reserved; retained files or workflow references produce mismatches regardless of purpose, without modifying consumer assets.
        guarantee_refs: [ retired-release-entrypoints-reported ]
      - id: ci-preset-assurance-valid-intent
        goal: A canonical applied preset produces a successful read-only preflight report without modifying the project.
        guarantee_refs:
          - ci-preset-assurance-valid-preset-succeeds
          - ci-preset-assurance-valid-evidence-exposed
          - ci-preset-assurance-semantic-review-state-exposed
          - valid-consumer-unchanged
      - id: ci-preset-assurance-drift-intent
        goal: Canonical or distribution identity drift produces a failed report and remains observable without remediation. Required pin companions must match every registry-projected entry and field, including unused pins; missing, additional or edited values are rejected independently of any existing lock. YAML formatting and mapping order are not semantic drift.
        guarantee_refs: [ ci-preset-assurance-drift-fails, drift-consumer-unchanged ]
  - id: contract.ci-preset-assurance.asset-lock
    summary: Asset lock generation binds validated applied assets to one full distribution revision and rejects invalid revision identity.
    conditions:
      - id: diagnostic-required-asset-lock
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.failure-diagnostic-required
          op: available
      - id: ci-preset-assurance-lock-input-valid
        input_predicate:
          kind: input
          term: input.full-source-revision
          op: present
      - id: ci-preset-assurance-lock-input-invalid
        input_predicate:
          kind: input
          term: input.invalid-source-revision
          op: present
      - id: canonical-lock-input
        environment_predicate:
          kind: environment-ref
          target_ref: runtime-context.ci-preset-assurance-canonical-lock-input
          op: available
    guarantees:
      - id: ci-preset-assurance-lock-source-bound
        when: ci-preset-assurance-lock-input-valid
        observation_ref: observation.ci-preset-assurance.asset-lock
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: sourceRevision
      - id: ci-preset-assurance-lock-assets-recorded
        when: ci-preset-assurance-lock-input-valid
        observation_ref: observation.ci-preset-assurance.asset-lock
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: assets
      - id: ci-preset-assurance-invalid-revision-rejected
        when: ci-preset-assurance-lock-input-invalid
        observation_ref: observation.ci-preset-assurance.asset-lock-failure
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: diagnostic
      - id: diagnostic-details-asset-lock
        when: diagnostic-required-asset-lock
        observation_ref: observation.ci-preset-assurance.detailed-diagnostics
        claim:
          kind: observable-result
          op: present
          target: { kind: observation_field, value: details }
      - id: lock-source-equals-request
        when: canonical-lock-input
        observation_ref: observation.ci-preset-assurance.asset-lock.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: requested-source-comparison
            right:
              kind: value_set
              values:
                - equal
      - id: lock-canonical-digests-match
        when: canonical-lock-input
        observation_ref: observation.ci-preset-assurance.asset-lock.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: canonical-digest-comparison
            right:
              kind: value_set
              values:
                - equal
      - id: lock-applied-digests-match
        when: canonical-lock-input
        observation_ref: observation.ci-preset-assurance.asset-lock.relations
        claim:
          kind: observable-value
          op: in
          relation:
            left:
              kind: observation_field
              value: applied-digest-comparison
            right:
              kind: value_set
              values:
                - equal
    verification_intents:
      - id: detailed-diagnostics-asset-lock
        goal: On a rejected, failed or unresolved invocation of this contract, retain its subject-specific details under contract.ci-failure-diagnostics.actionable. Existing outcome, authority, trust and success-output rules remain unchanged. Definition checks establish declaration coverage only; actual failure evidence requires execution at this contract boundary.
        guarantee_refs: [ diagnostic-details-asset-lock ]
      - id: ci-preset-assurance-lock-generation-intent
        goal: A validated preset produces an asset lock bound to a full source revision and all managed asset digests. Required generated pin companions record their registry input as the canonical digest and installed bytes as the applied digest; invalid projections cannot be blessed by generating a new lock.
        guarantee_refs:
          - ci-preset-assurance-lock-source-bound
          - ci-preset-assurance-lock-assets-recorded
      - id: ci-preset-assurance-lock-rejection-intent
        goal: A noncanonical source revision is rejected before an asset lock is written.
        guarantee_refs: [ ci-preset-assurance-invalid-revision-rejected ]
      - id: canonical-lock-bindings
        goal: Verify identities generated from complete canonical lock inputs.
        guarantee_refs:
          - lock-applied-digests-match
          - lock-canonical-digests-match
          - lock-source-equals-request
