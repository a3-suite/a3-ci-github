version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-preset-assurance.verification
    id: detailed-failure-verification
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - --unknown
        - value
  - contract_id: contract.ci-preset-assurance.verification
    id: case.ci-preset-assurance.explicit-roots-required
    partition: runtime-context.preset-assurance-roots-missing
    input:
      audit-mode: read-only
  - contract_id: contract.ci-preset-assurance.verification
    id: case.ci-preset-assurance.read-only-output-rejected
    partition: runtime-context.preset-assurance-read-only-output-requested
    input:
      audit-mode: read-only
      output: remediation-output.json
  - contract_id: contract.ci-preset-assurance.verification
    id: pending-publication-actions
    partition: selected-action-unavailable
    input:
      selected-pending-action: ci-release-assembly
      preset: release-publication
  - contract_id: contract.ci-preset-assurance.verification
    id: pending-quality-platform-action
    partition: selected-action-unavailable
    input:
      selected-pending-action: ci-platform-matrix
      preset: quality-gate
      optional-workflow: quality-gate-platforms
  - contract_id: contract.ci-preset-assurance.verification
    id: pending-release-publisher
    partition: selected-action-unavailable
    input:
      selected-pending-action: ci-release-publisher
      preset: release-publication
  - contract_id: contract.ci-preset-assurance.verification
    id: standard-publisher-drift
    partition: ci-preset-assurance-applied-preset-drifted
    input:
      applied-preset-drift: standard-publisher-condition
    verifies:
      - ci-preset-assurance-drift-fails
  - contract_id: contract.ci-preset-assurance.verification
    id: standard-authority-drift
    partition: ci-preset-assurance-applied-preset-drifted
    input:
      applied-preset-drift: standard-authority-condition
    verifies:
      - ci-preset-assurance-drift-fails
  - contract_id: contract.ci-preset-assurance.verification
    id: supplemental-phase-drift
    partition: supplemental-phase-drift
    input:
      supplemental-phase-drift: bypass
  - contract_id: contract.ci-preset-assurance.verification
    id: retired-release-entrypoints
    partition: retired-release-entrypoints-present
    input:
      retired-release-entrypoints-file-or-invocation: any-registered-retired-release-entrypoint
      preset: release-publication
  - contract_id: contract.ci-preset-assurance.verification
    id: case.ci-preset-assurance.valid-preset-succeeds
    partition: ci-preset-assurance-applied-preset-valid
    input:
      audit-mode: read-only
      preset: configured-preset
  - contract_id: contract.ci-preset-assurance.verification
    id: case.ci-preset-assurance.drift-fails
    partition: ci-preset-assurance-applied-preset-drifted
    input:
      applied-preset-drift: true
  - contract_id: contract.ci-preset-assurance.verification
    id: conditional-owner-extension
    partition: ci-preset-assurance-applied-preset-valid
    input:
      preset: release-publication
      applied-preset: canonical-remote-caller-with-selected-executable-owner-adapter
    verifies:
      - ci-preset-assurance-valid-preset-succeeds
  - contract_id: contract.ci-preset-assurance.verification
    id: supplemental-static-selections
    partition: ci-preset-assurance-applied-preset-valid
    input:
      preset: release-publication
      applied-preset: disabled
    verifies:
      - ci-preset-assurance-valid-preset-succeeds
  - contract_id: contract.ci-preset-assurance.verification
    id: supplemental-snapshot-reachability-drift
    partition: supplemental-phase-drift
    input:
      supplemental-phase-drift: missing-snapshot-binding
  - contract_id: contract.ci-preset-assurance.asset-lock
    id: detailed-failure-asset-lock
    partition: runtime-context.failure-diagnostic-required
    input:
      arguments:
        - --unknown
        - value
  - contract_id: contract.ci-preset-assurance.asset-lock
    id: case.ci-preset-assurance.asset-lock-generated
    partition: ci-preset-assurance-lock-input-valid
    input:
      source-revision: full-source-revision
  - contract_id: contract.ci-preset-assurance.asset-lock
    id: case.ci-preset-assurance.asset-lock-invalid-revision-rejected
    partition: ci-preset-assurance-lock-input-invalid
    input:
      source-revision: noncanonical-source-revision
  - contract_id: contract.ci-preset-assurance.asset-lock
    id: canonical-lock-bindings
    partition: runtime-context.ci-preset-assurance-canonical-lock-input
    input:
      source-revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      preset: quality-gate
      consumer-assets: canonical-with-complete-pin-projection
