version: 1
name: contract-verifications
subject_ref: subject.ci.preset-assurance
verifications:
  - id: verification.ci-preset-assurance.verification
    contract_ref: contract.ci-preset-assurance.verification
    intents:
      - intent_ref: ci-preset-assurance-explicit-roots-intent
        cases:
          - id: case.ci-preset-assurance.explicit-roots-required
            mode: automated
            strategy: Invoke the bootstrap without required roots and inspect the stable rejection envelope.
            checks:
              - id: check.ci-preset-assurance.explicit-roots-required
                guarantee_ref: ci-preset-assurance-explicit-roots-required
      - intent_ref: ci-preset-assurance-read-only-output-intent
        cases:
          - id: case.ci-preset-assurance.read-only-output-rejected
            mode: automated
            strategy: Invoke read-only audit with remediation output and inspect the stable rejection envelope.
            checks:
              - id: check.ci-preset-assurance.read-only-output-rejected
                guarantee_ref: ci-preset-assurance-read-only-output-rejected
      - intent_ref: ci-preset-assurance-valid-intent
        cases:
          - id: case.ci-preset-assurance.valid-preset-succeeds
            mode: automated
            strategy: Validate a configured canonical preset and compare the project tree before and after preflight.
            checks:
              - id: check.ci-preset-assurance.valid-preset-succeeds
                guarantee_ref: ci-preset-assurance-valid-preset-succeeds
              - id: check.ci-preset-assurance.valid-evidence-exposed
                guarantee_ref: ci-preset-assurance-valid-evidence-exposed
              - id: check.ci-preset-assurance.semantic-review-state-exposed
                guarantee_ref: ci-preset-assurance-semantic-review-state-exposed
      - intent_ref: ci-preset-assurance-drift-intent
        cases:
          - id: case.ci-preset-assurance.drift-fails
            mode: automated
            strategy: Drift an applied canonical workflow and inspect the failed report without remediation side effects.
            checks:
              - id: check.ci-preset-assurance.drift-fails
                guarantee_ref: ci-preset-assurance-drift-fails
  - id: verification.ci-preset-assurance.asset-lock
    contract_ref: contract.ci-preset-assurance.asset-lock
    intents:
      - intent_ref: ci-preset-assurance-lock-generation-intent
        cases:
          - id: case.ci-preset-assurance.asset-lock-generated
            mode: automated
            strategy: Generate a lock from a valid configured preset and inspect source revision and managed asset digests.
            checks:
              - id: check.ci-preset-assurance.asset-lock-source-bound
                guarantee_ref: ci-preset-assurance-lock-source-bound
              - id: check.ci-preset-assurance.asset-lock-assets-recorded
                guarantee_ref: ci-preset-assurance-lock-assets-recorded
      - intent_ref: ci-preset-assurance-lock-rejection-intent
        cases:
          - id: case.ci-preset-assurance.asset-lock-invalid-revision-rejected
            mode: automated
            strategy: Request generation with a noncanonical source revision and confirm rejection before output creation.
            checks:
              - id: check.ci-preset-assurance.asset-lock-invalid-revision-rejected
                guarantee_ref: ci-preset-assurance-invalid-revision-rejected
