version: 1
name: contract-subject
subject:
  id: subject.ci.preset-assurance
  summary: Validate applied preset identity and configuration while preserving read-only audit and explicit remediation boundaries.
contracts:
  - id: contract.ci-preset-assurance.verification
    summary: Preset assurance verification request for an applied consumer project.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: audit-mode
        meaning: "Received by the contract target: audit mode selected by the request."
      - name: repo-root
        meaning: "Received by the contract target: consumer project root to inspect."
      - name: skill-collection-root
        meaning: "Received by the contract target: external skill collection root supplied for resolving registered sources."
      - name: output
        meaning: "Received by the contract target: output path requested by the caller."
      - name: selected-pending-action
        meaning: "Precondition prepared by the case: selected Actions whose release is pending."
      - name: preset
        meaning: "Received by the contract target: preset identifier selected for validation."
      - name: optional-workflow
        meaning: "Precondition prepared by the case: optional workflow installed in the consumer project."
      - name: applied-preset-drift
        meaning: "Precondition prepared by the case: drift of the applied preset from the canonical assets."
      - name: supplemental-phase-drift
        meaning: "Precondition prepared by the case: drift of the supplemental phase wiring."
      - name: retired-release-entrypoints-file-or-invocation
        meaning: "Precondition prepared by the case: retired release entrypoint file or invocation present in the project."
      - name: applied-preset
        meaning: "Precondition prepared by the case: preset assets applied to the consumer project."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation arguments are accepted, but setup or runtime failure prevents a preflight report.
      - id: preset-assurance-invalid-invocation
        summary: The read-only command rejects invalid invocation arguments, including a missing explicit repository root or a forbidden output destination.
      - id: ci-preset-assurance-applied-preset-valid
        summary: The selected applied preset agrees with its canonical source in a read-only audit.
      - id: ci-preset-assurance-applied-preset-drifted
        summary: Inspection completes and finds a missing setting, an unavailable dependency or a mismatch in the applied configuration.
    guarantees:
      - id: ci-preset-assurance-explicit-roots-required
        applies_to:
          - preset-assurance-invalid-invocation
        boundary: boundary.cli-result
        statement: "The CLI reports `outcome: cannot-start` and `reason: invalid-input`."
      - id: unavailable-action-reported
        applies_to:
          - ci-preset-assurance-applied-preset-drifted
        boundary: boundary.cli-result
        statement: '`unavailable-action-state` is one of `"reported"`. Whether missingSettings names the selected Action whose release is pending; reported or not-reported.'
      - id: supplemental-phase-drift-reported
        applies_to:
          - ci-preset-assurance-applied-preset-drifted
        boundary: boundary.cli-result
        statement: '`supplemental-phase-drift-state` is one of `"reported"`. Whether mismatches names the supplemental phase drift; reported or not-reported.'
      - id: retired-release-entrypoint-reported
        applies_to:
          - ci-preset-assurance-applied-preset-drifted
        boundary: boundary.cli-result
        statement: '`retired-release-entrypoint-state` is one of `"reported"`. Whether mismatches names the retired release entrypoint; reported or not-reported.'
      - id: ci-preset-assurance-valid-preset-succeeds
        applies_to:
          - ci-preset-assurance-applied-preset-valid
        boundary: boundary.cli-result
        statement: '`status` is one of `"success"`. Provider preflight status.'
      - id: ci-preset-assurance-valid-evidence-exposed
        applies_to:
          - ci-preset-assurance-applied-preset-valid
        boundary: boundary.cli-result
        statement: "`evidence-entry-count` is at least `1`. The report includes evidence for inspected workflows and assets and names the evaluated presets in `inspectedPresets`."
      - id: ci-preset-assurance-semantic-review-state-exposed
        applies_to:
          - ci-preset-assurance-applied-preset-valid
        boundary: boundary.cli-result
        statement: "`semanticReviewRequired` is true. Provider preflight leaves semantic review to the caller."
      - id: ci-preset-assurance-drift-fails
        applies_to:
          - ci-preset-assurance-applied-preset-drifted
        boundary: boundary.cli-result
        statement: '`status` is one of `"failed"`. Provider preflight status.'
      - id: diagnostic-failure-stage-verification
        applies_to:
          - runtime-context.failure-diagnostic-required
          - preset-assurance-invalid-invocation
        boundary: boundary.diagnostic-result
        statement: "The diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: valid-consumer-unchanged
        applies_to:
          - ci-preset-assurance-applied-preset-valid
        boundary: boundary.project-ci-assets
        statement: '`valid-tree-comparison` is one of `"equal"`. Comparison of consumer file paths and bytes before and after read-only preset verification.'
      - id: drift-consumer-unchanged
        applies_to:
          - ci-preset-assurance-applied-preset-drifted
        boundary: boundary.project-ci-assets
        statement: '`drift-tree-comparison` is one of `"equal"`. Comparison of consumer file paths and bytes before and after read-only preset verification.'
    input_kind:
      kind: operation
      name: validate-ci-preset
  - id: contract.ci-preset-assurance.asset-lock
    summary: Asset lock generation request for applied canonical assets.
    inputs:
      - name: arguments
        meaning: "Received by the contract target: command-line arguments passed to the entrypoint."
      - name: repo-root
        meaning: "Received by the contract target: consumer project root whose applied assets the lock records."
      - name: skill-collection-root
        meaning: "Received by the contract target: external skill collection root supplied for resolving registered sources."
      - name: source-revision
        meaning: "Received by the contract target: source revision identifier."
      - name: release-tag
        meaning: "Received by the contract target: Release tag of the distribution that generates the lock."
      - name: distribution-release
        meaning: "Precondition prepared by the case: Release tag named by the fetched distribution manifest beside the generator."
      - name: preset
        meaning: "Precondition prepared by the case: applied preset identified from the consumer project during lock generation."
      - name: consumer-assets
        meaning: "Precondition prepared by the case: CI assets present in the consumer project."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The lock request is rejected for an argument, distribution binding, preset or file error outside the invalid revision or tag condition.
      - id: ci-preset-assurance-lock-input-invalid
        summary: The lock request has a missing or malformed exact release tag or a noncanonical source revision.
      - id: runtime-context.ci-preset-assurance-canonical-lock-input
        summary: A full immutable source revision and a complete configured canonical preset are supplied for lock generation. Managed workflow bytes, registry-projected pin companions and required settings conform to the provider inputs; source and consumer files remain readable and unchanged through the invocation.
    guarantees:
      - id: ci-preset-assurance-lock-source-bound
        applies_to:
          - runtime-context.ci-preset-assurance-canonical-lock-input
        boundary: boundary.project-ci-assets
        statement: "`sourceRevision` equals the invocation input `source-revision`. Full immutable distribution commit SHA. Observable fields at this boundary also include `generatedAt` (Minute-normalized observation timestamp of the generated lock)."
      - id: ci-preset-assurance-lock-release-bound
        applies_to:
          - runtime-context.ci-preset-assurance-canonical-lock-input
        boundary: boundary.project-ci-assets
        statement: "`releaseTag` equals the invocation input `release-tag`. Exact vX.Y.Z Release tag of the distribution that generated the lock."
      - id: ci-preset-assurance-lock-assets-cover-managed-paths
        applies_to:
          - runtime-context.ci-preset-assurance-canonical-lock-input
        boundary: boundary.project-ci-assets
        statement: '`asset-path-coverage` is one of `"equal"`. Comparison of the set of lock asset paths with the managed asset destinations and the pin companion path.'
      - id: ci-preset-assurance-invalid-revision-rejected
        applies_to:
          - ci-preset-assurance-lock-input-invalid
        boundary: boundary.script-result
        statement: "The generator fails with a diagnostic for the invalid revision or release tag and does not write a lock."
      - id: diagnostic-failure-stage-asset-lock
        applies_to:
          - runtime-context.failure-diagnostic-required
          - ci-preset-assurance-lock-input-invalid
        boundary: boundary.diagnostic-result
        statement: "The primary diagnostic identifies the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: lock-canonical-digests-match
        applies_to:
          - runtime-context.ci-preset-assurance-canonical-lock-input
        boundary: boundary.project-ci-assets
        statement: '`canonical-digest-comparison` is one of `"equal"`. Per-asset comparison of canonicalSha256 with its canonical provider source bytes; pin companions use the registry source bytes.'
      - id: lock-applied-digests-match
        applies_to:
          - runtime-context.ci-preset-assurance-canonical-lock-input
        boundary: boundary.project-ci-assets
        statement: '`applied-digest-comparison` is one of `"equal"`. Per-asset comparison of appliedSha256 with the corresponding installed consumer file bytes.'
    input_kind:
      kind: operation
      name: generate-ci-asset-lock
