version: 1
name: contract-verifications
cases:
  - contract_id: contract.ci-package-publication-request.outputs
    id: detailed-failure-outputs
    partition: runtime-context.failure-diagnostic-required
    input:
      action-inputs: none
  - contract_id: contract.ci-package-publication-request.outputs
    id: request-trigger-accepted
    partition: runtime-context.request-trigger-verification-invoked
    input:
      operation: verify-trigger
      workflow-run: successful-default-branch-dispatch-of-package-publication-request
  - contract_id: contract.ci-package-publication-request.outputs
    id: request-trigger-rejected
    partition: runtime-context.request-trigger-verification-invoked
    input:
      operation: verify-trigger
      workflow-run: non-default-branch
    verifies:
      - request-trigger-run-bound
  - contract_id: contract.ci-package-publication-request.outputs
    id: request-trigger-failure-propagated
    partition: runtime-context.action-input-invalid
    input:
      operation: verify-trigger
      workflow-run: non-default-branch
  - contract_id: contract.ci-package-publication-request.outputs
    id: package-request-round-trip
    partition: runtime-context.package-publication-request-succeeded
    input:
      operation: verify
  - contract_id: contract.ci-package-publication-request.outputs
    id: source-sha-mismatch-rejected
    partition: runtime-context.action-input-invalid
    input:
      operation: verify
      source-sha: mismatched-source
