version: 1
name: contract-subject
subject:
  id: subject.ci.package-publication-request
  summary: Create and verify immutable package publication request handoffs.
contracts:
  - id: contract.ci-package-publication-request.outputs
    summary: Validate the triggering run and create or verify the immutable package publication request.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: request-path
        meaning: "Received by the contract target: destination for create and path to the saved request for verify."
      - name: workflow-run
        meaning: "Received by the contract target: workflow_run event payload and repository context for verify-trigger."
      - name: source-sha
        meaning: "Received by the contract target: source commit SHA passed by the caller."
      - name: version
        meaning: "Received by the contract target: approved package version for create."
      - name: target-identity
        meaning: "Received by the contract target: approved package target identity for create."
      - name: language-profile
        meaning: "Received by the contract target: language profile for create."
      - name: toolchain
        meaning: "Received by the contract target: fixed toolchain for create."
      - name: expected-source-sha
        meaning: "Received by the contract target: source commit SHA that the verify operation expects the saved request to carry."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: Required Action inputs or the operation name are invalid, create or verify cannot complete using the supplied request, or writing a required output fails. Trigger event rejection has its own condition.
      - id: runtime-context.package-publication-request-succeeded
        summary: The create operation receives valid request fields and an unused writable path, or verify receives a valid request bound to the expected source SHA. All Action outputs can be written.
      - id: package-request-trigger-valid
        summary: The verify-trigger operation has a request path and receives a successful default-branch dispatch of the designated request workflow in the current repository, with valid run identity and writable Action outputs.
      - id: package-request-trigger-rejected
        summary: The verify-trigger operation has a request path, but the event is unavailable or fails the trigger validation criteria.
    guarantees:
      - id: package-request-source-produced
        applies_to:
          - runtime-context.package-publication-request-succeeded
        boundary: boundary.action-output
        statement: "`status` is `success` and `request-path` equals the supplied request path. The `source-sha`, `version`, `target-identity`, `language-profile`, and `toolchain` outputs equal the validated create inputs or the corresponding fields of the verified request. For verify, `source-sha` also equals `expected-source-sha`."
      - id: package-request-failure-propagated
        applies_to:
          - runtime-context.failure-diagnostic-required
          - package-request-trigger-rejected
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected package publication request step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
          - package-request-trigger-rejected
        boundary: boundary.diagnostic-result
        statement: "The primary failure diagnostic records the failed stage in `classification.stage`. Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: request-trigger-run-bound
        applies_to:
          - package-request-trigger-valid
          - package-request-trigger-rejected
        boundary: boundary.action-output
        statement: "For an accepted run, `status` is `success`. The event must identify a successful default-branch dispatch of the designated workflow in the current repository, with the expected workflow name and path, a positive run ID and a lowercase 40-digit hexadecimal head SHA. A rejected run causes a failed step."
    input_kind:
      kind: operation
      name: ci-package-publication-request
