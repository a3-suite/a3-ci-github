version: 1
name: contract-subject
subject:
  id: subject.ci.package-publication-request
  summary: Create and verify immutable package publication request handoffs.
contracts:
  - id: contract.ci-package-publication-request.outputs
    summary: Create and verify operation inputs to the package publication request Action.
    inputs:
      - name: action-inputs
        meaning: "Received by the contract target: set of GitHub Action inputs passed to the Action step."
      - name: operation
        meaning: "Received by the contract target: operation selected by the invocation."
      - name: workflow-run
        meaning: "Precondition prepared by the case: triggering workflow run."
      - name: source-sha
        meaning: "Received by the contract target: source commit SHA passed by the caller."
      - name: expected-source-sha
        meaning: "Received by the contract target: source commit SHA that the verify operation expects the saved request to carry."
    conditions:
      - id: runtime-context.failure-diagnostic-required
        summary: The invocation meets the shared runtime context `runtime-context.failure-diagnostic-required`.
      - id: runtime-context.package-publication-request-succeeded
        summary: The invocation meets the shared runtime context `runtime-context.package-publication-request-succeeded`.
      - id: runtime-context.request-trigger-verification-invoked
        summary: The invocation meets the shared runtime context `runtime-context.request-trigger-verification-invoked`.
      - id: runtime-context.action-input-invalid
        summary: The invocation meets the shared runtime context `runtime-context.action-input-invalid`.
    guarantees:
      - id: package-request-source-produced
        applies_to:
          - runtime-context.package-publication-request-succeeded
        boundary: boundary.action-output
        statement: "`source-sha` equals the invocation input `source-sha`. Verified source commit SHA. Observable fields at this boundary also include `status` (Package publication request operation status), `request-path` (Package publication request path), `version` (Verified package version), `target-identity` (Verified package target identity), `language-profile` (Verified language profile), `toolchain` (Verified fixed toolchain)."
      - id: package-request-failure-propagated
        applies_to:
          - runtime-context.action-input-invalid
        boundary: boundary.action-output
        statement: '`outcome` is one of `"failure"`. Failure outcome of the rejected package publication request step.'
      - id: diagnostic-failure-stage-outputs
        applies_to:
          - runtime-context.failure-diagnostic-required
        boundary: boundary.diagnostic-result
        statement: "`failure-stage` is present. 失敗した段階の識別子。 Diagnostic context follows `contract.ci-failure-diagnostics.actionable`."
      - id: request-trigger-run-bound
        applies_to:
          - runtime-context.request-trigger-verification-invoked
        boundary: boundary.action-output
        statement: '`accepted-trigger-run` is one of `"successful-default-branch-dispatch-of-own-request-workflow"`, `"absent"`. Kind of the triggering workflow run that verify-trigger accepts, identified by its repository, workflow name and path, event, conclusion and head branch; absent when verify-trigger rejects the run.'
    input_kind:
      kind: operation
      name: ci-package-publication-request
