version: 1
name: contract-observations
subject_ref: subject.ci.package-publication-request
observations:
  - id: observation.ci-package-publication-request.outputs
    summary: The Action exposes the operation status and verified package publication request fields.
    boundary:
      ref: boundary.action-output
    value:
      root: action.outputs
      kind: object
      fields:
        - selector: status
          kind: observation_field
          meaning: Package publication request operation status.
        - selector: request-path
          kind: observation_field
          meaning: Package publication request path.
        - selector: source-sha
          kind: observation_field
          meaning: Verified source commit SHA.
        - selector: version
          kind: observation_field
          meaning: Verified package version.
        - selector: target-identity
          kind: observation_field
          meaning: Verified package target identity.
        - selector: language-profile
          kind: observation_field
          meaning: Verified language profile.
        - selector: toolchain
          kind: observation_field
          meaning: Verified fixed toolchain.
  - id: observation.ci-package-publication-request.result
    summary: The Action exposes its failed step outcome when a package publication request is rejected.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: outcome
          kind: observation_field
          meaning: Failure outcome of the rejected package publication request step.
  - id: observation.ci-package-publication-request.detailed-diagnostics
    summary: Subject-specific failure evidence governed by contract.ci-failure-diagnostics.actionable; log and existing evidence may jointly satisfy the observation.
    boundary: {ref: boundary.diagnostic-result}
    value:
      root: failure-evidence
      kind: object
      fields:
        - selector: details
          kind: observation_field
          meaning: "create/verifyのoperation、要求の選択・作成・照合・出力書き込みの段階、createでは作成するsource SHA・version・target identity、verifyでは期待source SHA、および違反fieldと期待/観測値を表す診断情報。"
  - id: observation.ci-package-publication-request.trigger-verification
    summary: The Action exposes whether verify-trigger accepted the triggering workflow run before request artifacts are downloaded.
    boundary:
      ref: boundary.action-output
    value:
      root: action.step-result
      kind: object
      fields:
        - selector: accepted-trigger-run
          kind: observation_field
          meaning: Kind of the triggering workflow run that verify-trigger accepts, identified by its repository, workflow name and path, event, conclusion and head branch; absent when verify-trigger rejects the run.
