name: package-preparation

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      target_identity:
        required: true
        type: string
      language_profile:
        required: true
        type: string
      toolchain:
        required: true
        type: string
    outputs:
      handoff_run_id:
        value: ${{ jobs.build.outputs.handoff_run_id }}
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      publish_version:
        value: ${{ jobs.version-plan.outputs.version }}

permissions: {}

jobs:
  version-plan:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs['publish-version'] }}
    steps:
      - name: Write owner-approved version plan
        shell: bash
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_VERSION_JSON: ${{ toJSON(inputs.version) }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_VERSION"
          printf '{"strategy":"exact","publishVersion":%s}\n' "$PUBLISH_VERSION_JSON" > version-plan.json
      - id: version
        uses: a3-suite/a3-ci-github/actions/ci-publish-version@1d6958ce3953da4ecba81940ce6ab90e4a0a5435
        with:
          version-plan-json: version-plan.json

  build:
    needs: version-plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      handoff_run_id: ${{ github.run_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
      - id: build
        shell: bash
        env:
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_VERSION: ${{ needs.version-plan.outputs.version }}
          CI_TARGET_IDENTITY: ${{ inputs.target_identity }}
          CI_LANGUAGE_PROFILE: ${{ inputs.language_profile }}
          CI_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          test -n "$CI_SOURCE_SHA"; test -n "$CI_VERSION"; test -n "$CI_TARGET_IDENTITY"
          .ci/scripts/ci-package-build.sh "$CI_LANGUAGE_PROFILE" "$CI_TOOLCHAIN" "$CI_SOURCE_SHA" "$CI_VERSION" "$CI_TARGET_IDENTITY" package-handoff
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-handoff
          path: package-handoff
          if-no-files-found: error

  summary:
    needs: [version-plan, build]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@1d6958ce3953da4ecba81940ce6ab90e4a0a5435
        with:
          summary-json: >-
            {"jobs":[{"unit":"version-plan","execution":"owner-approved version plan","rawResult":"${{ needs.version-plan.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"version-plan job result: ${{ needs.version-plan.result }}"},{"unit":"build","execution":"package handoff build and upload","rawResult":"${{ needs.build.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"build job result: ${{ needs.build.result }}"}]}
