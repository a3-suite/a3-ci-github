name: release-publication

on:
  workflow_call:
    inputs:
      request_run_id:
        description: Successful release-request workflow run ID
        required: true
        type: string
      publication_request_run_id:
        description: Successful release-publication-request workflow run ID
        required: true
        type: string
      supplemental_release_asset_enabled:
        description: Build the owner-selected supplemental Release asset set
        required: true
        type: boolean
      supplemental_release_asset_owner_contract:
        description: Static owner contract ID, or __unset__ when disabled
        required: true
        type: string
      sha256sum-version:
        required: true
        type: string
      runner:
        description: Static versioned runner label selected by the owner caller
        required: true
        type: string
      language-profile:
        required: true
        type: string
      platform-manifest:
        required: true
        type: string
      toolchain-version:
        required: true
        type: string
      uv-version:
        required: true
        type: string
      cargo-audit-version:
        required: true
        type: string
      gh-version:
        required: true
        type: string
      jq-version:
        required: true
        type: string
      release-implementation:
        required: true
        type: string
      standard-bundle-id:
        required: true
        type: string
      adapter-descriptor:
        required: true
        type: string
      cargo-manifest-path:
        required: true
        type: string
      cargo-lock-path:
        required: true
        type: string
      release-binary-name:
        required: true
        type: string
      release-asset-prefix:
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  CI_LANGUAGE_PROFILE: ${{ inputs.language-profile }}
  CI_PLATFORM_MANIFEST: ${{ inputs.platform-manifest }}
  CI_TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
  CI_UV_VERSION: ${{ inputs.uv-version }}
  CI_CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
  CI_GH_VERSION: ${{ inputs.gh-version }}
  CI_JQ_VERSION: ${{ inputs.jq-version }}
  CI_SHA256SUM_VERSION: ${{ inputs.sha256sum-version }}
  CI_RELEASE_IMPLEMENTATION: ${{ inputs.release-implementation }}
  CI_RELEASE_OWNER_CONTRACT: git.release-flow
  CI_STANDARD_BUNDLE_ID: ${{ inputs.standard-bundle-id }}
  CI_ADAPTER_DESCRIPTOR: ${{ inputs.adapter-descriptor }}
  CI_CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest-path }}
  CI_CARGO_LOCK_PATH: ${{ inputs.cargo-lock-path }}
  CI_RELEASE_BINARY_NAME: ${{ inputs.release-binary-name }}
  CI_RELEASE_ASSET_PREFIX: ${{ inputs.release-asset-prefix }}

jobs:
  authority:
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RELEASE_REQUEST_RUN_ID: ${{ inputs.request_run_id }}
      CI_RELEASE_PUBLICATION_REQUEST_RUN_ID: ${{ inputs.publication_request_run_id }}
      CI_RELEASE_REQUEST_TAG_WORKFLOW_NAME: release-request-tag
      CI_RELEASE_REQUEST_TAG_WORKFLOW_PATH: .github/workflows/release-request-tag.yml
      CI_RELEASE_PUBLICATION_REQUEST_WORKFLOW_PATH: .github/workflows/release-publication-request.yml
      CI_CONFIG_SNAPSHOT_PATH: ci-config-snapshot.json
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha || steps.authority_owner.outputs.source_sha }}
      version: ${{ steps.authority.outputs.version || steps.authority_owner.outputs.version }}
      target_identity: ${{ steps.authority.outputs.target_identity || steps.authority_owner.outputs.target_identity }}
      platform_matrix: ${{ steps.platform-matrix.outputs.matrix }}
      approval_id: ${{ steps.authority.outputs['approval-id'] || steps.publication_notes.outputs['approval-id'] }}
      approval_body_sha256: ${{ steps.authority.outputs['body-sha256'] || steps.publication_notes.outputs.digest }}
    steps:
      - name: Verify publication entry
        id: publication-entry
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_EVENT" = workflow_run
          test -n "$REPOSITORY"
          test -n "$DEFAULT_BRANCH"
          test "$CALLER_WORKFLOW_REF" = "$REPOSITORY/.github/workflows/release-publication-caller.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@<commit-sha>
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Validate publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RELEASE_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RELEASE_PUBLICATION_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Resolve platform build matrix
        id: platform-matrix
        uses: a3-suite/a3-ci-github/actions/ci-platform-matrix@<release-publication-action-sha>
        with:
          manifest-path: ${{ env.CI_PLATFORM_MANIFEST }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Provision fixed gh
        uses: a3-suite/a3-ci-github/actions/ci-gh-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          gh-version: ${{ env.CI_GH_VERSION }}
      - name: Verify fixed GitHub tools
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: gh-jq-sha256
          gh-version: ${{ env.CI_GH_VERSION }}
          jq-version: ${{ env.CI_JQ_VERSION }}
          sha256sum-version: ${{ env.CI_SHA256SUM_VERSION }}
      - name: Verify publication request workflow run
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RELEASE_PUBLICATION_REQUEST_RUN_ID}" > run-metadata/publication-request.json
          test "$(jq -er '.id | tostring' run-metadata/publication-request.json)" = "$CI_RELEASE_PUBLICATION_REQUEST_RUN_ID"
          test "$(jq -er '.conclusion' run-metadata/publication-request.json)" = success
          test "$(jq -er '.repository.full_name' run-metadata/publication-request.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.name' run-metadata/publication-request.json)" = release-publication-request
          test "$(jq -er '.event' run-metadata/publication-request.json)" = workflow_dispatch
          test -n "$(jq -er '.actor.login' run-metadata/publication-request.json)"
          test -n "$(jq -er '.triggering_actor.login' run-metadata/publication-request.json)"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          test -n "$default_branch"
          test "$(jq -er '.head_branch' run-metadata/publication-request.json)" = "$default_branch"
          publication_request_path="$(jq -er '.path' run-metadata/publication-request.json)"
          case "$publication_request_path" in
            "$CI_RELEASE_PUBLICATION_REQUEST_WORKFLOW_PATH"|"$CI_RELEASE_PUBLICATION_REQUEST_WORKFLOW_PATH"@"$default_branch") ;;
            *) exit 1 ;;
          esac
          [[ "$(jq -er '.head_sha' run-metadata/publication-request.json)" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-publication-request
          path: release-publication-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-notes-handoff
          path: release-notes-handoff
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - name: Verify release request workflow run
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RELEASE_REQUEST_RUN_ID}" > run-metadata/release-request.json
          test "$(jq -er '.id | tostring' run-metadata/release-request.json)" = "$CI_RELEASE_REQUEST_RUN_ID"
          test "$(jq -er '.conclusion' run-metadata/release-request.json)" = success
          test "$(jq -er '.repository.full_name' run-metadata/release-request.json)" = "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-request
          path: release-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.request_run_id }}
      - name: Resolve release identity
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        id: release_identity
        shell: bash
        run: echo "tag=$(jq -er '.tag' release-request/release-request.json)" >> "$GITHUB_OUTPUT"
      - name: Verify publication notes handoff
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        id: publication_notes
        uses: a3-suite/a3-ci-github/actions/ci-release-notes-binding@312c534de67720de060689d78ada17da9c84c4e2
        with:
          handoff-json: release-notes-handoff/release-notes.json
          approval-json: release-notes-handoff/release-notes-approval.json
          release-identity: ${{ steps.release_identity.outputs.tag }}
      - name: Verify request and notes provenance
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-control@<release-publication-action-sha>
        with:
          operation: verify-provenance
          publication-request-run-id: ${{ inputs.publication_request_run_id }}
          release-request-run-id: ${{ inputs.request_run_id }}
          approval-id: ${{ steps.publication_notes.outputs.approval-id }}
          approval-body-sha256: ${{ steps.publication_notes.outputs.digest }}
          release-request-tag-workflow-name: ${{ env.CI_RELEASE_REQUEST_TAG_WORKFLOW_NAME }}
          release-request-tag-workflow-path: ${{ env.CI_RELEASE_REQUEST_TAG_WORKFLOW_PATH }}
      - name: Resolve configuration snapshot
        id: config
        uses: a3-suite/a3-ci-github/actions/ci-config-snapshot@312c534de67720de060689d78ada17da9c84c4e2
        with:
          sources-json: >-
            {"runtime":{"CI_LANGUAGE_PROFILE":"${{ env.CI_LANGUAGE_PROFILE }}","CI_TOOLCHAIN_VERSION":"${{ env.CI_TOOLCHAIN_VERSION }}","CI_PLATFORM_MANIFEST":"${{ env.CI_PLATFORM_MANIFEST }}","CI_RELEASE_IMPLEMENTATION":"${{ env.CI_RELEASE_IMPLEMENTATION }}","CI_RELEASE_OWNER_CONTRACT":"${{ env.CI_RELEASE_OWNER_CONTRACT }}","CI_CARGO_MANIFEST_PATH":"${{ env.CI_CARGO_MANIFEST_PATH }}","CI_CARGO_LOCK_PATH":"${{ env.CI_CARGO_LOCK_PATH }}","CI_RELEASE_BINARY_NAME":"${{ env.CI_RELEASE_BINARY_NAME }}","CI_RELEASE_ASSET_PREFIX":"${{ env.CI_RELEASE_ASSET_PREFIX }}"},"workflow":{"CI_SUPPLEMENTAL_RELEASE_ASSET_ENABLED":"${{ inputs.supplemental_release_asset_enabled }}","CI_SUPPLEMENTAL_RELEASE_ASSET_CONTRACT":"ci.release-asset-publication-contract#supplementalAsset","CI_SUPPLEMENTAL_RELEASE_ASSET_OWNER_CONTRACT":"${{ inputs.supplemental_release_asset_owner_contract }}","CI_SUPPLEMENTAL_RELEASE_ASSET_ADAPTER":".ci/scripts/ci-release-supplemental-asset.sh"},"preset":{}}
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
      - name: Validate release notes binding
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-release-notes-input-resolution@312c534de67720de060689d78ada17da9c84c4e2
        with:
          input-handoff-directory: release-notes-handoff
          output-directory: release-request
      - name: Verify release notes binding
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-release-notes-binding@312c534de67720de060689d78ada17da9c84c4e2
        with:
          handoff-json: release-request/release-notes.json
          approval-json: release-request/release-notes-approval.json
          release-identity: ${{ steps.release_identity.outputs.tag }}
      - name: Verify standard Release authority
        id: authority
        if: env.CI_RELEASE_IMPLEMENTATION == 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-release-authority@<release-publication-action-sha>
        with:
          root-directory: .
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
          output-directory: authority
          release-request-run-id: ${{ inputs.request_run_id }}
          publication-request-run-id: ${{ inputs.publication_request_run_id }}
          github-token: ${{ github.token }}
      - name: Verify owner-specific Release authority
        id: authority_owner
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        shell: bash
        run: |
          set -euo pipefail
          .ci/trusted/ci-release-authority.sh release-request/release-request.json authority
          test -s authority/authority.json
          cp "$CI_CONFIG_SNAPSHOT_PATH" authority/config-snapshot.json
          cp release-publication-request/request.json authority/publication-request.json
          for field in source_sha version target_identity; do
            value="$(jq -er --arg field "$field" '.[$field]' authority/authority.json)"
            printf '%s=%s\n' "$field" "$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          if-no-files-found: error

  source-gate:
    needs: authority
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run standard Rust source gate
        if: env.CI_RELEASE_IMPLEMENTATION == 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-rust-source-gate@312c534de67720de060689d78ada17da9c84c4e2
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          authority-path: authority/authority.json

  quality:
    needs: authority
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - name: Checkout trusted CI assets
        if: env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' || env.CI_ADAPTER_DESCRIPTOR != ''
        uses: actions/checkout@<commit-sha>
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            package.json
            package-lock.json
            Cargo.toml
            Cargo.lock
      - name: Verify trusted control checkout
        if: env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' || env.CI_ADAPTER_DESCRIPTOR != ''
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git -C .ci-base rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Set up quality toolchain
        uses: a3-suite/a3-ci-github/actions/ci-quality-toolchain@<release-publication-action-sha>
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          uv-version: ${{ env.CI_UV_VERSION }}
          cargo-audit-version: ${{ env.CI_CARGO_AUDIT_VERSION }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run project quality adapter
        id: quality-adapter
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@<release-publication-action-sha>
        with:
          bundle-path: ${{ env.CI_ADAPTER_DESCRIPTOR && format('.ci-base/{0}', env.CI_ADAPTER_DESCRIPTOR) || '' }}
          standard-bundle-id: ${{ env.CI_STANDARD_BUNDLE_ID }}
          require-trusted-project-scripts: 'true'
          trusted-project-root: .ci-base
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}

  build:
    needs: [authority, source-gate, quality]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authority.outputs.platform_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      CI_PLATFORM_ID: ${{ matrix.id }}
      CI_PLATFORM_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Build and verify standard Rust release assets
        if: env.CI_RELEASE_IMPLEMENTATION == 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-rust-release-build@312c534de67720de060689d78ada17da9c84c4e2
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          platform-manifest: ${{ env.CI_PLATFORM_MANIFEST }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          platform-id: ${{ env.CI_PLATFORM_ID }}
          platform-target: ${{ env.CI_PLATFORM_TARGET }}
          authority-path: authority/authority.json
          output-directory: build/${{ env.CI_PLATFORM_ID }}
          cargo-manifest-path: ${{ env.CI_CARGO_MANIFEST_PATH }}
          release-binary-name: ${{ env.CI_RELEASE_BINARY_NAME }}
          release-asset-prefix: ${{ env.CI_RELEASE_ASSET_PREFIX }}
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-build-${{ matrix.id }}
          path: build/${{ matrix.id }}
          if-no-files-found: error
      - name: Build and verify supplemental Release asset platform
        if: inputs.supplemental_release_asset_enabled
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@<release-publication-action-sha>
        with:
          operation: build-platform
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build/${{ matrix.id }}
          output-directory: supplemental-build/${{ matrix.id }}
      - uses: actions/upload-artifact@<commit-sha>
        if: inputs.supplemental_release_asset_enabled
        with:
          name: supplemental-build-${{ matrix.id }}
          path: supplemental-build/${{ matrix.id }}
          if-no-files-found: error

  supplemental-asset:
    if: inputs.supplemental_release_asset_enabled
    needs: [authority, source-gate, quality, build]
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          pattern: release-build-*
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          pattern: supplemental-build-*
          path: supplemental-build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify supplemental Release asset
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@<release-publication-action-sha>
        with:
          operation: assemble
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build
          supplemental-build-root: supplemental-build
          output-directory: supplemental-asset
      - uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-supplemental-asset
          path: supplemental-asset
          if-no-files-found: error

  assemble:
    needs: [authority, build, supplemental-asset]
    if: >-
      ${{
        !cancelled() &&
        needs.authority.result == 'success' &&
        needs.build.result == 'success' &&
        ((inputs.supplemental_release_asset_enabled && needs.supplemental-asset.result == 'success') ||
        (!inputs.supplemental_release_asset_enabled && needs.supplemental-asset.result == 'skipped'))
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_transfer_id: ${{ steps.upload_release_handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Provision fixed gh
        uses: a3-suite/a3-ci-github/actions/ci-gh-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          gh-version: ${{ env.CI_GH_VERSION }}
      - name: Verify fixed GitHub tools
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: gh-jq-sha256
          gh-version: ${{ env.CI_GH_VERSION }}
          jq-version: ${{ env.CI_JQ_VERSION }}
          sha256sum-version: ${{ env.CI_SHA256SUM_VERSION }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          pattern: release-build-*
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@<commit-sha>
        if: inputs.supplemental_release_asset_enabled
        with:
          name: release-supplemental-asset
          path: supplemental-asset
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Assemble release handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-assembly@<release-publication-action-sha>
        with:
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          platform-manifest-path: ${{ env.CI_PLATFORM_MANIFEST }}
          platform-matrix: ${{ needs.authority.outputs.platform_matrix }}
          build-root: build
          supplemental-root: ${{ inputs.supplemental_release_asset_enabled && 'supplemental-asset' || '' }}
          output-directory: release-handoff
      - id: upload_release_handoff
        uses: actions/upload-artifact@<commit-sha>
        with:
          name: release-handoff
          path: release-handoff
          if-no-files-found: error

  publish:
    needs: [authority, assemble]
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: write
    outputs:
      release_remote_identity: ${{ steps.verify_publication.outputs['release-remote-identity'] }}
      publish_receipt: ${{ steps.verify_publication.outputs['publish-receipt'] }}
      readback_evidence: ${{ steps.verify_publication.outputs['readback-evidence'] }}
    steps:
      - uses: actions/checkout@<commit-sha>
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Provision fixed gh
        uses: a3-suite/a3-ci-github/actions/ci-gh-provisioner@312c534de67720de060689d78ada17da9c84c4e2
        with:
          gh-version: ${{ env.CI_GH_VERSION }}
      - name: Verify fixed GitHub tools
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@312c534de67720de060689d78ada17da9c84c4e2
        with:
          mode: gh-jq-sha256
          gh-version: ${{ env.CI_GH_VERSION }}
          jq-version: ${{ env.CI_JQ_VERSION }}
          sha256sum-version: ${{ env.CI_SHA256SUM_VERSION }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@<commit-sha>
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_transfer_id }}
          path: release-handoff
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Validate release handoff integrity
        uses: a3-suite/a3-ci-github/actions/ci-handoff-integrity@312c534de67720de060689d78ada17da9c84c4e2
        with:
          handoff-root: release-handoff
          descriptor: handoff.json
          source-sha: ${{ needs.authority.outputs.source_sha }}
          version: ${{ needs.authority.outputs.version }}
          target-identity: ${{ needs.authority.outputs.target_identity }}
      - name: Verify approval is still valid
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-control@<release-publication-action-sha>
        with:
          operation: verify-approval
          approval-id: ${{ needs.authority.outputs.approval_id }}
          approval-body-sha256: ${{ needs.authority.outputs.approval_body_sha256 }}
      - name: Observe complete Release absence
        id: publication_before
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@<release-publication-action-sha>
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: observe-before
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
      - id: publish
        name: Publish standard GitHub Release
        if: env.CI_RELEASE_IMPLEMENTATION == 'rust-cli-release'
        uses: a3-suite/a3-ci-github/actions/ci-release-publisher@<release-publication-action-sha>
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          authority-path: authority/authority.json
          release-handoff-root: release-handoff
          pre-observation-path: publication-before.json
          write-output-directory: publication-write
      - id: publish_owner
        name: Publish owner-specific Release
        if: env.CI_RELEASE_IMPLEMENTATION != 'rust-cli-release'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          .ci/trusted/ci-release-publish.sh authority/authority.json release-handoff publication-before.json publication-write
      - name: Verify publication readback evidence
        id: verify_publication
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@<release-publication-action-sha>
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: verify-after
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
          receipt-path: publication-write/receipt.json
          readback-path: publication-write/readback.json

  summary:
    needs: [authority, source-gate, quality, build, supplemental-asset, assemble, publish]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@312c534de67720de060689d78ada17da9c84c4e2
        with:
          summary-json: >-
            {"jobs":[{"unit":"authority","execution":"manual release publication / trusted control","rawResult":"${{ needs.authority.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"authority job result: ${{ needs.authority.result }}"},{"unit":"source-gate","execution":"fixed source SHA identity","rawResult":"${{ needs.source-gate.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"source-gate result: ${{ needs.source-gate.result }}"},{"unit":"quality","execution":"fixed source / trusted adapter","rawResult":"${{ needs.quality.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"quality result: ${{ needs.quality.result }}"},{"unit":"build","execution":"platform manifest","rawResult":"${{ needs.build.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"build result: ${{ needs.build.result }}"},{"unit":"supplemental-asset","execution":"owner-selected supplemental Release asset","rawResult":"${{ needs.supplemental-asset.result }}","applicable":${{ !(needs.supplemental-asset.result == 'skipped' && !inputs.supplemental_release_asset_enabled) }},"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"${{ (needs.supplemental-asset.result == 'skipped' && !inputs.supplemental_release_asset_enabled) && 'supplemental asset disabled by workflow input' || format('supplemental-asset result: {0}', needs.supplemental-asset.result) }}"},{"unit":"assemble","execution":"trusted handoff","rawResult":"${{ needs.assemble.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"assemble result: ${{ needs.assemble.result }}"},{"unit":"publish","execution":"Release remote readback","rawResult":"${{ needs.publish.result }}","applicable":true,"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"publish result: ${{ needs.publish.result }}"}]}
