name: release-publication

on:
  workflow_call:
    inputs:
      request_run_id:
        description: Successful release-request workflow run ID
        required: true
        type: string
      publication_request_run_id:
        description: Successful release-publication-request workflow run ID
        required: true
        type: string
      supplemental_release_asset_enabled:
        description: Build the owner-selected supplemental Release asset set
        required: true
        type: boolean
      supplemental_release_asset_owner_contract:
        description: Static owner contract ID, or __unset__ when disabled
        required: true
        type: string
      supplemental_release_asset_implementation:
        description: owner-adapter or standard-installer; selected by the trusted caller
        required: false
        default: owner-adapter
        type: string
      supplemental_release_asset_config_path:
        description: Fixed-source installer declaration path; __unset__ outside standard mode
        required: false
        default: __unset__
        type: string
      release_skills_config_path:
        description: Fixed-source public skill declaration path, or __unset__ when not publishing skills
        required: false
        default: __unset__
        type: string
      sha256sum-version:
        # No step in this workflow runs gh or sha256sum; existing callers may still pass the tool versions.
        required: false
        type: string
        default: ''
      runner:
        description: Static versioned runner label selected by the owner caller
        required: true
        type: string
      language-profile:
        required: true
        type: string
      platform-manifest:
        required: true
        type: string
      toolchain-version:
        required: true
        type: string
      uv-version:
        # Release implementations are Rust-only, so callers may omit the Python tool version.
        required: false
        type: string
        default: ''
      cargo-audit-version:
        required: true
        type: string
      gh-version:
        required: false
        type: string
        default: ''
      jq-version:
        required: true
        type: string
      release-implementation:
        required: true
        type: string
      standard-bundle-id:
        required: true
        type: string
      adapter-descriptor:
        required: true
        type: string
      cargo-manifest-path:
        required: true
        type: string
      cargo-lock-path:
        required: true
        type: string
      cargo-deny-version:
        required: false
        type: string
        default: ''
      cargo-deny-config-path:
        required: false
        type: string
        default: ''
      release-binary-name:
        required: true
        type: string
      release-asset-prefix:
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  CI_LANGUAGE_PROFILE: ${{ inputs.language-profile }}
  CI_PLATFORM_MANIFEST: ${{ inputs.platform-manifest }}
  CI_TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
  CI_UV_VERSION: ${{ inputs.uv-version }}
  CI_CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
  CI_JQ_VERSION: ${{ inputs.jq-version }}
  CI_RELEASE_IMPLEMENTATION: ${{ inputs.release-implementation }}
  CI_RELEASE_OWNER_CONTRACT: git.release-flow
  CI_STANDARD_BUNDLE_ID: ${{ inputs.standard-bundle-id }}
  CI_ADAPTER_DESCRIPTOR: ${{ inputs.adapter-descriptor }}
  CI_CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest-path }}
  CI_CARGO_LOCK_PATH: ${{ inputs.cargo-lock-path }}
  CI_CARGO_DENY_VERSION: ${{ inputs.cargo-deny-version }}
  CI_CARGO_DENY_CONFIG_PATH: ${{ inputs.cargo-deny-config-path }}
  CI_RELEASE_BINARY_NAME: ${{ inputs.release-binary-name }}
  CI_RELEASE_ASSET_PREFIX: ${{ inputs.release-asset-prefix }}

jobs:
  authority:
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RELEASE_REQUEST_RUN_ID: ${{ inputs.request_run_id }}
      CI_RELEASE_PUBLICATION_REQUEST_RUN_ID: ${{ inputs.publication_request_run_id }}
      CI_CONFIG_SNAPSHOT_PATH: ci-config-snapshot.json
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      version: ${{ steps.authority.outputs.version }}
      target_identity: ${{ steps.authority.outputs.target_identity }}
      platform_matrix: ${{ steps.platform-matrix.outputs.matrix }}
      approval_id: ${{ steps.authority.outputs['approval-id'] }}
      approval_body_sha256: ${{ steps.authority.outputs['body-sha256'] }}
    steps:
      - name: Verify publication entry
        id: publication-entry
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_EVENT" = workflow_run
          test -n "$REPOSITORY"
          test -n "$DEFAULT_BRANCH"
          test "$CALLER_WORKFLOW_REF" = "$REPOSITORY/.github/workflows/release-publication-caller.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Validate publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RELEASE_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RELEASE_PUBLICATION_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Resolve platform build matrix
        id: platform-matrix
        uses: a3-suite/a3-ci-github/actions/ci-platform-matrix@d4e22467eca55e45a0ab5547076554733f112449
        with:
          manifest-path: ${{ env.CI_PLATFORM_MANIFEST }}
          runner-policy: trusted
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-publication-request
          path: release-publication-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes-handoff
          path: release-notes-handoff
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-request
          path: release-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.request_run_id }}
      - name: Resolve configuration snapshot
        id: config
        uses: a3-suite/a3-ci-github/actions/ci-config-snapshot@d4e22467eca55e45a0ab5547076554733f112449
        with:
          sources-json: >-
            {"runtime":{"CI_LANGUAGE_PROFILE":${{ toJSON(env.CI_LANGUAGE_PROFILE) }},"CI_TOOLCHAIN_VERSION":${{ toJSON(env.CI_TOOLCHAIN_VERSION) }},"CI_PLATFORM_MANIFEST":${{ toJSON(env.CI_PLATFORM_MANIFEST) }},"CI_RELEASE_IMPLEMENTATION":${{ toJSON(env.CI_RELEASE_IMPLEMENTATION) }},"CI_RELEASE_OWNER_CONTRACT":${{ toJSON(env.CI_RELEASE_OWNER_CONTRACT) }},"CI_CARGO_MANIFEST_PATH":${{ toJSON(env.CI_CARGO_MANIFEST_PATH) }},"CI_CARGO_LOCK_PATH":${{ toJSON(env.CI_CARGO_LOCK_PATH) }},"CI_RELEASE_BINARY_NAME":${{ toJSON(env.CI_RELEASE_BINARY_NAME) }},"CI_RELEASE_ASSET_PREFIX":${{ toJSON(env.CI_RELEASE_ASSET_PREFIX) }}},"workflow":{"CI_RELEASE_SKILLS_CONFIG_PATH":${{ toJSON(inputs.release_skills_config_path) }},"CI_SUPPLEMENTAL_RELEASE_ASSET_ENABLED":"${{ inputs.supplemental_release_asset_enabled }}","CI_SUPPLEMENTAL_RELEASE_ASSET_CONTRACT":"ci.release-asset-publication-contract#supplementalAsset","CI_SUPPLEMENTAL_RELEASE_ASSET_OWNER_CONTRACT":${{ toJSON(inputs.supplemental_release_asset_owner_contract) }},"CI_SUPPLEMENTAL_RELEASE_ASSET_ADAPTER":".ci/scripts/ci-release-supplemental-asset.sh","CI_SUPPLEMENTAL_RELEASE_ASSET_IMPLEMENTATION":${{ toJSON(inputs.supplemental_release_asset_implementation) }},"CI_SUPPLEMENTAL_RELEASE_ASSET_CONFIG_PATH":${{ toJSON(inputs.supplemental_release_asset_config_path) }}},"preset":{}}
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
      - name: Verify standard Release authority
        id: authority
        uses: a3-suite/a3-ci-github/actions/ci-release-authority@d4e22467eca55e45a0ab5547076554733f112449
        with:
          root-directory: .
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
          output-directory: authority
          release-request-run-id: ${{ inputs.request_run_id }}
          publication-request-run-id: ${{ inputs.publication_request_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-authority
          path: authority
          if-no-files-found: error

  source-gate:
    needs: authority
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@d4e22467eca55e45a0ab5547076554733f112449
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@d4e22467eca55e45a0ab5547076554733f112449
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run standard Rust source gate
        uses: a3-suite/a3-ci-github/actions/ci-rust-source-gate@d4e22467eca55e45a0ab5547076554733f112449
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          authority-path: authority/authority.json

  quality:
    needs: authority
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - name: Checkout trusted CI assets
        if: env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' || env.CI_ADAPTER_DESCRIPTOR != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            package.json
            package-lock.json
            Cargo.toml
            Cargo.lock
      - name: Verify trusted control checkout
        if: env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' || env.CI_ADAPTER_DESCRIPTOR != ''
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git -C .ci-base rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Set up quality toolchain
        uses: a3-suite/a3-ci-github/actions/ci-quality-toolchain@d4e22467eca55e45a0ab5547076554733f112449
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          uv-version: ${{ env.CI_UV_VERSION }}
          cargo-audit-version: ${{ env.CI_CARGO_AUDIT_VERSION }}
          cargo-deny-version: ${{ env.CI_CARGO_DENY_VERSION }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@d4e22467eca55e45a0ab5547076554733f112449
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@d4e22467eca55e45a0ab5547076554733f112449
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run project quality adapter
        id: quality-adapter
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@d4e22467eca55e45a0ab5547076554733f112449
        with:
          bundle-path: ${{ env.CI_ADAPTER_DESCRIPTOR && format('.ci-base/{0}', env.CI_ADAPTER_DESCRIPTOR) || '' }}
          standard-bundle-id: ${{ env.CI_STANDARD_BUNDLE_ID }}
          require-trusted-project-scripts: 'true'
          trusted-project-root: .ci-base
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}

  build:
    needs: [authority, source-gate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authority.outputs.platform_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      CI_PLATFORM_ID: ${{ matrix.id }}
      CI_PLATFORM_TARGET: ${{ matrix.target }}
    steps:
      # Windows runners default to core.autocrlf=true. Platform outputs are compared across runners, so every build must
      # see the committed bytes (or the owner's .gitattributes) rather than the runner's line-ending conversion.
      - name: Keep committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@d4e22467eca55e45a0ab5547076554733f112449
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@d4e22467eca55e45a0ab5547076554733f112449
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Build and verify standard Rust release assets
        uses: a3-suite/a3-ci-github/actions/ci-rust-release-build@d4e22467eca55e45a0ab5547076554733f112449
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          platform-manifest: ${{ env.CI_PLATFORM_MANIFEST }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          platform-id: ${{ env.CI_PLATFORM_ID }}
          platform-target: ${{ env.CI_PLATFORM_TARGET }}
          authority-path: authority/authority.json
          output-directory: build/${{ env.CI_PLATFORM_ID }}
          cargo-manifest-path: ${{ env.CI_CARGO_MANIFEST_PATH }}
          release-binary-name: ${{ env.CI_RELEASE_BINARY_NAME }}
          release-asset-prefix: ${{ env.CI_RELEASE_ASSET_PREFIX }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-${{ matrix.id }}
          path: build/${{ matrix.id }}
          if-no-files-found: error
          compression-level: 0
      - name: Build and verify supplemental Release asset platform
        if: inputs.supplemental_release_asset_enabled
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@d4e22467eca55e45a0ab5547076554733f112449
        env:
          A3_INSTALLER_PROVIDER_REVISION: d4e22467eca55e45a0ab5547076554733f112449
        with:
          operation: build-platform
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build/${{ matrix.id }}
          output-directory: supplemental-build/${{ matrix.id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.supplemental_release_asset_enabled
        with:
          name: supplemental-build-${{ matrix.id }}
          path: supplemental-build/${{ matrix.id }}
          include-hidden-files: ${{ inputs.supplemental_release_asset_implementation == 'standard-installer' }}
          if-no-files-found: error

  supplemental-asset:
    if: inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'owner-adapter'
    needs: [authority, source-gate, quality, build]
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-build-*
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: supplemental-build-*
          path: supplemental-build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Build and verify supplemental Release asset
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@d4e22467eca55e45a0ab5547076554733f112449
        env:
          A3_INSTALLER_PROVIDER_REVISION: d4e22467eca55e45a0ab5547076554733f112449
        with:
          operation: assemble
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build
          supplemental-build-root: supplemental-build
          output-directory: supplemental-asset
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-supplemental-asset
          path: supplemental-asset
          if-no-files-found: error

  assemble:
    needs: [authority, source-gate, quality, build, supplemental-asset]
    if: >-
      ${{
        !cancelled() &&
        needs.authority.result == 'success' &&
        needs.source-gate.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.build.result == 'success' &&
        ((inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'owner-adapter' && needs.supplemental-asset.result == 'success') ||
        ((!inputs.supplemental_release_asset_enabled || inputs.supplemental_release_asset_implementation == 'standard-installer') && needs.supplemental-asset.result == 'skipped'))
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_transfer_id: ${{ steps.upload_release_handoff.outputs.artifact-id }}
    steps:
      - name: Resolve assembly control checkout scope
        id: control-checkout-scope
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          if [[ "$CI_PLATFORM_MANIFEST" == *$'\n'* || "$CI_PLATFORM_MANIFEST" == *$'\r'* ]]; then
            echo "invalid platform manifest path" >&2
            exit 1
          fi
          pattern=""
          if [[ -n "$CI_PLATFORM_MANIFEST" && "$CI_PLATFORM_MANIFEST" != /* && "$CI_PLATFORM_MANIFEST" != *\\* && "$CI_PLATFORM_MANIFEST" != *[![:graph:]] ]]; then
            pattern="$CI_PLATFORM_MANIFEST"
            for character in '[' ']' '*' '?' ' ' $'\t' '#' '!'; do
              pattern=${pattern//"$character"/\\$character}
            done
            pattern="/$pattern"
          fi
          printf 'pattern=%s\n' "$pattern" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          sparse-checkout: ${{ steps.control-checkout-scope.outputs.pattern }}
          sparse-checkout-cone-mode: false
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Checkout fixed assembly source
        if: inputs.release_skills_config_path != '__unset__' || (inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'standard-installer')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: release-source/authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-build-*
          path: release-source/build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'owner-adapter'
        with:
          name: release-supplemental-asset
          path: release-source/supplemental-asset
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'standard-installer'
        with:
          pattern: supplemental-build-*
          path: release-source/supplemental-build
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Assemble standard installer
        if: inputs.supplemental_release_asset_enabled && inputs.supplemental_release_asset_implementation == 'standard-installer'
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@d4e22467eca55e45a0ab5547076554733f112449
        env:
          A3_INSTALLER_PROVIDER_REVISION: d4e22467eca55e45a0ab5547076554733f112449
        with:
          operation: assemble
          source-root: release-source
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build
          supplemental-build-root: supplemental-build
          output-directory: supplemental-asset
      - name: Assemble release handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-assembly@d4e22467eca55e45a0ab5547076554733f112449
        with:
          repository: ${{ github.repository }}
          authority-path: release-source/authority/authority.json
          snapshot-path: release-source/authority/config-snapshot.json
          platform-manifest-path: ${{ env.CI_PLATFORM_MANIFEST }}
          platform-matrix: ${{ needs.authority.outputs.platform_matrix }}
          build-root: release-source/build
          supplemental-root: ${{ inputs.supplemental_release_asset_enabled && 'release-source/supplemental-asset' || '' }}
          skills-source-root: ${{ inputs.release_skills_config_path != '__unset__' && 'release-source' || '' }}
          output-directory: release-handoff
      - id: upload_release_handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-handoff
          path: release-handoff
          if-no-files-found: error

  publish:
    needs: [authority, assemble]
    if: >-
      ${{
        !cancelled() &&
        needs.authority.result == 'success' &&
        needs.assemble.result == 'success'
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: write
    env:
      CI_RELEASE_CREDENTIAL_SOURCE: standard-workflow-github-token
      CI_RELEASE_CONTENTS_PERMISSION: write
    outputs:
      release_remote_identity: ${{ steps.verify_publication.outputs['release-remote-identity'] }}
      publish_receipt: ${{ steps.verify_publication.outputs['publish-receipt'] }}
      readback_evidence: ${{ steps.verify_publication.outputs['readback-evidence'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          sparse-checkout: '!/*'
          sparse-checkout-cone-mode: false
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_transfer_id }}
          path: release-handoff
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Validate release handoff integrity
        uses: a3-suite/a3-ci-github/actions/ci-handoff-integrity@d4e22467eca55e45a0ab5547076554733f112449
        with:
          handoff-root: release-handoff
          descriptor: handoff.json
          source-sha: ${{ needs.authority.outputs.source_sha }}
          version: ${{ needs.authority.outputs.version }}
          target-identity: ${{ needs.authority.outputs.target_identity }}
      - name: Verify approval is still valid
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-control@d4e22467eca55e45a0ab5547076554733f112449
        with:
          operation: verify-approval
          approval-id: ${{ needs.authority.outputs.approval_id }}
          approval-body-sha256: ${{ needs.authority.outputs.approval_body_sha256 }}
      - name: Observe complete Release absence
        id: publication_before
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@d4e22467eca55e45a0ab5547076554733f112449
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          operation: observe-before
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
      - id: publish
        name: Publish standard GitHub Release
        uses: a3-suite/a3-ci-github/actions/ci-release-publisher@d4e22467eca55e45a0ab5547076554733f112449
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          authority-path: authority/authority.json
          release-handoff-root: release-handoff
          pre-observation-path: publication-before.json
          write-output-directory: publication-write
      - name: Verify publication readback evidence
        id: verify_publication
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@d4e22467eca55e45a0ab5547076554733f112449
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          operation: verify-after
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
          receipt-path: publication-write/receipt.json
          readback-path: publication-write/readback.json

  summary:
    needs: [authority, source-gate, quality, build, supplemental-asset, assemble, publish]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@d4e22467eca55e45a0ab5547076554733f112449
        with:
          summary-json: >-
            {"jobs":[{"unit":"authority","execution":"manual release publication / trusted control","rawResult":"${{ needs.authority.result }}","applicable":true,"reason":"authority job result: ${{ needs.authority.result }}"},{"unit":"source-gate","execution":"fixed source SHA identity","rawResult":"${{ needs.source-gate.result }}","applicable":true,"reason":"source-gate result: ${{ needs.source-gate.result }}"},{"unit":"quality","execution":"fixed source / trusted adapter","rawResult":"${{ needs.quality.result }}","applicable":true,"reason":"quality result: ${{ needs.quality.result }}"},{"unit":"build","execution":"platform manifest","rawResult":"${{ needs.build.result }}","applicable":true,"reason":"build result: ${{ needs.build.result }}"},{"unit":"supplemental-asset","execution":"owner-selected supplemental Release asset","rawResult":"${{ needs.supplemental-asset.result }}","applicable":${{ !(needs.supplemental-asset.result == 'skipped' && (!inputs.supplemental_release_asset_enabled || inputs.supplemental_release_asset_implementation == 'standard-installer')) }},"reason":"${{ (needs.supplemental-asset.result == 'skipped' && (!inputs.supplemental_release_asset_enabled || inputs.supplemental_release_asset_implementation == 'standard-installer')) && 'supplemental asset disabled or assembled in assemble job' || format('supplemental-asset result: {0}', needs.supplemental-asset.result) }}"},{"unit":"assemble","execution":"trusted handoff","rawResult":"${{ needs.assemble.result }}","applicable":true,"reason":"assemble result: ${{ needs.assemble.result }}"},{"unit":"publish","execution":"Release remote readback","rawResult":"${{ needs.publish.result }}","applicable":true,"reason":"publish result: ${{ needs.publish.result }}"}]}
