name: asset-release-publication

on:
  workflow_call:
    inputs:
      request_run_id:
        description: Successful release-request workflow run ID
        required: true
        type: string
      publication_request_run_id:
        description: Successful release-publication-request workflow run ID
        required: true
        type: string
      supplemental_release_asset_enabled:
        description: Build the owner-selected supplemental Release asset set through the owner adapter
        required: true
        type: boolean
      supplemental_release_asset_owner_contract:
        description: Static owner contract ID, or __unset__ when disabled
        required: true
        type: string
      release_skills_config_path:
        description: Fixed-source public skill declaration path, or __unset__ when not publishing skills
        required: true
        type: string
      runner:
        description: Static versioned runner label selected by the owner caller
        required: true
        type: string
      jq-version:
        required: false
        type: string
        default: ''
      language-profile:
        # An asset release has no product build; quality runs only when the owner selects a language profile.
        required: false
        type: string
        default: ''
      toolchain-version:
        required: false
        type: string
        default: ''
      uv-version:
        required: false
        type: string
        default: ''
      cargo-audit-version:
        required: false
        type: string
        default: ''
      cargo-manifest-path:
        required: false
        type: string
        default: ''
      cargo-lock-path:
        required: false
        type: string
        default: ''
      cargo-deny-version:
        required: false
        type: string
        default: ''
      cargo-deny-config-path:
        required: false
        type: string
        default: ''
      standard-bundle-id:
        required: false
        type: string
        default: ''
      adapter-descriptor:
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  CI_LANGUAGE_PROFILE: ${{ inputs.language-profile }}
  CI_TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
  CI_UV_VERSION: ${{ inputs.uv-version }}
  CI_CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
  CI_CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest-path }}
  CI_CARGO_LOCK_PATH: ${{ inputs.cargo-lock-path }}
  CI_CARGO_DENY_VERSION: ${{ inputs.cargo-deny-version }}
  CI_CARGO_DENY_CONFIG_PATH: ${{ inputs.cargo-deny-config-path }}
  CI_JQ_VERSION: ${{ inputs.jq-version }}
  CI_STANDARD_BUNDLE_ID: ${{ inputs.standard-bundle-id }}
  CI_ADAPTER_DESCRIPTOR: ${{ inputs.adapter-descriptor }}

jobs:
  authority:
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RELEASE_REQUEST_RUN_ID: ${{ inputs.request_run_id }}
      CI_RELEASE_PUBLICATION_REQUEST_RUN_ID: ${{ inputs.publication_request_run_id }}
      CI_CONFIG_SNAPSHOT_PATH: ci-config-snapshot.json
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      version: ${{ steps.authority.outputs.version }}
      target_identity: ${{ steps.authority.outputs.target_identity }}
      approval_id: ${{ steps.authority.outputs['approval-id'] }}
      approval_body_sha256: ${{ steps.authority.outputs['body-sha256'] }}
    steps:
      - name: Verify publication entry
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_EVENT" = workflow_run
          test -n "$REPOSITORY"
          test -n "$DEFAULT_BRANCH"
          test "$CALLER_WORKFLOW_REF" = "$REPOSITORY/.github/workflows/release-publication-caller.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Verify asset selection
        shell: bash
        env:
          SKILLS_CONFIG_PATH: ${{ inputs.release_skills_config_path }}
          SUPPLEMENTAL_ENABLED: ${{ inputs.supplemental_release_asset_enabled }}
        run: |
          set -euo pipefail
          if [[ -z "$SKILLS_CONFIG_PATH" || ( "$SKILLS_CONFIG_PATH" == "__unset__" && "$SUPPLEMENTAL_ENABLED" != "true" ) ]]; then
            echo "asset release selects neither public skills nor a supplemental asset" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Validate publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RELEASE_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RELEASE_PUBLICATION_REQUEST_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-publication-request
          path: release-publication-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes-handoff
          path: release-notes-handoff
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publication_request_run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-request
          path: release-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.request_run_id }}
      - name: Resolve configuration snapshot
        id: config
        uses: a3-suite/a3-ci-github/actions/ci-config-snapshot@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          sources-json: >-
            {"runtime":{"CI_LANGUAGE_PROFILE":"__unset__","CI_TOOLCHAIN_VERSION":"__unset__","CI_PLATFORM_MANIFEST":"__unset__","CI_RELEASE_IMPLEMENTATION":"asset-release","CI_RELEASE_OWNER_CONTRACT":"git.release-flow"},"workflow":{"CI_RELEASE_SKILLS_CONFIG_PATH":${{ toJSON(inputs.release_skills_config_path) }},"CI_SUPPLEMENTAL_RELEASE_ASSET_ENABLED":"${{ inputs.supplemental_release_asset_enabled }}","CI_SUPPLEMENTAL_RELEASE_ASSET_CONTRACT":"ci.release-asset-publication-contract#supplementalAsset","CI_SUPPLEMENTAL_RELEASE_ASSET_OWNER_CONTRACT":${{ toJSON(inputs.supplemental_release_asset_owner_contract) }},"CI_SUPPLEMENTAL_RELEASE_ASSET_ADAPTER":".ci/scripts/ci-release-supplemental-asset.sh","CI_SUPPLEMENTAL_RELEASE_ASSET_IMPLEMENTATION":"owner-adapter","CI_SUPPLEMENTAL_RELEASE_ASSET_CONFIG_PATH":"__unset__"},"preset":{}}
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
      - name: Verify asset Release authority
        id: authority
        uses: a3-suite/a3-ci-github/actions/ci-release-authority@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          root-directory: .
          snapshot-path: ${{ env.CI_CONFIG_SNAPSHOT_PATH }}
          output-directory: authority
          release-request-run-id: ${{ inputs.request_run_id }}
          publication-request-run-id: ${{ inputs.publication_request_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-authority
          path: authority
          if-no-files-found: error

  quality:
    needs: authority
    if: inputs.language-profile != ''
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - name: Checkout trusted CI assets
        if: env.CI_ADAPTER_DESCRIPTOR != '' || (env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' && env.CI_STANDARD_BUNDLE_ID != 'python-uv-quality')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            package.json
            package-lock.json
      - name: Verify trusted control checkout
        if: env.CI_ADAPTER_DESCRIPTOR != '' || (env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' && env.CI_STANDARD_BUNDLE_ID != 'python-uv-quality')
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git -C .ci-base rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Set up quality toolchain
        uses: a3-suite/a3-ci-github/actions/ci-quality-toolchain@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          uv-version: ${{ env.CI_UV_VERSION }}
          cargo-audit-version: ${{ env.CI_CARGO_AUDIT_VERSION }}
          cargo-deny-version: ${{ env.CI_CARGO_DENY_VERSION }}
      - name: Provision fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed jq
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run project quality adapter
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          bundle-path: ${{ env.CI_ADAPTER_DESCRIPTOR && format('.ci-base/{0}', env.CI_ADAPTER_DESCRIPTOR) || '' }}
          standard-bundle-id: ${{ env.CI_STANDARD_BUNDLE_ID }}
          require-trusted-project-scripts: 'true'
          trusted-project-root: .ci-base
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}

  supplemental-asset:
    needs: [authority, quality]
    if: >-
      ${{
        !cancelled() &&
        inputs.supplemental_release_asset_enabled &&
        needs.authority.result == 'success' &&
        (needs.quality.result == 'success' || (inputs.language-profile == '' && needs.quality.result == 'skipped'))
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Create empty build roots
        # The owner adapter keeps its argument contract; an asset release supplies no product build to it.
        shell: bash
        run: mkdir build supplemental-build
      - name: Build and verify supplemental Release asset
        uses: a3-suite/a3-ci-github/actions/ci-release-supplemental-asset@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        env:
          A3_INSTALLER_PROVIDER_REVISION: 77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          operation: assemble
          authority-path: authority/authority.json
          snapshot-path: authority/config-snapshot.json
          standard-build-root: build
          supplemental-build-root: supplemental-build
          output-directory: supplemental-asset
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-supplemental-asset
          path: supplemental-asset
          if-no-files-found: error

  assemble:
    needs: [authority, quality, supplemental-asset]
    if: >-
      ${{
        !cancelled() &&
        needs.authority.result == 'success' &&
        (needs.quality.result == 'success' || (inputs.language-profile == '' && needs.quality.result == 'skipped')) &&
        ((inputs.supplemental_release_asset_enabled && needs.supplemental-asset.result == 'success') ||
        (!inputs.supplemental_release_asset_enabled && needs.supplemental-asset.result == 'skipped'))
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_transfer_id: ${{ steps.upload_release_handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          sparse-checkout: '!/*'
          sparse-checkout-cone-mode: false
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - name: Checkout fixed assembly source
        if: inputs.release_skills_config_path != '__unset__'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authority.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: release-source/authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.supplemental_release_asset_enabled
        with:
          name: release-supplemental-asset
          path: release-source/supplemental-asset
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Assemble release handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-assembly@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          repository: ${{ github.repository }}
          authority-path: release-source/authority/authority.json
          snapshot-path: release-source/authority/config-snapshot.json
          supplemental-root: ${{ inputs.supplemental_release_asset_enabled && 'release-source/supplemental-asset' || '' }}
          skills-source-root: ${{ inputs.release_skills_config_path != '__unset__' && 'release-source' || '' }}
          output-directory: release-handoff
      - id: upload_release_handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-handoff
          path: release-handoff
          if-no-files-found: error

  publish:
    needs: [authority, assemble]
    if: >-
      ${{
        !cancelled() &&
        needs.authority.result == 'success' &&
        needs.assemble.result == 'success'
      }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: write
    env:
      CI_RELEASE_CREDENTIAL_SOURCE: standard-workflow-github-token
      CI_RELEASE_CONTENTS_PERMISSION: write
    outputs:
      release_remote_identity: ${{ steps.verify_publication.outputs['release-remote-identity'] }}
      publish_receipt: ${{ steps.verify_publication.outputs['publish-receipt'] }}
      readback_evidence: ${{ steps.verify_publication.outputs['readback-evidence'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          sparse-checkout: '!/*'
          sparse-checkout-cone-mode: false
      - name: Verify trusted control checkout
        shell: bash
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-authority
          path: authority
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_transfer_id }}
          path: release-handoff
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Validate release handoff integrity
        uses: a3-suite/a3-ci-github/actions/ci-handoff-integrity@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          handoff-root: release-handoff
          descriptor: handoff.json
          source-sha: ${{ needs.authority.outputs.source_sha }}
          version: ${{ needs.authority.outputs.version }}
          target-identity: ${{ needs.authority.outputs.target_identity }}
      - name: Verify approval is still valid
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-control@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          operation: verify-approval
          approval-id: ${{ needs.authority.outputs.approval_id }}
          approval-body-sha256: ${{ needs.authority.outputs.approval_body_sha256 }}
      - name: Observe complete Release absence
        id: publication_before
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          operation: observe-before
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
      - id: publish
        name: Publish standard GitHub Release
        uses: a3-suite/a3-ci-github/actions/ci-release-publisher@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          authority-path: authority/authority.json
          release-handoff-root: release-handoff
          pre-observation-path: publication-before.json
          write-output-directory: publication-write
      - name: Verify publication readback evidence
        id: verify_publication
        uses: a3-suite/a3-ci-github/actions/ci-release-publication-verifier@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          operation: verify-after
          repository: ${{ github.repository }}
          authority-path: authority/authority.json
          handoff-root: release-handoff
          observation-path: publication-before.json
          receipt-path: publication-write/receipt.json
          readback-path: publication-write/readback.json

  summary:
    needs: [authority, quality, supplemental-asset, assemble, publish]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@77b1afe50b994c4b8ac54bfe5ba3ea849ed4d633
        with:
          summary-json: >-
            {"jobs":[{"unit":"authority","execution":"manual asset release publication / trusted control","rawResult":"${{ needs.authority.result }}","applicable":true,"reason":"authority job result: ${{ needs.authority.result }}"},{"unit":"quality","execution":"fixed source / trusted adapter","rawResult":"${{ needs.quality.result }}","applicable":${{ inputs.language-profile != '' }},"reason":"${{ inputs.language-profile == '' && 'quality not selected by the owner' || format('quality result: {0}', needs.quality.result) }}"},{"unit":"supplemental-asset","execution":"owner-selected supplemental Release asset","rawResult":"${{ needs.supplemental-asset.result }}","applicable":${{ inputs.supplemental_release_asset_enabled }},"reason":"${{ !inputs.supplemental_release_asset_enabled && 'supplemental asset not selected by the owner' || format('supplemental-asset result: {0}', needs.supplemental-asset.result) }}"},{"unit":"assemble","execution":"trusted handoff","rawResult":"${{ needs.assemble.result }}","applicable":true,"reason":"assemble result: ${{ needs.assemble.result }}"},{"unit":"publish","execution":"Release remote readback","rawResult":"${{ needs.publish.result }}","applicable":true,"reason":"publish result: ${{ needs.publish.result }}"}]}
