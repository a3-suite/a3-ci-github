name: ci-quality
on:
  workflow_call:
    inputs:
      runner:
        description: Versioned runner label for quality jobs
        type: string
        required: true
      language-profile:
        description: CI_LANGUAGE_PROFILE
        type: string
        required: true
      toolchain-version:
        description: CI_TOOLCHAIN_VERSION
        type: string
        required: true
      uv-version:
        description: CI_UV_VERSION
        type: string
        required: false
        default: ""
      cargo-audit-version:
        description: CI_CARGO_AUDIT_VERSION
        type: string
        required: false
        default: ""
      cargo-manifest-path:
        description: CI_CARGO_MANIFEST_PATH
        type: string
        required: false
        default: ""
      cargo-lock-path:
        description: CI_CARGO_LOCK_PATH
        type: string
        required: false
        default: ""
      jq-version:
        description: Optional exact jq version; empty skips jq preparation
        type: string
        required: false
        default: ""
      standard-bundle-id:
        description: CI_STANDARD_BUNDLE_ID
        type: string
        required: false
        default: ""
      adapter-descriptor:
        description: CI_ADAPTER_DESCRIPTOR
        type: string
        required: false
        default: ""
      docs-only-patterns:
        description: CI_DOCS_ONLY_PATTERNS
        type: string
        required: false
        default: docs/**,README.md,**/*.md
permissions:
  contents: read
env:
  CI_PROVIDER: github
  CI_LANGUAGE_PROFILE: ${{ inputs.language-profile }}
  CI_TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
  CI_UV_VERSION: ${{ inputs.uv-version }}
  CI_CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
  CI_CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest-path }}
  CI_CARGO_LOCK_PATH: ${{ inputs.cargo-lock-path }}
  CI_JQ_VERSION: ${{ inputs.jq-version }}
  CI_STANDARD_BUNDLE_ID: ${{ inputs.standard-bundle-id }}
  CI_ADAPTER_DESCRIPTOR: ${{ inputs.adapter-descriptor }}
  CI_DOCS_ONLY_PATTERNS: ${{ inputs.docs-only-patterns }}

jobs:
  trusted:
    name: quality-gate / trusted
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    outputs:
      run-ci: ${{ steps.change-scope.outputs['run-ci'] }}
    steps:
      - name: Check resolved configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_LANGUAGE_PROFILE" =~ ^[a-z][a-z0-9-]*$ ]] || {
            echo "invalid CI_LANGUAGE_PROFILE: $CI_LANGUAGE_PROFILE" >&2
            exit 1
          }
          [[ -n "${CI_TOOLCHAIN_VERSION:-}" && "${CI_TOOLCHAIN_VERSION:-}" != "__unset__" && "${CI_TOOLCHAIN_VERSION:-}" != *'<'* && "${CI_TOOLCHAIN_VERSION:-}" != *'>'* ]]
          if [[ "$CI_LANGUAGE_PROFILE" == "python" ]]; then [[ -n "${CI_UV_VERSION:-}" && "${CI_UV_VERSION:-}" != "__unset__" && "${CI_UV_VERSION:-}" != *'<'* && "${CI_UV_VERSION:-}" != *'>'* ]]; fi
          if [[ "$CI_LANGUAGE_PROFILE" == "rust" ]]; then [[ -n "${CI_CARGO_AUDIT_VERSION:-}" && "${CI_CARGO_AUDIT_VERSION:-}" != "__unset__" && "${CI_CARGO_AUDIT_VERSION:-}" != *'<'* && "${CI_CARGO_AUDIT_VERSION:-}" != *'>'* ]]; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch comparison commit
        shell: bash
        env:
          CI_DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ "$CI_DIFF_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && ! "$CI_DIFF_BASE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$CI_DIFF_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$CI_DIFF_BASE_SHA" ||
                echo "Comparison commit unavailable; change-scope will continue full CI." >&2
            fi
          fi
      - name: Resolve change scope
        id: change-scope
        uses: a3-suite/a3-ci-github/actions/ci-change-scope@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          event-name: ${{ github.event_name }}
          pr-base-sha: ${{ github.event.pull_request.base.sha || '' }}
          before-sha: ${{ github.event.before || '' }}
          docs-only-patterns: ${{ env.CI_DOCS_ONLY_PATTERNS }}
      - name: Checkout trusted CI assets
        if: >-
          steps.change-scope.outputs['run-ci'] != 'false' &&
          (env.CI_ADAPTER_DESCRIPTOR != '' ||
          (env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' && env.CI_STANDARD_BUNDLE_ID != 'python-uv-quality'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            .ci/ci-assets.lock.json
            package.json
            package-lock.json
      - name: Resolve trusted assets root
        id: trusted-assets
        if: >-
          steps.change-scope.outputs['run-ci'] != 'false' &&
          (env.CI_ADAPTER_DESCRIPTOR != '' ||
          (env.CI_STANDARD_BUNDLE_ID != 'rust-cargo-quality' && env.CI_STANDARD_BUNDLE_ID != 'python-uv-quality'))
        shell: bash
        env:
          CI_SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [[ -f ".ci-base/.ci/ci-assets.lock.json" ]]; then
            if [[ -n "$CI_ADAPTER_DESCRIPTOR" && ! -f ".ci-base/$CI_ADAPTER_DESCRIPTOR" ]]; then
              echo "trusted CI assets are missing in the base branch" >&2
              exit 1
            fi
            root=".ci-base"
          else
            if [[ ( -n "$CI_ADAPTER_DESCRIPTOR" && -f ".ci-base/$CI_ADAPTER_DESCRIPTOR" ) || -e ".ci-base/.ci/adapters" ]]; then
              echo "trusted CI assets exist in the base branch without a distribution integrity lock" >&2
              exit 1
            fi
            if [[ "$CI_SAME_REPO" != "true" ]]; then
              echo "trusted CI assets bootstrap is limited to same-repository pull requests" >&2
              exit 1
            fi
            root="."
          fi
          if [[ "$root" == ".ci-base" ]]; then source="base"; else source="bootstrap"; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "trusted CI assets root: $root (source: $source)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Set up quality toolchain
        if: steps.change-scope.outputs['run-ci'] != 'false'
        uses: a3-suite/a3-ci-github/actions/ci-quality-toolchain@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          uv-version: ${{ env.CI_UV_VERSION }}
          cargo-audit-version: ${{ env.CI_CARGO_AUDIT_VERSION }}
      - name: Provision fixed jq
        if: steps.change-scope.outputs['run-ci'] != 'false' && env.CI_JQ_VERSION != ''
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed GitHub tools
        if: steps.change-scope.outputs['run-ci'] != 'false' && env.CI_JQ_VERSION != ''
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run project quality adapter
        id: quality-adapter
        if: steps.change-scope.outputs['run-ci'] != 'false'
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          standard-bundle-id: ${{ env.CI_STANDARD_BUNDLE_ID }}
          bundle-path: ${{ env.CI_ADAPTER_DESCRIPTOR && format('{0}/{1}', steps.trusted-assets.outputs.root, env.CI_ADAPTER_DESCRIPTOR) || '' }}
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          require-trusted-project-scripts: 'true'
          trusted-project-root: ${{ steps.trusted-assets.outputs.root }}

  untrusted-pr:
    name: quality-gate / untrusted-pr
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ${{ inputs.runner }}
    outputs:
      run-ci: ${{ steps.change-scope.outputs['run-ci'] }}
    steps:
      - name: Check resolved configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_LANGUAGE_PROFILE" =~ ^[a-z][a-z0-9-]*$ ]] || {
            echo "invalid CI_LANGUAGE_PROFILE: $CI_LANGUAGE_PROFILE" >&2
            exit 1
          }
          [[ -n "${CI_TOOLCHAIN_VERSION:-}" && "${CI_TOOLCHAIN_VERSION:-}" != "__unset__" && "${CI_TOOLCHAIN_VERSION:-}" != *'<'* && "${CI_TOOLCHAIN_VERSION:-}" != *'>'* ]]
          if [[ "$CI_LANGUAGE_PROFILE" == "python" ]]; then [[ -n "${CI_UV_VERSION:-}" && "${CI_UV_VERSION:-}" != "__unset__" && "${CI_UV_VERSION:-}" != *'<'* && "${CI_UV_VERSION:-}" != *'>'* ]]; fi
          if [[ "$CI_LANGUAGE_PROFILE" == "rust" ]]; then [[ -n "${CI_CARGO_AUDIT_VERSION:-}" && "${CI_CARGO_AUDIT_VERSION:-}" != "__unset__" && "${CI_CARGO_AUDIT_VERSION:-}" != *'<'* && "${CI_CARGO_AUDIT_VERSION:-}" != *'>'* ]]; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch comparison commit
        shell: bash
        env:
          CI_DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ "$CI_DIFF_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && ! "$CI_DIFF_BASE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$CI_DIFF_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$CI_DIFF_BASE_SHA" ||
                echo "Comparison commit unavailable; change-scope will continue full CI." >&2
            fi
          fi
      - name: Resolve change scope
        id: change-scope
        uses: a3-suite/a3-ci-github/actions/ci-change-scope@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          base-sha: ${{ github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          event-name: ${{ github.event_name }}
          pr-base-sha: ${{ github.event.pull_request.base.sha || '' }}
          before-sha: ${{ github.event.before || '' }}
          docs-only-patterns: ${{ env.CI_DOCS_ONLY_PATTERNS }}
      - name: Checkout trusted CI assets
        if: steps.change-scope.outputs['run-ci'] != 'false' && env.CI_ADAPTER_DESCRIPTOR != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base
          sparse-checkout: |
            .ci/adapters
            package.json
            package-lock.json
      - name: Set up quality toolchain
        if: steps.change-scope.outputs['run-ci'] != 'false'
        uses: a3-suite/a3-ci-github/actions/ci-quality-toolchain@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}
          uv-version: ${{ env.CI_UV_VERSION }}
          cargo-audit-version: ${{ env.CI_CARGO_AUDIT_VERSION }}
      - name: Provision fixed jq
        if: steps.change-scope.outputs['run-ci'] != 'false' && env.CI_JQ_VERSION != ''
        uses: a3-suite/a3-ci-github/actions/ci-jq-provisioner@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Verify fixed GitHub tools
        if: steps.change-scope.outputs['run-ci'] != 'false' && env.CI_JQ_VERSION != ''
        uses: a3-suite/a3-ci-github/actions/ci-github-toolchain-verifier@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          mode: jq
          jq-version: ${{ env.CI_JQ_VERSION }}
      - name: Run project quality adapter
        id: quality-adapter
        if: steps.change-scope.outputs['run-ci'] != 'false'
        uses: a3-suite/a3-ci-github/actions/ci-quality-adapter@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          standard-bundle-id: ${{ env.CI_STANDARD_BUNDLE_ID }}
          bundle-path: ${{ env.CI_ADAPTER_DESCRIPTOR && format('.ci-base/{0}', env.CI_ADAPTER_DESCRIPTOR) || '' }}
          source-root: .
          language-profile: ${{ env.CI_LANGUAGE_PROFILE }}
          toolchain-version: ${{ env.CI_TOOLCHAIN_VERSION }}

  summary:
    needs: [trusted, untrusted-pr]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SELECTED_RUN_CI: ${{ needs.trusted.result == 'skipped' && needs.untrusted-pr.outputs.run-ci || needs.trusted.outputs.run-ci }}
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@dde810eaf0ef412cfaa8119b1c13b00b95d48a9d
        with:
          summary-json: >-
            {"jobs":[{"unit":"trusted","execution":"${{ needs.trusted.result == 'skipped' && 'untrusted trust branch excluded' || (env.SELECTED_RUN_CI == 'false' && 'docs-only change; adapter not run' || 'trusted language profile adapter') }}","rawResult":"${{ needs.trusted.result }}","applicable":${{ needs.trusted.result != 'skipped' }},"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"${{ needs.trusted.result == 'skipped' && 'untrusted-pr branch selected; trusted branch intentionally excluded' || (env.SELECTED_RUN_CI == 'false' && 'docs-only scope; adapter not run' || format('trusted job result: {0}', needs.trusted.result)) }}"},{"unit":"untrusted-pr","execution":"${{ needs.trusted.result != 'skipped' && 'untrusted trust branch excluded' || (env.SELECTED_RUN_CI == 'false' && 'docs-only change; adapter not run' || 'untrusted language profile adapter') }}","rawResult":"${{ needs.untrusted-pr.result }}","applicable":${{ needs.trusted.result == 'skipped' }},"evidence":"${{ env.WORKFLOW_RUN_URL }}","reason":"${{ needs.trusted.result != 'skipped' && 'trusted branch selected; untrusted-pr branch intentionally excluded' || (env.SELECTED_RUN_CI == 'false' && 'docs-only scope; adapter not run' || format('untrusted-pr job result: {0}', needs.untrusted-pr.result)) }}"}]}
