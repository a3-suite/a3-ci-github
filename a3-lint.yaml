config_version: 1

project:
  variables:
    skills_root: ${env.A3_SKILLS_ROOT}

  rule_sets:
    - id: skill-typescript
      root: ${skills_root}/typescript/assets/a3-lint/rules
      lib_dir: ${skills_root}/typescript/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - typescript
      frameworks:
        - any
    - id: skill-javascript
      root: ${skills_root}/javascript/assets/a3-lint/rules
      lib_dir: ${skills_root}/javascript/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - javascript
        - typescript
      frameworks:
        - any
    - id: skill-ci-github
      root: lint-rules/a3-lint
      include:
        - '**/ci_github_runtime_no_a3_cli.lua'
        - '**/ci_github_workflow_*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - yaml
      frameworks:
        - any
    - id: skill-ci-github-markdown
      root: lint-rules/a3-lint
      include:
        - '**/ci_github_ci_readme_contract.lua'
      languages:
        - markdown
      frameworks:
        - any

# 対象言語が typescript/javascript/yaml/markdown にまたがるため既定 lang は固定せず、
# 実行対象の言語ごとに --lang を明示して a3-lint を実行する。
run_defaults:
  framework: any
  format: json
  fail_on: warning
