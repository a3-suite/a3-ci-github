config_version: 1

project:
  variables:
    skills_root: ${env.A3_SKILLS_ROOT}

  rule_sets:
    - id: skill-python-semantic-extension
      root: ${skills_root}/python/assets/a3-lint/semantic-extension
      lib_dir: ${skills_root}/python/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - python
      frameworks:
        - any
    - id: skill-typescript
      root: ${skills_root}/typescript/assets/a3-lint/rules
      lib_dir: ${skills_root}/typescript/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - typescript
      frameworks:
        - any
    - id: skill-javascript
      root: ${skills_root}/javascript/assets/a3-lint/rules
      lib_dir: ${skills_root}/javascript/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - javascript
        - typescript
      frameworks:
        - any
    - id: skill-vitest
      root: ${skills_root}/vitest/assets/a3-lint/rules
      lib_dir: ${skills_root}/vitest/assets/a3-lint/shared
      include:
        - '**/*.lua'
        - '**/*.yml'
        - '**/*.yaml'
      languages:
        - javascript
        - typescript
      frameworks:
        - vitest
    - id: skill-vitest-template
      root: ${skills_root}/vitest/assets/a3-lint/semantic-extension
      lib_dir: ${skills_root}/vitest/assets/a3-lint/shared
      include:
        - '**/*.lua'
      languages:
        - javascript
        - typescript
      frameworks:
        - vitest

# 対象言語が python/typescript/javascript にまたがるため既定 lang は固定せず、
# 実行対象の言語ごとに --lang を明示して a3-lint を実行する。
run_defaults:
  framework: vitest
  format: json
  fail_on: warning
