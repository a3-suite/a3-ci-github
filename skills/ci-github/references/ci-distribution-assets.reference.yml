schemaVersion: "1"
kind: ci-github-distribution-assets
id: ci.github-distribution-assets
title: Selective CI asset distribution registry
summary: >-
  固定revisionから必要なCI資材だけを取得するため、配布単位、依存閉包、取得後の適用境界を定義する。
placementRole: public_reference
authority:
  role: authoritative-definition
  owns:
    - selective distribution asset identity
    - repository-owned asset group membership
    - presetごとの必須配布asset
    - 配布manifestと取得CLIの公開名
    - 取得資材のproject-local保存境界
  excludes:
    - presetのcanonical workflow membershipと配置先
    - project-owned extension
    - external skill assetのidentityと内容
    - GitHub Actionの配布
repository:
  slug: a3-suite/a3-ci-github
  rawOrigin: https://raw.githubusercontent.com
release:
  manifestAsset: a3-ci-github-distribution-manifest.json
  fetchCliAsset: fetch-a3-ci-github.mjs
  checksumAsset: SHA256SUMS
  trustBoundary: github-release-publisher-and-tls
localState:
  root: .a3-skills/ci-github
  distributionPath: distributions/{sourceRevision}
  planPath: plans/{planDigest}.json
  transactionPath: transactions/{transactionId}
  applyLockPath: apply.lock
assets:
  - id: registry.ci-github
    application: local-reference
    sourcePaths:
      - skills/ci-github/references/ci-github-preset-assets.reference.yml
      - skills/ci-github/references/ci-script-assets.reference.yml
      - skills/ci-github/references/ci-script-contracts.reference.yml
      - skills/ci-github/references/ci-distribution-assets.reference.yml
  - id: runtime.preset
    application: local-reference
    dependencies: [registry.ci-github]
    sourcePaths:
      - runtime/preset/package.json
      - runtime/preset/package-lock.json
      - runtime/preset/run-validate-ci-preset.mjs
      - runtime/preset/ci-asset-lock-plan.ts
      - runtime/preset/ci-asset-lock.ts
      - runtime/preset/ci-preset-assets.ts
      - runtime/preset/preset-model.ts
      - runtime/preset/preset-registry.ts
      - runtime/preset/cli-args.ts
      - runtime/preset/descriptor-validation.ts
      - runtime/preset/generate-ci-asset-lock.ts
      - runtime/preset/publication-validation.ts
      - runtime/preset/quality-validation.ts
      - runtime/adapter/standard-quality-bundles.ts
      - runtime/adapter/standard-quality-bundles.generated.ts
      - runtime/preset/action-availability.ts
      - runtime/preset/semantic-candidates.ts
      - runtime/preset/validate-ci-preset-core.ts
      - runtime/preset/validate-ci-preset.ts
      - runtime/preset/validate-platform-manifest.ts
      - runtime/preset/validation-report.ts
      - runtime/preset/workflow-assets.ts
      - runtime/preset/workflow-validation.ts
      - runtime/platform/platform-manifest-core.d.mts
      - runtime/platform/platform-manifest-core.mjs
      - runtime/platform/platform-selection-core.ts
  - id: runtime.quality-workflow
    application: local-reference
    dependencies: [runtime.preset]
    sourcePaths: [.github/workflows/ci-quality.yml]
  - id: runtime.quality-platforms-workflow
    application: local-reference
    dependencies: [runtime.preset]
    sourcePaths: [.github/workflows/ci-quality-platforms.yml]
  - id: runtime.release-publication-workflow
    application: local-reference
    dependencies: [runtime.preset]
    sourcePaths:
      - .github/workflows/ci-release-publication.yml
      - skills/ci-github/references/release-publication-evidence.reference.yml
      - runtime/release-publication/evidence.schema.json
  - id: runtime.package-publication-workflow
    application: local-reference
    dependencies: [runtime.preset]
    sourcePaths:
      - .github/workflows/ci-package-publication.yml
      - .github/workflows/ci-package-preparation.yml
  - id: runtime.adapter-materializer
    application: local-reference
    dependencies: [runtime.preset]
    sourcePaths:
      - runtime/adapter/cli-runtime.ts
      - runtime/adapter/materialize-adapter-bundle.ts
      - runtime/adapter/standard-quality-bundles.ts
      - runtime/adapter/standard-quality-bundles.generated.ts
      - runtime/path/same-file-core.d.mts
      - runtime/path/same-file-core.mjs
  - id: runtime.vitest-summary
    application: local-reference
    sourcePaths:
      - runtime/adapter/vitest-test-summary.ts
      - runtime/vitest/vitest-summary-core.d.mts
      - runtime/vitest/vitest-summary-core.mjs
  - id: lint.github-actions
    application: local-reference
    sourceTree: lint-rules/a3-lint
  - id: skill.ci-github
    application: skill-deploy-source
    sourceTree: skills/ci-github
workflowDependencies:
  workflow.quality-gate: [runtime.quality-workflow]
  workflow.quality-gate-platforms: [runtime.quality-platforms-workflow]
  workflow.release-publication-caller: [runtime.release-publication-workflow]
  workflow.package-publication-caller: [runtime.package-publication-workflow]
presets:
  - id: quality-gate
    requiredAssets: [runtime.preset, lint.github-actions]
  - id: release-request
    requiredAssets: [runtime.preset, lint.github-actions]
  - id: release-publication
    requiredAssets: [runtime.preset, lint.github-actions]
  - id: package-publication
    requiredAssets: [runtime.preset, lint.github-actions]
selectionRules:
  - ファイルは個別に転送できるが、適用可能性はassetとpresetの依存閉包単位で判定する。
  - asset単体選択では依存assetを暗黙追加せず、不足する依存を診断する。
  - preset選択ではrequiredAssetsとcanonical workflow assetを閉包へ含める。
  - optional workflow assetは明示的なasset選択時だけ含める。
applicationRules:
  - workflow assetだけをconsumer projectへのcopy対象とする。
  - runtime、lint、registryはproject-local distributionから導入・保守・検証時だけ参照する。
  - Agent Skillは取得後にproject-skill-deployへ委譲する。
  - external skill assetとproject-owned extensionはこの配布経路でcopyしない。
